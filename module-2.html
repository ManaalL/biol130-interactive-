<!DOCTYPE html>
<html lang="en" data-module="m2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Molecules of life | BIOL 130 Module 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,650;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efeff6; --paper:#ffffff; --ink:#1c2830; --ink2:#4b5b64; --rule:#cbd5d7;
  --head:#23282e; --accent:#5a5fc4; --accentInk:#ffffff; --accentSoft:#e8e8f8;
  --ok:#2a7648; --okSoft:#e2f2e7; --bad:#a53838; --badSoft:#f7e4e2;
  --plate:#ffffff; --plateRule:#c3cdd0; --cap:#3b4a52; --chip:#f1f5f5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
    --head:#e8eeea; --accent:#a3a7f2; --accentInk:#14152b; --accentSoft:#24264a;
    --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
    --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
  }
}
:root[data-theme="dark"]{
  --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
  --head:#e8eeea; --accent:#a3a7f2; --accentInk:#14152b; --accentSoft:#24264a;
  --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
  --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--head);font-weight:650;line-height:1.2;margin:0}
p{margin:0 0 .8em}
sup{font-size:.7em;line-height:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-size:1.45rem;color:var(--head);font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--rule);background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* figure plates */
.plate{background:var(--plate);border:1px solid var(--plateRule);border-radius:4px;padding:10px 10px 8px;margin:0;position:relative}
.plate svg,.plate canvas{display:block;width:100%;height:auto}
.plate figcaption{font-family:var(--serif);font-size:.93rem;color:#3b4a52;padding:8px 4px 2px;line-height:1.4}
.plate figcaption b{font-weight:650;color:#5a5fc4}
.plate .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.mini{font-size:.82rem;padding:4px 9px;border-radius:5px;border:1px solid #c3cdd0;background:#fff;color:#1c2830;cursor:pointer}
.mini:hover{background:#eef4f4}
.mini[aria-pressed="true"]{background:#5a5fc4;color:#fff;border-color:#5a5fc4}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:2.3rem;letter-spacing:-.015em;margin-bottom:12px}
.lede{font-size:1.08rem;color:var(--ink);max-width:36em}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.chlist{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chitem{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.chitem:hover{border-color:var(--accent)}
.chnum{font-family:var(--serif);font-size:1.6rem;color:var(--accent);grid-row:span 2;line-height:1}
.chitem h3{font-size:1.1rem}
.chitem .meta{grid-column:2;color:var(--ink2);font-size:.88rem}
.done-tag{color:var(--ok);font-weight:600}
.sect{margin-top:34px}
.sect h2{font-size:1.35rem;margin-bottom:6px}

/* chapter */
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb h1{font-size:1.6rem}
.crumb .back{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.steps{display:flex;gap:4px;flex:1;min-width:160px;max-width:420px;margin-left:auto}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--head)}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide>.panel{max-width:860px}
.stage.wide>.panel:has(.pad){max-width:none}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.kicker{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--accent);background:var(--accentSoft);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.bad{border-color:var(--bad);background:var(--badSoft)}
.fb > b:first-child{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.explored{font-size:.9rem;color:var(--ink2);margin-top:6px}
.termlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tl{border:1px solid var(--rule);background:var(--chip);border-radius:14px;padding:3px 10px;font-size:.86rem;cursor:pointer}
.tl:hover{border-color:var(--accent)}
.tl.inl{background:none;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;color:var(--accent);padding:0 1px!important;font-weight:600}
.tl.inl:hover{background:var(--accentSoft)}
.tl.seen{border-color:var(--accent);color:var(--accent)}

/* order + sort */
.order{display:grid;gap:8px;margin:10px 0}
.pool .card,.slot{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;background:var(--paper);line-height:1.35}
.pool{display:grid;gap:8px;margin:10px 0}
.pool .card{border-style:solid;cursor:pointer;text-align:left}
.pool .card:hover{border-color:var(--accent)}
.pool .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .n{font-family:var(--serif);color:var(--accent);font-weight:650;min-width:1.2em}
.slot.filled{border-style:solid;cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--okSoft)}
.slot.wrong{border-color:var(--bad);background:var(--badSoft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bin{border:1px solid var(--rule);border-radius:6px;padding:8px;min-height:90px;background:var(--chip);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.92rem;font-family:var(--sans);color:var(--head)}
.bin .card{display:block;width:100%;font-size:.88rem;padding:5px 8px;margin-bottom:5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);text-align:left;cursor:pointer}
.bin .card.right{border-color:var(--ok);background:var(--okSoft)}
.bin .card.wrong{border-color:var(--bad);background:var(--badSoft)}
.bin:hover{border-color:var(--accent)}

/* controls in sims */
.ctl{display:grid;gap:10px;margin:10px 0}
.ctl label{font-weight:600;font-size:.92rem;display:block;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 10px;background:var(--paper);border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:.9rem;min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink2)}
.meter{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}

/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}
.tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tok.used{opacity:.4}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}

/* term card */
.termcard{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,40,.18);padding:16px 18px;z-index:50;display:none;max-height:70vh;overflow:auto}
.termcard.show{display:block}
.termcard h3{font-size:1.2rem;margin-bottom:6px;padding-right:28px}
.termcard .x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--ink2);line-height:1;padding:4px 8px}
.termcard .rel{font-size:.86rem;color:var(--ink2);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:#2a2e35;color:#fff;font-size:.82rem;padding:4px 8px;border-radius:4px;z-index:60;display:none;white-space:nowrap}

/* svg hotspots */
[data-term]{cursor:pointer}
[data-term]:hover > .hl, [data-term]:focus > .hl{stroke:#5a5fc4;stroke-width:3}
[data-term]:focus{outline:none}
[data-term].hit > .hl{stroke:#5a5fc4}
[data-term]:hover{filter:brightness(1.06)}
.lbl{font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;fill:#1c2830}
.lbl.sm{font-size:11.5px}
.lbl.it{font-style:italic;fill:#3b4a52}
.lead{stroke:#5b6b73;stroke-width:1;fill:none}
.labels-off .lbls{display:none}

/* checkpoint */
.idcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.idcard .hd{background:var(--head);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
:root[data-theme="dark"] .idcard .hd{color:#0f171b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idcard .hd{color:#0f171b}}
.idcard .hd b{font-family:var(--serif);font-size:1.25rem}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:12px 14px}
.idcard dt{color:var(--ink2);font-size:.9rem}
.idcard dd{margin:0;font-weight:600}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.gate{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:var(--paper);cursor:pointer;text-align:left;font-size:.92rem;line-height:1.3}
.gate:hover:not([disabled]){border-color:var(--accent)}
.gate small{display:block;color:var(--ink2);font-size:.8rem;margin-top:2px}
.gate.right{border-color:var(--ok);background:var(--okSoft)}
.gate.wrong{border-color:var(--bad);background:var(--badSoft)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* glossary */
.gl{columns:2 360px;column-gap:28px}
.gl section{break-inside:avoid;margin-bottom:22px}
.gl h2{font-size:1.2rem;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.gi b{font-weight:700}
.gi p{grid-column:1 / -1;margin:0;color:var(--ink2);font-size:.94rem}
.st{font-size:.78rem;border-radius:10px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.st.tested{border-color:var(--ok);color:var(--ok)}
.st.seen{border-color:var(--accent);color:var(--accent)}

/* atlas */
.atlas{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:24px;align-items:start}
.atlas svg{touch-action:manipulation}
.quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accentSoft);border-radius:6px;padding:10px 14px;margin-bottom:12px}

.summary{max-width:720px}
.big{font-family:var(--serif);font-size:3rem;color:var(--accent);line-height:1}
.foot{margin-top:40px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}


/* course-notes styling */
.banner{display:flex;align-items:stretch;margin:0 0 16px;min-height:44px}
.banner .num{background:#43479f;color:#fff;font-family:var(--serif);font-weight:650;font-size:1.25rem;padding:8px 16px;display:flex;align-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.18);position:relative;z-index:1}
.banner .ttl{flex:1;background:#6d72d3;color:#fff;display:flex;align-items:center;padding:6px 18px;font-variant:small-caps;letter-spacing:.04em;font-weight:700;font-size:1.15rem;margin-left:-2px}
.banner .pg{background:#6d72d3;color:#ffffff;display:flex;align-items:center;padding:0 14px;font-size:.85rem;white-space:nowrap}
.remember{display:flex;gap:12px;align-items:flex-start;background:#e4ebf2;border-radius:4px;padding:10px 14px;margin:10px 0;color:#1c2830;box-shadow:1px 1px 0 rgba(0,0,0,.08)}
.remember .key{flex:none;width:28px;height:28px}
.remember b{display:block;font-family:var(--serif)}
.dyk{background:#ecebf8;border-left:4px solid #5a5fc4;border-radius:0 4px 4px 0;padding:10px 14px;margin:10px 0;font-style:italic;color:#2a1c18}
.dyk b{font-style:normal}
.notes-ref{font-size:.85rem;color:var(--ink2);margin:4px 0 10px}
.notes-ref b{color:var(--accent)}
.homelink{color:var(--ink2);font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;margin-right:4px}
.homelink:hover{color:var(--accent);border-color:var(--accent)}
.seqrow{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.seqrow .end{font-weight:700;color:var(--ink2);min-width:26px;text-align:center}
.nt{width:30px;height:34px;border:1px solid var(--rule);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;background:var(--paper);color:var(--ink)}
.nt.A{background:#8e6cc4;color:#fff;border-color:#6a4e9b}.nt.G{background:#dd5f45;color:#fff;border-color:#b0452f}
.nt.T{background:#3a9a9a;color:#fff;border-color:#2a7676}.nt.C{background:#f0cf4f;color:#3a2e00;border-color:#c9a92c}
.nt.U{background:#86b851;color:#fff;border-color:#618f33}
.nt.slot{border-style:dashed;cursor:pointer}.nt.slot.cur{box-shadow:0 0 0 2px var(--accent)}
.nt.ok{outline:2px solid var(--ok)}.nt.no{outline:2px solid var(--bad)}
.pad{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pad button{width:46px;height:42px;border-radius:6px;border:1px solid var(--rule);font-weight:700;font-size:1.05rem;cursor:pointer}
.pad button.A{background:#8e6cc4;color:#fff}.pad button.G{background:#dd5f45;color:#fff}.pad button.T{background:#3a9a9a;color:#fff}.pad button.C{background:#f0cf4f;color:#3a2e00}.pad button.U{background:#86b851;color:#fff}
.pad button.del{width:auto;padding:0 12px;background:var(--paper);font-size:.9rem}

@media (max-width: 880px){
  body{font-size:16px}
  .hero,.stage,.atlas{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:1.8rem}
  .topin{padding:8px 14px;gap:8px}
  .tabs{margin-left:0;width:100%}
  .tab{padding:5px 9px;font-size:.92rem}
  .brand span{display:none}
  .wrap{padding:16px 12px 60px}
  .steps{max-width:none;min-width:100%;order:3}
  .termcard{right:0;left:0;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px){.banner{flex-wrap:wrap}.banner .pg{flex-basis:100%;padding:4px 14px 6px;white-space:normal}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="brand" id="home" aria-label="Module 2 home"><b>Molecules of Life</b><span>BIOL 130, Module 2</span></button>
  <nav class="tabs" aria-label="Sections">
    <a class="homelink" id="hubLink" href="index.html" target="_top">All modules</a>
    <button class="tab" data-go="story">Chapters</button>
    <button class="tab" data-go="atlas">Molecule lab</button>
    <button class="tab" data-go="checkpoint">Chemistry desk</button>
    <button class="tab" data-go="exam">Mini exam</button>
    <button class="tab" data-go="glossary">Glossary</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<aside class="termcard" id="termcard" role="dialog" aria-live="polite"><button class="x" aria-label="Close">×</button><div id="tcbody"></div></aside>
<div class="tip" id="tip"></div>
<script src="studydata.js"></script>
<script src="srs.js"></script>
<script src="exam.js"></script>
<script src="kip.js"></script>
<script>
"use strict";
/* ============ storage ============ */
const KEY = "biol130-m2-progress-v1";
let P = { ch:{}, terms:{}, cp:{best:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
function markTerm(k, level){
  const order = {seen:1, tested:2};
  const cur = P.terms[k];
  if (!cur || order[level] > order[cur]) { P.terms[k] = level; save(); }
}
/* ============ glossary data (p = course notes page) ============ */
const T = {
 "element":{n:"Element",g:"Atoms",p:"13",d:"A substance made of only one type of atom. Around a dozen elements make up living things; carbon, hydrogen, oxygen, nitrogen and phosphorus are the most abundant in cells."},
 "atom":{n:"Atom",g:"Atoms",p:"13",d:"The basic unit of matter: a dense central nucleus of protons and neutrons, with electrons moving around it."},
 "nucleus-atom":{n:"Atomic nucleus",g:"Atoms",p:"13",d:"The dense centre of an atom, made of positively charged protons and neutral neutrons."},
 "proton":{n:"Proton",g:"Atoms",p:"13",d:"A positively charged particle in the atomic nucleus. The number of protons decides which element an atom is."},

 "ph":{n:"pH",g:"Water",p:"17",d:"A measure of the concentration of protons (H⁺) in a solution, on a scale from 0 to 14. Pure water is pH 7. pH matters for cell function, such as protein structure and enzyme activity."},

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let activeLoops = [];
function loop(fn){ let on = true, last = performance.now(); const tick = t => { if(!on) return; const dt = Math.min(0.05,(t-last)/1000); last = t; fn(dt,t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); const s = {stop(){on=false;}}; activeLoops.push(s); return s; }
function stopLoops(){ activeLoops.forEach(l=>l.stop()); activeLoops = []; }
function plate(svgOrEl, caption){
  const f = h("figure",{class:"plate"});
  if (typeof svgOrEl === "string") f.insertAdjacentHTML("beforeend", svgOrEl); else f.append(svgOrEl);
  if (caption) f.append(h("figcaption",{html:caption}));
  return f;
}

/* ============ shared drawing helpers ============ */
function lab(text, term, tx, ty, px, py, anchor="start", cls="lbl"){
  const lines = text.split("\n");
  const t = lines.map((l,i)=>`<tspan x="${tx}" dy="${i?14:0}">${l}</tspan>`).join("");
  const cw = cls.includes("sm")?5.7:6.4, wdt = Math.max(...lines.map(l=>l.length))*cw, hgt=(lines.length-1)*14;
  const x0 = anchor==="end"?tx-wdt: anchor==="middle"?tx-wdt/2 : tx, x1 = x0+wdt;
  let lx, ly=ty-4;
  if (px!=null && px>=x0-6 && px<=x1+6){ lx=Math.max(x0,Math.min(x1,px)); ly = py>ty ? ty+hgt+5 : ty-15; }
  else if (px!=null && px<x0) lx=x0-4; else lx=x1+4;
  const lead = (px!=null) ? `<line class="lead" x1="${lx}" y1="${ly}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2" fill="#5b6b73"/>` : "";
  return `<g ${term?`data-term="${term}"`:""}>${lead}<text class="${cls}" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text></g>`;
}

function arrow(x1,y1,x2,y2,col="#34454e",w=2.2,dash=""){
  const a=Math.atan2(y2-y1,x2-x1), L=10;
  const p1=[x2-L*Math.cos(a-0.4),y2-L*Math.sin(a-0.4)], p2=[x2-L*Math.cos(a+0.4),y2-L*Math.sin(a+0.4)];
  return `<line x1="${x1}" y1="${y1}" x2="${(x2-6*Math.cos(a)).toFixed(1)}" y2="${(y2-6*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
}

  const D=[["Carbon (C)",52,"#3f8a4c"],["Oxygen (O)",21.5,"#e58a2c"],["Nitrogen (N)",8.5,"#3d6fb6"],["Hydrogen (H)",7.5,"#7fb6e0"],["Calcium (Ca)",4.5,"#e2b33c"],["Phosphorus (P)",3,"#c0392b"],["S, K, Na, Cl, Mg",2,"#8a67bd"],["Other",1,"#a8d08d"]];
  const cx=200, cy=180, r=140; let a=-Math.PI/2;
  s+=`<g data-term="organic-molecule">`;
  D.forEach(([n,v,c])=>{ const b=a+v/100*2*Math.PI, large=v>50?1:0; s+=`<path d="M${cx} ${cy} L${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)} A${r} ${r} 0 ${large} 1 ${(cx+r*Math.cos(b)).toFixed(1)} ${(cy+r*Math.sin(b)).toFixed(1)} Z" fill="${c}" stroke="#fff" stroke-width="2"/>`; a=b; });
  s+=`</g>`;
  D.forEach(([n,v,c],i)=>{ const y=50+i*36; s+=`<rect x="400" y="${y-14}" width="18" height="18" rx="3" fill="${c}"/><text class="lbl" x="428" y="${y}">${n}</text><text class="lbl" x="${W-30}" y="${y}" text-anchor="end" font-weight="700">${v}%</text>`; });
  s+=`<text class="lbl it" x="400" y="${H-20}">Human body, dry mass (water removed)</text>`;
  s+=`</svg>`; return s;
}

/* a chemical reaction (notes Fig 2.7) */
function figReaction(){
  const W=760,H=240; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Two hydrogen molecules and one oxygen molecule react to form two water molecules"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const sp=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="rgba(0,0,0,.25)"/>`;
  const H2=(x,y)=>sp(x-11,y,16,"#9fc3e8")+sp(x+11,y,16,"#9fc3e8");
  s+=`<g data-term="reactants">${H2(70,80)}${H2(150,80)}<text class="lbl" x="110" y="130" text-anchor="middle">2H₂, hydrogen gas</text>${atomT(210,88,"+","#333",24)}${sp(255,80,22,"#e0857c")}${sp(285,80,22,"#e0857c")}<text class="lbl" x="270" y="130" text-anchor="middle">O₂, oxygen gas</text></g>`;
  s+=`<g data-term="chemical-reaction">${arrow(330,80,410,80,"#34454e",3)}</g>`;
  const W2=(x,y)=>sp(x,y,22,"#e0857c")+sp(x-20,y+16,13,"#9fc3e8")+sp(x+20,y+16,13,"#9fc3e8");
  s+=`<g data-term="products">${W2(480,72)}${W2(580,72)}<text class="lbl" x="530" y="130" text-anchor="middle">2H₂O, water</text></g>`;
  s+=`<path d="M40 160 v8 H320 v-8" stroke="#55606a" fill="none"/><text class="lbl" x="180" y="190" text-anchor="middle" font-weight="700">Reactants: the starting substances</text>`;
  s+=`<path d="M440 160 v8 H630 v-8" stroke="#55606a" fill="none"/><text class="lbl" x="535" y="190" text-anchor="middle" font-weight="700">Products: the new molecules</text>`;
  s+=`<text class="lbl it" x="${W/2}" y="${H-14}" text-anchor="middle">Bonds break (H–H, O=O) and new bonds form (O–H). Atoms are rearranged, not created or destroyed.</text>`;
  s+=`</svg>`; return s;
}

/* carbon's bonding (notes Fig 2.11) */
function figCarbon(){
  const W=860,H=300; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carbon forms four bonds: methane, a double bond, a chain and a ring"><rect width="${W}" height="${H}" fill="#fff"/>`;
  // methane tetrahedron
  s+=`<g data-term="carbon"><path d="M110 60 L40 190 L150 220 L190 150 Z M110 60 L150 220 M40 190 L190 150" stroke="#b9c2c8" fill="none" stroke-dasharray="4 3"/>`;
  [[110,60],[40,190],[150,220],[190,150]].forEach(([x,y])=>{ s+=`<path d="M120 160 L${x} ${y}" stroke="#f0a04b" stroke-width="10" stroke-linecap="round" opacity=".55"/>${atomT(x,y+6,"H",MC.H)}`; });
  s+=`<circle cx="120" cy="160" r="15" fill="#55585c"/>${atomT(120,166,"C","#fff")}<text class="lbl" x="115" y="262" text-anchor="middle" font-weight="700">Methane, CH₄</text><text class="lbl sm" x="115" y="280" text-anchor="middle">four bonds to the corners of a tetrahedron</text></g>`;
  // ethylene
  s+=`<g data-term="carbon">${dbl(290,140,340,140)}${bond(290,140,265,112)}${bond(290,140,265,168)}${bond(340,140,365,112)}${bond(340,140,365,168)}${atomT(290,146,"C")}${atomT(340,146,"C")}${atomT(258,108,"H",MC.H,14)}${atomT(258,182,"H",MC.H,14)}${atomT(372,108,"H",MC.H,14)}${atomT(372,182,"H",MC.H,14)}<text class="lbl" x="315" y="262" text-anchor="middle" font-weight="700">C₂H₄</text><text class="lbl sm" x="315" y="280" text-anchor="middle">a C=C double bond</text></g>`;
  // chain
  let d="M430 160"; const pts=[]; for(let i=0;i<7;i++){ const x=430+i*30, y=i%2?130:160; pts.push([x,y]); d+=` L${x} ${y}`; }
  s+=`<g data-term="carbon"><path d="${d}" stroke="#34454e" stroke-width="2.5" fill="none"/>${dbl(pts[2][0],pts[2][1],pts[3][0],pts[3][1])}${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#55585c"/>`).join("")}<text class="lbl" x="520" y="262" text-anchor="middle" font-weight="700">C₇H₁₄</text><text class="lbl sm" x="520" y="280" text-anchor="middle">a chain (Hs not drawn)</text></g>`;
  // benzene ring
  const rp=[]; for(let i=0;i<6;i++){ const a=(-90+60*i)*Math.PI/180; rp.push([720+50*Math.cos(a),145+50*Math.sin(a)]); }
  s+=`<g data-term="carbon">`; for(let i=0;i<6;i++){ const p=rp[i], q=rp[(i+1)%6]; s+= i%2? bond(p[0],p[1],q[0],q[1],"#34454e",2.5) : dbl(p[0],p[1],q[0],q[1]); } s+=rp.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#55585c"/>`).join("");
  s+=`<text class="lbl" x="720" y="262" text-anchor="middle" font-weight="700">C₆H₆</text><text class="lbl sm" x="720" y="280" text-anchor="middle">a ring</text></g>`;
  s+=`</svg>`; return s;
}

/* four kinds of macromolecule */
function figMacro4(){
  const W=860,H=330; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The four kinds of biological molecules, their monomers and functions"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const R=[["protein","Proteins","amino acids","structure; catalysts (enzymes)","#8fd19e","#3f8f52","c"],["nucleic-acid","Nucleic acids","nucleotides","encode and transmit genetic information","#c1b2e2","#6f5aa3","n"],["carbohydrate","Carbohydrates","monosaccharides","structure; a source of energy","#f6d36b","#b8901c","h"],["lipid","Lipids","not a polymer","membranes, energy storage, signalling","#f2c94c","#b8901c","l"]];
  R.forEach(([k,n,m,f,c,cs,sh],i)=>{ const x=20+i*210;
    s+=`<g data-term="${k}"><rect x="${x}" y="16" width="196" height="298" rx="10" fill="#fafafa" stroke="#d5d8e2"/><text x="${x+98}" y="46" text-anchor="middle" font-family="Source Serif 4,Georgia" font-size="19" font-weight="650" fill="#23282e">${n}</text>`;
    for(let j=0;j<4;j++){ const cx=x+38+j*40, cy=110;
      if(sh==="c") s+=`<circle cx="${cx}" cy="${cy}" r="15" fill="${c}" stroke="${cs}" stroke-width="2"/>`;
      if(sh==="n") s+=`<circle cx="${cx-6}" cy="${cy-8}" r="6" fill="#f4c64f" stroke="#b88a14"/><polygon points="${cx},${cy-8} ${cx+12},${cy-2} ${cx+8},${cy+10} ${cx-6},${cy+10} ${cx-9},${cy-2}" fill="${c}" stroke="${cs}"/>`;
      if(sh==="h"){ let p=[]; for(let k2=0;k2<6;k2++){ const a=Math.PI/3*k2+Math.PI/6; p.push((cx+15*Math.cos(a)).toFixed(1)+","+(cy+15*Math.sin(a)).toFixed(1)); } s+=`<polygon points="${p.join(" ")}" fill="${c}" stroke="${cs}" stroke-width="2"/>`; }
      if(sh==="l" && j<3) s+=`<path d="M${x+50+j*36} ${cy-26} v56" stroke="${cs}" stroke-width="4"/>`;
      if(sh!=="l" && j<3) s+=bond(cx+15,cy,cx+25,cy,"#34454e",3); }
    if(sh==="l") s+=`<rect x="${x+40}" y="${100-36}" width="90" height="12" rx="4" fill="#e9b52f"/>`;
    s+=`<text class="lbl" x="${x+98}" y="170" text-anchor="middle" font-weight="700">Building blocks:</text><text class="lbl" x="${x+98}" y="190" text-anchor="middle">${m}</text>`;
    const fw=f.split("; "); fw.forEach((t,j)=>s+=`<text class="lbl sm" x="${x+98}" y="${230+j*18}" text-anchor="middle">${t}</text>`); s+=`</g>`; });
  s+=`</svg>`; return s;
}

/* amino acid (notes Figs 2.13, 2.14) */
function figAminoAcid(ion){
  const W=640,H=320; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ion?"Ionized amino acid (zwitterion)":"General structure of an amino acid"}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const cx=300, cy=160;
  s+=`<g data-term="alpha-carbon">${atomT(cx,cy+6,"C",MC.C,26)}</g>`;
  s+=`<g data-term="fg-amino">${bond(cx-16,cy,cx-70,cy)}${atomT(cx-100,cy+7,ion?"H₃N⁺":"H₂N",MC.N,24)}</g>`;
  s+=`<g data-term="fg-carboxyl">${bond(cx+16,cy,cx+70,cy)}${atomT(cx+84,cy+7,"C",MC.C,24)}${dbl(cx+92,cy-12,cx+120,cy-46)}${atomT(cx+128,cy-52,"O","#a5532c",22)}${bond(cx+94,cy+10,cx+120,cy+42)}${atomT(cx+136,cy+60,ion?"O⁻":"OH","#a5532c",22)}</g>`;

  s+=`<g class="lbls">${lab("Amino group","fg-amino",40,60,cx-104,cy-14)}${lab("α carbon","alpha-carbon",400,90,cx+8,cy-8)}${lab("Carboxyl group","fg-carboxyl",470,170,cx+140,cy+4)}${lab("R group (side chain):\ndiffers for each amino acid","r-group",380,280,cx+22,cy+80)}</g>`;
  if(ion) s+=`<text class="lbl it" x="20" y="${H-16}">At physiological pH (7.4) both groups are ionized: a zwitterion.</text>`;
  s+=`</svg>`; return s;
}

/* purines and pyrimidines (notes Fig 2.16) */
function figBases2(){
  const W=760,H=300; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pyrimidines have one ring; purines have two"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const hex=(cx,cy,r,c)=>{ let p=[]; for(let i=0;i<6;i++){ const a=(-90+60*i)*Math.PI/180; p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1)); } return `<polygon points="${p.join(" ")}" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>`; };
  const pent=(cx,cy,r,c)=>{ let p=[]; for(let i=0;i<5;i++){ const a=(180+72*i)*Math.PI/180; p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1)); } return `<polygon points="${p.join(" ")}" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>`; };
  s+=`<g data-term="pyrimidine">`;
  [["C","Cytosine","#f0cf4f"],["T","Thymine","#3a9a9a"],["U","Uracil","#86b851"]].forEach(([b,n,c],i)=>{ const x=70+i*110; s+=hex(x,130,38,c)+atomT(x,138,b,"#fff",22)+`<text class="lbl" x="${x}" y="200" text-anchor="middle">${n}</text>`; });
  s+=`<text class="lbl" x="180" y="40" text-anchor="middle" font-weight="700">Pyrimidines: one ring</text></g>`;
  s+=`<g data-term="purine">`;
  [["G","Guanine","#dd5f45"],["A","Adenine","#8e6cc4"]].forEach(([b,n,c],i)=>{ const x=500+i*150; s+=pent(x-50,130,30,c)+hex(x,130,38,c)+atomT(x-6,138,b,"#fff",22)+`<text class="lbl" x="${x-20}" y="200" text-anchor="middle">${n}</text>`; });
  s+=`<text class="lbl" x="560" y="40" text-anchor="middle" font-weight="700">Purines: two rings</text></g>`;
  s+=`<text class="lbl it" x="${W/2}" y="250" text-anchor="middle">DNA uses A, G, C and T. RNA uses A, G, C and U.</text><text class="lbl it" x="${W/2}" y="272" text-anchor="middle">Ring shapes are simplified; the order of bases carries the information.</text>`;
  s+=`</svg>`; return s;
}

/* ============ story engine ============ */
let RUN = null; // {id, first:{}}
function chState(id){ return P.ch[id] || (P.ch[id] = {done:false, best:null, last:null}); }
function recordFirst(stepIdx, correct, terms){
  if (!RUN) return;
  if (!(stepIdx in RUN.first)) RUN.first[stepIdx] = !!correct;
  (terms||[]).forEach(k=>markTerm(k,"tested"));
}
function runScore(){ const v=Object.values(RUN.first); return {right:v.filter(Boolean).length, total:v.length}; }

function renderChapter(ci, si=0){
  stopLoops(); exploreHook=null; window.scrollTo(0,0);
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go==="story")));
  const ch = CHAPTERS[ci];
  if (!RUN || RUN.id !== ch.id) RUN = {id:ch.id, first:{}};
  const app = $("#app"); app.innerHTML = "";
  const bar = h("div",{class:"steps","aria-hidden":"true"});
  ch.steps.forEach((_,i)=>bar.append(h("i",{class:i<si?"on":i===si?"cur":""})));
  app.append(h("div",{class:"banner"}, h("span",{class:"num"},`2.${ci+1}`), h("span",{class:"ttl"},ch.title), h("span",{class:"pg"},`Course notes ${ch.pages}`)));
  app.append(h("div",{class:"crumb"}, h("button",{class:"back",onclick:()=>go("story")},"All chapters"), h("span",{class:"muted small"},`Step ${si+1} of ${ch.steps.length}`), bar));
  const step = ch.steps[si];
  const stage = h("div",{class:"stage"+(step.wide?" wide":"")});
  const plateHost = h("div"), panel = h("div",{class:"panel"});
  stage.append(plateHost, panel); app.append(stage);
  const next = h("button",{class:"btn",onclick:()=>{ if(si+1<ch.steps.length) renderChapter(ci,si+1); else finishChapter(ci); }}, si+1<ch.steps.length?"Continue":"Finish chapter");
  const back = h("button",{class:"btn ghost",onclick:()=>{ if(si>0) renderChapter(ci,si-1); else go("story"); }}, si>0?"Back":"All chapters");
  const api = {
    ci, si, panel, plateHost, next,
    lock(){ next.disabled = true; }, unlock(){ next.disabled = false; },
    grade(ok, terms){ recordFirst(si, ok, terms||step.terms); },
    gradeKey(key, ok, terms){ recordFirst(si+'.'+key, ok, terms); },
  };
  (STEP_TYPES[step.type])(step, api);
  panel.append(h("div",{class:"nav"}, back, next));
  bindTerms(app); bindRich(app);
  tc.classList.remove("show");
}
function finishChapter(ci){
  stopLoops(); window.scrollTo(0,0);
  const ch = CHAPTERS[ci], sc = runScore(), st = chState(ch.id);
  const frac = sc.total ? sc.right/sc.total : 1;
  const prevBest = st.best;
  st.done = true; st.last = frac; if (st.best==null || frac>st.best) st.best = frac; save();
  const app=$("#app"); app.innerHTML="";
  const box = h("div",{class:"summary"});
  box.append(h("div",{class:"banner"}, h("span",{class:"num"},`2.${ci+1}`), h("span",{class:"ttl"},ch.title+": complete")));
  box.append(h("div",{class:"row",style:"gap:26px;margin:10px 0 18px"},
     h("div",{}, h("div",{class:"big"},`${sc.right}/${sc.total}`), h("div",{class:"muted small"},"right on the first try")),
     h("div",{}, h("div",{class:"big",style:"color:var(--head)"},Math.round((st.best||0)*100)+"%"), h("div",{class:"muted small"}, prevBest==null?"your best so far": (frac>prevBest?"new personal best":"your best"))) ));
  box.append(h("p",{},ch.wrap));
  box.append(h("p",{class:"muted small"},"Terms from this chapter. Click one to review it."), termChips(ch.terms));
  const nextBtn = ci+1<CHAPTERS.length ? h("button",{class:"btn",onclick:()=>{RUN=null; renderChapter(ci+1,0);}},`Start chapter ${ci+2}: ${CHAPTERS[ci+1].title}`) : h("button",{class:"btn",onclick:()=>go("checkpoint")},"Go to the chemistry desk");
  box.append(h("div",{class:"row",style:"margin-top:16px"}, nextBtn, h("button",{class:"btn ghost",onclick:()=>{RUN=null; renderChapter(ci,0);}},"Replay chapter"), h("button",{class:"btn ghost",onclick:()=>go("story")},"All chapters")));
  app.append(box);
  RUN = null;
}

/* ---- step types ---- */
function figHost(step, api, svg){
  if (!svg) return;
  const f = plate(svg, step.cap);
  if (step.labelsToggle){
    const b = h("button",{class:"mini","aria-pressed":"true"},"Labels");
    b.addEventListener("click",()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",on?"false":"true"); f.classList.toggle("labels-off",on); });
    f.prepend(h("div",{class:"tools"},b));
  }
  api.plateHost.innerHTML=""; api.plateHost.append(f);
  if (step.onFig) step.onFig(f.querySelector("svg"));
  return f;
}
const STEP_TYPES = {
  brief(step, api){
    figHost(step, api, step.fig && step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    if (step.terms) api.panel.append(termChips(step.terms));
  },
  review(step, api){
    figHost(step, api, step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    const counter = h("p",{class:"explored"});
    const seen = new Set();
    const upd = ()=>{ counter.textContent = `Parts explored: ${seen.size} of ${step.terms.length}`; };
    exploreHook = k=>{ if(step.terms.includes(k)){ seen.add(k); upd(); } };
    upd(); api.panel.append(counter, termChips(step.terms));
  },
  mcq(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},step.kicker||"Your call"), h("h2",{},step.title));
    if (step.q) api.panel.append(h("div",{html:rich(step.q)}));
    const box = h("div",{class:"opts"}), fb = h("div");
    let solved=false, first=true;
    const opts = step.keep ? step.opts : shuffle(step.opts);
    opts.forEach(o=>{
      const b = h("button",{class:"opt"},o[0]);
      b.addEventListener("click",()=>{
        if (solved) return;
        if (first){ api.grade(o[1], step.terms); first=false; }
        fb.innerHTML="";
        if (o[1]){
          solved=true; b.classList.add("right");
          $$(".opt",box).forEach(x=>x.disabled=true);
          fb.append(h("div",{class:"fb ok",html:`<b>Correct.</b>${rich(o[2]||"")}`}));
          if (step.after) fb.append(h("div",{class:"fb",html:rich(step.after)}));
          if (step.afterFig && f){ const nf = plate(step.afterFig(), step.afterCap||step.cap); api.plateHost.innerHTML=""; api.plateHost.append(nf); bindTerms(nf); }
          api.unlock();
        } else {
          b.classList.add("wrong"); b.disabled=true;
          fb.append(h("div",{class:"fb bad",html:`<b>Not quite.</b>${rich(o[2]||"")} Try another answer.`}));
        }
        bindRich(fb);
      });
      box.append(b);
    });
    api.panel.append(box, fb); api.lock();
  },
  order(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Put these in order"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    const n = step.items.length, slots = new Array(n).fill(null);
    let pool = shuffle(step.items.map((t,i)=>({t,i})));
    let first = true;
    const slotBox = h("div",{class:"order"}), poolBox = h("div",{class:"pool"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check order");
    function draw(){
      slotBox.innerHTML=""; poolBox.innerHTML="";
      slots.forEach((s,i)=>{
        const el = h("div",{class:"slot"+(s?" filled":"")+(s&&s.mark?" "+s.mark:""),tabindex:s?"0":null,role:s?"button":null}, h("span",{class:"n"},String(i+1)), h("span",{}, s?s.t:"Click a step below to place it here"));
        if (s && !s.locked) el.addEventListener("click",()=>{ pool.push(s); slots[i]=null; delete s.mark; draw(); });
        slotBox.append(el);
      });
      pool.forEach(p=>{ const b=h("button",{class:"card"},p.t); b.addEventListener("click",()=>{ const k=slots.indexOf(null); if(k<0) return; slots[k]=p; pool=pool.filter(x=>x!==p); draw(); }); poolBox.append(b); });
      check.disabled = slots.includes(null);
    }
    check.addEventListener("click",()=>{
      let all=true;
      slots.forEach((s,i)=>{ s.mark = s.i===i?"right":"wrong"; if(s.i!==i) all=false; else s.locked=true; });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){ fb.append(h("div",{class:"fb ok",html:"<b>That's the right order.</b>"+rich(step.after||"")})); check.remove(); api.unlock(); draw(); bindRich(fb); return; }
      draw();
      fb.append(h("div",{class:"fb bad",html:"<b>Some steps are out of place.</b> The green ones are right and locked in. Click a red one to send it back, then try again."}));
    });
    draw();
    api.panel.append(slotBox, poolBox, h("div",{class:"row"},check), fb); api.lock();
  },
  sort(step, api){
    figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Sort them"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    let items = shuffle(step.items.map((it,i)=>({t:it[0],bin:it[1],why:it[2],i,at:null})));
    let sel = null, first = true;
    const poolBox = h("div",{class:"pool"}), binBox = h("div",{class:"bins"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check");
    function draw(){
      poolBox.innerHTML=""; binBox.innerHTML="";
      items.filter(x=>x.at===null).forEach(x=>{ const b=h("button",{class:"card"+(sel===x?" sel":"")},x.t); b.addEventListener("click",()=>{ sel = sel===x?null:x; draw(); }); poolBox.append(b); });
      step.bins.forEach((name,bi)=>{
        const bin = h("div",{class:"bin",tabindex:"0",role:"button","aria-label":"Place in "+name}, h("h4",{},name));
        const place = ()=>{ if(sel){ sel.at=bi; delete sel.mark; sel=null; draw(); } };
        bin.addEventListener("click",place); bin.addEventListener("keydown",e=>{ if(e.key==="Enter") place(); });
        items.filter(x=>x.at===bi).forEach(x=>{ const c=h("button",{class:"card"+(x.mark?" "+x.mark:"")},x.t); c.addEventListener("click",e=>{ e.stopPropagation(); if(sel){ place(); return; } if(x.locked) return; x.at=null; delete x.mark; draw(); }); bin.append(c); });
        binBox.append(bin);
      });
      if (!items.some(x=>x.at===null)) poolBox.append(h("p",{class:"muted small"},"All placed. Check your sort, or click a card in a box to take it back out."));
      else if (!sel) poolBox.prepend(h("p",{class:"muted small",style:"margin:0"},"Click a card, then click the box it belongs in."));
      check.disabled = items.some(x=>x.at===null);
    }
    check.addEventListener("click",()=>{
      let all=true; const misses=[];
      items.forEach(x=>{ if(x.at===x.bin){ x.mark="right"; x.locked=true; } else { x.mark="wrong"; all=false; misses.push(x); } });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){
        fb.append(h("div",{class:"fb ok",html:"<b>All sorted correctly.</b>"+rich(step.after||"")}));
        check.remove(); api.unlock(); draw(); bindRich(fb);
        if (step.onSolved) step.onSolved(api);
        return;
      }
      draw();
      const why = misses.filter(m=>m.why).map(m=>`<li>${m.t}: ${m.why}</li>`).join("");
      fb.append(h("div",{class:"fb bad",html:`<b>${misses.length} in the wrong box.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""} Move the red ones and check again.`}));
    });
    draw();
    api.panel.append(poolBox, binBox, h("div",{class:"row"},check), fb); api.lock();
  },
  custom(step, api){ step.render(api, step); }
};

/* ============ 2.1 Atom builder ============ */
const ELEM = [null,
 {s:"H",n:"Hydrogen",nn:0,b:"1 bond"},{s:"He",n:"Helium",nn:2,b:"none (full shell)"},{s:"Li",n:"Lithium",nn:4,b:"loses 1"},{s:"Be",n:"Beryllium",nn:5,b:"loses 2"},
 {s:"B",n:"Boron",nn:6,b:"3 bonds"},{s:"C",n:"Carbon",nn:6,b:"4 bonds"},{s:"N",n:"Nitrogen",nn:7,b:"3 bonds"},{s:"O",n:"Oxygen",nn:8,b:"2 bonds"},
 {s:"F",n:"Fluorine",nn:10,b:"1 bond"},{s:"Ne",n:"Neon",nn:10,b:"none (full shell)"},{s:"Na",n:"Sodium",nn:12,b:"gives up 1 electron"},{s:"Mg",n:"Magnesium",nn:12,b:"gives up 2 electrons"},
 {s:"Al",n:"Aluminum",nn:14,b:"gives up 3"},{s:"Si",n:"Silicon",nn:14,b:"4 bonds"},{s:"P",n:"Phosphorus",nn:16,b:"3 or 5 bonds"},{s:"S",n:"Sulfur",nn:16,b:"2 bonds"},
 {s:"Cl",n:"Chlorine",nn:18,b:"1 bond, or gains 1 electron"},{s:"Ar",n:"Argon",nn:22,b:"none (full shell)"},{s:"K",n:"Potassium",nn:20,b:"gives up 1 electron"},{s:"Ca",n:"Calcium",nn:20,b:"gives up 2 electrons"}];
const SHELL_CAP=[2,8,8,2];
function shellsOf(e){ const out=[]; let left=e; for(const c of SHELL_CAP){ if(left<=0) break; const k=Math.min(c,left); out.push(k); left-=k; } return out; }
function atomSVG(p,nn,e,opts={}){
  const W=520,H=440,cx=250,cy=220; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Atom with ${p} protons, ${nn} neutrons and ${e} electrons">`;
  s+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
  const sh=shellsOf(e), R=[78,128,172,206];
  R.slice(0,Math.max(1,sh.length)).forEach((r,i)=>{ const val=i===sh.length-1; s+=`<g data-term="${val?"valence":"orbital"}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${val&&e?"#e2a23a":"#c9cfe3"}" stroke-width="${val&&e?3:1.6}" ${val&&e?"":'stroke-dasharray="5 5"'}/></g>`; });
  // nucleus: sunflower packing
  const N=p+nn, parts=[]; for(let i=0;i<N;i++) parts.push(i<p?"p":"n");
  const order=parts.map((t,i)=>({t,k:(i*7)%Math.max(1,N)})).sort((a,b)=>a.k-b.k).map(x=>x.t);
  s+=`<g data-term="nucleus-atom">`;
  order.forEach((t,i)=>{ const r=6.2*Math.sqrt(i+0.5), a=i*2.39996; const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    s+= t==="p" ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.5" fill="#4a7fd0" stroke="#2c5aa0"/><text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Arial">+</text>`
                : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.5" fill="#7d8a86" stroke="#55615d"/>`; });
  s+=`</g>`;
  sh.forEach((k,i)=>{ for(let j=0;j<k;j++){ const a=-Math.PI/2+j*2*Math.PI/SHELL_CAP[i]+(i*0.35); const x=cx+R[i]*Math.cos(a), y=cy+R[i]*Math.sin(a);
    s+=`<g data-term="electron"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="#f08a2c" stroke="#b85f0e"/><text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Arial">e⁻</text></g>`; } });
  const el=ELEM[p];
  if(el){ s+=`<text x="${W-14}" y="40" text-anchor="end" font-family="Source Serif 4,Georgia" font-size="40" font-weight="650" fill="#23282e">${el.s}</text><text x="${W-14}" y="62" text-anchor="end" class="lbl">${el.n}</text>`; }
  s+=`<g class="lbls">${lab("Nucleus: protons (+)\nand neutrons","nucleus-atom",16,30,cx-14,cy-14)}${e?lab("Valence (outermost) shell","valence",16,H-24,cx-R[sh.length-1]*0.7,cy+R[sh.length-1]*0.7):""}</g>`;
  s+=`</svg>`; return s;
}
function simAtom(api){

               ["Build a neutral oxygen atom (8 protons, 8 neutrons). How many valence electrons does it have?",s=>s.p===8&&s.nn===8&&s.e===8],
               ["Turn a sodium atom (11 protons, 12 neutrons) into a sodium ion, Na⁺.",s=>s.p===11&&s.nn===12&&s.e===10],
               ["Make a chloride ion, Cl⁻ (17 protons, 18 neutrons).",s=>s.p===17&&s.nn===18&&s.e===18]];

    host.innerHTML=""; const f=plate(atomSVG(st.p,st.nn,st.e),"<b>Figure 1.1</b> Build an atom. Blue: protons (+). Grey: neutrons. Orange: electrons (–). Shells shown hold 2, then 8, then 8. (Notes p. 13, Fig 2.2)"); host.append(f); bindTerms(f);

    TASKS.forEach((t,i)=>{ if(!done[i] && t[1](st) && (i===0||done[i-1])) done[i]=true; });
    list.innerHTML=""; TASKS.forEach((t,i)=>list.append(h("li",{style:done[i]?"color:var(--ok);font-weight:600":(i===done.indexOf(false)?"font-weight:600":"color:var(--ink2)")},(done[i]?"Done: ":"")+t[0])));
    if(done.every(Boolean)) api.unlock();
  }
  const ctl=h("div",{class:"ctl"});
  [["p","Protons"],["nn","Neutrons"],["e","Electrons"]].forEach(([k,lbl])=>{
    const val=h("b",{style:"min-width:2ch;display:inline-block;text-align:center"});
    const row=h("div",{class:"row"}, h("span",{style:"min-width:84px;font-weight:600"},lbl),
      h("button",{class:"btn ghost",style:"padding:4px 14px",onclick:()=>{ if(st[k]>0){ st[k]--; upd(); } },"aria-label":"Remove one "+lbl.toLowerCase().slice(0,-1)},"−"), val,
      h("button",{class:"btn ghost",style:"padding:4px 14px",onclick:()=>{ if(st[k]<(k==="nn"?24:20)){ st[k]++; upd(); } },"aria-label":"Add one "+lbl.toLowerCase().slice(0,-1)},"+"));
    function upd(){ val.textContent=st[k]; draw(); } val.textContent=st[k]; row._upd=upd; ctl.append(row); });
  const presets=h("div",{class:"row",style:"margin:4px 0"},h("span",{class:"muted small"},"Start from:"));
  [["Sodium",11,12,11],["Chlorine",17,18,17],["Oxygen",8,8,8]].forEach(([nm,p,nn,e])=>presets.append(h("button",{class:"tl",onclick:()=>{ st.p=p; st.nn=nn; st.e=e; $$(".ctl b",api.panel).forEach((b,i)=>b.textContent=[st.p,st.nn,st.e][i]); draw(); }},nm)));
  api.panel.append(h("p",{class:"kicker"},"Build it"), h("h2",{},"Build an atom"),
    h("div",{html:rich("<p>Every atom has a dense [[nucleus-atom|nucleus]] of positive [[proton|protons]] and neutral [[neutron|neutrons]], with negative [[electron|electrons]] moving around it in [[orbital|orbitals]] (each orbital holds at most 2 electrons). The electrons in the outermost shell are the [[valence|valence electrons]], and they decide how many bonds an atom makes.</p>")}),
    ctl, presets, info, h("b",{},"Tasks"), list);

/* ============ 2.1 Bond polarity ============ */
const EN = {H:2.20,C:2.55,N:3.04,O:3.44,P:2.19,S:2.58,Cl:3.16,Na:0.93,K:0.82};
const ATOMCOL = {H:"#e9eef5",C:"#55585c",N:"#4a7fd0",O:"#d8463c",P:"#e58a2c",S:"#e2c341",Cl:"#5fbf5a",Na:"#9a6fd0",K:"#8a5fc0"};
function bondKind(a,b){ const d=Math.abs(EN[a]-EN[b]); return d>=1.7?"ionic": d>=0.5?"polar":"nonpolar"; }
function bondSVG(a,b){
  const W=600,H=300, xa=180, xb=420, y=150, d=EN[b]-EN[a], kind=bondKind(a,b);
  const ra = a==="H"?44:58, rb = b==="H"?44:58;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${a} bonded to ${b}: ${kind} bond"><rect width="${W}" height="${H}" fill="#fff"/>`;
  if(kind!=="ionic"){
    // shared electron cloud, shifted toward the more electronegative atom
    const shift=Math.max(-1,Math.min(1,d/1.7)); const cx=300+shift*70;
    s+=`<g data-term="${kind==="polar"?"polar-covalent":"nonpolar-covalent"}"><ellipse cx="${cx}" cy="${y}" rx="${150-Math.abs(shift)*30}" ry="70" fill="#f9d9a6" opacity=".7"/></g>`;
    s+=`<circle cx="${xa}" cy="${y}" r="${ra}" fill="${ATOMCOL[a]}" stroke="#555"/><circle cx="${xb}" cy="${y}" r="${rb}" fill="${ATOMCOL[b]}" stroke="#555"/>`;
    s+=`<g data-term="electron"><circle cx="${cx-9}" cy="${y-2}" r="7" fill="#f08a2c" stroke="#b85f0e"/><circle cx="${cx+9}" cy="${y-2}" r="7" fill="#f08a2c" stroke="#b85f0e"/></g>`;
    if(kind==="polar"){ const neg = d>0?xb:xa, pos= d>0?xa:xb; s+=`<text x="${neg}" y="${y-80}" text-anchor="middle" font-size="22" font-weight="700" fill="#d8463c" font-family="Arial">δ⁻</text><text x="${pos}" y="${y-80}" text-anchor="middle" font-size="22" font-weight="700" fill="#4a7fd0" font-family="Arial">δ⁺</text>`; }
  } else {
    const cat = d>0?a:b, an = d>0?b:a, xc = d>0?xa-20:xb+20, xn = d>0?xb+20:xa-20;
    s+=`<g data-term="ionic-bond"><circle cx="${xc}" cy="${y}" r="46" fill="${ATOMCOL[cat]}" stroke="#555"/><circle cx="${xn}" cy="${y}" r="66" fill="${ATOMCOL[an]}" stroke="#555"/></g>`;
    s+=`<text x="${xc}" y="${y-62}" text-anchor="middle" font-size="26" font-weight="700" fill="#4a7fd0" font-family="Arial">+</text><text x="${xn}" y="${y-82}" text-anchor="middle" font-size="30" font-weight="700" fill="#d8463c" font-family="Arial">−</text>`;
    s+=`<g data-term="electron"><circle cx="${xn+(d>0?-40:40)}" cy="${y-38}" r="7" fill="#f08a2c" stroke="#b85f0e"/></g>`;
    s+=arrow(xc+(d>0?30:-30),y-50,xn+(d>0?-46:46),y-46,"#b85f0e",2,"4 3");
    s+=`<text class="lbl" x="300" y="${H-46}" text-anchor="middle">${cat==="Na"||cat==="K"?cat+"⁺ ":"cation "} ${d>0?"gave":"gave"} an electron to ${an==="Cl"?"Cl⁻":an}. The ions attract each other.</text>`;
  }
  const lbl=(x,t,c)=>`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial" fill="${c}">${t}</text>`;
  if(kind!=="ionic"){ s+=lbl(xa,a,a==="H"?"#333":"#fff")+lbl(xb,b,b==="H"?"#333":"#fff"); }
  else { const cat=d>0?a:b, an=d>0?b:a; s+=lbl(d>0?xa-20:xb+20,cat+"⁺","#fff")+lbl(d>0?xb+20:xa-20,an+"⁻","#fff"); }
  s+=`<text class="lbl" x="${xa}" y="${H-14}" text-anchor="middle">electronegativity ${EN[a].toFixed(2)}</text><text class="lbl" x="${xb}" y="${H-14}" text-anchor="middle">electronegativity ${EN[b].toFixed(2)}</text>`;
  s+=`</svg>`; return s;
}
function simBond(api){
  let a="H", b="H"; const found={nonpolar:false,polar:false,ionic:false};
  const host=h("div"); api.plateHost.innerHTML=""; api.plateHost.append(host);
  const info=h("div",{class:"fb"}), tasks=h("div");
  const KN={nonpolar:"Nonpolar covalent bond",polar:"Polar covalent bond",ionic:"Ionic bond"};
  const KD={nonpolar:"The atoms have the same, or nearly the same, electronegativity, so they share the electrons equally.",polar:"One atom is more electronegative and pulls the shared electrons closer. It gets a slight negative charge (δ⁻); the other gets a slight positive charge (δ⁺).",ionic:"The difference in electronegativity is so large that one atom takes an electron from the other. The cation (+) and anion (–) are held together by their opposite charges."};

    const k=bondKind(a,b), dd=Math.abs(EN[a]-EN[b]); found[k]=true;
    info.innerHTML=`<b>${a}–${b}: ${KN[k]}.</b> Difference in electronegativity: ${dd.toFixed(2)}. ${KD[k]}`;
    tasks.innerHTML=""; tasks.append(h("b",{},"Find one of each"), h("ul",{style:"margin:4px 0;padding-left:20px"}, ...Object.keys(KN).map(x=>h("li",{style:found[x]?"color:var(--ok);font-weight:600":""},(found[x]?"Found: ":"")+KN[x]))));
    if(found.nonpolar&&found.polar&&found.ionic) api.unlock(); }
  function picker(label,get,set){ const seg=h("div",{class:"seg"}); Object.keys(EN).forEach(x=>{ const bt=h("button",{"aria-pressed":String(get()===x)},x); bt.addEventListener("click",()=>{ set(x); $$("button",seg).forEach(z=>z.setAttribute("aria-pressed",String(z.textContent===x))); draw(); }); seg.append(bt); }); return h("div",{},h("label",{},label),seg); }
  api.panel.append(h("p",{class:"kicker"},"Try it"), h("h2",{},"Equal sharing, unequal sharing, stealing"),
    h("div",{html:rich("<p>A [[covalent-bond|covalent bond]] forms when atoms share valence electrons. How they share depends on [[electronegativity|electronegativity]]: how strongly each atom pulls on electrons. Pick two atoms and watch where the electrons go.</p>")}),
    h("div",{class:"ctl"},picker("Atom 1",()=>a,x=>a=x),picker("Atom 2",()=>b,x=>b=x)), info, tasks,
    h("p",{class:"muted small"},"Rough guide used here: a difference under 0.5 is nonpolar, 0.5 to 1.7 is polar, above 1.7 is ionic. Real bonds sit on a continuum."));
  api.lock(); draw();
}

/* ============ 2.2 Water lab: hydrogen bonds, dissolving salt, oil ============ */
function simWater(api, opts={}){
  const W=760,H=440; const {cv,ctx}=makeCanvas(W,H,"Animation: water molecules, with salt or oil added");
  const S={mode:"water", hb:true, t:0, mols:[], ions:[], oil:[], dissolved:0};
  const R=13; // oxygen radius
  function initWater(n){ S.mols=[]; for(let i=0;i<n;i++) S.mols.push({x:20+Math.random()*(W-40),y:20+Math.random()*(H-40),vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,a:Math.random()*6.283,va:(Math.random()-.5)*2}); }
  function addSalt(){ S.ions=[]; const g=4, s0=24, x0=W/2-1.5*s0, y0=H/2-1.5*s0; for(let i=0;i<g;i++) for(let j=0;j<g;j++){ const na=(i+j)%2===0; S.ions.push({na,x:x0+i*s0,y:y0+j*s0,hx:x0+i*s0,hy:y0+j*s0,free:false,vx:0,vy:0,t:1+Math.random()*5+((Math.abs(i-1.5)+Math.abs(j-1.5))<2?3:0)}); }
    S.mols=S.mols.filter(m=>Math.hypot(m.x-W/2,m.y-H/2)>70); }
  function addOil(){ S.oil=[]; for(let i=0;i<18;i++) S.oil.push({x:60+Math.random()*(W-120),y:60+Math.random()*(H-120),vx:0,vy:0}); }
  function setMode(m){ S.mode=m; S.t=0; S.ions=[]; S.oil=[]; initWater(m==="water"?70:58); if(m==="salt") addSalt(); if(m==="oil") addOil(); }
  setMode("water");
  function oxy(m){ return [m.x,m.y]; }
  function hyd(m){ const d=17, sp=0.913; return [[m.x+d*Math.cos(m.a-sp),m.y+d*Math.sin(m.a-sp)],[m.x+d*Math.cos(m.a+sp),m.y+d*Math.sin(m.a+sp)]]; }
  function step(dt){
    S.t+=dt;
    // ions: break off one at a time from the crystal
    S.ions.forEach(io=>{ if(!io.free && S.t>io.t){ io.free=true; const a=Math.atan2(io.y-H/2,io.x-W/2)+(Math.random()-.5); io.vx=Math.cos(a)*40; io.vy=Math.sin(a)*40; }
      if(io.free){ io.vx+=(Math.random()-.5)*60*dt; io.vy+=(Math.random()-.5)*60*dt; const sp=Math.hypot(io.vx,io.vy); if(sp>45){ io.vx*=45/sp; io.vy*=45/sp; } io.x+=io.vx*dt; io.y+=io.vy*dt;
        if(io.x<20||io.x>W-20) io.vx*=-1; if(io.y<20||io.y>H-20) io.vy*=-1; io.x=Math.max(20,Math.min(W-20,io.x)); io.y=Math.max(20,Math.min(H-20,io.y)); } });
    // oil: nonpolar molecules drift together (water excludes them)

/* ============ Chemistry desk: endless practice ============ */
const DESK_EL=[[1,"H","hydrogen"],[6,"C","carbon"],[7,"N","nitrogen"],[8,"O","oxygen"],[11,"Na","sodium"],[12,"Mg","magnesium"],[15,"P","phosphorus"],[16,"S","sulfur"],[17,"Cl","chlorine"],[19,"K","potassium"],[20,"Ca","calcium"]];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function makeChemTask(){
  const k=Math.floor(Math.random()*8);
  if(k===0){ const pairs=[["H","H"],["C","H"],["O","H"],["N","H"],["Na","Cl"],["K","Cl"],["C","O"],["O","O"],["C","C"],["N","O"]]; const [a,b]=pick(pairs); const kind=bondKind(a,b);
    return {title:"Name the bond",prompt:`What kind of bond forms between ${a} and ${b}?`,opts:["Nonpolar covalent","Polar covalent","Ionic"],ans:kind==="ionic"?"Ionic":kind==="polar"?"Polar covalent":"Nonpolar covalent",why:`Electronegativity: ${a} ${EN[a]}, ${b} ${EN[b]}. Similar values share equally; a moderate difference shares unequally; a big difference (like Na and Cl) means one atom takes an electron.`,t:["covalent-bond","electronegativity","ionic-bond"]}; }
  if(k===1){ const [p,sym,nm]=pick(DESK_EL); const sh=shellsOf(p), v=sh[sh.length-1];
    return {title:"Valence electrons",prompt:`A neutral ${nm} atom (${sym}) has ${p} electrons. How many valence electrons does it have?`,opts:shuffle([...new Set([v,(v%8)+1,p,Math.max(1,v-2),8].filter(x=>x>0))]).slice(0,4).map(String).concat([]),ans:String(v),why:`Shells fill 2, then 8, then 8: ${sh.join(", ")}. The outermost shell holds ${v}.`,t:["valence"]}; }
  if(k===2){ const ion=pick([["Na",11,10],["K",19,18],["Cl",17,18],["Ca",20,18],["Mg",12,10],["O",8,10]]); const ch=ion[1]-ion[2]; const lab2=ch>0?`+${ch}`:String(ch);
    return {title:"Ion charge",prompt:`An ion of ${ion[0]} has ${ion[1]} protons and ${ion[2]} electrons. What is its charge, and is it a cation or an anion?`,opts:shuffle([`${lab2}, ${ch>0?"cation":"anion"}`,`${lab2}, ${ch>0?"anion":"cation"}`,`${ch>0?"-"+ch:"+"+(-ch)}, ${ch>0?"anion":"cation"}`,"0, neutral"]),ans:`${lab2}, ${ch>0?"cation":"anion"}`,why:"Charge = protons − electrons. Positive ions are cations; negative ions are anions.",t:["cation","anion"]}; }
  if(k===3){ const a=pick([1,2,3,4,5]), b=a+pick([1,2,3,4]); const f=Math.pow(10,b-a);
    return {title:"pH",prompt:`Solution X is pH ${a}; solution Y is pH ${b}. Which has more H⁺, and how many times more?`,opts:shuffle([`X, ${f.toLocaleString()} times more`,`Y, ${f.toLocaleString()} times more`,`X, ${b-a} times more`,`Y, ${b-a} times more`]),ans:`X, ${f.toLocaleString()} times more`,why:"Lower pH means more H⁺, and each pH unit is a tenfold change.",t:["ph","acid"]}; }
  if(k===4){ const n=pick([4,6,10,12,20,25,50,100]); const kind=pick(["glucose units into starch","amino acids into a polypeptide","nucleotides into a strand of DNA"]); const hyd=Math.random()<0.4;
    return {title:hyd?"Hydrolysis":"Condensation",prompt:hyd?`A chain of ${n} ${kind.split(" into ")[0]} is completely broken down by hydrolysis. How many water molecules are used?`:`${n} ${kind} are joined. How many water molecules are released?`,opts:shuffle([n-1,n,n+1,2*n].map(String)),ans:String(n-1),why:`A chain of ${n} has ${n-1} bonds, and each bond ${hyd?"uses":"releases"} one water.`,t:[hyd?"hydrolysis":"condensation","polymer"]}; }
  if(k===5){ const m=pick([["amino acids","peptide bond"],["monosaccharides","glycosidic bond"],["nucleotides","phosphodiester bond"]]);
    return {title:"Linking bonds",prompt:`What bond links ${m[0]} together?`,opts:shuffle(["Peptide bond","Glycosidic bond","Phosphodiester bond","Hydrogen bond"]),ans:m[1][0].toUpperCase()+m[1].slice(1),why:"Amino acids: peptide bonds. Sugars: glycosidic bonds. Nucleotides: phosphodiester bonds.",t:["peptide-bond","glycosidic","phosphodiester"]}; }
  if(k===6){ const g=pick(FG);
    return {title:"Functional groups",prompt:`Which group is ${g.f}?`,opts:shuffle([g.n,...shuffle(FG.filter(x=>x!==g)).slice(0,3).map(x=>x.n)]),ans:g.n,why:`${g.n} (${g.f}): ${g.pol.toLowerCase()}${g.ch!=="none"?", charge "+g.ch.trim():""}. Found in ${g.in.toLowerCase()}.`,t:[g.k]}; }
  const b=pick([["Adenine","Purine (two rings)","both DNA and RNA"],["Guanine","Purine (two rings)","both DNA and RNA"],["Cytosine","Pyrimidine (one ring)","both DNA and RNA"],["Thymine","Pyrimidine (one ring)","DNA only"],["Uracil","Pyrimidine (one ring)","RNA only"]]);
  return {title:"Bases",prompt:`Is ${b[0].toLowerCase()} a purine or a pyrimidine?`,opts:["Purine (two rings)","Pyrimidine (one ring)"],ans:b[1],why:`Purines (A, G) have two rings; pyrimidines (C, T, U) have one. ${b[0]} is found in ${b[2]}.`,t:["purine","pyrimidine"]};
}
