<!DOCTYPE html>
<html lang="en" data-module="m10">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cell and tissue form | BIOL 130 Module 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,650;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f1ece7; --paper:#ffffff; --ink:#1c2830; --ink2:#4b5b64; --rule:#cbd5d7;
  --head:#23282e; --accent:#c0612b; --accentInk:#ffffff; --accentSoft:#f6e9e1;
  --ok:#2a7648; --okSoft:#e2f2e7; --bad:#a53838; --badSoft:#f7e4e2;
  --plate:#ffffff; --plateRule:#c3cdd0; --cap:#3b4a52; --chip:#f1f5f5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
    --head:#e8eeea; --accent:#dca88a; --accentInk:#1d0f06; --accentSoft:#37251c;
    --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
    --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
  }
}
:root[data-theme="dark"]{
  --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
  --head:#e8eeea; --accent:#dca88a; --accentInk:#1d0f06; --accentSoft:#37251c;
  --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
  --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--head);font-weight:650;line-height:1.2;margin:0}
p{margin:0 0 .8em}
sup{font-size:.7em;line-height:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-size:1.45rem;color:var(--head);font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--rule);background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* figure plates */
.plate{background:var(--plate);border:1px solid var(--plateRule);border-radius:4px;padding:10px 10px 8px;margin:0;position:relative}
.plate svg,.plate canvas{display:block;width:100%;height:auto}
.plate figcaption{font-family:var(--serif);font-size:.93rem;color:#3b4a52;padding:8px 4px 2px;line-height:1.4}
.plate figcaption b{font-weight:650;color:#c0612b}
.plate .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.mini{font-size:.82rem;padding:4px 9px;border-radius:5px;border:1px solid #c3cdd0;background:#fff;color:#1c2830;cursor:pointer}
.mini:hover{background:#eef4f4}
.mini[aria-pressed="true"]{background:#c0612b;color:#fff;border-color:#c0612b}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:2.3rem;letter-spacing:-.015em;margin-bottom:12px}
.lede{font-size:1.08rem;color:var(--ink);max-width:36em}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.chlist{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chitem{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.chitem:hover{border-color:var(--accent)}
.chnum{font-family:var(--serif);font-size:1.6rem;color:var(--accent);grid-row:span 2;line-height:1}
.chitem h3{font-size:1.1rem}
.chitem .meta{grid-column:2;color:var(--ink2);font-size:.88rem}
.done-tag{color:var(--ok);font-weight:600}
.sect{margin-top:34px}
.sect h2{font-size:1.35rem;margin-bottom:6px}

/* chapter */
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb h1{font-size:1.6rem}
.crumb .back{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.steps{display:flex;gap:4px;flex:1;min-width:160px;max-width:420px;margin-left:auto}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--head)}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide>.panel{max-width:860px}
.stage.wide>.panel:has(.pad){max-width:none}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.kicker{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--accent);background:var(--accentSoft);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.bad{border-color:var(--bad);background:var(--badSoft)}
.fb > b:first-child{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.explored{font-size:.9rem;color:var(--ink2);margin-top:6px}
.termlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tl{border:1px solid var(--rule);background:var(--chip);border-radius:14px;padding:3px 10px;font-size:.86rem;cursor:pointer}
.tl:hover{border-color:var(--accent)}
.tl.inl{background:none;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;color:var(--accent);padding:0 1px!important;font-weight:600}
.tl.inl:hover{background:var(--accentSoft)}
.tl.seen{border-color:var(--accent);color:var(--accent)}

/* order + sort */
.order{display:grid;gap:8px;margin:10px 0}
.pool .card,.slot{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;background:var(--paper);line-height:1.35}
.pool{display:grid;gap:8px;margin:10px 0}
.pool .card{border-style:solid;cursor:pointer;text-align:left}
.pool .card:hover{border-color:var(--accent)}
.pool .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .n{font-family:var(--serif);color:var(--accent);font-weight:650;min-width:1.2em}
.slot.filled{border-style:solid;cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--okSoft)}
.slot.wrong{border-color:var(--bad);background:var(--badSoft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bin{border:1px solid var(--rule);border-radius:6px;padding:8px;min-height:90px;background:var(--chip);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.92rem;font-family:var(--sans);color:var(--head)}
.bin .card{display:block;width:100%;font-size:.88rem;padding:5px 8px;margin-bottom:5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);text-align:left;cursor:pointer}
.bin .card.right{border-color:var(--ok);background:var(--okSoft)}
.bin .card.wrong{border-color:var(--bad);background:var(--badSoft)}
.bin:hover{border-color:var(--accent)}

/* controls in sims */
.ctl{display:grid;gap:10px;margin:10px 0}
.ctl label{font-weight:600;font-size:.92rem;display:block;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 10px;background:var(--paper);border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:.9rem;min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink2)}
.meter{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}

/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}
.tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tok.used{opacity:.4}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}

/* term card */
.termcard{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,40,.18);padding:16px 18px;z-index:50;display:none;max-height:70vh;overflow:auto}
.termcard.show{display:block}
.termcard h3{font-size:1.2rem;margin-bottom:6px;padding-right:28px}
.termcard .x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--ink2);line-height:1;padding:4px 8px}
.termcard .rel{font-size:.86rem;color:var(--ink2);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:#2a2e35;color:#fff;font-size:.82rem;padding:4px 8px;border-radius:4px;z-index:60;display:none;white-space:nowrap}

/* svg hotspots */
[data-term]{cursor:pointer}
[data-term]:hover > .hl, [data-term]:focus > .hl{stroke:#c0612b;stroke-width:3}
[data-term]:focus{outline:none}
[data-term].hit > .hl{stroke:#c0612b}
[data-term]:hover{filter:brightness(1.06)}
.lbl{font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;fill:#1c2830}
.lbl.sm{font-size:11.5px}
.lbl.it{font-style:italic;fill:#3b4a52}
.lead{stroke:#5b6b73;stroke-width:1;fill:none}
.labels-off .lbls{display:none}

/* checkpoint */
.idcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.idcard .hd{background:var(--head);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
:root[data-theme="dark"] .idcard .hd{color:#0f171b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idcard .hd{color:#0f171b}}
.idcard .hd b{font-family:var(--serif);font-size:1.25rem}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:12px 14px}
.idcard dt{color:var(--ink2);font-size:.9rem}
.idcard dd{margin:0;font-weight:600}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.gate{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:var(--paper);cursor:pointer;text-align:left;font-size:.92rem;line-height:1.3}
.gate:hover:not([disabled]){border-color:var(--accent)}
.gate small{display:block;color:var(--ink2);font-size:.8rem;margin-top:2px}
.gate.right{border-color:var(--ok);background:var(--okSoft)}
.gate.wrong{border-color:var(--bad);background:var(--badSoft)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* glossary */
.gl{columns:2 360px;column-gap:28px}
.gl section{break-inside:avoid;margin-bottom:22px}
.gl h2{font-size:1.2rem;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.gi b{font-weight:700}
.gi p{grid-column:1 / -1;margin:0;color:var(--ink2);font-size:.94rem}
.st{font-size:.78rem;border-radius:10px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.st.tested{border-color:var(--ok);color:var(--ok)}
.st.seen{border-color:var(--accent);color:var(--accent)}

/* atlas */
.atlas{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:24px;align-items:start}
.atlas svg{touch-action:manipulation}
.quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accentSoft);border-radius:6px;padding:10px 14px;margin-bottom:12px}

.summary{max-width:720px}
.big{font-family:var(--serif);font-size:3rem;color:var(--accent);line-height:1}
.foot{margin-top:40px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}


/* course-notes styling */
.banner{display:flex;align-items:stretch;margin:0 0 16px;min-height:44px}
.banner .num{background:#904920;color:#fff;font-family:var(--serif);font-weight:650;font-size:1.25rem;padding:8px 16px;display:flex;align-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.18);position:relative;z-index:1}
.banner .ttl{flex:1;background:#c87444;color:#fff;display:flex;align-items:center;padding:6px 18px;font-variant:small-caps;letter-spacing:.04em;font-weight:700;font-size:1.15rem;margin-left:-2px}
.banner .pg{background:#c87444;color:#ffffff;display:flex;align-items:center;padding:0 14px;font-size:.85rem;white-space:nowrap}
.remember{display:flex;gap:12px;align-items:flex-start;background:#e4ebf2;border-radius:4px;padding:10px 14px;margin:10px 0;color:#1c2830;box-shadow:1px 1px 0 rgba(0,0,0,.08)}
.remember .key{flex:none;width:28px;height:28px}
.remember b{display:block;font-family:var(--serif)}
.dyk{background:#f9efea;border-left:4px solid #c0612b;border-radius:0 4px 4px 0;padding:10px 14px;margin:10px 0;font-style:italic;color:#2a1c18}
.dyk b{font-style:normal}
.notes-ref{font-size:.85rem;color:var(--ink2);margin:4px 0 10px}
.notes-ref b{color:var(--accent)}
.homelink{color:var(--ink2);font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;margin-right:4px}
.homelink:hover{color:var(--accent);border-color:var(--accent)}
.seqrow{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.seqrow .end{font-weight:700;color:var(--ink2);min-width:26px;text-align:center}
.nt{width:30px;height:34px;border:1px solid var(--rule);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;background:var(--paper);color:var(--ink)}
.nt.A{background:#8e6cc4;color:#fff;border-color:#6a4e9b}.nt.G{background:#dd5f45;color:#fff;border-color:#b0452f}
.nt.T{background:#3a9a9a;color:#fff;border-color:#2a7676}.nt.C{background:#f0cf4f;color:#3a2e00;border-color:#c9a92c}
.nt.U{background:#86b851;color:#fff;border-color:#618f33}
.nt.slot{border-style:dashed;cursor:pointer}.nt.slot.cur{box-shadow:0 0 0 2px var(--accent)}
.nt.ok{outline:2px solid var(--ok)}.nt.no{outline:2px solid var(--bad)}
.pad{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pad button{width:46px;height:42px;border-radius:6px;border:1px solid var(--rule);font-weight:700;font-size:1.05rem;cursor:pointer}
.pad button.A{background:#8e6cc4;color:#fff}.pad button.G{background:#dd5f45;color:#fff}.pad button.T{background:#3a9a9a;color:#fff}.pad button.C{background:#f0cf4f;color:#3a2e00}.pad button.U{background:#86b851;color:#fff}
.pad button.del{width:auto;padding:0 12px;background:var(--paper);font-size:.9rem}

@media (max-width: 880px){
  body{font-size:16px}
  .hero,.stage,.atlas{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:1.8rem}
  .topin{padding:8px 14px;gap:8px}
  .tabs{margin-left:0;width:100%}
  .tab{padding:5px 9px;font-size:.92rem}
  .brand span{display:none}
  .wrap{padding:16px 12px 60px}
  .steps{max-width:none;min-width:100%;order:3}
  .termcard{right:0;left:0;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px){.banner{flex-wrap:wrap}.banner .pg{flex-basis:100%;padding:4px 14px 6px;white-space:normal}}
/* Module 10: viewer tabs size to their labels and wrap */
.vseg button{flex:1 1 auto;min-width:0;white-space:nowrap;padding:7px 10px;border-bottom:1px solid var(--rule)}
/* numbered spot buttons in the epithelium builder */
.spots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.spots button{min-width:44px;min-height:40px;border:1px dashed var(--accent);border-radius:6px;background:var(--paper);color:var(--accent);font-weight:700;cursor:pointer}
.spots button:hover{background:var(--accentSoft)}

</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="brand" id="home" aria-label="Module 10 home"><b>Cell and Tissue Form</b><span>BIOL 130, Module 10</span></button>
  <nav class="tabs" aria-label="Sections">
    <a class="homelink" id="hubLink" href="index.html" target="_top">All modules</a>
    <button class="tab" data-go="story">Chapters</button>
    <button class="tab" data-go="atlas">Tissue viewer</button>
    <button class="tab" data-go="checkpoint">Junction desk</button>
    <button class="tab" data-go="exam">Mini exam</button>
    <button class="tab" data-go="glossary">Glossary</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<aside class="termcard" id="termcard" role="dialog" aria-live="polite"><button class="x" aria-label="Close">×</button><div id="tcbody"></div></aside>
<div class="tip" id="tip"></div>
<script src="studydata.js"></script>
<script src="srs.js"></script>
<script src="exam.js"></script>
<script src="kip.js"></script>
<script>
"use strict";
/* ============ storage ============ */
const KEY = "biol130-m10-progress-v1";
let P = { ch:{}, terms:{}, cp:{best:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
function markTerm(k, level){
  const order = {seen:1, tested:2};
  const cur = P.terms[k];
  if (!cur || order[level] > order[cur]) { P.terms[k] = level; save(); }
}
/* ============ glossary data (p = course notes page) ============ */
const T = {

 "epidermis":{n:"Epidermis",g:"Skin",p:"142",d:"The outer layer of skin, a water-resistant and protective barrier. Made mainly of epithelial cells called keratinocytes, with melanocytes that make skin pigment. Its bottom layer is attached to the basal lamina."},
 "dermis":{n:"Dermis",g:"Skin",p:"142",d:"The layer beneath the epidermis. It supports the epidermis and supplies it with nutrients. Mostly connective tissue; its main cell type is the fibroblast. Also contains nerves and blood vessels."},
 "keratinocyte":{n:"Keratinocytes",g:"Skin",p:"142",d:"The main epithelial cells of the epidermis, specialized to protect underlying tissues and organs. The bottom layer of keratinocytes is attached to the basal lamina."},
 "melanocyte":{n:"Melanocytes",g:"Skin",p:"142",d:"Cells in the epidermis that produce the pigments of skin."},
 "fibroblast":{n:"Fibroblast",g:"Skin",p:"142, 155",d:"The main cell type in the dermis and other connective tissue. Fibroblasts produce (secrete) the extracellular matrix, including collagen."},
 "cytoskeleton":{n:"Cytoskeleton",g:"The cytoskeleton",p:"143",d:"Protein fibers in the cytoplasm that give internal support to cells, just as bones support the body. Formed from long chains of protein subunits. Gives structural support and enables movement of substances within cells. All eukaryotic cells have microtubules and microfilaments; animal cells also have intermediate filaments."},
 "microtubule":{n:"Microtubules",g:"Microtubules",p:"144, 148",d:"Hollow tubes made of polymers of tubulin dimers, the widest cytoskeletal element. In animal cells they radiate out from the centrosome, help the cell keep its shape and withstand compression, and position organelles. Also used for vesicle transport, cilia and flagella, and chromosome segregation."},
 "tubulin":{n:"Alpha and beta tubulin",g:"Microtubules",p:"144",d:"The two tubulin proteins. One α tubulin and one β tubulin combine to form a tubulin dimer, and the dimers assemble to form microtubules."},
 "centrosome":{n:"Centrosome",g:"Microtubules",p:"144, 146",d:"The microtubule organizing centre of an animal cell, near the nucleus. Minus ends of microtubules sit at the centrosome; plus ends project outward toward the cell membrane."},
 "microfilament":{n:"Microfilaments",g:"Microfilaments",p:"144–145",d:"Polymers of actin monomers twisted into a double helix. The thinnest cytoskeletal fibers. Short and extensively branched just beneath the cell membrane, where they reinforce it and organize its proteins. Also form the cores of microvilli and take part in transport, muscle contraction and cell division."},
 "actin":{n:"Actin",g:"Microfilaments",p:"144, 148",d:"The protein monomer that polymerizes into microfilaments. Two strands of actin twist into a double helix."},
 "microvilli":{n:"Microvilli",g:"Microfilaments",p:"145",d:"Finger-like projections on the surface of intestinal epithelial cells. Each contains a bundle of actin microfilaments held together by cross-linking actin-binding proteins."},
 "mf-band":{n:"Band of microfilaments",g:"Microfilaments",p:"145, 151",d:"A band of longer microfilaments around the circumference of epithelial cells. It supports each cell and the whole layer of cells, and it is attached to a cell junction that connects neighbouring cells (the adherens junction)."},
 "intermediate-filament":{n:"Intermediate filaments",g:"Intermediate filaments",p:"147–148",d:"Strong, cable-like polymers of proteins found in animal cells. Their diameter is intermediate between microfilaments and microtubules. They give the cell mechanical strength. More than 100 types, made of different proteins in different cell types."},
 "if-types":{n:"Types of intermediate filaments",g:"Intermediate filaments",p:"148",d:"Epithelial cells: keratins. Fibroblasts: vimentin. Neurons: neurofilaments. Nucleus: lamins. Subunits are diverse, but the function is the same: cell shape and support."},
 "plus-minus":{n:"Plus and minus ends",g:"Dynamics and motors",p:"145–146",d:"Microtubules and microfilaments grow faster at one end than the other. The faster-growing end is the plus (+) end; the slower-growing end is the minus (−) end. Subunits can be added or removed at both ends."},
 "dynamic-instability":{n:"Dynamic instability",g:"Dynamics and motors",p:"146",d:"Random cycles of slower growth (polymerization) and rapid shrinkage (depolymerization) in microtubules. The dramatic shrinkage is called a catastrophe. It lets the cell reorganize its cytoskeleton quickly, and lets spindle microtubules find and attach to chromosomes during cell division."},
 "motor-protein":{n:"Motor proteins",g:"Dynamics and motors",p:"147",d:"Small accessory proteins that join microtubules and microfilaments and move along them. Movement comes from conformational changes in the motor protein, powered by ATP."},

 "cilia-flagella":{n:"Cilia and flagella",g:"Dynamics and motors",p:"147",d:"Structures built from microtubules that propel cells (for example a sperm's flagellum) or move substances over the cell surface (for example cilia sweeping mucus in the airway). Dynein, bound to the microtubules, causes the movement."},
 "polarity":{n:"Cell polarity",g:"Cell adhesion",p:"149",d:"Spatial differences in shape, structure and function within a cell. In epithelial cells, the apical membrane faces the outside of the body or the lumen and the basolateral membrane is attached to the basal lamina."},
 "apical":{n:"Apical membrane",g:"Cell adhesion",p:"149",d:"The surface of an epithelial cell that faces the outside of the body or the lumen. In intestinal cells it carries the microvilli."},
 "basolateral":{n:"Basolateral membrane",g:"Cell adhesion",p:"149",d:"The sides and base of an epithelial cell. The base is attached to the basal lamina."},
 "cam":{n:"Cell adhesion molecules",g:"Cell adhesion",p:"149–151",d:"Integral transmembrane glycoproteins that attach cells to each other or to the ECM and link to the cytoskeleton inside. Cadherins join cell to cell; integrins join cell to ECM."},

 "integrin":{n:"Integrins",g:"Cell adhesion",p:"150",d:"Integral transmembrane glycoproteins for cell–ECM adhesion. The extracellular domain binds ECM proteins; the cytoplasmic domain interacts with the cytoskeleton, which keeps tissues intact under physical stress. The main adhesion molecule of hemidesmosomes."},
 "cell-junctions":{n:"Cell junctions",g:"Cell junctions",p:"149–150",d:"Structures that physically connect a cell to another cell or to the ECM (basal lamina), reinforced by the cytoskeleton. Five types: adherens junctions, desmosomes, hemidesmosomes, tight junctions and gap junctions. Plants use plasmodesmata."},
 "anchoring":{n:"Anchoring junctions",g:"Cell junctions",p:"153",d:"Junctions that hold cells in place and link to the cytoskeleton: adherens junctions and desmosomes (cell–cell, cadherins) and hemidesmosomes (cell–ECM, integrins)."},
 "adherens":{n:"Adherens junction",g:"Cell junctions",p:"151",d:"A belt-like complex of cadherins around the circumference of the cell. Inside, the cadherins attach to a band of actin microfilaments; outside, they bind cadherins of the adjacent cell. Function: cell–cell adhesion."},
 "desmosome":{n:"Desmosomes",g:"Cell junctions",p:"151",d:"Button-like points of adhesion that hold the membranes of adjacent cells together. Cadherins in one cell's desmosome bind those of the adjacent cell, and their cytoplasmic domains link to intermediate filaments. Function: cell–cell adhesion."},
 "hemidesmosome":{n:"Hemidesmosome",g:"Cell junctions",p:"151",d:"A desmosome-like structure that firmly anchors epithelial cells to the basal lamina. Integrins bind ECM proteins of the basal lamina outside and intermediate filaments inside. Function: cell–ECM adhesion."},
 "tight-junction":{n:"Tight junction",g:"Cell junctions",p:"152–153",d:"A barrier junction made of claudins and occludins that seals the extracellular space between cells, which adherens junctions and desmosomes can't do. A substance can only cross a sheet of epithelial cells by moving through the cells by a transport mechanism. Function: epithelial boundary."},
 "gap-junction":{n:"Gap junction",g:"Cell junctions",p:"152–153",d:"A communicating junction in animal cells. Tiny channels (connexons, made of connexins) span a 2–4 nm gap and connect the cytoplasm of adjacent cells. Only low molecular weight material, such as ions, can pass. They integrate the activities of cells in a tissue."},
 "connexon":{n:"Connexons",g:"Cell junctions",p:"152–153",d:"The extremely small channels of a gap junction, made of connexin proteins. They span the 2–4 nm gap and give cytoplasmic continuity between adjacent cells."},
 "plasmodesmata":{n:"Plasmodesmata",g:"Cell junctions",p:"152–153",d:"Channels between plant cells, lined by the cell membrane, which is continuous from one cell to the next. Much larger than gap junctions: they can pass RNA molecules and proteins, so plant cells can signal despite their rigid walls. Function: communication between plant cells."},
 "ecm":{n:"Extracellular matrix (ECM)",g:"The ECM",p:"141, 154",d:"The layer of material secreted beyond the cell membrane: an insoluble meshwork of proteins and polysaccharides. It acts as a supportive and protective material and allows the expression of different cell functions. In plants it is the cell wall."},
 "cell-wall":{n:"Plant cell wall",g:"The ECM",p:"154",d:"The ECM of plant cells. Three layers: the middle lamella (carbohydrates; glues neighbouring cells together), the primary cell wall (cellulose, pectin and proteins) and the secondary cell wall (cellulose and lignin)."},
 "middle-lamella":{n:"Middle lamella",g:"The ECM",p:"154",d:"The outermost layer between two plant cells, made of carbohydrates. The main mechanism by which plant cells adhere to one another."},
 "primary-wall":{n:"Primary cell wall",g:"The ECM",p:"154",d:"Made of cellulose fibers, pectin and several other proteins. Laid down first, while the cell is still growing, so it is thin and flexible."},
 "secondary-wall":{n:"Secondary cell wall",g:"The ECM",p:"154",d:"Made of cellulose and lignin. Laid down inside the primary wall once the cell stops growing. Lignin hardens the wall and makes it water resistant."},
 "animal-ecm":{n:"Animal ECM",g:"The ECM",p:"155",d:"Extensive in connective tissue. A mixture of proteins and polysaccharides secreted by cells: large fibrous proteins (collagen, elastin and laminin) in a gel-like polysaccharide matrix."},
 "collagen":{n:"Collagen",g:"The ECM",p:"155",d:"The most abundant protein in the animal ECM and in animals (about 1/4 of the body's protein). More than 20 forms; type I, found in the dermis, is the most abundant. Three polypeptides wind into a triple helix; bundles of these molecules form fibrils, and fibrils form fibers, stronger than a single fiber of the same diameter."},
 "elastin":{n:"Elastin",g:"The ECM",p:"155",d:"A large fibrous protein of the animal ECM, seen as elastin fibers among the collagen fibers of the dermis."},
 "laminin":{n:"Laminin",g:"The ECM",p:"155",d:"A large fibrous protein of the animal ECM. It is a main protein of the basal lamina, where integrins bind it. (Named in your notes; the basal lamina role is the standard textbook answer.)"},

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let activeLoops = [];
function loop(fn){ let on = true, last = performance.now(); const tick = t => { if(!on) return; const dt = Math.min(0.05,(t-last)/1000); last = t; fn(dt,t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); const s = {stop(){on=false;}}; activeLoops.push(s); return s; }
function stopLoops(){ activeLoops.forEach(l=>l.stop()); activeLoops = []; }
function plate(svgOrEl, caption){
  const f = h("figure",{class:"plate"});
  if (typeof svgOrEl === "string") f.insertAdjacentHTML("beforeend", svgOrEl); else f.append(svgOrEl);
  if (caption) f.append(h("figcaption",{html:caption}));
  return f;
}

  $("#tcbody").append(h("h3",{},t.n), h("p",{},t.d), h("p",{class:"notes-ref"},h("b",{},"Course notes: "),`p. ${t.p}`));

function related(k){ return (REL[k]||[]).filter(r=>T[r]); }
function bindTerms(root, onPick){
  $$("[data-term]", root).forEach(g=>{
    const k = g.getAttribute("data-term");
    if (!T[k]) return;
    g.setAttribute("tabindex","0"); g.setAttribute("role","button"); g.setAttribute("aria-label", T[k].n);
    const pick = ()=>{ (onPick||openTerm)(k, g); g.classList.add("hit"); };
    g.addEventListener("click", e=>{ e.stopPropagation(); pick(); });
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopPropagation(); pick(); }});
    g.addEventListener("mousemove", e=>{ tip.textContent = T[k].n; tip.style.display="block"; tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY+12)+"px"; });
    g.addEventListener("mouseleave", ()=>{ tip.style.display="none"; });
  });
}

/* ============ shared drawing helpers ============ */
function lab(text, term, tx, ty, px, py, anchor="start", cls="lbl"){
  const lines = text.split("\n");
  const t = lines.map((l,i)=>`<tspan x="${tx}" dy="${i?14:0}">${l}</tspan>`).join("");
  const cw = cls.includes("sm")?5.7:6.4, wdt = Math.max(...lines.map(l=>l.length))*cw, hgt=(lines.length-1)*14;
  const x0 = anchor==="end"?tx-wdt: anchor==="middle"?tx-wdt/2 : tx, x1 = x0+wdt;
  let lx, ly=ty-4;
  if (px!=null && px>=x0-6 && px<=x1+6){ lx=Math.max(x0,Math.min(x1,px)); ly = py>ty ? ty+hgt+5 : ty-15; }
  else if (px!=null && px<x0) lx=x0-4; else lx=x1+4;
  const lead = (px!=null) ? `<line class="lead" x1="${lx}" y1="${ly}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2" fill="#5b6b73"/>` : "";
  return `<g ${term?`data-term="${term}"`:""}>${lead}<text class="${cls}" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text></g>`;
}

function arrow(x1,y1,x2,y2,col="#34454e",w=2.2,dash=""){
  const a=Math.atan2(y2-y1,x2-x1), L=10;
  const p1=[x2-L*Math.cos(a-0.4),y2-L*Math.sin(a-0.4)], p2=[x2-L*Math.cos(a+0.4),y2-L*Math.sin(a+0.4)];
  return `<line x1="${x1}" y1="${y1}" x2="${(x2-6*Math.cos(a)).toFixed(1)}" y2="${(y2-6*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
}

// actin double helix along a line
function actinHelix(x1,y1,x2,y2,r=4.2,col=CK.mf,st=CK.mfS){
  const L=Math.hypot(x2-x1,y2-y1), n=Math.max(2,Math.floor(L/(r*1.7))), ux=(x2-x1)/L, uy=(y2-y1)/L; let s="";
  for(let k=0;k<2;k++) for(let i=0;i<n;i++){ const t=i/(n-1), ph=t*L/26*Math.PI*2+k*Math.PI, off=Math.sin(ph)*r*0.95, x=x1+(x2-x1)*t-uy*off, y=y1+(y2-y1)*t+ux*off;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${k?col:"#e8826f"}" stroke="${st}" stroke-width=".7"/>`; }
  return s;
}
// microtubule drawn as a tube along x, from x1 to x2, centre y, height hgt
function mtTube(x1,x2,y,hgt=34,openEnd=true){
  const r=hgt/6.2, rows=Math.round(hgt/(2*r)); let s=`<rect x="${x1}" y="${y-hgt/2}" width="${x2-x1}" height="${hgt}" rx="3" fill="#e4effb" stroke="${CK.mtS}" stroke-width="1"/>`;
  for(let j=0;j<rows;j++){ const yy=y-hgt/2+r+j*(hgt-2*r)/(rows-1||1); for(let x=x1+r, k=0; x<=x2-r+0.1; x+=2*r, k++){ const ab=((k+j)%2)===0; s+=`<circle cx="${x.toFixed(1)}" cy="${(yy+(k%2?0:0)).toFixed(1)}" r="${(r*0.95).toFixed(2)}" fill="${ab?CK.mtA:CK.mtB}" stroke="${CK.mtS}" stroke-width=".5"/>`; } }
  if(openEnd) s+=`<ellipse cx="${x2}" cy="${y}" rx="${hgt*0.22}" ry="${hgt/2}" fill="#fff" stroke="${CK.mtS}" stroke-width="1.2"/><ellipse cx="${x2}" cy="${y}" rx="${hgt*0.12}" ry="${hgt*0.3}" fill="#cfe0f4"/>`;
  return s;
}
// intermediate filament rope
function ifRope(x1,y1,x2,y2,w=12,col=CK.ifc){
  const L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L; let s="";
  for(let k=0;k<4;k++){ let d=""; for(let t=0;t<=L;t+=4){ const off=Math.sin(t/14+k*Math.PI/2)*w/2, x=x1+ux*t-uy*off, y=y1+uy*t+ux*off; d+=(t?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }
    s+=`<path d="${d}" fill="none" stroke="${k%2?col:"#8cc77d"}" stroke-width="3.2" stroke-linecap="round"/>`; }
  return s;
}
// wavy filament path (for networks)
function wavy(x1,y1,x2,y2,amp,freq,col,wid,seed){
  const L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L; let d="";
  for(let t=0;t<=L;t+=5){ const off=Math.sin(t/freq+seed)*amp, x=x1+ux*t-uy*off, y=y1+uy*t+ux*off; d+=(t?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wid}" stroke-linecap="round"/>`;
}

// horizontal bilayer between x1 and x2 with centre y
function memH(x1,x2,y,th=12){ let s=`<rect x="${x1}" y="${y-th/2}" width="${x2-x1}" height="${th}" fill="${CK.mem}"/>`; for(let x=x1+3;x<x2;x+=6) s+=`<circle cx="${x}" cy="${y-th/2+1.5}" r="2.4" fill="#e2b84a" stroke="${CK.memS}" stroke-width=".4"/><circle cx="${x}" cy="${y+th/2-1.5}" r="2.4" fill="#e2b84a" stroke="${CK.memS}" stroke-width=".4"/>`; return s; }

/* ============ story engine ============ */
let RUN = null; // {id, first:{}}
function chState(id){ return P.ch[id] || (P.ch[id] = {done:false, best:null, last:null}); }
function recordFirst(stepIdx, correct, terms){
  if (!RUN) return;
  if (!(stepIdx in RUN.first)) RUN.first[stepIdx] = !!correct;
  (terms||[]).forEach(k=>markTerm(k,"tested"));
}
function runScore(){ const v=Object.values(RUN.first); return {right:v.filter(Boolean).length, total:v.length}; }

function renderChapter(ci, si=0){
  stopLoops(); exploreHook=null; window.scrollTo(0,0);
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go==="story")));
  const ch = CHAPTERS[ci];
  if (!RUN || RUN.id !== ch.id) RUN = {id:ch.id, first:{}};
  const app = $("#app"); app.innerHTML = "";
  const bar = h("div",{class:"steps","aria-hidden":"true"});
  ch.steps.forEach((_,i)=>bar.append(h("i",{class:i<si?"on":i===si?"cur":""})));
  app.append(h("div",{class:"banner"}, h("span",{class:"num"},`10.${ci+1}`), h("span",{class:"ttl"},ch.title), h("span",{class:"pg"},`Course notes ${ch.pages}`)));
  app.append(h("div",{class:"crumb"}, h("button",{class:"back",onclick:()=>go("story")},"All chapters"), h("span",{class:"muted small"},`Step ${si+1} of ${ch.steps.length}`), bar));
  const step = ch.steps[si];
  const stage = h("div",{class:"stage"+(step.wide?" wide":"")});
  const plateHost = h("div"), panel = h("div",{class:"panel"});
  stage.append(plateHost, panel); app.append(stage);
  const next = h("button",{class:"btn",onclick:()=>{ if(si+1<ch.steps.length) renderChapter(ci,si+1); else finishChapter(ci); }}, si+1<ch.steps.length?"Continue":"Finish chapter");
  const back = h("button",{class:"btn ghost",onclick:()=>{ if(si>0) renderChapter(ci,si-1); else go("story"); }}, si>0?"Back":"All chapters");
  const api = {
    ci, si, panel, plateHost, next,
    lock(){ next.disabled = true; }, unlock(){ next.disabled = false; },
    grade(ok, terms){ recordFirst(si, ok, terms||step.terms); },
    gradeKey(key, ok, terms){ recordFirst(si+'.'+key, ok, terms); },
  };
  (STEP_TYPES[step.type])(step, api);
  panel.append(h("div",{class:"nav"}, back, next));
  bindTerms(app); bindRich(app);
  tc.classList.remove("show");
}
function finishChapter(ci){
  stopLoops(); window.scrollTo(0,0);
  const ch = CHAPTERS[ci], sc = runScore(), st = chState(ch.id);
  const frac = sc.total ? sc.right/sc.total : 1;
  const prevBest = st.best;
  st.done = true; st.last = frac; if (st.best==null || frac>st.best) st.best = frac; save();
  const app=$("#app"); app.innerHTML="";
  const box = h("div",{class:"summary"});
  box.append(h("div",{class:"banner"}, h("span",{class:"num"},`10.${ci+1}`), h("span",{class:"ttl"},ch.title+": complete")));
  box.append(h("div",{class:"row",style:"gap:26px;margin:10px 0 18px"},
     h("div",{}, h("div",{class:"big"},`${sc.right}/${sc.total}`), h("div",{class:"muted small"},"right on the first try")),
     h("div",{}, h("div",{class:"big",style:"color:var(--head)"},Math.round((st.best||0)*100)+"%"), h("div",{class:"muted small"}, prevBest==null?"your best so far": (frac>prevBest?"new personal best":"your best"))) ));
  box.append(h("p",{},ch.wrap));
  box.append(h("p",{class:"muted small"},"Terms from this chapter. Click one to review it."), termChips(ch.terms));
  const nextBtn = ci+1<CHAPTERS.length ? h("button",{class:"btn",onclick:()=>{RUN=null; renderChapter(ci+1,0);}},`Start chapter ${ci+2}: ${CHAPTERS[ci+1].title}`) : h("button",{class:"btn",onclick:()=>go("checkpoint")},"Go to the junction desk");
  box.append(h("div",{class:"row",style:"margin-top:16px"}, nextBtn, h("button",{class:"btn ghost",onclick:()=>{RUN=null; renderChapter(ci,0);}},"Replay chapter"), h("button",{class:"btn ghost",onclick:()=>go("story")},"All chapters")));
  app.append(box);
  RUN = null;
}

/* ---- step types ---- */
function figHost(step, api, svg){
  if (!svg) return;
  const f = plate(svg, step.cap);
  if (step.labelsToggle){
    const b = h("button",{class:"mini","aria-pressed":"true"},"Labels");
    b.addEventListener("click",()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",on?"false":"true"); f.classList.toggle("labels-off",on); });
    f.prepend(h("div",{class:"tools"},b));
  }
  api.plateHost.innerHTML=""; api.plateHost.append(f);
  if (step.onFig) step.onFig(f.querySelector("svg"));
  return f;
}
const STEP_TYPES = {
  brief(step, api){
    figHost(step, api, step.fig && step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    if (step.terms) api.panel.append(termChips(step.terms));
  },
  review(step, api){
    figHost(step, api, step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    const counter = h("p",{class:"explored"});
    const seen = new Set();
    const upd = ()=>{ counter.textContent = `Parts explored: ${seen.size} of ${step.terms.length}`; };
    exploreHook = k=>{ if(step.terms.includes(k)){ seen.add(k); upd(); } };
    upd(); api.panel.append(counter, termChips(step.terms));
  },
  mcq(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},step.kicker||"Your call"), h("h2",{},step.title));
    if (step.q) api.panel.append(h("div",{html:rich(step.q)}));
    const box = h("div",{class:"opts"}), fb = h("div");
    let solved=false, first=true;
    const opts = step.keep ? step.opts : shuffle(step.opts);
    opts.forEach(o=>{
      const b = h("button",{class:"opt"},o[0]);
      b.addEventListener("click",()=>{
        if (solved) return;
        if (first){ api.grade(o[1], step.terms); first=false; }
        fb.innerHTML="";
        if (o[1]){
          solved=true; b.classList.add("right");
          $$(".opt",box).forEach(x=>x.disabled=true);
          fb.append(h("div",{class:"fb ok",html:`<b>Correct.</b>${rich(o[2]||"")}`}));
          if (step.after) fb.append(h("div",{class:"fb",html:rich(step.after)}));
          if (step.afterFig && f){ const nf = plate(step.afterFig(), step.afterCap||step.cap); api.plateHost.innerHTML=""; api.plateHost.append(nf); bindTerms(nf); }
          api.unlock();
        } else {
          b.classList.add("wrong"); b.disabled=true;
          fb.append(h("div",{class:"fb bad",html:`<b>Not quite.</b>${rich(o[2]||"")} Try another answer.`}));
        }
        bindRich(fb);
      });
      box.append(b);
    });
    api.panel.append(box, fb); api.lock();
  },
  order(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Put these in order"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    const n = step.items.length, slots = new Array(n).fill(null);
    let pool = shuffle(step.items.map((t,i)=>({t,i})));
    let first = true;
    const slotBox = h("div",{class:"order"}), poolBox = h("div",{class:"pool"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check order");
    function draw(){
      slotBox.innerHTML=""; poolBox.innerHTML="";
      slots.forEach((s,i)=>{
        const el = h("div",{class:"slot"+(s?" filled":"")+(s&&s.mark?" "+s.mark:""),tabindex:s?"0":null,role:s?"button":null}, h("span",{class:"n"},String(i+1)), h("span",{}, s?s.t:"Click a step below to place it here"));
        if (s && !s.locked) el.addEventListener("click",()=>{ pool.push(s); slots[i]=null; delete s.mark; draw(); });
        slotBox.append(el);
      });
      pool.forEach(p=>{ const b=h("button",{class:"card"},p.t); b.addEventListener("click",()=>{ const k=slots.indexOf(null); if(k<0) return; slots[k]=p; pool=pool.filter(x=>x!==p); draw(); }); poolBox.append(b); });
      check.disabled = slots.includes(null);
    }
    check.addEventListener("click",()=>{
      let all=true;
      slots.forEach((s,i)=>{ s.mark = s.i===i?"right":"wrong"; if(s.i!==i) all=false; else s.locked=true; });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){ fb.append(h("div",{class:"fb ok",html:"<b>That's the right order.</b>"+rich(step.after||"")})); check.remove(); api.unlock(); draw(); bindRich(fb); return; }
      draw();
      fb.append(h("div",{class:"fb bad",html:"<b>Some steps are out of place.</b> The green ones are right and locked in. Click a red one to send it back, then try again."}));
    });
    draw();
    api.panel.append(slotBox, poolBox, h("div",{class:"row"},check), fb); api.lock();
  },
  sort(step, api){
    figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Sort them"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    let items = shuffle(step.items.map((it,i)=>({t:it[0],bin:it[1],why:it[2],i,at:null})));
    let sel = null, first = true;
    const poolBox = h("div",{class:"pool"}), binBox = h("div",{class:"bins"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check");
    function draw(){
      poolBox.innerHTML=""; binBox.innerHTML="";
      items.filter(x=>x.at===null).forEach(x=>{ const b=h("button",{class:"card"+(sel===x?" sel":"")},x.t); b.addEventListener("click",()=>{ sel = sel===x?null:x; draw(); }); poolBox.append(b); });
      step.bins.forEach((name,bi)=>{
        const bin = h("div",{class:"bin",tabindex:"0",role:"button","aria-label":"Place in "+name}, h("h4",{},name));
        const place = ()=>{ if(sel){ sel.at=bi; delete sel.mark; sel=null; draw(); } };
        bin.addEventListener("click",place); bin.addEventListener("keydown",e=>{ if(e.key==="Enter") place(); });
        items.filter(x=>x.at===bi).forEach(x=>{ const c=h("button",{class:"card"+(x.mark?" "+x.mark:"")},x.t); c.addEventListener("click",e=>{ e.stopPropagation(); if(sel){ place(); return; } if(x.locked) return; x.at=null; delete x.mark; draw(); }); bin.append(c); });
        binBox.append(bin);
      });
      if (!items.some(x=>x.at===null)) poolBox.append(h("p",{class:"muted small"},"All placed. Check your sort, or click a card in a box to take it back out."));
      else if (!sel) poolBox.prepend(h("p",{class:"muted small",style:"margin:0"},"Click a card, then click the box it belongs in."));
      check.disabled = items.some(x=>x.at===null);
    }
    check.addEventListener("click",()=>{
      let all=true; const misses=[];
      items.forEach(x=>{ if(x.at===x.bin){ x.mark="right"; x.locked=true; } else { x.mark="wrong"; all=false; misses.push(x); } });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){
        fb.append(h("div",{class:"fb ok",html:"<b>All sorted correctly.</b>"+rich(step.after||"")}));
        check.remove(); api.unlock(); draw(); bindRich(fb);
        if (step.onSolved) step.onSolved(api);
        return;
      }
      draw();
      const why = misses.filter(m=>m.why).map(m=>`<li>${m.t}: ${m.why}</li>`).join("");
      fb.append(h("div",{class:"fb bad",html:`<b>${misses.length} in the wrong box.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""} Move the red ones and check again.`}));
    });
    draw();
    api.panel.append(poolBox, binBox, h("div",{class:"row"},check), fb); api.lock();
  },
  custom(step, api){ step.render(api, step); }
};

   text:`<p>Microtubules and microfilaments can be joined by small accessory proteins, the [[motor-protein|motor proteins]]. For example, microtubules work as tracks for transport within the cell.</p><p>Two motor proteins, [[kinesin-dynein|kinesin and dynein]], move along microtubule tracks. Kinesin moves cargo, such as vesicles, toward the microtubule's plus end. Dynein moves cargo toward the minus end. The energy comes from conformational changes in the motor proteins and is powered by ATP.</p>`+dyk("The motor protein that moves along actin microfilaments is [[myosin|myosin]]. It is on your terms list: myosin pulling on actin is what shortens muscle cells during contraction."),

{ id:"adhesion", title:"Polarity, cadherins and integrins", pages:"pp. 149–150", blurb:"Apical and basolateral membranes, and the two families of cell adhesion molecules.",
  terms:["polarity","apical","basolateral","cam","cadherin","integrin"],
  wrap:"Epithelial cells have an apical and a basolateral side; cadherins join cell to cell and integrins join cell to ECM, both linked to the cytoskeleton inside. Next: the junctions they build.",

  {type:"review", title:"Two sides of a cell", fig:figPolarity, labelsToggle:true, cap:"<b>Figure 6.1</b> Polarity of epithelial cells. (Notes p. 149, Fig 10.11)",
   text:`<p>Multicellular organisms use cell junctions to physically connect one cell to another cell or to the ECM.</p><p>Cells show [[polarity|polarity]]: spatial differences in shape, structure and function within a cell. In epithelial cells, the [[apical|apical membrane]] faces the outside of the body or the lumen, and the [[basolateral|basolateral membrane]] is attached to the basal lamina.</p>`,
   terms:["polarity","apical","basolateral","basal-lamina"]},
  {type:"review", title:"Cadherins", fig:figCadherin, labelsToggle:true, cap:"<b>Figure 6.2</b> Cadherins. (Notes p. 149, Fig 10.12)",
   text:`<p>[[cadherin|Cadherins]] are integral transmembrane glycoproteins, [[cam|cell adhesion molecules]] that join cell to cell.</p><p>The extracellular domain of a cadherin binds the extracellular domain of a cadherin of the <b>same type</b> on an adjacent cell. The cytoplasmic part is linked to the internal cytoskeleton. This gives structural continuity from the cytoskeleton of one cell to the cytoskeleton of the next, which increases the strength of tissues and organs.</p>`,

   terms:["integrin","cam","animal-ecm"]},
  {type:"sort", title:"Cadherin, integrin or both?", q:"<p>Sort each statement.</p>", bins:["Cadherins","Integrins","Both"],
   items:[["Bind the same type of molecule on an adjacent cell",0],["Cell–cell adhesion",0],["Found in adherens junctions and desmosomes",0],["Bind proteins of the ECM",1],["Cell–ECM adhesion",1],["Main adhesion molecule in hemidesmosomes",1],["Integral transmembrane glycoproteins",2],["Cytoplasmic part links to the cytoskeleton",2]], terms:["cadherin","integrin","cam"]},
  {type:"mcq", title:"Stronger together", q:"<p>How do cadherins increase the strength of a tissue?</p>",
   opts:[["They link the cytoskeleton of one cell to the cytoskeleton of the next, so force is shared across the tissue",true," Structural continuity, cell to cell."],["They bind any cadherin on any neighbouring cell",false," They bind cadherins of the same type."],["They glue cells to the basal lamina",false," That is integrins."],["They form channels between cells",false," That is gap junctions (connexins)."]], terms:["cadherin"]}

{ id:"anchoring", title:"Anchoring junctions", pages:"pp. 150–151", blurb:"Adherens junctions, desmosomes and hemidesmosomes: what binds, and which filament each grips.",
  terms:["cell-junctions","anchoring","adherens","desmosome","hemidesmosome","cadherin","integrin"],

  {type:"brief", title:"Five junctions", fig:()=>figEpithelium(), cap:"<b>Figure 7.1</b> Cell junctions. (Notes p. 150, Fig 10.14)",
   text:`<p>[[cell-junctions|Cell junctions]] connect cells to other cells or to the basal lamina and are reinforced by the cytoskeleton. There are five types:</p><p>a. adherens junctions<br>b. desmosomes<br>c. hemidesmosomes<br>d. tight junctions<br>e. gap junctions</p><p>Cadherins are found in both adherens junctions and desmosomes. The first three are [[anchoring|anchoring junctions]]: they anchor cells to one another, or to the ECM, and are reinforced by the cytoskeleton.</p>`, terms:["cell-junctions","anchoring"]},

  {type:"mcq", title:"Anchored below", q:"<p>The bottom layer of keratinocytes is firmly anchored to the basal lamina. Which junction and which adhesion molecule do this?</p>",

  {type:"mcq", title:"Belt or button?", q:"<p>What is the difference between an adherens junction and a desmosome?</p>",

{ id:"sealcomm", title:"Tight junctions, gap junctions, plasmodesmata", pages:"pp. 152–153", blurb:"The barrier junction, the two communicating junctions, and Table 10.2. Then build a whole epithelium.",
  terms:["tight-junction","gap-junction","connexon","plasmodesmata","cell-junctions"],
  wrap:"Tight junctions seal the epithelium; gap junctions pass ions and small molecules between animal cells; plasmodesmata pass RNA and proteins between plant cells. Next: the matrix outside the cells.",
  steps:[
  {type:"review", title:"Tight junctions seal", fig:()=>figJxZoom("tight"), cap:"<b>Figure 8.1</b> Tight junction. (Notes p. 152, Fig 10.18)",
   text:`<p>Adherens junctions and desmosomes do not stop materials passing between cells, so another mechanism is needed. [[tight-junction|Tight junctions]] seal the extracellular space, so substances cannot leak between neighbouring cells.</p><p>The only way a substance can travel from one side of a sheet of epithelial cells to the other is by moving <b>through</b> the cells, by a cellular transport mechanism. Their major components are claudins and occludins, and their function is the epithelial boundary.</p>`,
   terms:["tight-junction"]},
  {type:"review", title:"Gap junctions connect", fig:()=>figJxZoom("gap"), cap:"<b>Figure 8.2</b> Gap junction. (Notes p. 152, Fig 10.19)",
   text:`<p>[[gap-junction|Gap junctions]] are communicating junctions in animal cells. Extremely small channels, [[connexon|connexons]] (made of connexins), span a small gap of 2–4 nm between cells.</p><p>Connexons give cytoplasmic continuity between adjacent cells, but only low molecular weight material, such as ions, can pass. Gap junctions integrate the activities of the individual cells of a tissue.</p>`,
   terms:["gap-junction","connexon"]},
  {type:"review", title:"Plasmodesmata", fig:figPlasmodesmata, labelsToggle:true, cap:"<b>Figure 8.3</b> Plasmodesmata. (Notes p. 152, Fig 10.20)",
   text:`<p>[[plasmodesmata|Plasmodesmata]] let plant cells transfer RNA molecules and proteins. They are much larger than gap junctions.</p><p>The cell membrane is continuous from one cell to the next through the channel, so plants can send signals to one another despite being enclosed in rigid cell walls.</p>`,
   terms:["plasmodesmata","cell-wall"]},
  {type:"custom", title:"Build an epithelium", render:api=>simBuildEpi(api), terms:["tight-junction","adherens","desmosome","gap-junction","hemidesmosome"]},
  {type:"sort", title:"Three classes of junction", q:"<p>Table 10.2 groups the junctions into three classes. Sort them.</p>", bins:["Anchoring","Barrier","Communicating"], after:" Anchoring junctions hold cells to each other or to the ECM, the barrier junction seals the epithelium, and communicating junctions pass material between cells. The full table is in the tissue viewer.",
   items:[["Adherens junction",0],["Desmosome",0],["Hemidesmosome",0],["Tight junction",1],["Gap junction",2],["Plasmodesma",2]], terms:["anchoring","tight-junction","gap-junction","plasmodesmata"]},
  {type:"mcq", title:"Across the gut lining", q:"<p>Tight junctions seal an intestinal epithelium. How does a glucose molecule get from the gut lumen to the blood side?</p>",
   opts:[["Through the cells, using membrane transport proteins",true," With the space between cells sealed, a cellular transport mechanism is the only route."],["Between the cells, through the tight junctions",false," Tight junctions seal that route."],["Through gap junctions into the lumen",false," Gap junctions link the cytoplasm of neighbouring cells; they don't open to the lumen."],["Through plasmodesmata",false," Those are in plants."]], terms:["tight-junction"]},
  {type:"mcq", title:"Big enough for RNA", q:"<p>Which junction can pass RNA molecules and proteins between cells?</p>",
   opts:[["Plasmodesmata",true," Much larger than gap junctions, with the membrane continuous between cells."],["Gap junctions",false," Only low molecular weight material, such as ions, fits through connexons."],["Tight junctions",false," They block passage."],["Desmosomes",false," They hold cells together; they are not channels."]], terms:["plasmodesmata","gap-junction"]}
  ]},

/* ============ sim helpers ============ */
function makeCanvas(W,H,label){
  const cv = h("canvas",{role:"img","aria-label":label||""}); const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); return {cv,ctx,W,H};
}
function label(ctx,t,x,y,opts={}){ ctx.fillStyle=opts.col||"#1c2830"; ctx.font=`${opts.it?"italic ":""}${opts.w||400} ${opts.s||13}px Source Sans 3, Arial`; ctx.textAlign=opts.a||"left"; ctx.textBaseline="alphabetic"; ctx.fillText(t,x,y); }
function inlineMCQ(host, q, opts, api, key, terms, onRight){
  host.append(h("p",{style:"margin-top:10px"},h("b",{},q)));
  const box=h("div",{class:"opts"}), fb=h("div"); let first=true, done=false;
  shuffle(opts).forEach(o=>{ const b=h("button",{class:"opt"},o[0]); b.addEventListener("click",()=>{
    if(done) return; if(first){ api.gradeKey(key,o[1],terms); first=false; }
    fb.innerHTML="";
    if(o[1]){ done=true; b.classList.add("right"); $$(".opt",box).forEach(x=>x.disabled=true); fb.append(h("div",{class:"fb ok",html:"<b>Correct.</b>"+o[2]})); onRight&&onRight(); }
    else { b.classList.add("wrong"); b.disabled=true; fb.append(h("div",{class:"fb bad",html:"<b>Not quite.</b>"+o[2]+" Try another answer."})); }
  }); box.append(b); });
  host.append(box,fb);
}

const SKINQ=[
 {q:"Click the water-resistant, protective outer layer.",ok:["epidermis","keratinocyte"],t:"epidermis",why:"The epidermis is the outer barrier. It is epithelial tissue, mostly keratinocytes."},
 {q:"Click the specialized ECM that the bottom layer of keratinocytes is attached to.",ok:["basal-lamina"],t:"basal-lamina",why:"The basal lamina lies below the bottom layer of the epidermis and supports the epithelial cells."},
 {q:"Click the cell that produces the pigments of skin.",ok:["melanocyte"],t:"melanocyte",why:"Melanocytes sit in the epidermis and make skin pigment."},
 {q:"Click a cell specialized to protect underlying tissues and organs.",ok:["keratinocyte"],t:"keratinocyte",why:"Keratinocytes are the main epithelial cells of the epidermis."},
 {q:"Click the layer that supports the epidermis and supplies it with nutrients.",ok:["dermis","collagen","elastin","connective-tissue","fibroblast"],t:"dermis",why:"The dermis is mostly connective tissue, with nerves and blood vessels."},

function simSkinFind(api){
  let i=0, first=true, right=0; const host=h("div"), body=h("div");
  api.plateHost.innerHTML=""; api.plateHost.append(host);
  const f=plate(figSkin(),"<b>Figure 1.5</b> Skin, labels hidden. Click the part each prompt describes. (Notes p. 142, Fig 10.1)"); f.classList.add("labels-off"); host.append(f);
  function draw(){ body.innerHTML="";
    if(i>=SKINQ.length){ f.classList.remove("labels-off"); body.append(h("div",{class:"fb ok",html:rich(`<b>All six found.</b> ${right} of ${SKINQ.length} on the first click. Labels are back on: [[epidermis|epidermis]] on top, the [[basal-lamina|basal lamina]] between, the [[dermis|dermis]] below.`)})); bindRich(body); api.unlock(); return; }
    body.append(h("p",{class:"muted small"},`Prompt ${i+1} of ${SKINQ.length}`), h("p",{},h("b",{},SKINQ[i].q))); }
  bindTerms(f,(k,g)=>{ if(i>=SKINQ.length){ openTerm(k); return; } const it=SKINQ[i], ok=it.ok.includes(k);
    if(first){ first=false; api.gradeKey("s"+i,ok,[it.t]); if(ok) right++; }
    $$(".fb.bad",body).forEach(x=>x.remove());
    if(ok){ markTerm(it.t,"tested"); i++; first=true; draw(); if(i<SKINQ.length) body.prepend(h("div",{class:"fb ok",html:`<b>Yes: ${T[it.t].n}.</b> ${it.why}`})); }
    else body.append(h("div",{class:"fb bad",html:`<b>That's ${T[k]?T[k].n.toLowerCase():"not it"}.</b> Try again.`})); });
  api.panel.append(h("p",{class:"kicker"},"Find it"), h("h2",{},"Find it in the skin"), h("p",{},"The labels are hidden. Click the part of the skin that matches each prompt."), body);
  api.lock(); draw();
}

/* ============ Dynamic instability: search and capture (notes p. 146) ============ */
function simDynInst(api){
  const W=760,H=440; const {cv,ctx}=makeCanvas(W,H,"Microtubules growing and shrinking from a centrosome to find chromosomes");
  const C={x:380,y:220}, RX=350, RY=205;
  const CHR=[[-0.5,150],[0.9,165],[2.3,140],[3.8,160]].map(([a,r],i)=>({x:C.x+Math.cos(a)*r*1.25,y:C.y+Math.sin(a)*r*0.95,cap:false,i}));
  const S={tub:1,dyn:true,fast:false,offT:0,t:0,done:{cap:false,off:false},mcq:false};
  const inCell=(x,y)=>((x-C.x)/RX)**2+((y-C.y)/RY)**2<0.93;
  function nuc(){ return {a:Math.random()*Math.PI*2,L:4,st:"grow",cap:null}; }
  let MT=Array.from({length:24},()=>{ const m=nuc(); m.L=20+Math.random()*120; m.st=Math.random()<.3?"shrink":"grow"; return m; });
  const tip=m=>({x:C.x+Math.cos(m.a)*m.L,y:C.y+Math.sin(m.a)*m.L});
  function step(dt){
    MT.forEach(m=>{ if(m.cap) return; const p=tip(m);
      if(m.st==="grow"){ m.L+=42*S.tub*dt; const q=tip(m);
        if(!inCell(q.x,q.y)){ if(S.dyn) m.st="shrink"; else m.L-=42*S.tub*dt; }
        else if(S.dyn && Math.random()<0.18*dt/S.tub) m.st="shrink";
        CHR.forEach(c=>{ if(!c.cap && Math.hypot(q.x-c.x,q.y-c.y)<20){ c.cap=true; m.cap=c; m.st="cap"; } }); }
      else if(m.st==="shrink"){ m.L-=170*dt; if(m.L<6){ Object.assign(m,nuc()); } else if(S.dyn && Math.random()<0.05*dt) m.st="grow"; } });
  }
  loop(dt=>{ const k=S.fast?3:1; for(let r=0;r<k;r++) step(dt); S.t+=dt;
    if(!S.dyn){ S.offT+=dt*k; if(S.offT>4 && !S.done.off){ S.done.off=true; say(); } }
    const nc=CHR.filter(c=>c.cap).length; if(nc===CHR.length && !S.done.cap){ S.done.cap=true; say(); }
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#eef6fa"; ctx.strokeStyle="#7a96a6"; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(C.x,C.y,RX,RY,0,0,7); ctx.fill(); ctx.stroke();

function fromHash(){
  const m=location.hash.match(/^#ch=(\d+)/);
  if(m && CHAPTERS[+m[1]-1]){ RUN=null; renderChapter(+m[1]-1,0); return true; }

}
