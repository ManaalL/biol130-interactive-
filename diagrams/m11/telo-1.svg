oke:rgb(195, 204, 210);stroke-width:1.2px;stroke-linecap:round;"/><line x1="705" y1="100" x2="705" y2="118" stroke="#c3ccd2" stroke-width="1.2" stroke-linecap="round" style="stroke:rgb(195, 204, 210);stroke-width:1.2px;stroke-linecap:round;"/><line x1="715" y1="100" x2="715" y2="118" stroke="#c3ccd2" stroke-width="1.2" stroke-linecap="round" style="stroke:rgb(195, 204, 210);stroke-width:1.2px;stroke-linecap:round;"/><line x1="725" y1="100" x2="725" y2="118" stroke="#c3ccd2" stroke-width="1.2" stroke-linecap="round" style="stroke:rgb(195, 204, 210);stroke-width:1.2px;stroke-linecap:round;"/><line x1="735" y1="100" x2="735" y2="118" stroke="#c3ccd2" stroke-width="1.2" stroke-linecap="round" style="stroke:rgb(195, 204, 210);stroke-width:1.2px;stroke-linecap:round;"/></g><text x="414" y="122" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">5′</text><g data-term="telomerase" style=""><path d="M80 72 q80 -34 176 0 q30 44 0 88 q-90 30 -176 0 q-30 -44 0 -88 Z" fill="#e6efc8" stroke="#7a9a2c" stroke-width="2" style="fill:rgb(230, 239, 200);stroke:rgb(122, 154, 44);stroke-width:2px;"/><text x="150" y="138" font-family="IBM Plex Mono,Menlo,monospace" font-size="14" font-weight="600" fill="#6a4fa3" letter-spacing="2.2" style="fill:rgb(106, 79, 163);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;letter-spacing:2.2px;display:block;" data-l="1">CCCUAACCC</text><text x="136" y="138" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">5′</text><text x="282" y="138" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">3′</text></g><g data-term="telomerase" style=""><text x="112" y="90" font-family="IBM Plex Mono,Menlo,monospace" font-size="15" font-weight="600" fill="#8e44ad" letter-spacing="2.2" style="fill:rgb(142, 68, 173);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:2.2px;display:block;" data-l="1">GGGATT</text><line x1="106" y1="100" x2="250" y2="100" stroke="#8e44ad" stroke-width="6" stroke-linecap="round" style="stroke:rgb(142, 68, 173);stroke-width:6px;stroke-linecap:round;"/></g><text x="92" y="104" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">3′</text><line x1="230" y1="182" x2="116.0" y2="182.0" stroke="#7a3f8f" stroke-width="2.2" style="stroke:rgb(122, 63, 143);stroke-width:2.2px;"/><polygon points="110,182 119.2,178.1 119.2,185.9" fill="#7a3f8f" style="fill:rgb(122, 63, 143);"/><text x="240" y="186" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">new repeats added to the 3′ end</text><g style=""><g data-term="telomerase" style=""><line x1="200" y1="49" x2="200" y2="98" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="200" cy="98" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="20" y="30" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="20" dy="0" style="" data-l="1">New DNA repeats: reverse transcriptase</tspan><tspan x="20" dy="14" style="" data-l="1">activity (RNA template → DNA)</tspan></text></g><g data-term="telomerase" style=""><line x1="326" y1="242" x2="236" y2="144" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="236" cy="144" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="330" y="246" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="330" dy="0" style="" data-l="1">Its own RNA template,</tspan><tspan x="330" dy="14" style="" data-l="1">complementary to the repeat</tspan></text></g><g data-term="telomerase" style=""><line x1="100" y1="231" x2="100" y2="154" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="100" cy="154" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="30" y="246" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="30" dy="0" style="" data-l="1">Telomerase: protein + RNA</tspan><tspan x="30" dy="14" style="" data-l="1">(a ribonucleoprotein)</tspan></text></g><g data-term="telomere" style=""><line x1="600" y1="53" x2="600" y2="94" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="600" cy="94" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="500" y="34" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="500" dy="0" style="" data-l="1">Template strand: its 3′ end</tspan><tspan x="500" dy="14" style="" data-l="1">holds the telomere repeats</tspan></text></g><g data-term="lagging" style=""><line x1="600" y1="145" x2="600" y2="120" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="600" cy="120" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="560" y="160" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="560" dy="0" style="" data-l="1">Lagging strand</tspan></text></g></g><text x="20" y="290" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">GGGATT read 3′ → 5′ is the human repeat 5′-TTAGGG-3′.</text><text x="20" y="308" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-style:italic;display:block;" data-l="1">Then primase and DNA polymerase fill in the lagging strand from a new primer. An extra 3′ overhang remains,</text><text x="20" y="324" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-style:italic;display:block;" data-l="1">which can form a loop at the chromosome end and protect it from degradation.</text></svg>