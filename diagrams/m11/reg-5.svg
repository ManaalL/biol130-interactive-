<svg viewBox="0 0 760 330" role="img" aria-label="p53 responds to DNA damage by stopping the cell cycle, or by triggering apoptosis if damage is not repaired" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="330" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="p53" style=""><rect x="10" y="40" width="176" height="270" rx="8" fill="#fafbfc" stroke="#d6dde2" stroke-width="1" style="fill:rgb(250, 251, 252);stroke:rgb(214, 221, 226);"/></g><text x="20" y="62" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">1. p53 sits in the nucleus</text><text x="20" y="250" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">p53 is a protein found</text><text x="20" y="264" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">in the nucleus.</text><circle cx="98" cy="150" r="62" fill="#e8ecf0" stroke="#8a98a8" stroke-width="2" stroke-dasharray="7 4" style="fill:rgb(232, 236, 240);stroke:rgb(138, 152, 168);stroke-width:2px;stroke-dasharray:7px, 4px;"/><path d="M50 120 q8 -8 16 0 t16 0 t16 0 t16 0" fill="none" stroke="#2c5aa0" stroke-width="2.5" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.5px;"/><rect x="89" y="153" width="18" height="24" rx="8" fill="#8fd19e" stroke="#3f8f52" style="fill:rgb(143, 209, 158);stroke:rgb(63, 143, 82);"/><g data-term="p53" style=""><rect x="196" y="40" width="176" height="270" rx="8" fill="#fafbfc" stroke="#d6dde2" stroke-width="1" style="fill:rgb(250, 251, 252);stroke:rgb(214, 221, 226);"/></g><text x="206" y="62" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">2. DNA damage</text><text x="206" y="250" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">Damage (e.g. radiation)</text><text x="206" y="264" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">activates a protein kinase</text><text x="206" y="278" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">that phosphorylates p53.</text><circle cx="284" cy="150" r="62" fill="#e8ecf0" stroke="#8a98a8" stroke-width="2" stroke-dasharray="7 4" style="fill:rgb(232, 236, 240);stroke:rgb(138, 152, 168);stroke-width:2px;stroke-dasharray:7px, 4px;"/><path d="M236 120 q8 -8 16 0 t16 0 t16 0 t16 0" fill="none" stroke="#2c5aa0" stroke-width="2.5" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.5px;"/><path d="M246 120 l10 -8" stroke="#d8463c" stroke-width="4" style="stroke:rgb(216, 70, 60);stroke-width:4px;"/><rect x="262" y="150" width="14" height="14" fill="#2c8fb8" style="fill:rgb(44, 143, 184);"/><rect x="291" y="158" width="18" height="24" rx="8" fill="#8fd19e" stroke="#3f8f52" style="fill:rgb(143, 209, 158);stroke:rgb(63, 143, 82);"/><circle cx="308" cy="158" r="6" fill="#f2b33d" stroke="#a57a0c" style="fill:rgb(242, 179, 61);stroke:rgb(165, 122, 12);"/><line x1="278" y1="158" x2="286.5" y2="161.6" stroke="#55606a" stroke-width="1.5" style="stroke:rgb(85, 96, 106);stroke-width:1.5px;"/><polygon points="292,164 282.0,164.0 285.1,156.8" fill="#55606a" style="fill:rgb(85, 96, 106);"/><g data-term="checkpoint" style=""><rect x="382" y="40" width="176" height="270" rx="8" fill="#f6f1f8" stroke="#7a3f8f" stroke-width="2.5" style="fill:rgb(246, 241, 248);stroke:rgb(122, 63, 143);stroke-width:2.5px;"/></g><text x="392" y="62" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">3. Cell cycle arrested</text><text x="392" y="250" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">P-p53 turns on genes, incl.</text><text x="392" y="264" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">an inhibitor of the G₁/S</text><text x="392" y="278" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">cyclin–CDK: time to repair.</text><circle cx="470" cy="150" r="62" fill="#e8ecf0" stroke="#8a98a8" stroke-width="2" stroke-dasharray="7 4" style="fill:rgb(232, 236, 240);stroke:rgb(138, 152, 168);stroke-width:2px;stroke-dasharray:7px, 4px;"/><path d="M422 120 q8 -8 16 0 t16 0 t16 0 t16 0" fill="none" stroke="#2c5aa0" stroke-width="2.5" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.5px;"/><rect x="431" y="158" width="18" height="24" rx="8" fill="#8fd19e" stroke="#3f8f52" style="fill:rgb(143, 209, 158);stroke:rgb(63, 143, 82);"/><circle cx="448" cy="158" r="6" fill="#f2b33d" stroke="#a57a0c" style="fill:rgb(242, 179, 61);stroke:rgb(165, 122, 12);"/><rect x="461" y="168" width="18" height="24" rx="8" fill="#8fd19e" stroke="#3f8f52" style="fill:rgb(143, 209, 158);stroke:rgb(63, 143, 82);"/><circle cx="478" cy="168" r="6" fill="#f2b33d" stroke="#a57a0c" style="fill:rgb(242, 179, 61);stroke:rgb(165, 122, 12);"/><path d="M445 120 q8 -8 16 0" stroke="#7a3f8f" stroke-width="4" fill="none" style="fill:none;stroke:rgb(122, 63, 143);stroke-width:4px;"/><text x="470" y="105" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">gene on</text><g data-term="apoptosis" style=""><rect x="568" y="40" width="176" height="270" rx="8" fill="#fafbfc" stroke="#d6dde2" stroke-width="1" style="fill:rgb(250, 251, 252);stroke:rgb(214, 221, 226);"/></g><text x="578" y="62" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-weight:700;display:block;" data-l="1">4. Not repaired in time</text><text x="578" y="250" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">P-p53 raises Bax and</text><text x="578" y="264" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">lowers Bcl-2: Bax/Bax</text><text x="578" y="278" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">dimers trigger apoptosis.</text><g transform="translate(656 150)" style=""><path d="M-46 -10 q10 -40 40 -36 q40 -6 48 30 q16 30 -14 46 q-20 26 -50 10 q-40 -6 -24 -50 Z" fill="#dde7ee" stroke="#8aa4b4" stroke-width="2" style="fill:rgb(221, 231, 238);stroke:rgb(138, 164, 180);stroke-width:2px;"/><circle cx="-56" cy="40" r="12" fill="#dde7ee" stroke="#8aa4b4" stroke-width="2" style="fill:rgb(221, 231, 238);stroke:rgb(138, 164, 180);stroke-width:2px;"/><circle cx="54" cy="-40" r="10" fill="#dde7ee" stroke="#8aa4b4" stroke-width="2" style="fill:rgb(221, 231, 238);stroke:rgb(138, 164, 180);stroke-width:2px;"/><circle cx="2" cy="4" r="18" fill="#c9b6df" stroke="#7a5aa0" style="fill:rgb(201, 182, 223);stroke:rgb(122, 90, 160);"/></g><line x1="182" y1="150" x2="188.0" y2="150.0" stroke="#55606a" stroke-width="2" style="stroke:rgb(85, 96, 106);stroke-width:2px;"/><polygon points="194,150 184.8,153.9 184.8,146.1" fill="#55606a" style="fill:rgb(85, 96, 106);"/><line x1="368" y1="150" x2="374.0" y2="150.0" stroke="#55606a" stroke-width="2" style="stroke:rgb(85, 96, 106);stroke-width:2px;"/><polygon points="380,150 370.8,153.9 370.8,146.1" fill="#55606a" style="fill:rgb(85, 96, 106);"/><line x1="554" y1="150" x2="560.0" y2="150.0" stroke="#55606a" stroke-width="2" style="stroke:rgb(85, 96, 106);stroke-width:2px;"/><polygon points="566,150 556.8,153.9 556.8,146.1" fill="#55606a" style="fill:rgb(85, 96, 106);"/><text x="20" y="26" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">p53, the "guardian of the genome": a tumour suppressor</text></svg>