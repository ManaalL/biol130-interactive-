block;" data-l="1">2  The 3′-OH of the growing</text><text x="546" y="204" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">strand attacks the high-energy</text><text x="546" y="218" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">phosphate bond of the incoming</text><text x="546" y="232" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">nucleotide; 2 phosphates leave</text><text x="546" y="246" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">as pyrophosphate.</text></g><text x="20" y="370" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-style:italic;display:block;" data-l="1">The four building blocks: dATP, dTTP, dGTP and dCTP (deoxyribonucleotides with three phosphates).</text></svg>