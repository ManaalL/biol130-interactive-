lock;" data-l="1">proteins to the inner surface of the</text><text x="24" y="168" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">plasma membrane (red).</text><g data-term="binary-fission" style=""><rect x="262" y="14" width="236" height="196" rx="8" fill="#fafbfc" stroke="#d6dde2" stroke-width="1" style="fill:rgb(250, 251, 252);stroke:rgb(214, 221, 226);"/></g><circle cx="280" cy="32" r="11" fill="#23282e" style="fill:rgb(35, 40, 46);"/><text x="280" y="37" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">2</text><rect x="334.15" y="53.25" width="91.7" height="57.5" rx="28.75" fill="#e3c35b" stroke="#b8951c" style="fill:rgb(227, 195, 91);stroke:rgb(184, 149, 28);"/><rect x="339.15" y="58.25" width="81.7" height="47.5" rx="23.75" fill="#e6f2f8" stroke="#7aa7bf" stroke-width="1.5" style="fill:rgb(230, 242, 248);stroke:rgb(122, 167, 191);stroke-width:1.5px;"/><g data-term="chromosome" style=""><ellipse cx="380" cy="83.9" rx="24.7" ry="15.2" fill="none" stroke="#2c5aa0" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.85px;"/></g><rect x="378.1" y="55.45" width="3.8" height="7.6" fill="#d8463c" style="fill:rgb(216, 70, 60);"/><path d="M366.7 70.6 q14 9.5 26.599999999999998 0" fill="none" stroke="#62b8de" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(98, 184, 222);stroke-width:2.85px;"/><text x="274" y="140" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">DNA replication begins at a specific</text><text x="274" y="154" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">spot and proceeds in both directions</text><text x="274" y="168" style="fill:r