e="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.85px;"/></g><ellipse cx="671.8" cy="293.9" rx="22.799999999999997" ry="14.25" fill="none" stroke="#62b8de" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(98, 184, 222);stroke-width:2.85px;"/><rect x="586.3000000000001" y="265.45" width="3.8" height="7.6" fill="#d8463c" style="fill:rgb(216, 70, 60);"/><rect x="669.9" y="265.45" width="3.8" height="7.6" fill="#d8463c" style="fill:rgb(216, 70, 60);"/><text x="524" y="350" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">New membrane and cell wall form at</text><text x="524" y="364" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">the constriction, separating two</text><text x="524" y="378" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">identical daughter cells.</text><g style=""><text x="20" y="424" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;font-style:italic;display:block;" data-l="1">Dark blue: original DNA. Light blue: the new copy. Red: where the DNA attaches to the membrane.</text></g></svg>