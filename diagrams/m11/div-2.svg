;" data-l="1">attached to the membrane, near the</text><text x="524" y="168" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">attachment site of the first.</text><g data-term="binary-fission" style=""><rect x="12" y="224" width="236" height="196" rx="8" fill="#fafbfc" stroke="#d6dde2" stroke-width="1" style="fill:rgb(250, 251, 252);stroke:rgb(214, 221, 226);"/></g><circle cx="30" cy="242" r="11" fill="#23282e" style="fill:rgb(35, 40, 46);"/><text x="30" y="247" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">4</text><rect x="58.5" y="263.25" width="143" height="57.5" rx="28.75" fill="#e3c35b" stroke="#b8951c" style="fill:rgb(227, 195, 91);stroke:rgb(184, 149, 28);"/><rect x="63.5" y="268.25" width="133" height="47.5" rx="23.75" fill="#e6f2f8" stroke="#7aa7bf" stroke-width="1.5" style="fill:rgb(230, 242, 248);stroke:rgb(122, 167, 191);stroke-width:1.5px;"/><g data-term="chromosome" style=""><ellipse cx="97.7" cy="293.9" rx="24.7" ry="15.2" fill="none" stroke="#2c5aa0" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.85px;"/></g><g data-term="dna-replication" style=""><ellipse cx="162.3" cy="293.9" rx="24.7" ry="15.2" fill="none" stroke="#62b8de" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(98, 184, 222);stroke-width:2.85px;"/></g><rect x="95.8" y="265.45" width="3.8" height="7.6" fill="#d8463c" style="fill:rgb(216, 70, 60);"/><rect x="160.4" y="265.45" width="3.8" height="7.6" fill="#d8463c" style="fill:rgb(216, 70, 60);"/><text x="24" y="350" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">As the cell elongates, the two DNA</text><text x="24" y="364" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">attachment sites separate.</text><g data-term="binary-fission" style=""><rect x="262" y="224" width="236" height="196" rx="8" fill="#fafbfc" stroke="#d6dde2" stroke-width="1" style="fill:rgb(250, 251, 252);stroke:rgb(214, 221, 226);"/></g><circle cx="280" cy="242" r="11" fill="#23282e" style="fill:rgb(35, 40, 46);"/><text x="280" y="247" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">5</text><g data-term="binary-fission" style=""><path d="M313.5 292 a23.75 23.75 0 0 1 23.75 -23.75 h34.199999999999996 q8.549999999999999 9.5 17.099999999999998 0 h34.199999999999996 a23.75 23.75 0 0 1 0 47.5 h-34.199999999999996 q-8.549999999999999 -9.5 -17.099999999999998 0 h-34.199999999999996 a23.75 23.75 0 0 1 -23.75 -23.75 Z" fill="#e6f2f8" stroke="#b8951c" stroke-width="7.6" stroke-opacity=".75" style="fill:rgb(230, 242, 248);stroke:rgb(184, 149, 28);stroke-width:7.6px;stroke-opacity:0.75;"/><path d="M313.5 292 a23.75 23.75 0 0 1 23.75 -23.75 h34.199999999999996 q8.549999999999999 9.5 17.099999999999998 0 h34.199999999999996 a23.75 23.75 0 0 1 0 47.5 h-34.199999999999996 q-8.549999999999999 -9.5 -17.099999999999998 0 h-34.199999999999996 a23.75 23.75 0 0 1 -23.75 -23.75 Z" fill="#e6f2f8" stroke="#7aa7bf" stroke-width="1.5" style="fill:rgb(230, 242, 248);stroke:rgb(122, 167, 191);stroke-width:1.5px;"/></g><g data-term="chromosome" style=""><ellipse cx="347.7" cy="293.9" rx="22.799999999999997" ry="14.25" fill="none" stroke="#2c5aa0" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:2.85px;"/></g><ellipse cx="412.3" cy="293.9" rx="22.799999999999997" ry="14.25" fill="none" stroke="#62b8de" stroke-width="2.8499999999999996" style="fill:none;stroke:rgb(98, 184, 222);stroke-width:2.85px;"/><rect x="345.8" y="265.45" width="3.8" h