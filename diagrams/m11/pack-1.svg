<svg viewBox="0 0 760 330" role="img" aria-label="A pair of homologous chromosomes before and after S phase" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="330" fill="#fff" style="fill:rgb(255, 255, 255);"/><text x="160" y="30" text-anchor="middle" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Before S phase (G₁)</text><text x="560" y="30" text-anchor="middle" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">After S phase (G₂)</text><g data-term="homologous" style=""><g transform="rotate(0 120 160)" style=""><line x1="120" y1="75" x2="120" y2="245" stroke="#2c5aa0" stroke-width="16" stroke-linecap="round" style="stroke:rgb(44, 90, 160);stroke-width:16px;stroke-linecap:round;"/><circle cx="120" cy="160" r="6.72" fill="#1c2830" opacity=".55" style="fill:rgb(28, 40, 48);opacity:0.55;"/></g><g transform="rotate(0 200 160)" style=""><line x1="200" y1="75" x2="200" y2="245" stroke="#7db6e6" stroke-width="16" stroke-linecap="round" style="stroke:rgb(125, 182, 230);stroke-width:16px;stroke-linecap:round;"/><circle cx="200" cy="160" r="6.72" fill="#1c2830" opacity=".55" style="fill:rgb(28, 40, 48);opacity:0.55;"/></g></g><g data-term="s-phase" style=""><path d="M290 160 h90 v-14 l28 24 l-28 24 v-14 h-90 Z" fill="#62b8de" style="fill:rgb(98, 184, 222);"/><text x="335" y="175" text-anchor="middle" font-weight="700" style="fill:rgb(255, 255, 255);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">S phase</text></g><g data-term="sister-chromatids" style=""><g transform="rotate(0 500 160)" style=""><path d="M489.44 75 Q499.472 160 489.44 245" fill="none" stroke="#2c5aa0" stroke-width="16" stroke-linecap="round" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:16px;stroke-linecap:round;"/><path d="M510.56 75 Q500.528 160 510.56 245" fill="none" stroke="#2c5aa0" stroke-width="16" stroke-linecap="round" style="fill:none;stroke:rgb(44, 90, 160);stroke-width:16px;stroke-linecap:round;"/><circle cx="500" cy="160" r="6.72" fill="#1c2830" opacity=".55" style="fill:rgb(28, 40, 48);opacity:0.55;"/></g></g><g data-term="homologous" style=""><g transform="rotate(0 620 160)" style=""><path d="M609.44 75 Q619.472 160 609.44 245" fill="none" stroke="#7db6e6" stroke-width="16" stroke-linecap="round" style="fill:none;stroke:rgb(125, 182, 230);stroke-width:16px;stroke-linecap:round;"/><path d="M630.56 75 Q620.528 160 630.56 245" fill="none" stroke="#7db6e6" stroke-width="16" stroke-linecap="round" style="fill:none;stroke:rgb(125, 182, 230);stroke-width:16px;stroke-linecap:round;"/><circle cx="620" cy="160" r="6.72" fill="#1c2830" opacity=".55" style="fill:rgb(28, 40, 48);opacity:0.55;"/></g></g><g data-term="nonsister" style=""><path d="M512 250 q48 30 96 0" fill="none" stroke="#a5385a" stroke-width="1.8" stroke-dasharray="4 3" style="fill:none;stroke:rgb(165, 56, 90);stroke-width:1.8px;stroke-dasharray:4px, 3px;"/></g><g style=""><g data-term="homologous" style=""><line x1="160" y1="285" x2="160" y2="240" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="160" cy="240" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="60" y="300" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="60" dy="0" style="" data-l="1">Homologous chromosomes:</tspan><tspan x="60" dy="14" style="" data-l="1">one from each parent</tspan></text></g><g data-term="centromere" style=""><line x1="226" y1="92" x2="203" y2="160" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="203" cy="160" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="230" y="96" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="230" dy="0" style="" data-l="1">Centromere</tspan></text></g><g data-term="sister-chromatids" style=""><line x1="479.2" y1="66" x2="492" y2="112" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="492" cy="112" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="360" y="70" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="360" dy="0" style="" data-l="1">Sister chromatids:</tspan><tspan x="360" dy="14" style="" data-l="1">identical copies</tspan></text></g><g data-term="nonsister" style=""><line x1="596" y1="296" x2="560" y2="266" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="560" cy="266" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="600" y="300" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="600" dy="0" style="" data-l="1">Nonsister chromatids:</tspan><tspan x="600" dy="14" style="" data-l="1">one from each homolog</tspan></text></g><g data-term="centromere" style=""><line x1="646" y1="66" x2="621" y2="160" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="621" cy="160" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="650" y="70" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="650" dy="0" style="" data-l="1">Held together at</tspan><tspan x="650" dy="14" style="" data-l="1">the centromere</tspan></text>