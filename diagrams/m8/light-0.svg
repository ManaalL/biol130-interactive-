<svg viewBox="0 0 760 330" role="img" aria-label="An absorbed photon raises a molecule to an excited state; it returns by heat, fluorescence or energy transfer" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="330" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="excited-state" style=""><line x1="90" y1="96" x2="260" y2="96" stroke="#23282e" stroke-width="2.5" style="stroke:rgb(35, 40, 46);stroke-width:2.5px;"/><line x1="90" y1="262" x2="260" y2="262" stroke="#23282e" stroke-width="2.5" style="stroke:rgb(35, 40, 46);stroke-width:2.5px;"/><text x="90" y="86" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">Excited state</text><text x="90" y="284" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">Ground state</text><line x1="150" y1="256" x2="150.0" y2="110.0" stroke="#e07b28" stroke-width="2.5" style="stroke:rgb(224, 123, 40);stroke-width:2.5px;"/><polygon points="150,104 153.9,113.2 146.1,113.2" fill="#e07b28" style="fill:rgb(224, 123, 40);"/><circle cx="150" cy="96" r="9" fill="#e07b28" stroke="#a5501a" style="fill:rgb(224, 123, 40);stroke:rgb(165, 80, 26);"/><text x="150" y="99.5" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">e⁻</text><circle cx="150" cy="262" r="9" fill="none" stroke="#e07b28" stroke-dasharray="3 2" style="fill:none;stroke:rgb(224, 123, 40);stroke-dasharray:3px, 2px;"/></g><g data-term="photon" style=""><path d="M36.0 170.0L38.3 172.9L40.6 174.8L42.9 174.8L45.2 172.9L47.5 170.0L49.8 167.1L52.1 165.2L54.4 165.2L56.7 167.1L59.0 170.0L61.3 172.9L63.6 174.8L65.9 174.8L68.2 172.9L70.5 170.0L72.8 167.1L75.1 165.2L77.4 165.2L79.7 167.1L82.0 170.0L84.3 172.9L86.6 174.8L88.9 174.8L91.2 172.9L93.5 170.0L95.8 167.1L98.1 165.2L100.4 165.2L102.7 167.1L105.0 170.0L107.3 172.9L109.6 174.8L111.9 174.8L114.2 172.9L116.5 170.0L118.8 167.1L121.1 165.2L123.4 165.2L125.7 167.1L128.0 170.0" stroke="#3a62c9" stroke-width="2.4" fill="none" style="fill:none;stroke:rgb(58, 98, 201);stroke-width:2.4px;"/><polygon points="138,170 129.0,174.3 129.0,165.7" fill="#3a62c9" style="fill:rgb(58, 98, 201);"/><text x="22" y="152" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1">photon</text><text x="22" y="200" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">(absorbed)</text></g><text x="34" y="26" font-weight="700" font-size="15" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">Absorbing a photon, then three ways back to the ground state</text><line x1="262" y1="96" x2="350.2" y2="75.4" stroke="#7a8a96" stroke-width="1.6" style="stroke:rgb(122, 138, 150);stroke-width:1.6px;"/><polygon points="356,74 347.9,79.9 346.1,72.3" fill="#7a8a96" style="fill:rgb(122, 138, 150);"/><line x1="262" y1="100" x2="351.2" y2="166.4" stroke="#7a8a96" stroke-width="1.6" style="stroke:rgb(122, 138, 150);stroke-width:1.6px;"/><polygon points="356,170 346.3,167.6 350.9,161.4" fill="#7a8a96" style="fill:rgb(122, 138, 150);"/><line x1="262" y1="104" x2="352.9" y2="256.8" stroke="#7a8a96" stroke-width="1.6" style="stroke:rgb(122, 138, 150);stroke-width:1.6px;"/><polygon points="356,262 347.9,256.1 354.6,252.1" fill="#7a8a96" style="fill:rgb(122, 138, 150);"/><g data-term="excited-state" style=""><rect x="360" y="40" width="380" height="68" rx="8" fill="#f6f8f4" stroke="#cfd8c6" style="fill:rgb(246, 248, 244);stroke:rgb(207, 216, 198);"/><text x="440" y="68" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">1. Dissipate the energy as heat</text><text x="440" y="86" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">The molecule warms its surroundings.</text><path d="M384 60 q6 8 0 16 t0 16 M398 60 q6 8 0 16 t0 16 M412 60 q6 8 0 16 t0 16" stroke="#d8463c" stroke-width="2.2" fill="none" style="fill:none;stroke:rgb(216, 70, 60);stroke-width:2.2px;"/></g><g data-term="fluorescence" style=""><rect x="360" y="136" width="380" height="68" rx="8" fill="#f6f8f4" stroke="#cfd8c6" style="fill:rgb(246, 248, 244);stroke:rgb(207, 216, 198);"/><text x="440" y="164" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">2. Re-emit it at a longer wavelength</text><text x="440" y="182" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">Fluorescence: less energy, so a longer λ.</text><path d="M372.0 170.0L373.1 171.8L374.3 173.2L375.4 174.0L376.6 173.8L377.8 172.8L378.9 171.2L380.1 169.4L381.2 167.6L382.4 166.4L383.5 166.0L384.6 166.4L385.8 167.6L386.9 169.4L388.1 171.2L389.3 172.8L390.4 173.8L391.6 174.0L392.7 173.2L393.9 171.8L395.0 170.0L396.1 168.2L397.3 166.8L398.4 166.0L399.6 166.2L400.8 167.2L401.9 168.8L403.1 170.6L404.2 172.4L405.4 173.6L406.5 174.0L407.6 173.6L408.8 172.4L409.9 170.6L411.1 168.8L412.3 167.2L413.4 166.2L414.6 166.0L415.7 166.8L416.9 168.2L418.0 170.0" stroke="#c0392b" stroke-width="2.2" fill="none" style="fill:none;stroke:rgb(192, 57, 43);stroke-width:2.2px;"/><polygon points="428,170 419.0,174.3 419.0,165.7" fill="#c0392b" style="fill:rgb(192, 57, 43);"/></g><g data-term="antenna" style=""><rect x="360" y="232" width="380" height="68" rx="8" fill="#f6f8f4" stroke="#cfd8c6" style="fill:rgb(246, 248, 244);stroke:rgb(207, 216, 198);"/><text x="440" y="260" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">3. Transfer it to another molecule</text><text x="440" y="278" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">This is what photosynthetic pigments do.</text><circle cx="384" cy="266" r="12" fill="#cfe6a8" stroke="#6d9b3a" style="fill:rgb(207, 230, 168);stroke:rgb(109, 155, 58);"/><line x1="398" y1="266" x2="406.0" y2="266.0" stroke="#d99a12" stroke-width="2" style="stroke:rgb(217, 154, 18);stroke-width:2px;"/><polygon points="412,266 402.8,269.9 402.8,262.1" fill="#d99a12" style="fill:rgb(217, 154, 18);"/><circle cx="424" cy="266" r="12" fill="#9ccc5e" stroke="#4f7a22" style="fill:rgb(156, 204, 94);stroke:rgb(79, 122, 34);"/></g></svg>