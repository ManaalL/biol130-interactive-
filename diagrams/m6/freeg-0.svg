<svg viewBox="0 0 760 260" role="img" aria-label="Carbon dioxide plus water forms carbonic acid: two bonds break and two new bonds form" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="260" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="reactants" style=""><text x="60" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#d8463c" style="fill:rgb(216, 70, 60);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><line x1="72" y1="117" x2="96" y2="117" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><line x1="72" y1="123" x2="96" y2="123" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><text x="108" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#55585c" style="fill:rgb(85, 88, 92);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">C</text><line x1="120" y1="117" x2="144" y2="117" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><line x1="120" y1="123" x2="144" y2="123" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><text x="156" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#d8463c" style="fill:rgb(216, 70, 60);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><text x="108" y="170" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">CO₂</text><text x="108" y="188" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12px;text-anchor:middle;display:block;" data-l="1">carbon dioxide</text><text x="196" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:20px;text-anchor:middle;display:block;" data-l="1">+</text><text x="232" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#4a7fd0" style="fill:rgb(74, 127, 208);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H</text><line x1="244" y1="120" x2="264" y2="120" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><text x="276" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#d8463c" style="fill:rgb(216, 70, 60);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><line x1="288" y1="120" x2="308" y2="120" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><text x="320" y="127" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#4a7fd0" style="fill:rgb(74, 127, 208);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H</text><text x="276" y="170" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H₂O</text><text x="276" y="188" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12px;text-anchor:middle;display:block;" data-l="1">water</text></g><path d="M132 112 l8 16 M256 112 l-6