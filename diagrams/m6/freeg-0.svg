20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H</text><line x1="528" y1="130" x2="548" y2="154" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><text x="558" y="166" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#d8463c" style="fill:rgb(216, 70, 60);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><line x1="570" y1="160" x2="590" y2="160" stroke="#d0402f" stroke-width="3" style="stroke:rgb(208, 64, 47);stroke-width:3px;"/><text x="602" y="166" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#4a7fd0" style="fill:rgb(74, 127, 208);font-size:20px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H</text><text x="530" y="210" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H₂CO₃</text><text x="530" y="228" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12px;text-anchor:middle;display:block;" data-l="1">carbonic acid</text></g><g style=""><g data-term="chemical-reaction" style=""><line x1="136" y1="63" x2="136" y2="110" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="136" cy="110" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="20" y="30" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="20" dy="0" style="" data-l="1">Bonds broken: one C–O</tspan><tspan x="20" dy="14" style="" data-l="1">bond in CO₂ and one</tspan><tspan x="20" dy="14" style="" data-l="1">O–H bond in H₂O</tspan></text></g><g data-term="chemical-reaction" style=""><line x1="590" y1="181" x2="590" y2="160" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="590" cy="160" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="750" y="196" text-anchor="end" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;text-anchor:end;display:block;" data-l="1"><tspan x="750" dy="0" style="" data-l="1">New covalent bonds (red):</tspan><tspan x="750" dy="14" style="" data-l="1">C to the O of water,</tspan><tspan x="750" dy="14" style="" data-l="1">an O of CO₂ to an H</tspan></text></g></g><text x="380" y="250" text-anchor="middle" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-style:italic;text-anchor:middle;display:block;" data-l="1">Atoms keep their identity; only the bonds linking them change.</text></svg>