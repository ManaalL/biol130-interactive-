01c" opacity=".7" style="fill:rgb(246, 211, 107);stroke:rgb(184, 144, 28);opacity:0.7;"/><text x="100" y="250" text-anchor="start" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12.5px;display:block;" data-l="1">= one unit of energy</text><g style=""><g data-term="first-law" style=""><line x1="556" y1="96" x2="494" y2="130" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="494" cy="130" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="560" y="100" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="560" dy="0" style="" data-l="1">Same 4 units, rearranged:</tspan><tspan x="560" dy="14" style="" data-l="1">energy is neither created</tspan><tspan x="560" dy="14" style="" data-l="1">nor destroyed</tspan></text></g></g></svg>