<svg viewBox="0 0 760 240" role="img" aria-label="ATP hydrolysis (−7.3) coupled to glucose phosphorylation (+3.3) gives a net ΔG of −4 kcal/mol" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="240" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="atp-hydrolysis" style=""><text x="30" y="60" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;display:block;" data-l="1">ATP + H₂O</text><text x="310" y="60" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="16" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:16px;text-anchor:middle;display:block;" data-l="1">→</text><text x="340" y="60" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;display:block;" data-l="1">ADP + Pᵢ</text><text x="560" y="60" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#c8402f" style="fill:rgb(200, 64, 47);font-size:14px;font-weight:700;display:block;" data-l="1">ΔG₁ = −7.3</text><text x="745" y="60" text-anchor="end" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#c8402f" style="fill:rgb(200, 64, 47);font-size:13px;font-weight:700;text-anchor:end;display:block;" data-l="1">Exergonic</text></g><g data-term="endergonic" style=""><text x="30" y="104" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;display:block;" data-l="1">Glucose + Pᵢ</text><text x="310" y="104" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="16" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:16px;text-anchor:middle;display:block;" data-l="1">→</text><text x="340" y="104" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;display:block;" data-l="1">Glucose 6-phosphate + H₂O</text><text x="560" y="104" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#2f6db5" style="fill:rgb(47, 109, 181);font-size:14px;font-weight:700;display:block;" data-l="1">ΔG₂ = +3.3</text><text x="745" y="104" text-anchor="end" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#2f6db5" style="fill:rgb(47, 109, 181);font-size:13px;font-weight:700;text-anchor:end;display:block;" data-l="1">Endergonic</text></g><line x1="24" y1="128" x2="745" y2="128" stroke="#34454e" stroke-width="1.5" style="stroke:rgb(52, 69, 78);stroke-width:1.5px;"/><g data-term="coupling" style=""><text x="30" y="160" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;display:block;" data-l="1">Glucose + ATP</text><text x="310" y="160" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="16" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:16px;text-anchor:middle;display:block;" data-l="1">→</text><text x="340" y="160" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;display:block;" data-l="1">Glucose 6-phosphate + ADP</text><text x="560" y="160" text-anchor="start" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#c8402f" style="fill:rgb(200, 64, 47);font-size:14px;font-weight:700;display:block;" data-l="1">ΔG = −4</text><text x="745" y="160" text-anchor="end" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#c8402f" style="fill:rgb(200, 64, 47);font-size:13px;font-weight:700;text-anchor:end;display:block;" data-l="1">Coupled</text></g><text x="600" y="32" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#4b5b64" style="fill:rgb(75, 91, 100);font-size:12px;text-anchor:middle;display:block;" data-l="1">kcal/mol</text><g data-term="coupling" style=""><rect x="30" y="182" width="700" height="44" rx="6" fill="#e0ecef" style="fill:rgb(224, 236, 239);"/><text x="44" y="201" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">The coupled reaction proceeds because the net ΔG is negative (−7.3 + 3.3 = −4.0),</text><text x="44" y="218" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">and Pᵢ is shared between the two reactions.</text></g></svg>