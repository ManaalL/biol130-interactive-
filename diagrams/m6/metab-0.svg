<svg viewBox="0 0 760 400" role="img" aria-label="Anabolism builds macromolecules from subunits using ATP; catabolism breaks them down and makes ATP" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="400" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="metabolism" style=""><rect x="290" y="16" width="180" height="104" rx="8" fill="#f4eefa" stroke="#6f4a90" stroke-width="1.6" style="fill:rgb(244, 238, 250);stroke:rgb(111, 74, 144);stroke-width:1.6px;"/><text x="380" y="38" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#5a3a80" style="fill:rgb(90, 58, 128);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Macromolecules</text><text x="380" y="58" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#5a3a80" style="fill:rgb(90, 58, 128);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Carbohydrates</text><text x="380" y="74" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#5a3a80" style="fill:rgb(90, 58, 128);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Proteins</text><text x="380" y="90" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#5a3a80" style="fill:rgb(90, 58, 128);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Lipids</text><text x="380" y="106" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#5a3a80" style="fill:rgb(90, 58, 128);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Nucleic acids</text></g><g data-term="metabolism" style=""><rect x="280" y="262" width="200" height="116" rx="8" fill="#eef7f0" stroke="#3f8a4c" stroke-width="1.6" style="fill:rgb(238, 247, 240);stroke:rgb(63, 138, 76);stroke-width:1.6px;"/><text x="380" y="284" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#2e6b39" style="fill:rgb(46, 107, 57);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Subunits</text><text x="380" y="302" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#2e6b39" style="fill:rgb(46, 107, 57);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Sugars</text><text x="380" y="317" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#2e6b39" style="fill:rgb(46, 107, 57);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Amino acids</text><text x="380" y="332" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#2e6b39" style="fill:rgb(46, 107, 57);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Fatty acids</text><text x="380" y="347" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#2e6b39" style="fill:rgb(46, 107, 57);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">Nucleotides</text><text x="380" y="362" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12.5" font-weight="400" fill="#2e6b39" style="fill:rgb(46, 107, 57);font-size:12.5px;text-anchor:middle;display:block;" data-l="1">and their precursors</text></g><g data-term="anabolism" style=""><path d="M300 258 Q170 190 295.5 126.3" stroke="#b9c2c8" stroke-width="7" fill="none" style="fill:none;stroke:rgb(185, 194, 200);stroke-width:7px;"/><polygon points="300,124 289.2,137.3 282.9,124.9" fill="#b9c2c8" style="fill:rgb(185, 194, 200);"/><text x="212" y="190" transform="rotate(-82 212 190)" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#55606a" style="fill:rgb(85, 96, 106);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Anabolism</text></g><g data-term="catabolism" style=""><path d="M460 124 Q590 190 464.4 255.7" stroke="#b9c2c8" stroke-width="7" fill="none" style="fill:none;stroke:rgb(185, 194, 200);stroke-width:7px;"/><polygon points="460,258 470.6,244.6 477.1,256.9" fill="#b9c2c8" style="fill:rgb(185, 194, 200);"/><text x="548" y="190" transform="rotate(82 548 190)" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#55606a" style="fill:rgb(85, 96, 106);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Catabolism</text></g><g data-term="atp" style=""><rect x="24" y="150" width="136" height="50" rx="8" fill="#fffaf0" stroke="#b8901c" style="fill:rgb(255, 250, 240);stroke:rgb(184, 144, 28);"/><text x="92" y="171" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">ATP + H₂O</text><text x="92" y="190" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;text-anchor:middle;display:block;" data-l="1">→ ADP + Pᵢ</text></g><g data-term="atp" style=""><rect x="600" y="150" width="136" height="50" rx="8" fill="#fffaf0" stroke="#b8901c" style="fill:rgb(255, 250, 240);stroke:rgb(184, 144, 28);"/><text x="668" y="171" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;text-anchor:middle;display:block;" data-l="1">ADP + Pᵢ</text><text x="668" y="190" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">→ ATP + H₂O</text></g><g data-term="anabolism" style=""><rect x="14" y="290" width="236" height="74" rx="4" fill="#e3eef6" style="fill:rgb(227, 238, 246);"/><text x="26" y="312" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13.5" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13.5px;font-weight:700;display:block;" data-l="1">Anabolism: building molecules</text><text x="26" y="330" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">from smaller units. Requires an</text><text x="26" y="348" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">input of energy (ATP).</text></g><g data-term="catabolism" style=""><rect x="510" y="290" width="236" height="74" rx="4" fill="#fbeee0" style="fill:rgb(251, 238, 224);"/><text x="522" y="312" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13.5" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13.5px;font-weight:700;display:block;" data-l="1">Catabolism: breakdown of</text><text x="522" y="330" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">molecules into smaller units.</text><text x="522" y="348" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">Produces energy (ATP).</text></g></svg>