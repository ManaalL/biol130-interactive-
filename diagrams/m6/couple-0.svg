troke="#55606a" stroke-width="2" style="stroke:rgb(85, 96, 106);stroke-width:2px;"/><circle cx="44" cy="100" r="13" fill="#f6d36b" stroke="#b8901c" style="fill:rgb(246, 211, 107);stroke:rgb(184, 144, 28);"/><text x="44" y="105" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#8a6400" style="fill:rgb(138, 100, 0);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">P</text><text x="90" y="150" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">ATP</text></g><g data-term="atp-hydrolysis" style=""><text x="208" y="106" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:20px;text-anchor:middle;display:block;" data-l="1">+</text><circle cx="246" cy="100" r="14" fill="#d8463c" style="fill:rgb(216, 70, 60);"/><circle cx="231" cy="112" r="8" fill="#eef2f6" stroke="#8a98a8" style="fill:rgb(238, 242, 246);stroke:rgb(138, 152, 168);"/><circle cx="261" cy="112" r="8" fill="#eef2f6" stroke="#8a98a8" style="fill:rgb(238, 242, 246);stroke:rgb(138, 152, 168);"/><text x="246" y="150" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H₂O</text><line x1="282" y1="100" x2="332.0" y2="100.0" stroke="#34454e" stroke-width="2.4" style="stroke:rgb(52, 69, 78);stroke-width:2.4px;"/><polygon points="338,100 328.8,103.9 328.8,96.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/></g><g data-term="adp-amp" style=""><rect x="430" y="84" width="74" height="32" rx="8" fill="#d8cdee" stroke="#6f5aa3" style="fill:rgb(216, 205, 238);stroke:rgb(111, 90, 163);"/><text x="467" y="105" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11" font-weight="700" fill="#4a3a70" style="fill:rgb(74, 58, 112);font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Adenosine</text><line x1="428" y1="100" x2="430" y2="100" stroke="#55606a" stroke-width="2" style="stroke:rgb(85, 96, 106);stroke-width:2px;"/><circle cx="414" cy="100" r="13" fill="#f6d36b" stroke="#b8901c" style="fill:rgb(246, 211, 107);stroke:rgb(184, 144, 28);"/><text x="414" y="105" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#8a6400" style="fill:rgb(138, 100, 0);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">P</text><line x1="398" y1="100" x2="400" y2="100" stroke="#55606a" stroke-width="2" style="stroke:rgb(85, 96, 106);stroke-width:2px;"/><circle cx="384" cy="100" r="13" fill="#f6d36b" stroke="#b8901c" style="fill:rgb(246, 211, 107);stroke:rgb(184, 144, 28);"/><text x="384" y="105" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#8a6400" style="fill:rgb(138, 100, 0);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">P</text><text x="415" y="150" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">ADP</text></g><g data-term="atp-hydrolysis" style=""><text x="510" y="106" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="20" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:20px;text-anchor:middle;display:block;" data-l="1">+</text><circle cx="548" cy="100" r="13" fill="#f6d36b" stroke="#b8901c" style="fill:rgb(246, 211, 107);stroke:rgb(184, 144, 28);"/><text x="548" y="105" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#8a6400" style="fill:rgb(138, 100, 0);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">P</text><text x="548" y="150" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Pᵢ</text><path d="M312 56 l-8 14 h10 l-8 14" stroke="#e0a000" stroke-width="2.5" fill="none" style="fill:none;stroke:rgb(224, 160, 0);stroke-width:2.5px;"/><text x="322" y="62" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#a07000" style="fill:rgb(160, 112, 0);font-size:13px;font-weight:700;display:block;" data-l="1">Free energy released</text></g><g data-term="exergonic" style=""><text x="220" y="200" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="600" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;font-weight:600;text-anchor:middle;display:block;" data-l="1">ATP + H₂O → ADP + Pᵢ</text><text x="520" y="200" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="600" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:14px;font-weight:600;text-anchor:middle;display:block;" data-l="1">ΔG = −7.3 kcal/mol (exergonic, spontaneous)</text></g><text x="380" y="228" text-anchor="middle" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-style:italic;text-anchor:middle;display:block;" data-l="1">Pᵢ = inorganic phosphate. ADP has two phosphate groups, so it has lower potential energy than ATP.</text></svg>