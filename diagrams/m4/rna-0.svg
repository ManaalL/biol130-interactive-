<svg viewBox="0 0 860 280" role="img" aria-label="Ribose has a 2′ hydroxyl where deoxyribose has a hydrogen; uracil has a hydrogen where thymine has a methyl group" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="860" height="280" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="ribose" style=""><polygon points="110.0,80.0 157.6,114.5 139.4,170.5 80.6,170.5 62.4,114.5" fill="#f3b3c1" stroke="#b0566e" stroke-width="2" style="fill:rgb(243, 179, 193);stroke:rgb(176, 86, 110);stroke-width:2px;"/><text x="110" y="136" text-anchor="middle" font-size="13" font-weight="700" font-family="Arial" style="font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Ribose</text><text x="140" y="205" font-size="15" font-weight="700" font-family="Arial" fill="#b0342c" style="fill:rgb(176, 52, 44);font-family:'Source Sans 3',system-ui,sans-serif;font-size:15px;font-weight:700;display:block;" data-l="1">2′ OH</text></g><g data-term="deoxyribose" style=""><polygon points="300.0,80.0 347.6,114.5 329.4,170.5 270.6,170.5 252.4,114.5" fill="#c1b2e2" stroke="#6f5aa3" stroke-width="2" style="fill:rgb(193, 178, 226);stroke:rgb(111, 90, 163);stroke-width:2px;"/><text x="300" y="136" text-anchor="middle" font-size="13" font-weight="700" font-family="Arial" style="font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Deoxyribose</text><text x="330" y="205" font-size="15" font-weight="700" font-family="Arial" style="font-family:'Source Sans 3',system-ui,sans-serif;font-size:15px;font-weight:700;display:block;" data-l="1">2′ H</text></g><g data-term="uracil" style=""><polygon points="592.9,149.0 560.0,168.0 527.1,149.0 527.1,111.0 560.0,92.0 592.9,111.0" fill="#86b851" stroke="rgba(0,0,0,.45)" stroke-width="1.5" style="fill:rgb(134, 184, 81);stroke:rgba(0, 0, 0, 0.45);stroke-width:1.5px;"/><text x="560.0" y="84.0" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#2a2a2a" style="fill:rgb(42, 42, 42);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><text x="602.9" y="107.0" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#2a2a2a" style="fill:rgb(42, 42, 42);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">H</text><text x="560.0" y="184.0" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#2a2a2a" style="fill:rgb(42, 42, 42);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><text x="560" y="135" text-anchor="middle" font-size="24" font-weight="700" font-family="Source Sans 3,Arial" fill="#fff" style="fill:rgb(255, 255, 255);font-size:24px;font-weight:700;text-anchor:middle;display:block;" data-l="1">U</text><text x="560" y="215" text-anchor="middle" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Uracil (RNA)</text></g><g data-term="thymine" style=""><polygon points="782.9,149.0 750.0,168.0 717.1,149.0 717.1,111.0 750.0,92.0 782.9,111.0" fill="#3a9a9a" stroke="rgba(0,0,0,.45)" stroke-width="1.5" style="fill:rgb(58, 154, 154);stroke:rgba(0, 0, 0, 0.45);stroke-width:1.5px;"/><text x="750.0" y="84.0" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#2a2a2a" style="fill:rgb(42, 42, 42);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><text x="796.9" y="107.0" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#2a2a2a" style="fill:rgb(42, 42, 42);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">CH₃</text><text x="750.0" y="184.0" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#2a2a2a" style="fill:rgb(42, 42, 42);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O</text><text x="750" y="135" text-anchor="middle" font-size="24" font-weight="700" font-family="Source Sans 3,Arial" fill="#fff" style="fill:rgb(255, 255, 255);font-size:24px;font-weight:700;text-anchor:middle;display:block;" data-l="1">T</text><text x="750" y="215" text-anchor="middle" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Thymine (DNA)</text></g><text x="205" y="255" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">The 2′ –OH makes RNA less stable than DNA.</text><text x="655" y="255" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">U has –H where T has –CH₃.</text></svg>