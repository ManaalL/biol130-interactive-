<svg viewBox="0 0 900 300" role="img" aria-label="A polycistronic mRNA carrying three genes, each translated into its own protein" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="300" fill="#fff" style="fill:rgb(255, 255, 255);"/><line x1="40" y1="54" x2="860" y2="54" stroke="#76a9dc" stroke-width="7" stroke-linecap="round" style="stroke:rgb(118, 169, 220);stroke-width:7px;stroke-linecap:round;"/><line x1="40" y1="66" x2="860" y2="66" stroke="#2c4f95" stroke-width="7" stroke-linecap="round" style="stroke:rgb(44, 79, 149);stroke-width:7px;stroke-linecap:round;"/><g data-term="promoter" style=""><rect x="60" y="48" width="60" height="24" fill="#5fb35f" opacity=".5" style="fill:rgb(95, 179, 95);opacity:0.5;"/></g><text x="64" y="94" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">promoter</text><rect x="140" y="50" width="200" height="20" fill="none" stroke="#b0342c" stroke-width="2" style="fill:none;stroke:rgb(176, 52, 44);stroke-width:2px;"/><text x="240" y="94" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">Gene 1</text><rect x="360" y="50" width="200" height="20" fill="none" stroke="#b0342c" stroke-width="2" style="fill:none;stroke:rgb(176, 52, 44);stroke-width:2px;"/><text x="460" y="94" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">Gene 2</text><rect x="580" y="50" width="200" height="20" fill="none" stroke="#b0342c" stroke-width="2