t-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Nucleus</text><text x="650" y="244" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="600" fill="#3a7a32" style="fill:rgb(58, 122, 50);font-size:14px;font-weight:600;text-anchor:middle;display:block;" data-l="1">→ lamins</text></g><text x="40" y="296" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;display:block;" data-l="1">More than 100 types, made of different proteins depending on the cell type.</text><text x="40" y="318" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:700;display:block;" data-l="1">Animal cells only.</text></svg>