<svg viewBox="0 0 640 330" role="img" aria-label="A kinase adds a phosphate from ATP to activate a protein; a phosphatase removes it" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="330" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="phosphorylation" style=""><path d="M280 70 C270 30 330 20 340 50 C370 40 376 90 340 94 C320 114 280 104 280 70 Z" fill="#c7d6e8" stroke="#2f5f93" stroke-width="2" style="fill:rgb(199, 214, 232);stroke:rgb(47, 95, 147);stroke-width:2px;"/><text x="420" y="64" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="600" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:600;display:block;" data-l="1">Inactive protein</text><path d="M280 262 C270 222 330 212 340 242 C370 232 376 282 340 286 C320 306 280 296 280 262 Z" fill="#9cc2ec" stroke="#f2c230" stroke-width="4" style="fill:rgb(156, 194, 236);stroke:rgb(242, 194, 48);stroke-width:4px;"/><circle cx="352" cy="232" r="9" fill="#e8902f" stroke="#a55d12" style="fill:rgb(232, 144, 47);stroke:rgb(165, 93, 18);"/><text x="352" y="235.5" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;display:block;" data-l="1">P</text><text x="420" y="268" text-anchor="start" font-family="Source Sans 3,Arial" font-size="13" font-weight="600" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:13px;font-weight:600;display:block;" data-l="1">Active protein</text></g><g data-term="kinase" style=""><line x1="296" y1="118" x2="296.0" y2="208.0" stroke="#3445