<svg viewBox="0 0 780 310" role="img" aria-label="Receptor activation, signal transduction, response and termination" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="780" height="310" fill="#fff" style="fill:rgb(255, 255, 255);"/><rect x="0" y="0" width="110" height="310" fill="#fbf6e8" style="fill:rgb(251, 246, 232);"/><rect x="110" y="0" width="670" height="310" fill="#e8f3f5" style="fill:rgb(232, 243, 245);"/><rect x="96" y="0" width="30" height="310" fill="#f6e7b8" style="fill:rgb(246, 231, 184);"/><line x1="100" y1="4" x2="100" y2="310" stroke="#d9a93a" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 9" style="stroke:rgb(217, 169, 58);stroke-width:7px;stroke-dasharray:0px, 9px;stroke-linecap:round;"/><line x1="122" y1="4" x2="122" y2="310" stroke="#d9a93a" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 9" style="stroke:rgb(217, 169, 58);stroke-width:7px;stroke-dasharray:0px, 9px;stroke-linecap:round;"/><text x="48" y="24" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" font-style="italic" style="fill:rgb(35, 40, 46);font-size:12px;font-style:italic;text-anchor:middle;display:block;" data-l="1">Outside</text><text x="740" y="24" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" font-style="italic" style="fill:rgb(35, 40, 46);font-size:12px;font-style:italic;text-anchor:middle;display:block;" data-l="1">Cytoplasm</text><g data-term="receptor-activation" style=""><rect x="30" y="50" width="170" height="120" rx="10" fill="rgba(255,255,255,.55)" stroke="#2b62a8" stroke-width="3.5" style="fill:rgba(255, 255, 255, 0.55);stroke:rgb(43, 98, 168);stroke-width:3.5px;"/><text x="115" y="72" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#1f6f6a" style="fill:rgb(31, 111, 106);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Receptor activation</text><path d="M168 128 H112 M112 128 L90 110 M112 128 L90 146" stroke="#7b4fa0" stroke-width="9" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(123, 79, 160);stroke-width:9px;stroke-linecap:round;"/><circle cx="90" cy="128" r="9" fill="#e0578a" style="fill:rgb(224, 87, 138);"/><circle cx="48" cy="156" r="7" fill="#e0578a" style="fill:rgb(224, 87, 138);"/><line x1="54" y1="150" x2="70.9" y2="139.2" stroke="#555" stroke-width="1.5" style="stroke:rgb(85, 85, 85);stroke-width:1.5px;"/><polygon points="76,136 70.3,144.2 66.1,137.7" fill="#555" style="fill:rgb(85, 85, 85);"/></g><g data-term="signal-transduction" style=""><rect x="230" y="50" width="180" height="120" rx="10" fill="#fff" stroke="#3a8f8a" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(58, 143, 138);stroke-width:2px;"/><text x="320" y="72" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#1f6f6a" style="fill:rgb(31, 111, 106);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Signal transduction</text><ellipse cx="258" cy="122" rx="16" ry="11" fill="#86c46f" style="fill:rgb(134, 196, 111);"/><path d="M296 112 l26 8 l-26 12 z" fill="#5b8ad0" style="fill:rgb(91, 138, 208);"/><circle cx="374" cy="122" r="15" fill="#2a9aa3" style="fill:rgb(42, 154, 163);"/><path d="M374 122 l15 -8 v16 z" fill="#fff" style="fill:rgb(255, 255, 255);"/><line x1="276" y1="122" x2="286.0" y2="122.0" stroke="#555" stroke-width="1.6" style="stroke:rgb(85, 85, 85);stroke-width:1.6px;"/><polygon points="292,122 282.8,125.9 282.8,118.1" fill="#555" style="fill:rgb(85, 85, 85);"/><line x1="326" y1="122" x2="350.0" y2="122.0" stroke="#555" stroke-width="1.6" style="stroke:rgb(85, 85, 85);stroke-width:1.6px;"/><polygon points="356,122 346.8,125.9 346.8,118.1" fill="#555" style="fill:rgb(85, 85, 85);"/></g><g data-term="response" style=""><rect x="440" y="50" width="140" height="120" rx="10" fill="#fff" stroke="#3a8f8a" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(58, 143, 138);stroke-width:2px;"/><text x="510" y="72" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#1f6f6a" style="fill:rgb(31, 111, 106);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Response</text><text x="510" y="116" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12px;text-anchor:middle;display:block;" data-l="1">enzyme on, or</text><text x="510" y="132" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12px;text-anchor:middle;display:block;" data-l="1">gene turned on</text></g><g data-term="signal-termination" style=""><rect x="610" y="50" width="150" height="120" rx="10" fill="#fff" stroke="#3a8f8a" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(58, 143, 138);stroke-width:2px;"/><text x="685" y="72" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#1f6f6a" style="fill:rgb(31, 111, 106);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Termination</text><text x="685" y="116" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:12px;text-anchor:middle;display:block;" data-l="1">response stops</text></g><line x1="202" y1="110" x2="220.0" y2="110.0" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><polygon points="226,110 216.8,113.9 216.8,106.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/><line x1="412" y1="110" x2="430.0" y2="110.0" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><polygon points="436,110 426.8,113.9 426.8,106.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/><line x1="582" y1="110" x2="600.0" y2="110.0" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><polygon points="606,110 596.8,113.9 596.8,106.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/><text x="115" y="204" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">1. The signal binds a</text><text x="115" y="220" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">receptor, which is</text><text x="115" y="236" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">then activated.</text><text x="320" y="204" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">2. The signal is transmitted</text><text x="320" y="220" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">into the cell by a signal</text><text x="320" y="236" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">transduction pathway.</text><text x="510" y="204" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">3. The cell responds:</text><text x="510" y="220" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">e.g. an enzyme is</text><text x="510" y="236" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">activated or a gene</text><text x="510" y="252" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">is turned on.</text><text x="685" y="204" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">4. The response is</text><text x="685" y="220" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">stopped so new</text><text x="685" y="236" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">signals can be</text><text x="685" y="252" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="11.5" font-weight="400" fill="#23282e" style="fill:rgb(35, 40, 46);font-size:11.5px;text-anchor:middle;display:block;" data-l="1">received.</text><g style=""><g style=""><line x1="146" y1="290" x2="112" y2="270" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="112" cy="270" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="150" y="294" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1"><tspan x="150" dy="0" style="" data-l="1">Cell membrane</tspan></text></g></g></svg>