<svg viewBox="0 0 860 400" role="img" aria-label="Who built the cell theory, and its three tenets" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="860" height="400" fill="#fff" style="fill:rgb(255, 255, 255);"/><text x="20" y="24" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">First looks</text><g data-term="hooke" style=""><rect x="20" y="34" width="250" height="84" rx="9" fill="#fff" stroke="#7a5a2c" stroke-width="2.5" style="fill:rgb(255, 255, 255);stroke:rgb(122, 90, 44);stroke-width:2.5px;"/><rect x="20" y="34" width="250" height="26" rx="9" fill="#7a5a2c" style="fill:rgb(122, 90, 44);"/><rect x="20" y="50" width="250" height="10" fill="#7a5a2c" style="fill:rgb(122, 90, 44);"/><text x="145" y="52" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Robert Hooke, 1665</text><text x="145" y="82" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">names "cells" in cork</text><text x="145" y="100" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">(empty walls of dead cells)</text></g><line x1="276" y1="76" x2="312.0" y2="76.0" stroke="#55606a" stroke-width="2.5" style="stroke:rgb(85, 96, 106);stroke-width:2.5px;"/><polygon points="318,76 308.8,79.9 308.8,72.1" fill="#55606a" style="fill:rgb(85, 96, 106);"/><g data-term="leeuwenhoek" style=""><rect x="324" y="34" width="250" height="84" rx="9" fill="#fff" stroke="#4a7fd0" stroke-width="2.5" style="fill:rgb(255, 255, 255);stroke:rgb(74, 127, 208);stroke-width:2.5px;"/><rect x="324" y="34" width="250" height="26" rx="9" fill="#4a7fd0" style="fill:rgb(74, 127, 208);"/><rect x="324" y="50" width="250" height="10" fill="#4a7fd0" style="fill:rgb(74, 127, 208);"/><text x="449" y="52" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Anton van Leeuwenhoek, 1673–1700</text><text x="449" y="82" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">better lenses; sees living</text><text x="449" y="100" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">"animalcules" in pond water</text></g><text x="20" y="152" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">Building the theory</text><g data-term="schleiden" style=""><rect x="20" y="162" width="250" height="84" rx="9" fill="#fff" stroke="#3f8a4c" stroke-width="2.5" style="fill:rgb(255, 255, 255);stroke:rgb(63, 138, 76);stroke-width:2.5px;"/><rect x="20" y="162" width="250" height="26" rx="9" fill="#3f8a4c" style="fill:rgb(63, 138, 76);"/><rect x="20" y="178" width="250" height="10" fill="#3f8a4c" style="fill:rgb(63, 138, 76);"/><text x="145" y="180" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Schleiden, botanist</text><text x="145" y="210" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">all plant tissues are cells;</text><text x="145" y="228" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">plant embryos start as one cell</text></g><g data-term="schwann" style=""><rect x="296" y="162" width="250" height="84" rx="9" fill="#fff" stroke="#8a67bd" stroke-width="2.5" style="fill:rgb(255, 255, 255);stroke:rgb(138, 103, 189);stroke-width:2.5px;"/><rect x="296" y="162" width="250" height="26" rx="9" fill="#8a67bd" style="fill:rgb(138, 103, 189);"/><rect x="296" y="178" width="250" height="10" fill="#8a67bd" style="fill:rgb(138, 103, 189);"/><text x="421" y="180" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Schwann, zoologist</text><text x="421" y="210" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">same for animals;</text><text x="421" y="228" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">plants and animals are similar</text></g><g data-term="virchow" style=""><rect x="580" y="162" width="260" height="84" rx="9" fill="#fff" stroke="#c0392b" stroke-width="2.5" style="fill:rgb(255, 255, 255);stroke:rgb(192, 57, 43);stroke-width:2.5px;"/><rect x="580" y="162" width="260" height="26" rx="9" fill="#c0392b" style="fill:rgb(192, 57, 43);"/><rect x="580" y="178" width="260" height="10" fill="#c0392b" style="fill:rgb(192, 57, 43);"/><text x="710" y="180" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#fff" style="fill:rgb(255, 255, 255);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Virchow, physician</text><text x="710" y="210" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1">adds the third tenet</text><text x="710" y="228" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;text-anchor:middle;display:block;" data-l="1"/></g><g data-term="cell-theory" style=""><rect x="20" y="276" width="820" height="112" rx="10" fill="#f2f6ee" stroke="#9cb87a" style="fill:rgb(242, 246, 238);stroke:rgb(156, 184, 122);"/><text x="36" y="300" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;display:block;" data-l="1">The cell theory</text><text x="36" y="324" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1">1. All living organisms are composed of one (unicellular) or more (multicellular) cells.</text><text x="36" y="346" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1">2. Each cell is the structural and functional unit of life.</text><text x="36" y="368" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;display:block;" data-l="1">3. Cells can arise only from pre-existing cells.</text></g><path d="M145 246 V258 H421 V246 M283 258 V276" stroke="#3f8a4c" stroke-width="2" fill="none" style="fill:none;stroke:rgb(63, 138, 76);stroke-width:2px;"/><text x="430" y="268" fill="#2e6b39" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">tenets 1 and 2</text><path d="M710 246 V276" stroke="#c0392b" stroke-width="2" style="stroke:rgb(192, 57, 43);stroke-width:2px;"/><text x="718" y="268" fill="#c0392b" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1">tenet 3</text></svg>