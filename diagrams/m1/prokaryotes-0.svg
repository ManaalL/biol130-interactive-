necap="round" style="fill:none;stroke:rgb(63, 138, 76);stroke-width:7px;stroke-linecap:round;"/><path d="M640 80 L600 40" stroke="#3f8a4c" stroke-width="3.5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(63, 138, 76);stroke-width:3.5px;stroke-linecap:round;"/><path d="M640 80 L650 34" stroke="#3f8a4c" stroke-width="3.5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(63, 138, 76);stroke-width:3.5px;stroke-linecap:round;"/><path d="M640 80 L700 52" stroke="#3f8a4c" stroke-width="3.5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(63, 138, 76);stroke-width:3.5px;stroke-linecap:round;"/><path d="M640 80 L720 90" stroke="#3f8a4c" stroke-width="3.5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(63, 138, 76);stroke-width:3.5px;stroke-linecap:round;"/><text x="720" y="40" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#3f8a4c" letter-spacing="2" style="fill:rgb(63, 138, 76);font-size:20px;font-weight:700;letter-spacing:2px;display:block;" data-l="1">EUKARYA</text></g><g style=""><g data-term="tree-of-life" style=""><line x1="466" y1="386" x2="436" y2="334" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="436" cy="334" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="470" y="390" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1"><tspan x="470" dy="0" style="" data-l="1">Proposed position of the root.</tspan><tspan x="470" dy="14" style="" data-l="1">Time runs from root to branches.</tspan></text></g><g data-term="eukarya" style=""><line x1="606" y1="306" x2="560" y2="190" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="560" cy="190" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="610" y="310" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1"><tspan x="610" dy="0" style="" data-l="1">Eukaryotes are thought to have</tspan><tspan x="610" dy="14" style="" data-l="1">descended from within the Archaea.</tspan></text></g><g data-term="prokaryote" style=""><line x1="246.6" y1="315" x2="250" y2="250" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="250" cy="250" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="30" y="330" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1"><tspan x="30" dy="0" style="" data-l="1">Prokaryotes: Bacteria and Archaea.</tspan><tspan x="30" dy="14" style="" data-l="1">Most of life's diversity is microbial.</tspan></text></g><g data-term="eukaryote" style=""><line x1="503.6" y1="56" x2="598" y2="42" style="fill:none;stroke:rgb(91, 107, 115);"/><circle cx="598" cy="42" r="2" fill="#5b6b73" style="fill:rgb(91, 107, 115);"/><text x="340" y="60" text-anchor="start" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11.5px;display:block;" data-l="1"><tspan x="340" dy="0" style="" data-l="1">Plants and animals are twigs</tspan><tspan x="340" dy="14" style="" data-l="1">on the Eukarya branch.</tspan></text></g></g></svg>