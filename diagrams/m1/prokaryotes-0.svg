<svg viewBox="0 0 860 420" role="img" aria-label="Tree of life with three domains: Bacteria, Archaea and Eukarya" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="860" height="420" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="tree-of-life" style=""><path d="M430 400 L430 330" stroke="#55606a" stroke-width="14" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(85, 96, 106);stroke-width:14px;stroke-linecap:round;"/><circle cx="430" cy="330" r="8" fill="#55606a" style="fill:rgb(85, 96, 106);"/></g><g data-term="bacteria" style=""><path d="M430 330 C360 300 260 260 200 200" stroke="#3d6fb6" stroke-width="10" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(61, 111, 182);stroke-width:10px;stroke-linecap:round;"/><path d="M200 200 Q155 155 110 70" stroke="#3d6fb6" stroke-width="4" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(61, 111, 182);stroke-width:4px;stroke-linecap:round;"/><path d="M200 200 Q185 150 170 60" stroke="#3d6fb6" stroke-width="4" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(61, 111, 182);stroke-width:4px;stroke-linecap:round;"/><path d="M200 200 Q215 152 230 64" stroke="#3d6fb6" stroke-width="4" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(61, 111, 182);stroke-width:4px;stroke-linecap:round;"/><path d="M240 236 Q260 198 280 120" stroke="#3d6fb6" stroke-width="4" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(61, 111, 182);stroke-width:4px;stroke-linecap:round;"/><path d="M240 236 Q280 213 320 150" stroke="#3d6fb6" stroke-width="4" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(61, 111, 182);stroke-width:4px;s