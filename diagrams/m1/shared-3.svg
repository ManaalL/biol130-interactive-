<svg viewBox="0 0 520 420" role="img" aria-label="DNA is transcribed into RNA, which is translated into protein" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="520" height="420" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="dna" style=""><rect x="170" y="24" width="180" height="62" rx="8" fill="#3d5c9e" stroke="rgba(0,0,0,.25)" style="fill:rgb(61, 92, 158);stroke:rgba(0, 0, 0, 0.25);"/><text x="260" y="54" text-anchor="middle" font-family="Source Serif 4,Georgia" font-size="24" font-weight="650" fill="#fff" style="fill:rgb(255, 255, 255);font-size:24px;font-weight:650;text-anchor:middle;display:block;" data-l="1">DNA</text><text x="260" y="74" text-anchor="middle" font-size="12" fill="#fff" font-family="Source Sans 3,Arial" style="fill:rgb(255, 255, 255);font-size:12px;text-anchor:middle;display:block;" data-l="1">deoxyribonucleic acid</text></g><g data-term="rna" style=""><rect x="170" y="178" width="180" height="62" rx="8" fill="#c83a4f" stroke="rgba(0,0,0,.25)" style="fill:rgb(200, 58, 79);stroke:rgba(0, 0, 0, 0.25);"/><text x="260" y="208" text-anchor="middle" font-family="Source Serif 4,Georgia" font-size="24" font-weight="650" fill="#fff" style="fill:rgb(255, 255, 255);font-size:24px;font-weight:650;text-anchor:middle;display:block;" data-l="1">RNA</text><text x="260" y="228" text-anchor="middle" font-size="12" fill="#fff" font-family="Source Sans 3,Arial" style="fill:rgb(255, 255, 255);font-size:12px;text-anchor:middle;display:block;" data-l="1">ribonucleic acid</text></g><g data-term="protein" style=""><rect x="170" y="332" width="180" height="62" rx="8" fill="#3f8a4c" stroke="rgba(0,0,0,.25)" style="fill:rgb(63, 138, 76)