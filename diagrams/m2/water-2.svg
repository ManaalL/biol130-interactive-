<svg viewBox="0 0 760 240" role="img" aria-label="Two hydrogen molecules and one oxygen molecule react to form two water molecules" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="240" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="reactants" style=""><circle cx="59" cy="80" r="16" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="81" cy="80" r="16" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="139" cy="80" r="16" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="161" cy="80" r="16" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><text x="110" y="130" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;text-anchor:middle;display:block;" data-l="1">2H₂, hydrogen gas</text><text x="210" y="88" text-anchor="middle" font-family="Source Sans 3,Arial" font-size="24" font-weight="700" fill="#333" style="fill:rgb(51, 51, 51);font-size:24px;font-weight:700;text-anchor:middle;display:block;" data-l="1">+</text><circle cx="255" cy="80" r="22" fill="#e0857c" stroke="rgba(0,0,0,.25)" style="fill:rgb(224, 133, 124);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="285" cy="80" r="22" fill="#e0857c" stroke="rgba(0,0,0,.25)" style="fill:rgb(224, 133, 124);stroke:rgba(0, 0, 0, 0.25);"/><text x="270" y="130" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;text-anchor:middle;display:block;" data-l="1">O₂, oxygen gas</text></g><g data-term="chemical-reaction" style=""><line x1="330" y1="80" x2="404.0" y2="80.0" stroke="#34454e" stroke-width="3" style="stroke:rgb(52, 69, 78);stroke-width:3px;"/><polygon points="410,80 400.8,83.9 400.8,76.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/></g><g data-term="products" style=""><circle cx="480" cy="72" r="22" fill="#e0857c" stroke="rgba(0,0,0,.25)" style="fill:rgb(224, 133, 124);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="460" cy="88" r="13" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="500" cy="88" r="13" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="580" cy="72" r="22" fill="#e0857c" stroke="rgba(0,0,0,.25)" style="fill:rgb(224, 133, 124);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="560" cy="88" r="13" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><circle cx="600" cy="88" r="13" fill="#9fc3e8" stroke="rgba(0,0,0,.25)" style="fill:rgb(159, 195, 232);stroke:rgba(0, 0, 0, 0.25);"/><text x="530" y="130" text-anchor="middle" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;text-anchor:middle;display:block;" data-l="1">2H₂O, water</text></g><path d="M40 160 v8 H320 v-8" stroke="#55606a" fill="none" style="fill:none;stroke:rgb(85, 96, 106);"/><text x="180" y="190" text-anchor="middle" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Reactants: the starting substances</text><path d="M440 160 v8 H630 v-8" stroke="#55606a" fill="none" style="fill:none;stroke:rgb(85, 96, 106);"/><text x="535" y="190" text-anchor="middle" font-weight="700" style="fill:rgb(28, 40, 48);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">Products: the new molecules</text><text x="380" y="226" text-anchor="middle" style="fill:rgb(59, 74, 82);font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;font-style:italic;text-anchor:middle;display:block;" data-l="1">Bonds break (H–H, O=O) and new bonds form (O–H). Atoms are rearranged, not created or destroyed.</text></svg>