<svg viewBox="0 0 760 380" role="img" aria-label="Glucose is oxidized to carbon dioxide while oxygen is reduced to water; NAD+ and FAD are reduced to NADH and FADH2" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="380" fill="#fff" style="fill:rgb(255, 255, 255);"/><text x="380" y="86" font-family="Source Sans 3,Arial" font-size="22" font-weight="600" fill="#1c2830" text-anchor="middle" style="fill:rgb(28, 40, 48);font-size:22px;font-weight:600;text-anchor:middle;display:block;" data-l="1">C₆H₁₂O₆  +  6 O₂   →   6 CO₂  +  6 H₂O  +  energy</text><g data-term="oxidation" style=""><path d="M150 62 C200 34 310 34 360 58" fill="none" stroke="#7a5aa8" stroke-width="2.2" style="fill:none;stroke:rgb(122, 90, 168);stroke-width:2.2px;"/><polygon points="362,60 353.1,58.4 357.3,52.3" fill="#7a5aa8" style="fill:rgb(122, 90, 168);"/><text x="256" y="24" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#7a5aa8" text-anchor="middle" style="fill:rgb(122, 90, 168);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">glucose is oxidized: loses electrons</text></g><g data-term="reduction" style=""><path d="M240 98 C300 136 420 136 470 100" fill="none" stroke="#c0392b" stroke-width="2.2" style="fill:none;stroke:rgb(192, 57, 43);stroke-width:2.2px;"/><polygon points="472,98 468.1,106.1 463.4,100.5" fill="#c0392b" style="fill:rgb(192, 57, 43);"/><text x="355" y="152" font-family="Source Sans 3,Arial" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle" style="fill:rgb(192, 57, 43);font-size:13px;font-weight:700;text-anchor:middle;display:block;" data-l="1">O₂ is reduced: gains electrons</text></g><g data-term="nad" style=""><text x="40" y="206" font-family="Source Sans 3,Arial" font-size="18" font-weight="600" fill="#1c2830" text-anchor="start" style="fill:rgb(28, 40, 48);font-size:18px;font-weight:600;display:block;" data-l="1">NAD⁺  +  2e⁻  +  H⁺</text><line x1="232" y1="200" x2="276.0" y2="200.0" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><polygon points="282,200 272.8,203.9 272.8,196.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/><text x="296" y="206" font-family="Source Sans 3,Arial" font-size="18" font-weight="700" fill="#7a4b00" text-anchor="start" style="fill:rgb(122, 75, 0);font-size:18px;font-weight:700;display:block;" data-l="1">NADH</text><text x="40" y="226" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#3b5274" text-anchor="start" style="fill:rgb(59, 82, 116);font-size:12px;display:block;" data-l="1">oxidized form</text><text x="296" y="226" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#7a4b00" text-anchor="start" style="fill:rgb(122, 75, 0);font-size:12px;display:block;" data-l="1">reduced form: high potential energy</text></g><g data-term="fad" style=""><text x="40" y="276" font-family="Source Sans 3,Arial" font-size="18" font-weight="600" fill="#1c2830" text-anchor="start" style="fill:rgb(28, 40, 48);font-size:18px;font-weight:600;display:block;" data-l="1">FAD  +  2e⁻  +  2H⁺</text><line x1="232" y1="270" x2="276.0" y2="270.0" stroke="#34454e" stroke-width="2" style="stroke:rgb(52, 69, 78);stroke-width:2px;"/><polygon points="282,270 272.8,273.9 272.8,266.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/><text x="296" y="276" font-family="Source Sans 3,Arial" font-size="18" font-weight="700" fill="#7a4b00" text-anchor="start" style="fill:rgb(122, 75, 0);font-size:18px;font-weight:700;display:block;" data-l="1">FADH₂</text><text x="40" y="296" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#3b5274" text-anchor="start" style="fill:rgb(59, 82, 116);font-size:12px;display:block;" data-l="1">oxidized form</text><text x="296" y="296" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#7a4b00" text-anchor="start" style="fill:rgb(122, 75, 0);font-size:12px;display:block;" data-l="1">reduced form</text></g><g data-term="redox" style=""><rect x="540" y="176" width="200" height="130" rx="6" fill="#f3f0e6" stroke="#c9b98a" style="fill:rgb(243, 240, 230);stroke:rgb(201, 185, 138);"/><text x="640" y="200" font-family="Source Sans 3,Arial" font-size="16" font-weight="700" fill="#7a5aa8" text-anchor="middle" style="fill:rgb(122, 90, 168);font-size:16px;font-weight:700;text-anchor:middle;display:block;" data-l="1">OIL RIG</text><text x="640" y="220" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#1c2830" text-anchor="middle" style="fill:rgb(28, 40, 48);font-size:13px;text-anchor:middle;display:block;" data-l="1">Oxidation Is Loss</text><text x="640" y="236" font-family="Source Sans 3,Arial" font-size="13" font-weight="400" fill="#1c2830" text-anchor="middle" style="fill:rgb(28, 40, 48);font-size:13px;text-anchor:middle;display:block;" data-l="1">Reduction Is Gain</text><text x="640" y="264" font-family="Source Sans 3,Arial" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle" style="fill:rgb(192, 57, 43);font-size:14px;font-weight:700;text-anchor:middle;display:block;" data-l="1">LEO the lion says GER</text><text x="640" y="282" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#1c2830" text-anchor="middle" style="fill:rgb(28, 40, 48);font-size:12px;text-anchor:middle;display:block;" data-l="1">Loss of Electrons: Oxidation</text><text x="640" y="298" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#1c2830" text-anchor="middle" style="fill:rgb(28, 40, 48);font-size:12px;text-anchor:middle;display:block;" data-l="1">Gain of Electrons: Reduction</text></g><g data-term="final-acceptor" style=""><text x="40" y="350" font-family="Source Sans 3,Arial" font-size="13.5" font-weight="600" fill="#1c2830" text-anchor="start" style="fill:rgb(28, 40, 48);font-size:13.5px;font-weight:600;display:block;" data-l="1">Original electron donor: glucose.   Final electron acceptor: O₂ (reduced to H₂O).</text></g></svg>