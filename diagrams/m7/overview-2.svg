<svg viewBox="0 0 760 340" role="img" aria-label="Overview: carbohydrate catabolism makes ATP by substrate-level phosphorylation and by oxidative phosphorylation" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;fill-opacity:1;stroke-opacity:1;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;font-weight:400;font-style:normal;text-anchor:start;letter-spacing:normal;visibility:visible;paint-order:normal;" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="340" fill="#fff" style="fill:rgb(255, 255, 255);"/><g data-term="cellular-respiration" style=""><rect x="40" y="40" width="140" height="40" rx="7" fill="#efe8f8" stroke="#7a5aa8" stroke-width="1.6" style="fill:rgb(239, 232, 248);stroke:rgb(122, 90, 168);stroke-width:1.6px;"/><text x="110" y="64.68" font-family="Source Sans 3,Arial" font-size="13" font-weight="600" fill="#7a5aa8" text-anchor="middle" style="fill:rgb(122, 90, 168);font-size:13px;font-weight:600;text-anchor:middle;display:block;" data-l="1">Carbohydrate</text></g><g data-term="catabolic" style=""><line x1="186" y1="60" x2="344.0" y2="60.0" stroke="#34454e" stroke-width="2.2" style="stroke:rgb(52, 69, 78);stroke-width:2.2px;"/><polygon points="350,60 340.8,63.9 340.8,56.1" fill="#34454e" style="fill:rgb(52, 69, 78);"/><text x="268" y="50" font-family="Source Sans 3,Arial" font-size="13" font-weight="600" fill="#1c2830" text-anchor="middle" style="fill:rgb(28, 40, 48);font-size:13px;font-weight:600;text-anchor:middle;display:block;" data-l="1">Catabolism</text></g><g data-term="redox" style=""><rect x="366" y="49" width="44" height="22" rx="11" fill="#eef1f3" stroke="#6b7a83" stroke-width="1.3" style="fill:rgb(238, 241, 243);stroke:rgb(107, 122, 131);stroke-width:1.3px;"/><text x="388" y="64.5" font-family="Source Sans 3,Arial" font-size="12" font-weight="700" fill="#3d4b53" text-anchor="middle" style="fill:rgb(61, 75, 83);font-size:12px;font-weight:700;text-anch