Source Sans 3,Arial" font-size="12" font-weight="700" fill="#5a4300" text-anchor="middle" style="fill:rgb(90, 67, 0);font-size:12px;font-weight:700;text-anchor:middle;display:block;" data-l="1">ATP</text></g><text x="20" y="332" font-family="Source Sans 3,Arial" font-size="12" font-weight="400" fill="#3b4a52" text-anchor="start" font-style="italic" style="fill:rgb(59, 74, 82);font-size:12px;font-style:italic;display:block;" data-l="1">A small amount of ATP comes from substrate-level phosphorylation; the majority comes from oxidative phosphorylation.</text></svg>