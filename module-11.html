<!DOCTYPE html>
<html lang="en" data-module="m11">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Replication and division | BIOL 130 Module 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,650;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#edeaed; --paper:#ffffff; --ink:#1c2830; --ink2:#4b5b64; --rule:#cbd5d7;
  --head:#23282e; --accent:#7a3f8f; --accentInk:#ffffff; --accentSoft:#ece4ef;
  --ok:#2a7648; --okSoft:#e2f2e7; --bad:#a53838; --badSoft:#f7e4e2;
  --plate:#ffffff; --plateRule:#c3cdd0; --cap:#3b4a52; --chip:#f1f5f5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
    --head:#e8eeea; --accent:#b695c1; --accentInk:#120915; --accentSoft:#271d32;
    --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
    --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
  }
}
:root[data-theme="dark"]{
  --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
  --head:#e8eeea; --accent:#b695c1; --accentInk:#120915; --accentSoft:#271d32;
  --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
  --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--head);font-weight:650;line-height:1.2;margin:0}
p{margin:0 0 .8em}
sup{font-size:.7em;line-height:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-size:1.45rem;color:var(--head);font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--rule);background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* figure plates */
.plate{background:var(--plate);border:1px solid var(--plateRule);border-radius:4px;padding:10px 10px 8px;margin:0;position:relative}
.plate svg,.plate canvas{display:block;width:100%;height:auto}
.plate figcaption{font-family:var(--serif);font-size:.93rem;color:#3b4a52;padding:8px 4px 2px;line-height:1.4}
.plate figcaption b{font-weight:650;color:#7a3f8f}
.plate .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.mini{font-size:.82rem;padding:4px 9px;border-radius:5px;border:1px solid #c3cdd0;background:#fff;color:#1c2830;cursor:pointer}
.mini:hover{background:#eef4f4}
.mini[aria-pressed="true"]{background:#7a3f8f;color:#fff;border-color:#7a3f8f}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:2.3rem;letter-spacing:-.015em;margin-bottom:12px}
.lede{font-size:1.08rem;color:var(--ink);max-width:36em}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.chlist{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chitem{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.chitem:hover{border-color:var(--accent)}
.chnum{font-family:var(--serif);font-size:1.6rem;color:var(--accent);grid-row:span 2;line-height:1}
.chitem h3{font-size:1.1rem}
.chitem .meta{grid-column:2;color:var(--ink2);font-size:.88rem}
.done-tag{color:var(--ok);font-weight:600}
.sect{margin-top:34px}
.sect h2{font-size:1.35rem;margin-bottom:6px}

/* chapter */
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb h1{font-size:1.6rem}
.crumb .back{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.steps{display:flex;gap:4px;flex:1;min-width:160px;max-width:420px;margin-left:auto}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--head)}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide>.panel{max-width:860px}
.stage.wide>.panel:has(.pad){max-width:none}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.kicker{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--accent);background:var(--accentSoft);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.bad{border-color:var(--bad);background:var(--badSoft)}
.fb > b:first-child{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.explored{font-size:.9rem;color:var(--ink2);margin-top:6px}
.termlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tl{border:1px solid var(--rule);background:var(--chip);border-radius:14px;padding:3px 10px;font-size:.86rem;cursor:pointer}
.tl:hover{border-color:var(--accent)}
.tl.inl{background:none;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;color:var(--accent);padding:0 1px!important;font-weight:600}
.tl.inl:hover{background:var(--accentSoft)}
.tl.seen{border-color:var(--accent);color:var(--accent)}

/* order + sort */
.order{display:grid;gap:8px;margin:10px 0}
.pool .card,.slot{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;background:var(--paper);line-height:1.35}
.pool{display:grid;gap:8px;margin:10px 0}
.pool .card{border-style:solid;cursor:pointer;text-align:left}
.pool .card:hover{border-color:var(--accent)}
.pool .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .n{font-family:var(--serif);color:var(--accent);font-weight:650;min-width:1.2em}
.slot.filled{border-style:solid;cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--okSoft)}
.slot.wrong{border-color:var(--bad);background:var(--badSoft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bin{border:1px solid var(--rule);border-radius:6px;padding:8px;min-height:90px;background:var(--chip);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.92rem;font-family:var(--sans);color:var(--head)}
.bin .card{display:block;width:100%;font-size:.88rem;padding:5px 8px;margin-bottom:5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);text-align:left;cursor:pointer}
.bin .card.right{border-color:var(--ok);background:var(--okSoft)}
.bin .card.wrong{border-color:var(--bad);background:var(--badSoft)}
.bin:hover{border-color:var(--accent)}

/* controls in sims */
.ctl{display:grid;gap:10px;margin:10px 0}
.ctl label{font-weight:600;font-size:.92rem;display:block;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 10px;background:var(--paper);border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:.9rem;min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink2)}
.meter{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}

/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}
.tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tok.used{opacity:.4}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}

/* term card */
.termcard{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,40,.18);padding:16px 18px;z-index:50;display:none;max-height:70vh;overflow:auto}
.termcard.show{display:block}
.termcard h3{font-size:1.2rem;margin-bottom:6px;padding-right:28px}
.termcard .x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--ink2);line-height:1;padding:4px 8px}
.termcard .rel{font-size:.86rem;color:var(--ink2);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:#2a2e35;color:#fff;font-size:.82rem;padding:4px 8px;border-radius:4px;z-index:60;display:none;white-space:nowrap}

/* svg hotspots */
[data-term]{cursor:pointer}
[data-term]:hover > .hl, [data-term]:focus > .hl{stroke:#7a3f8f;stroke-width:3}
[data-term]:focus{outline:none}
[data-term].hit > .hl{stroke:#7a3f8f}
[data-term]:hover{filter:brightness(1.06)}
.lbl{font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;fill:#1c2830}
.lbl.sm{font-size:11.5px}
.lbl.it{font-style:italic;fill:#3b4a52}
.lead{stroke:#5b6b73;stroke-width:1;fill:none}
.labels-off .lbls{display:none}

/* checkpoint */
.idcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.idcard .hd{background:var(--head);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
:root[data-theme="dark"] .idcard .hd{color:#0f171b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idcard .hd{color:#0f171b}}
.idcard .hd b{font-family:var(--serif);font-size:1.25rem}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:12px 14px}
.idcard dt{color:var(--ink2);font-size:.9rem}
.idcard dd{margin:0;font-weight:600}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.gate{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:var(--paper);cursor:pointer;text-align:left;font-size:.92rem;line-height:1.3}
.gate:hover:not([disabled]){border-color:var(--accent)}
.gate small{display:block;color:var(--ink2);font-size:.8rem;margin-top:2px}
.gate.right{border-color:var(--ok);background:var(--okSoft)}
.gate.wrong{border-color:var(--bad);background:var(--badSoft)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* glossary */
.gl{columns:2 360px;column-gap:28px}
.gl section{break-inside:avoid;margin-bottom:22px}
.gl h2{font-size:1.2rem;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.gi b{font-weight:700}
.gi p{grid-column:1 / -1;margin:0;color:var(--ink2);font-size:.94rem}
.st{font-size:.78rem;border-radius:10px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.st.tested{border-color:var(--ok);color:var(--ok)}
.st.seen{border-color:var(--accent);color:var(--accent)}

/* atlas */
.atlas{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:24px;align-items:start}
.atlas svg{touch-action:manipulation}
.quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accentSoft);border-radius:6px;padding:10px 14px;margin-bottom:12px}

.summary{max-width:720px}
.big{font-family:var(--serif);font-size:3rem;color:var(--accent);line-height:1}
.foot{margin-top:40px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}


/* course-notes styling */
.banner{display:flex;align-items:stretch;margin:0 0 16px;min-height:44px}
.banner .num{background:#5c2f6b;color:#fff;font-family:var(--serif);font-weight:650;font-size:1.25rem;padding:8px 16px;display:flex;align-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.18);position:relative;z-index:1}
.banner .ttl{flex:1;background:#8a569c;color:#fff;display:flex;align-items:center;padding:6px 18px;font-variant:small-caps;letter-spacing:.04em;font-weight:700;font-size:1.15rem;margin-left:-2px}
.banner .pg{background:#8a569c;color:#ffffff;display:flex;align-items:center;padding:0 14px;font-size:.85rem;white-space:nowrap}
.remember{display:flex;gap:12px;align-items:flex-start;background:#e4ebf2;border-radius:4px;padding:10px 14px;margin:10px 0;color:#1c2830;box-shadow:1px 1px 0 rgba(0,0,0,.08)}
.remember .key{flex:none;width:28px;height:28px}
.remember b{display:block;font-family:var(--serif)}
.dyk{background:#f2ecf4;border-left:4px solid #7a3f8f;border-radius:0 4px 4px 0;padding:10px 14px;margin:10px 0;font-style:italic;color:#2a1c18}
.dyk b{font-style:normal}
.notes-ref{font-size:.85rem;color:var(--ink2);margin:4px 0 10px}
.notes-ref b{color:var(--accent)}
.homelink{color:var(--ink2);font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;margin-right:4px}
.homelink:hover{color:var(--accent);border-color:var(--accent)}
.seqrow{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.seqrow .end{font-weight:700;color:var(--ink2);min-width:26px;text-align:center}
.nt{width:30px;height:34px;border:1px solid var(--rule);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;background:var(--paper);color:var(--ink)}
.nt.A{background:#8e6cc4;color:#fff;border-color:#6a4e9b}.nt.G{background:#dd5f45;color:#fff;border-color:#b0452f}
.nt.T{background:#3a9a9a;color:#fff;border-color:#2a7676}.nt.C{background:#f0cf4f;color:#3a2e00;border-color:#c9a92c}
.nt.U{background:#86b851;color:#fff;border-color:#618f33}
.nt.slot{border-style:dashed;cursor:pointer}.nt.slot.cur{box-shadow:0 0 0 2px var(--accent)}
.nt.ok{outline:2px solid var(--ok)}.nt.no{outline:2px solid var(--bad)}
.pad{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pad button{width:46px;height:42px;border-radius:6px;border:1px solid var(--rule);font-weight:700;font-size:1.05rem;cursor:pointer}
.pad button.A{background:#8e6cc4;color:#fff}.pad button.G{background:#dd5f45;color:#fff}.pad button.T{background:#3a9a9a;color:#fff}.pad button.C{background:#f0cf4f;color:#3a2e00}.pad button.U{background:#86b851;color:#fff}
.pad button.del{width:auto;padding:0 12px;background:var(--paper);font-size:.9rem}

@media (max-width: 880px){
  body{font-size:16px}
  .hero,.stage,.atlas{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:1.8rem}
  .topin{padding:8px 14px;gap:8px}
  .tabs{margin-left:0;width:100%}
  .tab{padding:5px 9px;font-size:.92rem}
  .brand span{display:none}
  .wrap{padding:16px 12px 60px}
  .steps{max-width:none;min-width:100%;order:3}
  .termcard{right:0;left:0;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px){.banner{flex-wrap:wrap}.banner .pg{flex-basis:100%;padding:4px 14px 6px;white-space:normal}}
/* Module 11: the viewer has many views, so let its buttons size to their labels instead of clipping */
.atlas .seg button{flex:1 1 auto;min-width:0;white-space:nowrap;padding:7px 9px}
@media (max-width:640px){.atlas .seg button{font-size:.82rem;padding:6px 7px}}

</style>

<body>
<header class="top"><div class="topin">
  <button class="brand" id="home" aria-label="Module 11 home"><b>DNA Replication and Cell Division</b><span>BIOL 130, Module 11</span></button>
  <nav class="tabs" aria-label="Sections">
    <a class="homelink" id="hubLink" href="index.html" target="_top">All modules</a>
    <button class="tab" data-go="story">Chapters</button>
    <button class="tab" data-go="atlas">Cell cycle viewer</button>
    <button class="tab" data-go="checkpoint">Replication desk</button>
    <button class="tab" data-go="exam">Mini exam</button>
    <button class="tab" data-go="glossary">Glossary</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<div class="tip" id="tip"></div>
<script src="studydata.js"></script>
<script src="srs.js"></script>

<script>
"use strict";
/* ============ storage ============ */
const KEY = "biol130-m11-progress-v1";
let P = { ch:{}, terms:{}, cp:{best:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
function markTerm(k, level){
  const order = {seen:1, tested:2};
  const cur = P.terms[k];
  if (!cur || order[level] > order[cur]) { P.terms[k] = level; save(); }
}
/* ============ glossary data (p = course notes page) ============ */
const T = {
 "cell-division":{n:"Cell division",g:"Cell division",p:"159",d:"How a cell makes more cells. It happens for cell growth, cell replacement, cell healing and cell reproduction. Each daughter cell must receive all of the parent's genetic material, and the parent must be big enough that each daughter gets enough cytoplasm."},

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let activeLoops = [];
function loop(fn){ let on = true, last = performance.now(); const tick = t => { if(!on) return; const dt = Math.min(0.05,(t-last)/1000); last = t; fn(dt,t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); const s = {stop(){on=false;}}; activeLoops.push(s); return s; }
function stopLoops(){ activeLoops.forEach(l=>l.stop()); activeLoops = []; }
function plate(svgOrEl, caption){
  const f = h("figure",{class:"plate"});
  if (typeof svgOrEl === "string") f.insertAdjacentHTML("beforeend", svgOrEl); else f.append(svgOrEl);
  if (caption) f.append(h("figcaption",{html:caption}));
  return f;
}

function lab(text, term, tx, ty, px, py, anchor="start", cls="lbl"){
  const lines = text.split("\n");
  const t = lines.map((l,i)=>`<tspan x="${tx}" dy="${i?14:0}">${l}</tspan>`).join("");
  const cw = cls.includes("sm")?5.7:6.4, wdt = Math.max(...lines.map(l=>l.length))*cw, hgt=(lines.length-1)*14;
  const x0 = anchor==="end"?tx-wdt: anchor==="middle"?tx-wdt/2 : tx, x1 = x0+wdt;
  let lx, ly=ty-4;
  if (px!=null && px>=x0-6 && px<=x1+6){ lx=Math.max(x0,Math.min(x1,px)); ly = py>ty ? ty+hgt+5 : ty-15; }
  else if (px!=null && px<x0) lx=x0-4; else lx=x1+4;
  const lead = (px!=null) ? `<line class="lead" x1="${lx}" y1="${ly}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2" fill="#5b6b73"/>` : "";
  return `<g ${term?`data-term="${term}"`:""}>${lead}<text class="${cls}" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text></g>`;
}

function arrow(x1,y1,x2,y2,col="#34454e",w=2.2,dash=""){
  const a=Math.atan2(y2-y1,x2-x1), L=10;
  const p1=[x2-L*Math.cos(a-0.4),y2-L*Math.sin(a-0.4)], p2=[x2-L*Math.cos(a+0.4),y2-L*Math.sin(a+0.4)];
  return `<line x1="${x1}" y1="${y1}" x2="${(x2-6*Math.cos(a)).toFixed(1)}" y2="${(y2-6*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
}

function fissionCell(k,x,y,sc=1){

  const loopD=(cx,cy,rx,ry,c,term)=>`<g data-term="${term||"chromosome"}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${c}" stroke-width="${3*sc}"/></g>`;
  const pin=(px,py)=>`<rect x="${px-2*sc}" y="${py-4*sc}" width="${4*sc}" height="${8*sc}" fill="#d8463c"/>`;
  if(k<=2){ s+=cap(x,y,w,hh)+loopD(x,y+2*sc,26*sc,16*sc,DC.old)+pin(x,y-hh/2+1);
    if(k===2) s+=`<path d="M${x-14*sc} ${y-12*sc} q14 ${10*sc} ${28*sc} 0" fill="none" stroke="${DC.neu}" stroke-width="${3*sc}"/>`; }
  if(k===3){ s+=cap(x,y,w,hh)+loopD(x-6*sc,y+2*sc,24*sc,15*sc,DC.old)+`<g data-term="dna-replication"><ellipse cx="${x+8*sc}" cy="${y+2*sc}" rx="${24*sc}" ry="${15*sc}" fill="none" stroke="${DC.neu}" stroke-width="${3*sc}"/></g>`+pin(x-5*sc,y-hh/2+1)+pin(x+5*sc,y-hh/2+1); }
  if(k===4){ s+=cap(x,y,w,hh)+loopD(x-34*sc,y+2*sc,26*sc,16*sc,DC.old)+`<g data-term="dna-replication"><ellipse cx="${x+34*sc}" cy="${y+2*sc}" rx="${26*sc}" ry="${16*sc}" fill="none" stroke="${DC.neu}" stroke-width="${3*sc}"/></g>`+pin(x-34*sc,y-hh/2+1)+pin(x+34*sc,y-hh/2+1); }
  if(k===5){ const p=`M${x-70*sc} ${y} a${25*sc} ${25*sc} 0 0 1 ${25*sc} ${-25*sc} h${36*sc} q${9*sc} ${10*sc} ${18*sc} 0 h${36*sc} a${25*sc} ${25*sc} 0 0 1 0 ${50*sc} h${-36*sc} q${-9*sc} ${-10*sc} ${-18*sc} 0 h${-36*sc} a${25*sc} ${25*sc} 0 0 1 ${-25*sc} ${-25*sc} Z`;
    s+=`<g data-term="binary-fission"><path d="${p}" fill="${DC.cyto}" stroke="#b8951c" stroke-width="${8*sc}" stroke-opacity=".75"/><path d="${p}" fill="${DC.cyto}" stroke="${DC.cytoS}" stroke-width="1.5"/></g>`+loopD(x-34*sc,y+2*sc,24*sc,15*sc,DC.old)+`<ellipse cx="${x+34*sc}" cy="${y+2*sc}" rx="${24*sc}" ry="${15*sc}" fill="none" stroke="${DC.neu}" stroke-width="${3*sc}"/>`+pin(x-34*sc,y-25*sc+1)+pin(x+34*sc,y-25*sc+1); }
  if(k===6){ s+=`<g data-term="daughter-cell">${cap(x-44*sc,y,74*sc,hh)}${cap(x+44*sc,y,74*sc,hh)}</g>`+loopD(x-44*sc,y+2*sc,24*sc,15*sc,DC.old)+`<ellipse cx="${x+44*sc}" cy="${y+2*sc}" rx="${24*sc}" ry="${15*sc}" fill="none" stroke="${DC.neu}" stroke-width="${3*sc}"/>`+pin(x-44*sc,y-hh/2+1)+pin(x+44*sc,y-hh/2+1); }

  const colX=[90,330,580];
  G.forEach((ms,g)=>{ const x=colX[g]; s+=tx(x+50,30,g===0?"Parent molecule":`After round ${g}`,{a:"middle",w:700});
    ms.forEach((m,i)=>{ const n=ms.length, y=70+(i+0.5)*(270/n)-20, hh=Math.min(40,270/n-14);
      s+=`<g data-term="${m.includes("O")&&m.includes("N")?"semiconservative":m[0]==="O"?"template-strand":"daughter-strand"}">`;

  return s;
}

/* ============ origins: circular vs linear (notes Figs 11.13, 11.14) ============ */
function figOrigins(mode="both",t=0.45){
  const W=760,H=mode==="both"?330:300; let s=svgOpen(W,H,"Replication from one origin on a circular chromosome and from many origins on a linear chromosome");
  const circ=(cx,cy,R,tt)=>{ let g=`<g data-term="chromosome"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${DC.old}" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="${R-10}" fill="none" stroke="${DC.old}" stroke-width="5"/></g>`;
    const sweep=Math.min(180,tt*180); if(sweep>0){ g+=`<g data-term="replication-bubble"><path d="${arcLine(cx,cy,R-24,-90-sweep,-90+sweep)}" fill="none" stroke="${DC.neu}" stroke-width="5"/><path d="${arcLine(cx,cy,R+12,-90-sweep,-90+sweep)}" fill="none" stroke="${DC.neu}" stroke-width="5"/></g>`;
      if(sweep<180) [-90-sweep,-90+sweep].forEach(a=>{ const [x,y]=arcPt(cx,cy,R-5,a); g+=`<g data-term="replication-fork"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${DC.hel}" stroke="${DC.helS}"/></g>`; }); }
    g+=`<g data-term="origin"><rect x="${cx-3}" y="${cy-R-12}" width="6" height="24" fill="#d8463c"/></g>`; return g; };
  const lin=(x0,x1,y,tt,origins)=>{ let g=`<g data-term="chromosome">${ln(x0,y-6,x1,y-6,DC.old,5)}${ln(x0,y+6,x1,y+6,DC.old,5)}</g>`; const reach=tt*(x1-x0)/(origins.length*2)*1.15;
    const spans=origins.map(o=>[Math.max(x0,o-reach),Math.min(x1,o+reach)]); const merged=[]; spans.forEach(sp=>{ if(merged.length && sp[0]<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],sp[1]); else merged.push([...sp]); });
    merged.forEach(([a,b])=>{ if(b-a<2) return; g+=`<g data-term="replication-bubble"><path d="M${a} ${y-6} C${a+14} ${y-30} ${b-14} ${y-30} ${b} ${y-6}" fill="none" stroke="${DC.old}" stroke-width="5"/><path d="M${a} ${y+6} C${a+14} ${y+30} ${b-14} ${y+30} ${b} ${y+6}" fill="none" stroke="${DC.old}" stroke-width="5"/><path d="M${a+8} ${y-12} C${a+18} ${y-22} ${b-18} ${y-22} ${b-8} ${y-12}" fill="none" stroke="${DC.neu}" stroke-width="4"/><path d="M${a+8} ${y+12} C${a+18} ${y+22} ${b-18} ${y+22} ${b-8} ${y+12}" fill="none" stroke="${DC.neu}" stroke-width="4"/></g>`;
      [a,b].forEach(x=>{ if(x>x0+1 && x<x1-1) g+=`<g data-term="replication-fork"><circle cx="${x}" cy="${y}" r="6" fill="${DC.hel}" stroke="${DC.helS}"/></g>`; }); });
    origins.forEach(o=>g+=`<g data-term="origin"><rect x="${o-2}" y="${y-14}" width="4" height="28" fill="#d8463c"/></g>`); return {g,forks:merged.reduce((n,[a,b])=>n+(a>x0+1?1:0)+(b<x1-1?1:0),0),bubbles:merged.length}; };
  if(mode==="both"||mode==="circ"){ const cx=mode==="both"?150:380; s+=tx(cx,28,"Circular (bacteria, mitochondria, chloroplasts)",{a:"middle",w:700})+circ(cx,170,100,t);
    s+=`<g class="lbls">${lab("Single origin","origin",cx+40,52,cx+2,74)}${t>0&&t<1?(()=>{ const [fx,fy]=arcPt(cx,170,95,-90-Math.min(180,t*180)); return lab("Two forks move in\nopposite directions","replication-fork",cx-130,300,fx,fy); })():""}</g>`; }
  if(mode==="both"||mode==="lin"){ const x0=mode==="both"?330:40, x1=W-20, y=mode==="both"?170:150; const OR=mode==="both"?[x0+70,x0+200,x0+330]:[x0+90,x0+260,x0+430,x0+600], L=lin(x0,x1,y,t,OR); s+=tx((x0+x1)/2,28,"Linear (eukaryotes)",{a:"middle",w:700})+L.g;
    s+=`<g class="lbls">${lab("Many origins of replication","origin",x0+20,80,OR[0],y-14)}${t>0&&t<1?lab("Each bubble: two forks\nmoving apart","replication-bubble",x0+180,260,OR[1],y+22):""}</g>`; s+=`<!--forks:${L.forks} bubbles:${L.bubbles}-->`; }
  s+=`</svg>`; return s;
}

/* ============ chromosome glyphs ============ */
const CHR={A:{L:50,c:"#2c5aa0"},a:{L:50,c:"#7db6e6"},B:{L:32,c:"#2c5aa0"},b:{L:32,c:"#7db6e6"}};
function chrX(x,y,L,c,ang=0,w=8){ // duplicated chromosome: two sister chromatids joined at the centromere
  const d=w*0.66; return `<g transform="rotate(${ang} ${x} ${y})"><path d="M${x-d} ${y-L/2} Q${x-d*0.05} ${y} ${x-d} ${y+L/2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x+d} ${y-L/2} Q${x+d*0.05} ${y} ${x+d} ${y+L/2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${w*0.42}" fill="#1c2830" opacity=".55"/></g>`; }
function chrI(x,y,L,c,ang=0,w=8){ // unreplicated chromosome (one chromatid)
  return `<g transform="rotate(${ang} ${x} ${y})"><line x1="${x}" y1="${y-L/2}" x2="${x}" y2="${y+L/2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${w*0.42}" fill="#1c2830" opacity=".55"/></g>`; }

function figHost(step, api, svg){

  api.plateHost.innerHTML=""; api.plateHost.append(f);

    const seen = new Set();

    exploreHook = k=>{ if(step.terms.includes(k)){ seen.add(k); upd(); } };

  },
  mcq(step, api){

      });

      }
      draw();
      const why = misses.filter(m=>m.why).map(m=>`<li>${m.t}: ${m.why}</li>`).join("");
      fb.append(h("div",{class:"fb bad",html:`<b>${misses.length} in the wrong box.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""} Move the red ones and check again.`}));
    });
    draw();
    api.panel.append(poolBox, binBox, h("div",{class:"row"},check), fb); api.lock();
  },
  custom(step, api){ step.render(api, step); }
};

const CHAPTERS = [
{ id:"div", title:"Why and how cells divide", pages:"pp. 159–161", blurb:"Reasons for division, the two requirements, binary fission in prokaryotes, and how eukaryotic division differs.",
  terms:["cell-division","parent-cell","daughter-cell","binary-fission","chromosome"],
  wrap:"Prokaryotes split by binary fission: copy the circular chromosome, grow, pinch in two. Eukaryotes have a large, linear genome locked in a nucleus, so they need the cell cycle. Next: the cell cycle.",

   text:`<p>Your notes ask: how can a cell make more cells? Answer: by [[cell-division|cell division]]. Cells divide for cell growth, cell replacement, cell healing and cell reproduction.</p><p>Division must meet two requirements:</p><ol style="margin:0 0 .8em;padding-left:20px"><li>Each of the two [[daughter-cell|daughter cells]] must receive all of the genetic material in the single [[parent-cell|parent cell]].</li><li>The parent cell must be big enough to divide in two, so each daughter gets enough cytoplasmic components.</li></ol><p>Prokaryotic cells divide by [[binary-fission|binary fission]]. Eukaryotic cells divide by mitotic cell division.</p>`,

  {type:"review", title:"Binary fission", fig:()=>figFissionStrip(), cap:"<b>Figure 1.2</b> Binary fission in prokaryotes. (Notes pp. 159–160, Figs 11.1 and 11.2)",
   text:`<p>[[binary-fission|Binary fission]] has three parts: DNA replication, an increase in cell size, and division into two daughter cells, each with one copy of the replicated parental DNA.</p><p>Proteins bind the circular [[chromosome|genome]] to the inner surface of the plasma membrane. Replication starts at one spot and travels around the circle in opposite directions. Both new DNA molecules are fixed to the membrane, and their attachment sites separate as the cell elongates. When the cell is about twice its original size and the DNA molecules are well separated, a constriction forms at the midpoint. There a new membrane and a new cell wall are made, giving two daughter cells identical to the parent.</p>`,

{ id:"semi", title:"Semiconservative replication", pages:"p. 163", blurb:"Each parental strand is a template, so every new DNA molecule is one old strand and one new strand.",
  terms:["dna-replication","semiconservative","template-strand","daughter-strand","replication-fork"],
  wrap:"Replication is semiconservative: the two parental strands separate at the replication fork and each templates a new daughter strand. Next: the enzymes that do it.",

   text:`<p>[[dna-replication|DNA replication]] is [[semiconservative|semiconservative]]. The two strands of parental DNA unwind, and each one serves as a [[template-strand|template strand]] for the synthesis of a [[daughter-strand|daughter strand]].</p><p>The strands separate at the [[replication-fork|replication fork]]. The strands are antiparallel: one runs 3′ to 5′, the other 5′ to 3′, and each new strand is antiparallel to its template.</p><p>At the end of replication each new DNA molecule consists of one strand from the original parent (old) and one newly made strand (new).</p>`,

   opts:[["One parental (old) strand and one newly synthesized strand",true," That is what semiconservative means."],["Two old strands, while the other molecule has two new strands",false," That would be conservative replication; each parental strand is used as a template."],["Short mixed pieces of old and new DNA in both strands",false," Each strand stays whole: one old, one new."],["Two new strands; the old DNA is broken down",false," The old strands are kept as templates."]], terms:["semiconservative","daughter-strand"]}

{ id:"enzymes", title:"The replication machinery", pages:"pp. 164–165", blurb:"Helicase, single-strand binding proteins, topoisomerase, primase and DNA polymerase, and what DNA polymerase needs.",
  terms:["helicase","ssb","topoisomerase","primase","dna-pol","rna-primer"],

   text:`<p>Many enzymes are needed to replicate DNA:</p><p>[[helicase|Helicase]] unwinds the parental double helix at the fork, so a single strand is available for DNA polymerase to add complementary bases.<br>[[ssb|Single-strand binding proteins]] bind the single-stranded parental regions and stop them coming back together.<br>[[topoisomerase|Topoisomerase]] works upstream of the fork and changes the supercoiled state of DNA caused by unwinding.<br>[[primase|Primase]] makes a short piece of RNA complementary to the parental strand, the [[rna-primer|RNA primer]].<br>[[dna-pol|DNA polymerase]] adds nucleotides to the growing strand.</p>`,

  {type:"review", title:"How DNA polymerase adds a nucleotide", fig:figSynthesis, cap:"<b>Figure 4.2</b> DNA synthesis. (Notes p. 165, Fig 11.7)",
   text:`<p>[[dna-pol|DNA polymerase]] needs:</p><ul style="margin:0 0 .8em;padding-left:20px"><li>the 4 deoxyribonucleotides (dATP, dTTP, dGTP, dCTP)</li><li>a DNA template</li><li>a primer strand with a 3′-OH end (an [[rna-primer|RNA primer]])</li></ul><p>An incoming nucleotide is accepted only if it base pairs correctly with the template. The 3′-OH of the growing strand attacks the high-energy phosphate bond of the incoming nucleotide, and pyrophosphate is released.</p>`+remember("Your notes underline this:"," DNA polymerase can only synthesize DNA in the 5′ to 3′ direction, the same as for transcription. Base pairing: A with T, G with C.")+`<p>Most DNA polymerases can also correct mistakes made during replication.</p>`,

  {type:"mcq", title:"What DNA polymerase can't do", q:"<p>Which statement about DNA polymerase is <em>false</em>?</p>",

{ id:"lagging", title:"Leading and lagging strands", pages:"pp. 166–168", blurb:"Continuous and discontinuous synthesis, Okazaki fragments, primers, ligase, the trombone model and proofreading.",
  terms:["leading","lagging","okazaki","rna-primer","primase","dna-ligase","trombone","proofreading"],
  wrap:"Because DNA grows only 5′ to 3′, one strand is made continuously and the other in Okazaki fragments that are primed, extended, re-filled and sealed by ligase, while proofreading fixes rare errors. Next: where replication starts.",

   text:`<p>New DNA can be elongated only at its 3′ end, so the two daughter strands are made differently.</p><p>The [[leading|leading strand]] has its 3′ end pointing toward the replication fork. It grows toward the fork and is made as one long, continuous polymer as the parent unwinds.</p><p>The [[lagging|lagging strand]] has its 3′ end pointing away from the fork. It grows away from the fork and is made in short, discontinuous pieces called [[okazaki|Okazaki fragments]]. A new piece starts at intervals as more parent DNA is unwound. Each needs an RNA primer, extension by DNA polymerase, and replacement of the primer with DNA.</p>`+remember("Why fragments?"," Okazaki fragments are a necessity because DNA synthesis goes in one direction only: 5′ to 3′."),
   terms:["leading","lagging","okazaki"]},
  {type:"custom", title:"Make the lagging strand", render:api=>simLagging(api), terms:["lagging","okazaki","primase","dna-ligase"]},

   text:`<p>Short [[rna-primer|RNA primers]] are added by an RNA polymerase called [[primase|primase]], which makes a short piece of RNA complementary to the DNA. Once the primer is made, DNA polymerase takes over and extends it with DNA nucleotides until it hits the fragment in front of it.</p><p>A different DNA polymerase removes the primer and replaces it with DNA. Then [[dna-ligase|DNA ligase]] joins the fragments, completing the sugar-phosphate backbone of the new DNA.</p>`,
   terms:["rna-primer","primase","dna-pol","dna-ligase"]},
  {type:"order", title:"One Okazaki fragment", q:"<p>Put the making of one Okazaki fragment in order.</p>",
   items:["Helicase unwinds more parental DNA at the fork","Primase lays down a short RNA primer","DNA polymerase extends the primer 5′ to 3′ until it reaches the previous fragment","A different DNA polymerase replaces the RNA primer with DNA","DNA ligase seals the sugar-phosphate backbone"], terms:["okazaki","rna-primer","dna-ligase"]},

   text:`<p>The leading and lagging strands are made at the same time. This works because one strand of the DNA loops: the [[trombone|trombone model]].</p><p>As each new primer for an Okazaki fragment is made, the lagging strand forms a loop. The loop persists until the new lagging strand reaches the previous Okazaki fragment.</p>`, terms:["trombone","lagging"]},
  {type:"custom", title:"Proofread it", render:api=>simProofread(api), terms:["proofreading","dna-pol"]},

{ id:"origins", title:"Circular and linear chromosomes", pages:"pp. 169–170", blurb:"One origin on a circular chromosome, many origins and replication bubbles on linear ones.",
  terms:["origin","replication-bubble","replication-fork","chromosome","dna-ligase"],
  wrap:"Circular chromosomes have one origin and two forks that meet on the far side. Linear eukaryotic chromosomes have many origins; bubbles grow, fuse and are sealed by ligase. Next: the problem at the very ends.",

  {type:"review", title:"One origin or many", fig:()=>figOrigins("both",0.45), cap:"<b>Figure 6.1</b> Replication of a bacterial circular chromosome and of a linear eukaryotic chromosome. (Notes pp. 169–170, Figs 11.13 and 11.14)", labelsToggle:true,
   text:`<p><b>Prokaryotic replication:</b> circular DNA, in most bacteria. Mitochondrial and chloroplast DNA replicate the same way because they are circular too. Two special features: there is a single [[origin|origin of replication]], and replication goes in both directions until the forks meet and fuse on the opposite side. That completes one round.</p><p><b>Eukaryotic replication:</b> linear DNA with multiple origins, which gives multiple [[replication-fork|replication forks]]. Each origin opens a [[replication-bubble|replication bubble]] with two forks moving in opposite directions, and each fork has a leading and a lagging strand. When two bubbles meet, [[dna-ligase|DNA ligase]] seals the gap in the sugar-phosphate backbone.</p>`,

{ id:"telo", title:"Telomeres and telomerase", pages:"pp. 170–171", blurb:"Why linear chromosomes shorten, telomere repeats, telomerase, and the Hayflick limit.",
  terms:["end-problem","telomere","telomerase","hayflick"],
  wrap:"The last lagging-strand primer leaves the 3′ end of the template uncopied, so linear chromosomes shorten each round. Telomeres buffer the loss, and telomerase rebuilds them in stem cells and germ cells. Next: how DNA is packed into chromosomes.",
  steps:[
  {type:"review", title:"The problem at the ends", fig:figEnds, cap:"<b>Figure 7.1</b> Shortening of linear DNA. (Notes p. 170, Fig 11.15)",
   text:`<p>The leading strand can be replicated all the way to the end of its template. But because the DNA is linear, there is a problem with the lagging strand: it needs enough single-stranded template to begin the next Okazaki fragment.</p><p>The final primer is added about 100 nucleotides from the 3′ end of the template. When it is removed, a section of template DNA stays unreplicated. So each time DNA is replicated, one strand is [[end-problem|shortened]], and after several cycles the DNA would be severely shortened.</p>`,
   terms:["end-problem","lagging","leading"]},
  {type:"review", title:"Telomeres and telomerase", fig:figTelomerase, cap:"<b>Figure 7.2</b> Telomerase. (Notes p. 171, Fig 11.16)",
   text:`<p>The ends of linear chromosomes are [[telomere|telomeres]]: repeated sequences whose sequence and number vary between species. In humans, 5′-TTAGGG-3′ is repeated 1500 to 3000 times at each telomere.</p><p>In some cell types, the missing nucleotides are replaced by [[telomerase|telomerase]]. Telomerase is a ribonucleoprotein (a protein-RNA complex) that carries its own RNA template, complementary to the telomere repeat. It has reverse transcriptase activity (RNA → DNA): it adds deoxyribonucleotides to the 3′-OH end of the lagging strand template. Then the lagging strand can be continued from a new RNA primer. An extra 3′ overhang remains, which can form a loop that protects the chromosome end from degradation.</p>`,
   terms:["telomere","telomerase"]},
  {type:"custom", title:"Count the divisions", render:api=>simTelomere(api), terms:["telomere","telomerase","hayflick"]},
  {type:"sort", title:"Is telomerase on?", q:"<p>Telomerase activity is cell-type specific. Sort these cells.</p>", bins:["Telomerase fully active","Telomerase inactive"],
   items:[["Stem cells",0],["Germ cells that produce eggs",0],["Germ cells that produce sperm",0],["Adult somatic cells",1],["A cell that stops dividing after about 50 divisions",1]], terms:["telomerase","hayflick"]},
  {type:"mcq", title:"What kind of enzyme?", q:"<p>Which description of telomerase is correct?</p>",
   opts:[["A ribonucleoprotein with reverse transcriptase activity: it makes DNA from its own RNA template",true,""],["A DNA polymerase that needs a primer from primase to add repeats",false," Telomerase carries its own RNA template; it extends the existing 3′ end."],["An RNA polymerase that makes the telomere repeats in RNA",false," It makes DNA: RNA → DNA."],["A nuclease that trims the 3′ overhang",false," It lengthens the 3′ end."]], terms:["telomerase"]}
  ]},

{ id:"pack", title:"Packaging DNA into chromosomes", pages:"p. 172", blurb:"Chromatin, six levels of condensation, haploid and diploid, and sister chromatids.",
  terms:["chromatin","nucleosome","condensation","haploid","homologous","sister-chromatids","nonsister","centromere"],
  wrap:"DNA wraps histones and coils up to a 1400 nm chromatid. After S phase each chromosome is two sister chromatids joined at the centromere. Next: separating them in mitosis.",
  steps:[
  {type:"custom", title:"Zoom out from the double helix", render:api=>simPack(api), terms:["chromatin","nucleosome","condensation"]},
  {type:"review", title:"Homologs and sister chromatids", fig:figHomologs, cap:"<b>Figure 8.2</b> Homologous chromosomes and sister chromatids. (Notes p. 172, Fig 11.18)", labelsToggle:true,
   text:`<p>A cell with one copy of each chromosome is haploid; a cell with two copies of each is diploid ([[haploid|haploid and diploid]]). The two copies are [[homologous|homologous chromosomes]].</p><p>For division, every chromosome must be duplicated, so each daughter gets a full set. This happens in S phase. Afterwards there are two identical copies, [[sister-chromatids|sister chromatids]]. They do not separate: they stay side by side, held together at the [[centromere|centromere]]. Chromatids from the two different homologs are [[nonsister|nonsister chromatids]].</p><p>Chromosomes are hard to see in interphase because they are not condensed.</p>`,
   terms:["homologous","sister-chromatids","nonsister","centromere"]},
  {type:"mcq", title:"Two copies", q:"<p>A cell has two copies of each chromosome. What is it called?</p>",
   opts:[["Diploid",true," One copy of each would be haploid."],["Haploid",false," Haploid means one copy of each chromosome."],["A sister chromatid",false," Sister chromatids are copies made in S phase, joined at the centromere."],["Condensed",false," Condensation describes packing, not copy number."]], terms:["haploid"]},
  {type:"mcq", title:"Counting chromatids", q:"<p>A diploid cell has 4 chromosomes (2 homologous pairs) in G₁. How many chromatids does it have in G₂?</p>",
   opts:[["8",true," S phase copies every chromosome, so each of the 4 is now 2 sister chromatids."],["4",false," That's G₁, before S phase."],["2",false," That's the number of homologous pairs."],["16",false," Each chromosome is copied once, not twice."]], terms:["sister-chromatids","s-phase"]},
  {type:"sort", title:"Sister or nonsister?", fig:figHomologs, cap:"<b>Figure 8.2</b> One homologous pair after S phase.", q:"<p>In the figure, which description fits each pair of chromatids?</p>", bins:["Sister chromatids","Nonsister chromatids"],
   items:[["Two dark blue chromatids joined at one centromere",0],["Identical copies made in S phase",0],["One dark blue and one light blue chromatid",1],["One chromatid from each homolog",1]], terms:["sister-chromatids","nonsister"]}
  ]},

   terms:["prophase","prometaphase","metaphase","anaphase","telophase"]},

/* ============ Run and stop the cell cycle (notes p. 162) ============ */
function phaseAt(a){ a=((a+117)%360+360)%360-117; if(a<-63) return "M"; if(a<70) return "G1"; if(a<200) return "S"; return "G2"; }

function cycleCellSVG(ph,frac){ // little cell beside the wheel: size and chromosome copies

  else { s+=`<circle cx="0" cy="0" r="44" fill="${DC.nuc}" stroke="${DC.nucS}" stroke-width="2"/>`;
    const dup=ph==="G2"||(ph==="S"&&frac>0.5); s+=(dup?chrX(-14,0,40,"#2c5aa0")+chrX(14,0,40,"#7db6e6"):chrI(-12,0,40,"#2c5aa0")+chrI(12,0,40,"#7db6e6")); }
  s+=`</g>`+tx(610,388,ph==="M"?"Dividing":ph==="S"?(frac>0.5?"DNA being copied: now 2 chromatids each":"DNA being copied"):ph==="G2"?"Each chromosome: 2 sister chromatids":ph==="G0"?"Not dividing":"Growing; 1 copy of each chromosome",{a:"middle",sm:1});

function simCycle(api){

    svgEl=f.querySelector("svg"); dot=svgEl.querySelector("#cycdot"); cellBox=svgEl.querySelector("#cyccell"); }

  const stopB=h("button",{class:"btn"},"Stop here"), g0B=h("button",{class:"btn ghost"},"Exit to G₀"), backB=h("button",{class:"btn ghost",style:"display:none"},"Back into G₁");

/* ============ router ============ */
function go(view){
  stopLoops(); exploreHook=null; RUN=null; tc.classList.remove("show"); tip.style.display="none";
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go===view)));
  if(view==="atlas") atlasView(); else if(view==="checkpoint") checkpointView(); else if(view==="glossary") glossaryView(); else if(view==="exam") examView(); else homeView();
  window.scrollTo(0,0);
}
$$(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.go)));
$("#home").addEventListener("click",()=>go("story"));
function fromHash(){
  const m=location.hash.match(/^#ch=(\d+)/);
  if(m && CHAPTERS[+m[1]-1]){ RUN=null; renderChapter(+m[1]-1,0); return true; }
  if(location.hash==="#exam"){ go("exam"); return true; }
  return false;
}
window.addEventListener("hashchange",fromHash);
if(!fromHash()) go("story");
</script>
<script src="modes.js"></script>
</body></html>
