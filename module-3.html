<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cell Border Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,650;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eaf0ef; --paper:#ffffff; --ink:#1c2830; --ink2:#4b5b64; --rule:#cbd5d7;
  --head:#153d55; --accent:#11707b; --accentInk:#ffffff; --accentSoft:#dcefef;
  --ok:#2a7648; --okSoft:#e2f2e7; --bad:#a53838; --badSoft:#f7e4e2;
  --plate:#ffffff; --plateRule:#c3cdd0; --cap:#3b4a52; --chip:#f1f5f5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
    --head:#bfe1ea; --accent:#4db2be; --accentInk:#0b191d; --accentSoft:#1b3940;
    --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
    --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
  }
}
:root[data-theme="dark"]{
  --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
  --head:#bfe1ea; --accent:#4db2be; --accentInk:#0b191d; --accentSoft:#1b3940;
  --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
  --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--head);font-weight:650;line-height:1.2;margin:0}
p{margin:0 0 .8em}
sup{font-size:.7em;line-height:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-size:1.45rem;color:var(--head);font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--rule);background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* figure plates */
.plate{background:var(--plate);border:1px solid var(--plateRule);border-radius:4px;padding:10px 10px 8px;margin:0;position:relative}
.plate svg,.plate canvas{display:block;width:100%;height:auto}
.plate figcaption{font-family:var(--serif);font-size:.93rem;color:#3b4a52;padding:8px 4px 2px;line-height:1.4}
.plate figcaption b{font-weight:650;color:#153d55}
.plate .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.mini{font-size:.82rem;padding:4px 9px;border-radius:5px;border:1px solid #c3cdd0;background:#fff;color:#1c2830;cursor:pointer}
.mini:hover{background:#eef4f4}
.mini[aria-pressed="true"]{background:#11707b;color:#fff;border-color:#11707b}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:2.3rem;letter-spacing:-.015em;margin-bottom:12px}
.lede{font-size:1.08rem;color:var(--ink);max-width:36em}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.chlist{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chitem{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.chitem:hover{border-color:var(--accent)}
.chnum{font-family:var(--serif);font-size:1.6rem;color:var(--accent);grid-row:span 2;line-height:1}
.chitem h3{font-size:1.1rem}
.chitem .meta{grid-column:2;color:var(--ink2);font-size:.88rem}
.done-tag{color:var(--ok);font-weight:600}
.sect{margin-top:34px}
.sect h2{font-size:1.35rem;margin-bottom:6px}

/* chapter */
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb h1{font-size:1.6rem}
.crumb .back{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.steps{display:flex;gap:4px;flex:1;min-width:160px;max-width:420px;margin-left:auto}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--head)}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide>.panel{max-width:860px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.kicker{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--accent);background:var(--accentSoft);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.bad{border-color:var(--bad);background:var(--badSoft)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.explored{font-size:.9rem;color:var(--ink2);margin-top:6px}
.termlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tl{border:1px solid var(--rule);background:var(--chip);border-radius:14px;padding:3px 10px;font-size:.86rem;cursor:pointer}
.tl:hover{border-color:var(--accent)}
.tl.inl{background:none;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;color:var(--accent);padding:0 1px!important;font-weight:600}
.tl.inl:hover{background:var(--accentSoft)}
.tl.seen{border-color:var(--accent);color:var(--accent)}

/* order + sort */
.order{display:grid;gap:8px;margin:10px 0}
.pool .card,.slot{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;background:var(--paper);line-height:1.35}
.pool{display:grid;gap:8px;margin:10px 0}
.pool .card{border-style:solid;cursor:pointer;text-align:left}
.pool .card:hover{border-color:var(--accent)}
.pool .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .n{font-family:var(--serif);color:var(--accent);font-weight:650;min-width:1.2em}
.slot.filled{border-style:solid;cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--okSoft)}
.slot.wrong{border-color:var(--bad);background:var(--badSoft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bin{border:1px solid var(--rule);border-radius:6px;padding:8px;min-height:90px;background:var(--chip);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.92rem;font-family:var(--sans);color:var(--head)}
.bin .card{display:block;width:100%;font-size:.88rem;padding:5px 8px;margin-bottom:5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);text-align:left;cursor:pointer}
.bin .card.right{border-color:var(--ok);background:var(--okSoft)}
.bin .card.wrong{border-color:var(--bad);background:var(--badSoft)}
.bin:hover{border-color:var(--accent)}

/* controls in sims */
.ctl{display:grid;gap:10px;margin:10px 0}
.ctl label{font-weight:600;font-size:.92rem;display:block;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 10px;background:var(--paper);border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:.9rem;min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink2)}
.meter{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}

/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}
.tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tok.used{opacity:.4}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}

/* term card */
.termcard{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,40,.18);padding:16px 18px;z-index:50;display:none;max-height:70vh;overflow:auto}
.termcard.show{display:block}
.termcard h3{font-size:1.2rem;margin-bottom:6px;padding-right:28px}
.termcard .x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--ink2);line-height:1;padding:4px 8px}
.termcard .rel{font-size:.86rem;color:var(--ink2);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:#153d55;color:#fff;font-size:.82rem;padding:4px 8px;border-radius:4px;z-index:60;display:none;white-space:nowrap}

/* svg hotspots */
[data-term]{cursor:pointer}
[data-term]:hover > .hl, [data-term]:focus > .hl{stroke:#11707b;stroke-width:3}
[data-term]:focus{outline:none}
[data-term].hit > .hl{stroke:#11707b}
.lbl{font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;fill:#1c2830}
.lbl.sm{font-size:11.5px}
.lbl.it{font-style:italic;fill:#3b4a52}
.lead{stroke:#5b6b73;stroke-width:1;fill:none}
.labels-off .lbls{display:none}

/* checkpoint */
.idcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.idcard .hd{background:var(--head);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
:root[data-theme="dark"] .idcard .hd{color:#0f171b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idcard .hd{color:#0f171b}}
.idcard .hd b{font-family:var(--serif);font-size:1.25rem}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:12px 14px}
.idcard dt{color:var(--ink2);font-size:.9rem}
.idcard dd{margin:0;font-weight:600}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.gate{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:var(--paper);cursor:pointer;text-align:left;font-size:.92rem;line-height:1.3}
.gate:hover:not([disabled]){border-color:var(--accent)}
.gate small{display:block;color:var(--ink2);font-size:.8rem;margin-top:2px}
.gate.right{border-color:var(--ok);background:var(--okSoft)}
.gate.wrong{border-color:var(--bad);background:var(--badSoft)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* glossary */
.gl{columns:2 360px;column-gap:28px}
.gl section{break-inside:avoid;margin-bottom:22px}
.gl h2{font-size:1.2rem;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.gi b{font-weight:700}
.gi p{grid-column:1 / -1;margin:0;color:var(--ink2);font-size:.94rem}
.st{font-size:.78rem;border-radius:10px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.st.tested{border-color:var(--ok);color:var(--ok)}
.st.seen{border-color:var(--accent);color:var(--accent)}

/* atlas */
.atlas{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:24px;align-items:start}
.atlas svg{touch-action:manipulation}
.quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accentSoft);border-radius:6px;padding:10px 14px;margin-bottom:12px}

.summary{max-width:720px}
.big{font-family:var(--serif);font-size:3rem;color:var(--accent);line-height:1}
.foot{margin-top:40px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}

@media (max-width: 880px){
  body{font-size:16px}
  .hero,.stage,.atlas{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:1.8rem}
  .topin{padding:8px 14px;gap:8px}
  .tabs{margin-left:0;width:100%}
  .tab{padding:5px 9px;font-size:.92rem}
  .brand span{display:none}
  .wrap{padding:16px 12px 60px}
  .steps{max-width:none;min-width:100%;order:3}
  .termcard{right:0;left:0;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="brand" id="home" aria-label="Cell Border Control home"><b>Cell Border Control</b><span>Membrane transport in an animal cell</span></button>
  <nav class="tabs" aria-label="Sections">
    <a id="hubLink" href="index.html" target="_top" style="color:var(--ink2);font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;margin-right:4px">All modules</a>
    <button class="tab" data-go="story">Story</button>
    <button class="tab" data-go="atlas">Cell atlas</button>
    <button class="tab" data-go="checkpoint">Checkpoint</button>
    <button class="tab" data-go="glossary">Glossary</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<aside class="termcard" id="termcard" role="dialog" aria-live="polite"><button class="x" aria-label="Close">×</button><div id="tcbody"></div></aside>
<div class="tip" id="tip"></div>
<script>
"use strict";
/* ============ storage ============ */
const KEY = "cbc-progress-v1";
let P = { ch:{}, terms:{}, cp:{best:0, seen:0, right:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
function markTerm(k, level){
  const order = {seen:1, tested:2};
  const cur = P.terms[k];
  if (!cur || order[level] > order[cur]) { P.terms[k] = level; save(); }
}

/* ============ glossary data ============ */
const T = {
 "plasma-membrane":{n:"Plasma membrane",g:"Membrane structure",d:"The phospholipid bilayer and its proteins that surround the cell. It decides what gets in and out."},
 "phospholipid":{n:"Phospholipid",g:"Membrane structure",d:"A lipid with a hydrophilic (water-attracting) phosphate head and two hydrophobic fatty acid tails. In water, phospholipids line up into a bilayer with heads facing the water on both sides and tails tucked inside."},
 "fatty-acid-tails":{n:"Fatty acid tails",g:"Membrane structure",d:"The two long hydrocarbon chains of each phospholipid. They are nonpolar, so together they form the oily core of the membrane. That core is what blocks ions and most polar molecules. A kink in an unsaturated tail stops lipids packing tightly and keeps the membrane fluid."},
 "hydrophilic-head":{n:"Hydrophilic head",g:"Membrane structure",d:"The polar phosphate end of a phospholipid. Heads face the watery fluid outside the cell and the cytosol inside."},
 "bilayer":{n:"Phospholipid bilayer",g:"Membrane structure",d:"Two layers of phospholipids, tails pointing inward. The hydrophobic middle is the barrier; proteins set in it are the gates."},
 "fluid-mosaic":{n:"Fluid mosaic model",g:"Membrane structure",d:"The current model of membrane structure. Fluid: lipids and many proteins move sideways within their layer. Mosaic: the membrane is a patchwork of lipids, proteins, cholesterol and carbohydrates."},
 "selective-permeability":{n:"Selective permeability",g:"Membrane structure",d:"The membrane lets some substances through and stops others. Small nonpolar molecules cross the bilayer easily. Water crosses slowly on its own. Ions and large polar molecules need a protein."},
 "cholesterol":{n:"Cholesterol",g:"Membrane structure",d:"A lipid tucked between phospholipids in animal cell membranes. It buffers fluidity: it stops the membrane getting too runny when warm and too stiff when cold."},
 "integral-protein":{n:"Integral membrane protein",g:"Membrane structure",d:"A protein set into the membrane, held there by hydrophobic regions that sit among the fatty acid tails. It can only be removed by breaking the bilayer apart (for example with detergent). Most integral proteins are transmembrane."},
 "transmembrane-protein":{n:"Transmembrane protein",g:"Membrane structure",d:"An integral membrane protein that spans the whole bilayer, with parts on both sides. Every channel and carrier protein is transmembrane, because it has to connect the two sides."},
 "peripheral-protein":{n:"Peripheral membrane protein",g:"Membrane structure",d:"A protein that sits on the surface of the membrane, attached by weak bonds to lipid heads or to integral proteins. It never enters the hydrophobic core, so it can be washed off without breaking the membrane."},
 "glycoprotein":{n:"Glycoprotein",g:"Membrane structure",d:"A membrane protein with a carbohydrate chain attached on the outside surface. Used for cell to cell recognition."},
 "glycolipid":{n:"Glycolipid",g:"Membrane structure",d:"A membrane lipid with a carbohydrate chain attached, facing outside the cell."},
 "cytoskeleton":{n:"Cytoskeleton",g:"Parts of the cell",d:"A network of protein filaments (microtubules, actin filaments, intermediate filaments). It gives the cell its shape, anchors organelles and some membrane proteins, and acts as tracks for vesicles."},
 "cytoplasm":{n:"Cytoplasm",g:"Parts of the cell",d:"Everything inside the plasma membrane except the nucleus: the cytosol plus all the organelles in it."},
 "cytosol":{n:"Cytosol",g:"Parts of the cell",d:"The fluid part of the cytoplasm, outside the organelles. Water with dissolved ions, sugars and proteins. Many reactions, including the first stage of breaking down glucose, happen here."},
 "nucleus":{n:"Nucleus",g:"Parts of the cell",d:"Holds the cell's DNA. Surrounded by the nuclear envelope, a double membrane that is continuous with the ER."},
 "nucleolus":{n:"Nucleolus",g:"Parts of the cell",d:"A dense region inside the nucleus where ribosomal RNA is made and ribosome subunits are put together. It has no membrane around it."},
 "nuclear-pores":{n:"Nuclear pores",g:"Parts of the cell",d:"Protein-lined openings through the nuclear envelope. mRNA and ribosome subunits leave through them; proteins the nucleus needs come in through them."},
 "ribosome":{n:"Ribosome",g:"Parts of the cell",d:"Makes proteins. Free ribosomes in the cytosol make proteins that stay in the cytosol. Ribosomes on the rough ER make proteins bound for membranes, for secretion, or for the endomembrane system."},
 "er":{n:"Endoplasmic reticulum",g:"Parts of the cell",d:"A network of membrane sacs and tubes continuous with the nuclear envelope. Rough ER has ribosomes and makes membrane and secreted proteins. Smooth ER has no ribosomes and makes lipids and breaks down toxins."},
 "golgi":{n:"Golgi apparatus",g:"Parts of the cell",d:"Stacks of flattened membrane sacs. Receives proteins and lipids from the ER, modifies them (for example by adding sugar chains), sorts them and ships them out in vesicles."},
 "lysosome":{n:"Lysosome",g:"Parts of the cell",d:"A membrane sac full of digestive enzymes that work at acidic pH. Breaks down material brought in by endocytosis and worn-out parts of the cell."},
 "vesicle":{n:"Vesicle",g:"Parts of the cell",d:"A small membrane sac that carries cargo between compartments, or to and from the plasma membrane."},
 "endomembrane":{n:"Endomembrane system",g:"Parts of the cell",d:"The connected set of membranes that make, modify and move proteins and lipids: nuclear envelope, ER, Golgi, lysosomes, vesicles and the plasma membrane. Parts are linked directly or by vesicles. Mitochondria and chloroplasts are not part of it."},
 "vacuole":{n:"Vacuole",g:"Parts of the cell",d:"A membrane sac used for storage. Animal cells have small vacuoles. Plant cells usually have one large central vacuole that stores water and presses outward to keep the cell firm."},
 "mitochondria":{n:"Mitochondria",g:"Parts of the cell",d:"Double-membrane organelles that make most of the cell's ATP by cellular respiration. The inner membrane folds into cristae, which adds surface area. They have their own DNA and ribosomes. Found in both animal and plant cells."},
 "chloroplast":{n:"Chloroplast",g:"Parts of the cell",d:"A double-membrane organelle in plants and algae where photosynthesis happens. Inside are stacks of thylakoids (grana). A chloroplast is one type of plastid. Animal cells do not have them."},
 "plastid":{n:"Plastid",g:"Parts of the cell",d:"A family of plant organelles with a double membrane and their own DNA. Chloroplasts do photosynthesis, amyloplasts store starch, chromoplasts hold pigments. Not found in animal cells."},
 "cell-wall":{n:"Cell wall",g:"Parts of the cell",d:"A rigid layer outside the plasma membrane of plant cells, made mostly of cellulose. It resists swelling, so a plant cell in a hypotonic solution becomes firm instead of bursting. Animal cells do not have one."},
 "diffusion":{n:"Diffusion",g:"Passive transport",d:"Net movement of a substance from where it is more concentrated to where it is less concentrated, caused by random motion of molecules. It continues until the concentrations even out."},
 "simple-diffusion":{n:"Simple diffusion",g:"Passive transport",d:"Diffusion straight through the phospholipid bilayer, with no protein. Works for small nonpolar molecules such as O₂, CO₂ and steroid hormones."},
 "facilitated-diffusion":{n:"Facilitated diffusion",g:"Passive transport",d:"Diffusion through a membrane protein, either a channel or a carrier. Still passive: the substance moves down its gradient and no energy is spent."},
 "passive-transport":{n:"Passive transport",g:"Passive transport",d:"Movement across a membrane down a concentration or electrochemical gradient, with no energy spent by the cell. Includes simple diffusion, facilitated diffusion and osmosis."},
 "channel":{n:"Channel protein",g:"Passive transport",d:"A transmembrane protein that forms a water-filled pore. Specific ions or water flow through it quickly, down their gradient. Many channels are gated: they open or close in response to a signal."},
 "carrier":{n:"Carrier protein",g:"Passive transport",d:"A transmembrane protein that binds its cargo, changes shape, and releases it on the other side. Slower than a channel, and it can be saturated: once every carrier is busy, adding more cargo does not speed things up."},
 "aquaporin":{n:"Aquaporin",g:"Passive transport",d:"A channel protein for water. Most water that crosses a membrane goes through aquaporins."},
 "concentration-gradient":{n:"Concentration gradient",g:"Active transport",d:"A difference in concentration of a substance between two places. Substances diffuse down their gradient (high to low) on their own; moving them up the gradient takes energy."},
 "osmosis":{n:"Osmosis",g:"Water and tonicity",d:"Diffusion of water across a selectively permeable membrane. Water moves from the side with lower solute concentration (more free water) to the side with higher solute concentration."},
 "osmotic-pressure":{n:"Osmotic pressure",g:"Water and tonicity",d:"The pressure that would be needed to stop water moving into a solution by osmosis. The more solute a solution has, the higher its osmotic pressure and the harder it pulls water in."},
 "isotonic":{n:"Isotonic",g:"Water and tonicity",d:"The outside solution has the same solute concentration as the cell. Water moves both ways equally, so there is no net change in volume."},
 "hypotonic":{n:"Hypotonic",g:"Water and tonicity",d:"The outside solution has a lower solute concentration than the cell. Water moves in. An animal cell swells and can burst (lysis)."},
 "hypertonic":{n:"Hypertonic",g:"Water and tonicity",d:"The outside solution has a higher solute concentration than the cell. Water moves out. An animal cell shrinks and shrivels (crenation)."},
 "active-transport":{n:"Active transport",g:"Active transport",d:"Movement across a membrane against a gradient. It needs an energy source: ATP directly (primary) or another gradient (secondary)."},
 "primary-active":{n:"Primary active transport",g:"Active transport",d:"Active transport powered directly by ATP. The protein splits ATP and uses that energy to change shape and push cargo against its gradient. The Na⁺/K⁺ pump is the main example."},
 "nak-pump":{n:"Na⁺/K⁺ pump (Na⁺/K⁺-ATPase)",g:"Active transport",d:"A transmembrane protein that uses ATP to move Na⁺ out of the cell and K⁺ into it, both against their gradients. It moves three Na⁺ out for every two K⁺ in, which also helps keep the inside of the cell negative. The Na⁺ gradient it builds powers secondary active transport."},
 "membrane-potential":{n:"Membrane potential",g:"Active transport",d:"The voltage across the plasma membrane. The inside of an animal cell is negative compared with the outside."},
 "electrochemical-gradient":{n:"Electrochemical gradient",g:"Active transport",d:"The total push on an ion across a membrane: its concentration gradient plus the pull from the charge difference across the membrane. For Na⁺, both push it into the cell. For K⁺, concentration pushes it out while the negative inside pulls it back."},
 "importer":{n:"Importer",g:"Active transport",d:"A transporter that moves its cargo into the cell. The Na⁺/K⁺ pump imports K⁺."},
 "exporter":{n:"Exporter",g:"Active transport",d:"A transporter that moves its cargo out of the cell. The Na⁺/K⁺ pump exports Na⁺."},
 "secondary-active":{n:"Secondary active transport",g:"Co-transport",d:"Active transport powered by a gradient that a primary pump already built. One substance (usually Na⁺) flows down its gradient and that energy drags a second substance up its gradient. No ATP is used by this protein directly, but if the pump stops, this stops too."},
 "cotransport":{n:"Co-transport",g:"Co-transport",d:"Two substances moved by the same protein at the same time. Symport and antiport are the two kinds."},
 "uniporter":{n:"Uniporter",g:"Co-transport",d:"A carrier that moves one kind of substance in one direction. The glucose transporter (GLUT) is a uniporter."},
 "symporter":{n:"Symporter",g:"Co-transport",d:"A carrier that moves two substances in the same direction. The Na⁺/glucose symporter brings Na⁺ and glucose into the cell together."},
 "antiporter":{n:"Antiporter",g:"Co-transport",d:"A carrier that moves two substances in opposite directions. The Na⁺/H⁺ exchanger brings Na⁺ in and sends H⁺ out."},
 "sglt":{n:"Na⁺/glucose symporter (SGLT)",g:"Co-transport",d:"The apical carrier that brings glucose into gut lining cells against its gradient, powered by Na⁺ flowing in down its electrochemical gradient. Secondary active transport."},
 "glut":{n:"Glucose transporter (GLUT)",g:"Co-transport",d:"A uniporter carrier for glucose. On the basolateral side of a gut lining cell it lets glucose leave by facilitated diffusion, down its gradient into the interstitial fluid."},
 "apical":{n:"Apical membrane",g:"The gut lining",d:"The part of an epithelial cell's plasma membrane that faces the lumen (the gut contents). In gut lining cells it is folded into microvilli."},
 "basolateral":{n:"Basolateral membrane",g:"The gut lining",d:"The sides and base of an epithelial cell, facing neighbouring cells and the interstitial fluid, toward the blood. It carries a different set of transport proteins from the apical side."},
 "tight-junction":{n:"Tight junction",g:"The gut lining",d:"A seal between neighbouring epithelial cells near the apical surface. It stops gut contents leaking between cells and keeps apical and basolateral proteins from mixing."},
 "microvilli":{n:"Microvilli",g:"The gut lining",d:"Finger-like folds of the apical membrane. They increase the surface area for absorption."},
 "lumen":{n:"Gut lumen",g:"The gut lining",d:"The space inside the small intestine, where digested food is."},
 "interstitial-fluid":{n:"Interstitial fluid",g:"The gut lining",d:"The fluid that fills the space between cells in a tissue. Glucose leaving the basolateral side of a gut lining cell enters the interstitial fluid first, then diffuses into a capillary."},
 "capillary":{n:"Capillary",g:"The gut lining",d:"The smallest blood vessel. Its thin wall lets glucose, O₂ and CO₂ pass between blood and interstitial fluid."},
 "atp":{n:"ATP",g:"Active transport",d:"Adenosine triphosphate, the cell's energy currency. Splitting off a phosphate releases energy that pumps use. Most ATP is made in mitochondria."},
 "bulk-transport":{n:"Bulk transport",g:"Bulk transport",d:"Moving large particles, or a lot of material at once, into or out of the cell inside membrane vesicles. It needs energy."},
 "exocytosis":{n:"Exocytosis",g:"Bulk transport",d:"A vesicle fuses with the plasma membrane and releases its contents outside. It also adds the vesicle's membrane and proteins to the plasma membrane, which is how new transporters arrive."},
 "endocytosis":{n:"Endocytosis",g:"Bulk transport",d:"The plasma membrane folds inward and pinches off a vesicle, bringing material in. Three kinds: phagocytosis, pinocytosis and receptor-mediated endocytosis."},
 "phagocytosis":{n:"Phagocytosis",g:"Bulk transport",d:"Cell eating. The cell reaches around a large particle such as a bacterium with pseudopodia and engulfs it in a phagosome. The phagosome then fuses with a lysosome, which digests it."},
 "pinocytosis":{n:"Pinocytosis",g:"Bulk transport",d:"Cell drinking. The cell takes in small droplets of extracellular fluid, with whatever is dissolved in it, in small vesicles. Not selective."},
 "rme":{n:"Receptor-mediated endocytosis",g:"Bulk transport",d:"Selective endocytosis. Specific molecules (ligands) bind receptors clustered in coated pits. The pit, lined with clathrin on the inside, pinches off as a coated vesicle. Cells take in LDL (a cholesterol carrier) this way."}
};

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let activeLoops = [];
function loop(fn){ let on = true, last = performance.now(); const tick = t => { if(!on) return; const dt = Math.min(0.05,(t-last)/1000); last = t; fn(dt,t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); const s = {stop(){on=false;}}; activeLoops.push(s); return s; }
function stopLoops(){ activeLoops.forEach(l=>l.stop()); activeLoops = []; }
function plate(svgOrEl, caption){
  const f = h("figure",{class:"plate"});
  if (typeof svgOrEl === "string") f.insertAdjacentHTML("beforeend", svgOrEl); else f.append(svgOrEl);
  if (caption) f.append(h("figcaption",{html:caption}));
  return f;
}

function bindTerms(root, onPick){

function lab(text, term, tx, ty, px, py, anchor="start", cls="lbl"){
  const lines = text.split("\n");
  const t = lines.map((l,i)=>`<tspan x="${tx}" dy="${i?14:0}">${l}</tspan>`).join("");
  const cw = cls.includes("sm")?5.7:6.4, wdt = Math.max(...lines.map(l=>l.length))*cw;
  let lx = anchor==="end" ? tx+4 : anchor==="middle" ? tx : (px!=null && px>tx+wdt ? tx+wdt+4 : tx-4);
  if (anchor==="end" && px!=null && px<tx-wdt) lx = tx-wdt-4;
  const lead = (px!=null) ? `<line class="lead" x1="${lx}" y1="${ty-4}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2" fill="#5b6b73"/>` : "";
  return `<g ${term?`data-term="${term}"`:""}>${lead}<text class="${cls}" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text></g>`;
}
/* bilayer: y = centre of top heads. spans y-7 .. y+79 */
function bilayer(x0,x1,y,skips=[],s=15){
  const L=28, yb=y+72; let out="";
  const skip=(x,leaf)=>skips.some(k=>x>k[0]&&x<k[1]&&(k[2]==="both"||!k[2]||k[2]===leaf));
  let i=0;
  for(let x=x0;x<=x1;x+=s,i++){
    if(!skip(x,"top")){
      out+=`<path d="M${x-3} ${y+6} v${L}" stroke="${C.tail}" stroke-width="2" fill="none"/>`;
      out+= (i%3===1) ? `<path d="M${x+3} ${y+6} v12 l4 6 v${L-18}" stroke="${C.tail}" stroke-width="2" fill="none"/>` : `<path d="M${x+3} ${y+6} v${L}" stroke="${C.tail}" stroke-width="2" fill="none"/>`;
      out+=`<circle cx="${x}" cy="${y}" r="6.5" fill="${C.head}" stroke="${C.headS}" stroke-width="1"/>`;
    }
    if(!skip(x,"bot")){
      out+=`<path d="M${x-3} ${yb-6} v${-L}" stroke="${C.tail}" stroke-width="2" fill="none"/>`;
      out+= (i%3===2) ? `<path d="M${x+3} ${yb-6} v-12 l4 -6 v${-(L-18)}" stroke="${C.tail}" stroke-width="2" fill="none"/>` : `<path d="M${x+3} ${yb-6} v${-L}" stroke="${C.tail}" stroke-width="2" fill="none"/>`;
      out+=`<circle cx="${x}" cy="${yb}" r="6.5" fill="${C.head}" stroke="${C.headS}" stroke-width="1"/>`;
    }
  }
  return out;
}

function animateTissue(svgRoot){
  const layer = svgRoot.querySelector("#gluLayer"); if(!layer) return;
  const mkPath = pts => { const seg=[]; let total=0; for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(d); total+=d; }
    return u => { let d=u*total; for(let i=0;i<seg.length;i++){ if(d<=seg[i]){ const f=d/seg[i]; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f]; } d-=seg[i]; } return pts[pts.length-1]; }; };
  // glucose: in through the symporter, out through GLUT, into the capillary
  const gPath = mkPath([[294,30],[294,100],[294,127],[285,160],[258,215],[256,300],[262,322],[262,352],[272,410],[520,412],[860,412]]);
  // Na+: in with glucose through the symporter, out through the pump
  const nPath = mkPath([[314,44],[314,100],[308,127],[330,170],[370,240],[374,300],[376,322],[380,356]]);
  // K+: in through the pump
  const kPath = mkPath([[398,372],[386,340],[382,322],[390,280],[396,240]]);
  const items=[];
  const add=(html,path,n,speed,fade)=>{ for(let i=0;i<n;i++){ const g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.innerHTML=html; layer.append(g); items.push({g,u:i/n,path,speed,fade}); } };
  add(hex(0,0,8),gPath,6,0.045,false);
  add(ionSVG("na",0,0,7),nPath,4,0.07,true);
  add(ionSVG("k",0,0,7),kPath,3,0.11,true);
  let st=""; [[80,50],[150,80],[470,40],[560,75],[700,60],[230,30],[760,95]].forEach(p=>st+=hex(p[0],p[1],7));
  [[120,40],[520,90],[640,30],[200,85]].forEach(p=>st+=ionSVG("na",p[0],p[1],7));
  layer.insertAdjacentHTML("afterbegin", st);
  const place=it=>{ const p=it.path(it.u); it.g.setAttribute("transform",`translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`); it.g.setAttribute("opacity", it.fade ? Math.min(1,(1-it.u)*5).toFixed(2) : 1); };
  if(reduceMotion){ items.forEach(place); return; }
  loop(dt=>{ items.forEach(it=>{ it.u=(it.u+dt*it.speed)%1; place(it); }); });
}

/* ============ story engine ============ */
let RUN = null; // {id, first:{}}
function chState(id){ return P.ch[id] || (P.ch[id] = {done:false, best:null, last:null}); }
function recordFirst(stepIdx, correct, terms){
  if (!RUN) return;
  if (!(stepIdx in RUN.first)) RUN.first[stepIdx] = !!correct;
  (terms||[]).forEach(k=>markTerm(k,"tested"));
}
function runScore(){ const v=Object.values(RUN.first); return {right:v.filter(Boolean).length, total:v.length}; }

function renderChapter(ci, si=0){
  stopLoops(); exploreHook=null; window.scrollTo(0,0);
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go==="story")));
  const ch = CHAPTERS[ci];
  if (!RUN || RUN.id !== ch.id) RUN = {id:ch.id, first:{}};
  const app = $("#app"); app.innerHTML = "";
  const bar = h("div",{class:"steps","aria-hidden":"true"});
  ch.steps.forEach((_,i)=>bar.append(h("i",{class:i<si?"on":i===si?"cur":""})));
  app.append(h("div",{class:"crumb"},
    h("button",{class:"back",onclick:()=>go("story")},"All chapters"),
    h("h1",{},`Chapter ${ci+1}: ${ch.title}`), bar));
  const step = ch.steps[si];
  const stage = h("div",{class:"stage"+(step.wide?" wide":"")});
  const plateHost = h("div"), panel = h("div",{class:"panel"});
  stage.append(plateHost, panel); app.append(stage);
  const next = h("button",{class:"btn",onclick:()=>{ if(si+1<ch.steps.length) renderChapter(ci,si+1); else finishChapter(ci); }}, si+1<ch.steps.length?"Continue":"Finish chapter");
  const back = h("button",{class:"btn ghost",onclick:()=>{ if(si>0) renderChapter(ci,si-1); else go("story"); }}, si>0?"Back":"All chapters");
  const api = {
    ci, si, panel, plateHost, next,
    lock(){ next.disabled = true; }, unlock(){ next.disabled = false; },
    grade(ok, terms){ recordFirst(si, ok, terms||step.terms); },
    gradeKey(key, ok, terms){ recordFirst(si+'.'+key, ok, terms); },
  };
  (STEP_TYPES[step.type])(step, api);
  panel.append(h("div",{class:"nav"}, back, next));
  bindTerms(app); bindRich(app);
  tc.classList.remove("show");
}
function finishChapter(ci){
  stopLoops(); window.scrollTo(0,0);
  const ch = CHAPTERS[ci], sc = runScore(), st = chState(ch.id);
  const frac = sc.total ? sc.right/sc.total : 1;
  const prevBest = st.best;
  st.done = true; st.last = frac; if (st.best==null || frac>st.best) st.best = frac; save();
  const app=$("#app"); app.innerHTML="";
  const box = h("div",{class:"summary"});
  box.append(h("p",{class:"kicker"},`Chapter ${ci+1} complete`), h("h1",{style:"font-size:2rem;margin-bottom:14px"},ch.title));
  box.append(h("div",{class:"row",style:"gap:26px;margin:10px 0 18px"},
     h("div",{}, h("div",{class:"big"},`${sc.right}/${sc.total}`), h("div",{class:"muted small"},"right on the first try")),
     h("div",{}, h("div",{class:"big",style:"color:var(--head)"},Math.round((st.best||0)*100)+"%"), h("div",{class:"muted small"}, prevBest==null?"your best so far": (frac>prevBest?"new personal best":"your best"))) ));
  box.append(h("p",{},ch.wrap));
  box.append(h("p",{class:"muted small"},"Terms from this chapter. Click one to review it."), termChips(ch.terms));
  const nextBtn = ci+1<CHAPTERS.length ? h("button",{class:"btn",onclick:()=>{RUN=null; renderChapter(ci+1,0);}},`Start chapter ${ci+2}: ${CHAPTERS[ci+1].title}`) : h("button",{class:"btn",onclick:()=>go("checkpoint")},"Go to Checkpoint");
  box.append(h("div",{class:"row",style:"margin-top:16px"}, nextBtn, h("button",{class:"btn ghost",onclick:()=>{RUN=null; renderChapter(ci,0);}},"Replay chapter"), h("button",{class:"btn ghost",onclick:()=>go("story")},"All chapters")));
  app.append(box);
  RUN = null;
}

/* ---- step types ---- */
function figHost(step, api, svg){
  if (!svg) return;
  const f = plate(svg, step.cap);
  if (step.labelsToggle){
    const b = h("button",{class:"mini","aria-pressed":"true"},"Labels");
    b.addEventListener("click",()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",on?"false":"true"); f.classList.toggle("labels-off",on); });
    f.prepend(h("div",{class:"tools"},b));
  }
  api.plateHost.innerHTML=""; api.plateHost.append(f);
  if (step.onFig) step.onFig(f.querySelector("svg"));
  return f;
}
const STEP_TYPES = {
  brief(step, api){
    figHost(step, api, step.fig && step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    if (step.terms) api.panel.append(termChips(step.terms));
  },
  review(step, api){
    figHost(step, api, step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    const counter = h("p",{class:"explored"});
    const seen = new Set();
    const upd = ()=>{ counter.textContent = `Parts explored: ${seen.size} of ${step.terms.length}`; };
    exploreHook = k=>{ if(step.terms.includes(k)){ seen.add(k); upd(); } };
    upd(); api.panel.append(counter, termChips(step.terms));
  },
  mcq(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},step.kicker||"Your call"), h("h2",{},step.title));
    if (step.q) api.panel.append(h("div",{html:rich(step.q)}));
    const box = h("div",{class:"opts"}), fb = h("div");
    let solved=false, first=true;
    const opts = step.keep ? step.opts : shuffle(step.opts);
    opts.forEach(o=>{
      const b = h("button",{class:"opt"},o[0]);
      b.addEventListener("click",()=>{
        if (solved) return;
        if (first){ api.grade(o[1], step.terms); first=false; }
        fb.innerHTML="";
        if (o[1]){
          solved=true; b.classList.add("right");
          $$(".opt",box).forEach(x=>x.disabled=true);
          fb.append(h("div",{class:"fb ok",html:`<b>Correct.</b>${rich(o[2]||"")}`}));
          if (step.after) fb.append(h("div",{class:"fb",html:rich(step.after)}));
          if (step.afterFig && f){ const nf = plate(step.afterFig(), step.afterCap||step.cap); api.plateHost.innerHTML=""; api.plateHost.append(nf); bindTerms(nf); }
          api.unlock();
        } else {
          b.classList.add("wrong"); b.disabled=true;
          fb.append(h("div",{class:"fb bad",html:`<b>Not quite.</b>${rich(o[2]||"")} Try another answer.`}));
        }
        bindRich(fb);
      });
      box.append(b);
    });
    api.panel.append(box, fb); api.lock();
  },
  order(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Put these in order"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    const n = step.items.length, slots = new Array(n).fill(null);
    let pool = shuffle(step.items.map((t,i)=>({t,i})));
    let first = true;
    const slotBox = h("div",{class:"order"}), poolBox = h("div",{class:"pool"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check order");
    function draw(){
      slotBox.innerHTML=""; poolBox.innerHTML="";
      slots.forEach((s,i)=>{
        const el = h("div",{class:"slot"+(s?" filled":"")+(s&&s.mark?" "+s.mark:""),tabindex:s?"0":null,role:s?"button":null}, h("span",{class:"n"},String(i+1)), h("span",{}, s?s.t:"Click a step below to place it here"));
        if (s && !s.locked) el.addEventListener("click",()=>{ pool.push(s); slots[i]=null; delete s.mark; draw(); });
        slotBox.append(el);
      });
      pool.forEach(p=>{ const b=h("button",{class:"card"},p.t); b.addEventListener("click",()=>{ const k=slots.indexOf(null); if(k<0) return; slots[k]=p; pool=pool.filter(x=>x!==p); draw(); }); poolBox.append(b); });
      check.disabled = slots.includes(null);
    }
    check.addEventListener("click",()=>{
      let all=true;
      slots.forEach((s,i)=>{ s.mark = s.i===i?"right":"wrong"; if(s.i!==i) all=false; else s.locked=true; });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){ fb.append(h("div",{class:"fb ok",html:"<b>That's the right order.</b>"+rich(step.after||"")})); check.remove(); api.unlock(); draw(); bindRich(fb); return; }
      draw();
      fb.append(h("div",{class:"fb bad",html:"<b>Some steps are out of place.</b> The green ones are right and locked in. Click a red one to send it back, then try again."}));
    });
    draw();
    api.panel.append(slotBox, poolBox, h("div",{class:"row"},check), fb); api.lock();
  },
  sort(step, api){
    figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Sort them"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    let items = shuffle(step.items.map((it,i)=>({t:it[0],bin:it[1],why:it[2],i,at:null})));
    let sel = null, first = true;
    const poolBox = h("div",{class:"pool"}), binBox = h("div",{class:"bins"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check");
    function draw(){
      poolBox.innerHTML=""; binBox.innerHTML="";
      items.filter(x=>x.at===null).forEach(x=>{ const b=h("button",{class:"card"+(sel===x?" sel":"")},x.t); b.addEventListener("click",()=>{ sel = sel===x?null:x; draw(); }); poolBox.append(b); });
      step.bins.forEach((name,bi)=>{
        const bin = h("div",{class:"bin",tabindex:"0",role:"button","aria-label":"Place in "+name}, h("h4",{},name));
        const place = ()=>{ if(sel){ sel.at=bi; delete sel.mark; sel=null; draw(); } };
        bin.addEventListener("click",place); bin.addEventListener("keydown",e=>{ if(e.key==="Enter") place(); });
        items.filter(x=>x.at===bi).forEach(x=>{ const c=h("button",{class:"card"+(x.mark?" "+x.mark:"")},x.t); c.addEventListener("click",e=>{ e.stopPropagation(); if(sel){ place(); return; } if(x.locked) return; x.at=null; delete x.mark; draw(); }); bin.append(c); });
        binBox.append(bin);
      });
      if (!items.some(x=>x.at===null)) poolBox.append(h("p",{class:"muted small"},"All placed. Check your sort, or click a card in a box to take it back out."));
      else if (!sel) poolBox.prepend(h("p",{class:"muted small",style:"margin:0"},"Click a card, then click the box it belongs in."));
      check.disabled = items.some(x=>x.at===null);
    }
    check.addEventListener("click",()=>{
      let all=true; const misses=[];
      items.forEach(x=>{ if(x.at===x.bin){ x.mark="right"; x.locked=true; } else { x.mark="wrong"; all=false; misses.push(x); } });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){
        fb.append(h("div",{class:"fb ok",html:"<b>All sorted correctly.</b>"+rich(step.after||"")}));
        check.remove(); api.unlock(); draw(); bindRich(fb);
        if (step.onSolved) step.onSolved(api);
        return;
      }
      draw();
      const why = misses.filter(m=>m.why).map(m=>`<li>${m.t}: ${m.why}</li>`).join("");
      fb.append(h("div",{class:"fb bad",html:`<b>${misses.length} in the wrong box.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""} Move the red ones and check again.`}));
    });
    draw();
    api.panel.append(poolBox, binBox, h("div",{class:"row"},check), fb); api.lock();
  },
  custom(step, api){ step.render(api, step); }
};

/* ============ canvas helpers ============ */
function makeCanvas(W,H,label){
  const cv = h("canvas",{role:"img","aria-label":label||""}); const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); return {cv,ctx,W,H};
}
function bilayerCanvas(W,y,gaps=[]){
  const {cv,ctx}=makeCanvas(W,90); const L=28, yb=y+72, oy=y-8;
  ctx.fillStyle="#fbf8ee"; ctx.fillRect(0,0,W,90);
  ctx.translate(0,-oy);
  let i=0;
  for(let x=10;x<W;x+=15,i++){
    if(gaps.some(g=>x>g[0]&&x<g[1])) continue;
    ctx.strokeStyle=C.tail; ctx.lineWidth=2;
    [[x-3,y+6,1],[x+3,y+6,1],[x-3,yb-6,-1],[x+3,yb-6,-1]].forEach(t=>{ ctx.beginPath(); ctx.moveTo(t[0],t[1]); ctx.lineTo(t[0],t[1]+t[2]*L); ctx.stroke(); });
    ctx.fillStyle=C.head; ctx.strokeStyle=C.headS; ctx.lineWidth=1;
    [y,yb].forEach(yy=>{ ctx.beginPath(); ctx.arc(x,yy,6.5,0,7); ctx.fill(); ctx.stroke(); });
  }
  return cv;
}
function dHex(ctx,x,y,r){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/3*i+Math.PI/6; ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a)); } ctx.closePath(); ctx.fillStyle=C.glu; ctx.fill(); ctx.strokeStyle=C.gluS; ctx.lineWidth=1.2; ctx.stroke(); }
function dIon(ctx,x,y,kind,r=8){ const m={na:[C.na,"Na⁺"],k:[C.k,"K⁺"],h:[C.h,"H⁺"]}[kind]; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=m[0]; ctx.fill(); ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle="#fff"; ctx.font=`700 ${Math.round(r*0.95)}px Source Sans 3, Arial`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(m[1],x,y+0.5); }
function dO2(ctx,x,y){ ctx.fillStyle=C.o2; [-4,4].forEach(d=>{ ctx.beginPath(); ctx.arc(x+d,y,5,0,7); ctx.fill(); }); }
function dCO2(ctx,x,y){ ctx.fillStyle=C.o2; [-8,8].forEach(d=>{ ctx.beginPath(); ctx.arc(x+d,y,4.5,0,7); ctx.fill(); }); ctx.fillStyle="#555"; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill(); }
function dWater(ctx,x,y,s=1){ ctx.fillStyle=C.h2o; ctx.beginPath(); ctx.arc(x,y,4.5*s,0,7); ctx.fill(); ctx.fillStyle="#fff"; ctx.strokeStyle=C.h2o; ctx.lineWidth=1; [-1,1].forEach(d=>{ ctx.beginPath(); ctx.arc(x+d*4*s,y-3.5*s,2.3*s,0,7); ctx.fill(); ctx.stroke(); }); }
function dSteroid(ctx,x,y){ ctx.fillStyle="#d08a3a"; ctx.strokeStyle="#8a5518"; ctx.lineWidth=1; [[-9,2],[-2,-3],[5,2],[11,-2]].forEach(p=>{ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/3*i; ctx.lineTo(x+p[0]+5*Math.cos(a),y+p[1]+5*Math.sin(a)); } ctx.closePath(); ctx.fill(); ctx.stroke(); }); }
function dProtein(ctx,x,y){ ctx.fillStyle=C.prot; ctx.strokeStyle=C.protS; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(x,y,16,12,0.3,0,7); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x+10,y-6,8,7,0,0,7); ctx.fill(); ctx.stroke(); }
function label(ctx,t,x,y,opts={}){ ctx.fillStyle=opts.col||"#1c2830"; ctx.font=`${opts.it?"italic ":""}${opts.w||400} ${opts.s||13}px Source Sans 3, Arial`; ctx.textAlign=opts.a||"left"; ctx.textBaseline="alphabetic"; ctx.fillText(t,x,y); }

function permAnim(api){
  stopLoops();
  const W=820,H=380,MY=150; const {cv,ctx}=makeCanvas(W,H,"Animation: molecules meeting a membrane with no proteins");
  const mem = bilayerCanvas(W,MY);
  const lanes=[["O₂",dO2,1],["CO₂",dCO2,1],["Steroid",dSteroid,1],["Water",dWater,0.12],["Glucose",(c,x,y)=>dHex(c,x,y,8),0],["Na⁺",(c,x,y)=>dIon(c,x,y,"na"),0],["Protein",dProtein,0]];
  const lw=W/lanes.length; const P=[]; const crossed=lanes.map(()=>0);
  const spawn=li=>P.push({li,x:lw*li+lw/2+(Math.random()-.5)*lw*0.5,y:40+Math.random()*40,vy:55+Math.random()*25,state:"down",a:1});
  lanes.forEach((_,li)=>{ for(let k=0;k<3;k++){ spawn(li); P[P.length-1].y-=k*40; } });
  const f = plate(cv,"<b>Figure 2.2</b> The same bare bilayer, tested. Counts show how many of each molecule got through.");
  api.plateHost.innerHTML=""; api.plateHost.append(f);
  loop(dt=>{
    ctx.fillStyle=C.ext; ctx.fillRect(0,0,W,MY); ctx.fillStyle=C.cyt; ctx.fillRect(0,MY+72,W,H-MY-72);
    ctx.drawImage(mem,0,MY-8,W,90);
    lanes.forEach((l,li)=>{ label(ctx,l[0],lw*li+lw/2,24,{a:"center",w:700,s:16}); label(ctx,`through: ${crossed[li]}`,lw*li+lw/2,H-12,{a:"center",s:15,col:"#3b4a52"}); });
    for(let i=P.length-1;i>=0;i--){
      const p=P[i];
      if(p.state==="down"){ p.y+=p.vy*dt; if(p.y>=MY-14){ const pass=Math.random()<lanes[p.li][2]; p.state=pass?"through":"bounce"; if(!pass){ p.vy=-p.vy*0.7; } } }
      else if(p.state==="through"){ p.y+=p.vy*dt*0.8; if(p.y>MY+90&&!p.counted){ p.counted=true; crossed[p.li]++; } if(p.y>H-30){ p.a-=dt*2; } }
      else { p.y+=p.vy*dt; p.a-=dt*0.9; }
      ctx.globalAlpha=Math.max(0,p.a); lanes[p.li][1](ctx,p.x,p.y); ctx.globalAlpha=1;
      if(p.a<=0){ const li=p.li; P.splice(i,1); spawn(li); }
    }
  });
}

const TONIC = [
  {k:"distilled", name:"Distilled water", o:0, term:"hypotonic", rel:"hypotonic", f:1.5, burst:true},
  {k:"hypo", name:"Hypotonic", o:0.5, term:"hypotonic", rel:"hypotonic", f:1.22},
  {k:"iso", name:"Isotonic", o:1, term:"isotonic", rel:"isotonic", f:1},
  {k:"hyper", name:"Hypertonic", o:1.7, term:"hypertonic", rel:"hypertonic", f:0.8},

function tonicityCanvas(){

  const S = {t:TONIC[2], r:r0, burst:false, burstT:0, cross:[], outDots:[], inDots:[], acc:[0,0], netIn:0};
  for(let i=0;i<34;i++){ const a=Math.random()*6.283, d=Math.sqrt(Math.random())*0.82; S.inDots.push([a,d]); }
  function setT(t, reset){

    if(reset){ S.r=r0; S.burst=false; S.burstT=0; S.cross=[]; S.netIn=0; }
  }
  setT(TONIC[2],true);
  function step(dt){
    const t=S.t;
    if(!S.burst){
      const target = r0*t.f;
      S.r += (target - S.r)*Math.min(1,dt*0.9);
      if(t.burst && S.r>r0*1.42){ S.burst=true; }
      const freeOut=1/(1+t.o), freeIn=0.5;
      S.acc[0]+=dt*22*freeOut; S.acc[1]+=dt*22*freeIn;
      while(S.acc[0]>=1){ S.acc[0]--; S.cross.push({a:Math.random()*6.283,u:0,dir:1}); }
      while(S.acc[1]>=1){ S.acc[1]--; S.cross.push({a:Math.random()*6.283,u:0,dir:-1}); }
    } else S.burstT+=dt;
    S.cross.forEach(c=>c.u+=dt*1.5); S.cross=S.cross.filter(c=>c.u<1);
  }
  function draw(){
    ctx.fillStyle=C.ext; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#9a6a12"; S.outDots.forEach(d=>{ ctx.beginPath(); ctx.arc(d[0],d[1],3.4,0,7); ctx.fill(); });
    const t=S.t, wr = th => S.r*(1 + (t.f<0.9 && !S.burst ? 0.05*Math.sin(th*14) : 0));
    if(!S.burst){
      ctx.beginPath(); for(let i=0;i<=120;i++){ const th=i/120*6.283; ctx.lineTo(cx+wr(th)*Math.cos(th), cy+wr(th)*Math.sin(th)); } ctx.closePath();
      ctx.fillStyle=C.cyt; ctx.fill(); ctx.lineWidth=7; ctx.strokeStyle=C.head; ctx.stroke(); ctx.lineWidth=2.5; ctx.strokeStyle=C.tail; ctx.stroke();
      ctx.fillStyle="#9a6a12"; S.inDots.forEach(d=>{ ctx.beginPath(); ctx.arc(cx+d[1]*S.r*Math.cos(d[0]), cy+d[1]*S.r*Math.sin(d[0]),3.4,0,7); ctx.fill(); });
      S.cross.forEach(c=>{ const rr = S.r*(c.dir>0 ? 1.35-0.55*c.u : 0.8+0.55*c.u); ctx.globalAlpha=Math.sin(c.u*Math.PI); dWater(ctx,cx+rr*Math.cos(c.a),cy+rr*Math.sin(c.a),1.25); ctx.globalAlpha=1; });
      const net = t.o<1?1:t.o>1?-1:0;
      if(net){ ctx.strokeStyle="#1f6f9a"; ctx.fillStyle="#1f6f9a"; ctx.lineWidth=3;
        for(let i=0;i<8;i++){ const a=i/8*6.283+0.2, r1=S.r+(net>0?62:18), r2=S.r+(net>0?18:62);
