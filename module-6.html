<!DOCTYPE html>
<html lang="en" data-module="m6">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metabolism | BIOL 130 Module 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,650;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e7eeed; --paper:#ffffff; --ink:#1c2830; --ink2:#4b5b64; --rule:#cbd5d7;
  --head:#23282e; --accent:#1f7a8c; --accentInk:#ffffff; --accentSoft:#e0ecef;
  --ok:#2a7648; --okSoft:#e2f2e7; --bad:#a53838; --badSoft:#f7e4e2;
  --plate:#ffffff; --plateRule:#c3cdd0; --cap:#3b4a52; --chip:#f1f5f5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
    --head:#e8eeea; --accent:#84b6c0; --accentInk:#051215; --accentSoft:#132a32;
    --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
    --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
  }
}
:root[data-theme="dark"]{
  --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
  --head:#e8eeea; --accent:#84b6c0; --accentInk:#051215; --accentSoft:#132a32;
  --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
  --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--head);font-weight:650;line-height:1.2;margin:0}
p{margin:0 0 .8em}
sup{font-size:.7em;line-height:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-size:1.45rem;color:var(--head);font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--rule);background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* figure plates */
.plate{background:var(--plate);border:1px solid var(--plateRule);border-radius:4px;padding:10px 10px 8px;margin:0;position:relative}
.plate svg,.plate canvas{display:block;width:100%;height:auto}
.plate figcaption{font-family:var(--serif);font-size:.93rem;color:#3b4a52;padding:8px 4px 2px;line-height:1.4}
.plate figcaption b{font-weight:650;color:#1f7a8c}
.plate .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.mini{font-size:.82rem;padding:4px 9px;border-radius:5px;border:1px solid #c3cdd0;background:#fff;color:#1c2830;cursor:pointer}
.mini:hover{background:#eef4f4}
.mini[aria-pressed="true"]{background:#1f7a8c;color:#fff;border-color:#1f7a8c}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:2.3rem;letter-spacing:-.015em;margin-bottom:12px}
.lede{font-size:1.08rem;color:var(--ink);max-width:36em}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.chlist{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chitem{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.chitem:hover{border-color:var(--accent)}
.chnum{font-family:var(--serif);font-size:1.6rem;color:var(--accent);grid-row:span 2;line-height:1}
.chitem h3{font-size:1.1rem}
.chitem .meta{grid-column:2;color:var(--ink2);font-size:.88rem}
.done-tag{color:var(--ok);font-weight:600}
.sect{margin-top:34px}
.sect h2{font-size:1.35rem;margin-bottom:6px}

/* chapter */
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb h1{font-size:1.6rem}
.crumb .back{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.steps{display:flex;gap:4px;flex:1;min-width:160px;max-width:420px;margin-left:auto}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--head)}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide>.panel{max-width:860px}
.stage.wide>.panel:has(.pad){max-width:none}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.kicker{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--accent);background:var(--accentSoft);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.bad{border-color:var(--bad);background:var(--badSoft)}
.fb > b:first-child{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.explored{font-size:.9rem;color:var(--ink2);margin-top:6px}
.termlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tl{border:1px solid var(--rule);background:var(--chip);border-radius:14px;padding:3px 10px;font-size:.86rem;cursor:pointer}
.tl:hover{border-color:var(--accent)}
.tl.inl{background:none;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;color:var(--accent);padding:0 1px!important;font-weight:600}
.tl.inl:hover{background:var(--accentSoft)}
.tl.seen{border-color:var(--accent);color:var(--accent)}

/* order + sort */
.order{display:grid;gap:8px;margin:10px 0}
.pool .card,.slot{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;background:var(--paper);line-height:1.35}
.pool{display:grid;gap:8px;margin:10px 0}
.pool .card{border-style:solid;cursor:pointer;text-align:left}
.pool .card:hover{border-color:var(--accent)}
.pool .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .n{font-family:var(--serif);color:var(--accent);font-weight:650;min-width:1.2em}
.slot.filled{border-style:solid;cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--okSoft)}
.slot.wrong{border-color:var(--bad);background:var(--badSoft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bin{border:1px solid var(--rule);border-radius:6px;padding:8px;min-height:90px;background:var(--chip);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.92rem;font-family:var(--sans);color:var(--head)}
.bin .card{display:block;width:100%;font-size:.88rem;padding:5px 8px;margin-bottom:5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);text-align:left;cursor:pointer}
.bin .card.right{border-color:var(--ok);background:var(--okSoft)}
.bin .card.wrong{border-color:var(--bad);background:var(--badSoft)}
.bin:hover{border-color:var(--accent)}

/* controls in sims */
.ctl{display:grid;gap:10px;margin:10px 0}
.ctl label{font-weight:600;font-size:.92rem;display:block;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 10px;background:var(--paper);border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:.9rem;min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink2)}
.meter{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}

/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}
.tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tok.used{opacity:.4}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}

/* term card */
.termcard{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,40,.18);padding:16px 18px;z-index:50;display:none;max-height:70vh;overflow:auto}
.termcard.show{display:block}
.termcard h3{font-size:1.2rem;margin-bottom:6px;padding-right:28px}
.termcard .x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--ink2);line-height:1;padding:4px 8px}
.termcard .rel{font-size:.86rem;color:var(--ink2);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:#2a2e35;color:#fff;font-size:.82rem;padding:4px 8px;border-radius:4px;z-index:60;display:none;white-space:nowrap}

/* svg hotspots */
[data-term]{cursor:pointer}
[data-term]:hover > .hl, [data-term]:focus > .hl{stroke:#1f7a8c;stroke-width:3}
[data-term]:focus{outline:none}
[data-term].hit > .hl{stroke:#1f7a8c}
[data-term]:hover{filter:brightness(1.06)}
.lbl{font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;fill:#1c2830}
.lbl.sm{font-size:11.5px}
.lbl.it{font-style:italic;fill:#3b4a52}
.lead{stroke:#5b6b73;stroke-width:1;fill:none}
.labels-off .lbls{display:none}

/* checkpoint */
.idcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.idcard .hd{background:var(--head);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
:root[data-theme="dark"] .idcard .hd{color:#0f171b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idcard .hd{color:#0f171b}}
.idcard .hd b{font-family:var(--serif);font-size:1.25rem}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:12px 14px}
.idcard dt{color:var(--ink2);font-size:.9rem}
.idcard dd{margin:0;font-weight:600}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.gate{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:var(--paper);cursor:pointer;text-align:left;font-size:.92rem;line-height:1.3}
.gate:hover:not([disabled]){border-color:var(--accent)}
.gate small{display:block;color:var(--ink2);font-size:.8rem;margin-top:2px}
.gate.right{border-color:var(--ok);background:var(--okSoft)}
.gate.wrong{border-color:var(--bad);background:var(--badSoft)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* glossary */
.gl{columns:2 360px;column-gap:28px}
.gl section{break-inside:avoid;margin-bottom:22px}
.gl h2{font-size:1.2rem;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.gi b{font-weight:700}
.gi p{grid-column:1 / -1;margin:0;color:var(--ink2);font-size:.94rem}
.st{font-size:.78rem;border-radius:10px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.st.tested{border-color:var(--ok);color:var(--ok)}
.st.seen{border-color:var(--accent);color:var(--accent)}

/* atlas */
.atlas{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:24px;align-items:start}
.atlas svg{touch-action:manipulation}
.quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accentSoft);border-radius:6px;padding:10px 14px;margin-bottom:12px}

.summary{max-width:720px}
.big{font-family:var(--serif);font-size:3rem;color:var(--accent);line-height:1}
.foot{margin-top:40px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}


/* course-notes styling */
.banner{display:flex;align-items:stretch;margin:0 0 16px;min-height:44px}
.banner .num{background:#175c69;color:#fff;font-family:var(--serif);font-weight:650;font-size:1.25rem;padding:8px 16px;display:flex;align-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.18);position:relative;z-index:1}
.banner .ttl{flex:1;background:#3a8a9a;color:#fff;display:flex;align-items:center;padding:6px 18px;font-variant:small-caps;letter-spacing:.04em;font-weight:700;font-size:1.15rem;margin-left:-2px}
.banner .pg{background:#3a8a9a;color:#ffffff;display:flex;align-items:center;padding:0 14px;font-size:.85rem;white-space:nowrap}
.remember{display:flex;gap:12px;align-items:flex-start;background:#e4ebf2;border-radius:4px;padding:10px 14px;margin:10px 0;color:#1c2830;box-shadow:1px 1px 0 rgba(0,0,0,.08)}
.remember .key{flex:none;width:28px;height:28px}
.remember b{display:block;font-family:var(--serif)}
.dyk{background:#e9f2f4;border-left:4px solid #1f7a8c;border-radius:0 4px 4px 0;padding:10px 14px;margin:10px 0;font-style:italic;color:#2a1c18}
.dyk b{font-style:normal}
.notes-ref{font-size:.85rem;color:var(--ink2);margin:4px 0 10px}
.notes-ref b{color:var(--accent)}
.homelink{color:var(--ink2);font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;margin-right:4px}
.homelink:hover{color:var(--accent);border-color:var(--accent)}
.seqrow{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.seqrow .end{font-weight:700;color:var(--ink2);min-width:26px;text-align:center}
.nt{width:30px;height:34px;border:1px solid var(--rule);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;background:var(--paper);color:var(--ink)}
.nt.A{background:#8e6cc4;color:#fff;border-color:#6a4e9b}.nt.G{background:#dd5f45;color:#fff;border-color:#b0452f}
.nt.T{background:#3a9a9a;color:#fff;border-color:#2a7676}.nt.C{background:#f0cf4f;color:#3a2e00;border-color:#c9a92c}
.nt.U{background:#86b851;color:#fff;border-color:#618f33}
.nt.slot{border-style:dashed;cursor:pointer}.nt.slot.cur{box-shadow:0 0 0 2px var(--accent)}
.nt.ok{outline:2px solid var(--ok)}.nt.no{outline:2px solid var(--bad)}
.pad{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pad button{width:46px;height:42px;border-radius:6px;border:1px solid var(--rule);font-weight:700;font-size:1.05rem;cursor:pointer}
.pad button.A{background:#8e6cc4;color:#fff}.pad button.G{background:#dd5f45;color:#fff}.pad button.T{background:#3a9a9a;color:#fff}.pad button.C{background:#f0cf4f;color:#3a2e00}.pad button.U{background:#86b851;color:#fff}
.pad button.del{width:auto;padding:0 12px;background:var(--paper);font-size:.9rem}

@media (max-width: 880px){
  body{font-size:16px}
  .hero,.stage,.atlas{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:1.8rem}
  .topin{padding:8px 14px;gap:8px}
  .tabs{margin-left:0;width:100%}
  .tab{padding:5px 9px;font-size:.92rem}
  .brand span{display:none}
  .wrap{padding:16px 12px 60px}
  .steps{max-width:none;min-width:100%;order:3}
  .termcard{right:0;left:0;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px){.banner{flex-wrap:wrap}.banner .pg{flex-basis:100%;padding:4px 14px 6px;white-space:normal}}
</style>

<body>
<header class="top"><div class="topin">
  <button class="brand" id="home" aria-label="Module 6 home"><b>Making Life Work: Energy and Metabolism</b><span>BIOL 130, Module 6</span></button>
  <nav class="tabs" aria-label="Sections">
    <a class="homelink" id="hubLink" href="index.html" target="_top">All modules</a>
    <button class="tab" data-go="story">Chapters</button>
    <button class="tab" data-go="atlas">Energy lab</button>
    <button class="tab" data-go="checkpoint">Enzyme desk</button>
    <button class="tab" data-go="exam">Mini exam</button>
    <button class="tab" data-go="glossary">Glossary</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<div class="tip" id="tip"></div>
<script src="studydata.js"></script>
<script src="srs.js"></script>
<script src="exam.js"></script>
<script src="kip.js"></script>
<script>
"use strict";
/* ============ storage ============ */
const KEY = "biol130-m6-progress-v1";
let P = { ch:{}, terms:{}, cp:{best:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
function markTerm(k, level){
  const order = {seen:1, tested:2};
  const cur = P.terms[k];
  if (!cur || order[level] > order[cur]) { P.terms[k] = level; save(); }
}
/* ============ glossary data (p = course notes page) ============ */
const T = {
 "phototroph":{n:"Phototroph",g:"Harvesting energy",p:"90",d:"An organism that obtains energy from the sun. Plants are the most common: they use the sun's energy to convert CO₂ and water into sugar and O₂."},
 "chemotroph":{n:"Chemotroph",g:"Harvesting energy",p:"90",d:"An organism that obtains energy from chemical compounds. Animals are the most common chemotrophs: they ingest other organisms and break them down into CO₂ and water."},
 "autotroph":{n:"Autotroph",g:"Harvesting energy",p:"90",d:"An organism that can convert CO₂ into glucose, so it makes its own organic source of carbon (carbon from inorganic sources such as CO₂). Examples: plants, cyanobacteria, sulfur-oxidizing bacteria."},
 "heterotroph":{n:"Heterotroph",g:"Harvesting energy",p:"90",d:"An organism that cannot convert CO₂, so it must ingest other organisms or molecules for a source of carbon (carbon from organic compounds). Examples: animals, most bacteria."},
 "metabolism":{n:"Metabolism",g:"Metabolism",p:"91",d:"The chemical processes that occur in a living organism to maintain life. It includes building up and breaking down chemical compounds, which lets energy be harnessed or released. These reactions happen continuously in cells."},
 "pathway":{n:"Metabolic pathway",g:"Metabolism",p:"91",d:"A series of linked reactions in which the products of one reaction are the reactants of the next."},
 "anabolism":{n:"Anabolic (anabolism)",g:"Metabolism",p:"91",d:"The branch of metabolism that builds molecules from smaller units (e.g. amino acids into proteins). It requires an input of energy (ATP)."},
 "catabolism":{n:"Catabolic (catabolism)",g:"Metabolism",p:"91",d:"The branch of metabolism that breaks molecules down into smaller units (e.g. macromolecules into sugars, amino acids, fatty acids, nucleotides). It produces energy (ATP)."},
 "potential-energy":{n:"Potential energy",g:"Forms of energy",p:"91",d:"Energy that is not associated with movement but is stored, like a ball at the top of a staircase. It can be converted to other forms."},
 "kinetic-energy":{n:"Kinetic energy",g:"Forms of energy",p:"91",d:"The energy of motion, like a ball bouncing down a staircase. Energy can be converted from one form to another."},
 "chemical-energy":{n:"Chemical energy",g:"Forms of energy",p:"92",d:"The form of potential energy held in the chemical bonds between pairs of atoms in a molecule."},
 "bond-strength":{n:"Bond strength and potential energy",g:"Forms of energy",p:"92",d:"Bond strength and potential energy are linked: strong bonds hold less potential energy, weak bonds hold more."},
 "atp":{n:"Adenosine triphosphate (ATP)",g:"ATP",p:"92",d:"The energy currency of the cell: the most common chemical form of readily accessible energy. Made of adenine, a five-carbon sugar (ribose) and three phosphate groups. Its chemical energy is held in the bonds connecting the phosphate groups."},
 "adp-amp":{n:"ADP and AMP",g:"ATP",p:"92",d:"With only two phosphate groups the molecule is adenosine diphosphate (ADP); with only one it is adenosine monophosphate (AMP). Adenine plus ribose alone is adenosine."},
 "ribose":{n:"Ribose",g:"ATP",p:"92",d:"The five-carbon sugar in ATP. Adenine is attached to one carbon and the phosphate chain to another (through its CH₂)."},
 "phosphate-bonds":{n:"Bonds between phosphate groups",g:"ATP",p:"92, 95",d:"The bonds linking ATP's phosphate groups have high potential energy because they are weak. At physiological pH the phosphate groups are negatively charged and resist (repel) one another. Breaking these bonds releases the energy for the cell to do work."},
 "cellular-work":{n:"Cellular work",g:"ATP",p:"90, 92",d:"What cells use energy for: movement, growth, pumping ions and substances across membranes, vesicle movement, DNA, RNA and protein synthesis, breaking down fats and proteins, and the reactions needed for cellular function."},
 "atp-hydrolysis":{n:"ATP hydrolysis",g:"ATP",p:"95",d:"ATP + H₂O → ADP + Pᵢ (inorganic phosphate). The reaction of ATP with water is exergonic (spontaneous) and releases free energy (ΔG = −7.3 kcal/mol). ADP has two phosphate groups, so it has lower potential energy than ATP."},
 "thermodynamics":{n:"Thermodynamics",g:"Thermodynamics",p:"93",d:"The study of changes in energy that accompany events in the universe. Its concepts predict the direction events will take and whether an input of energy is required."},
 "first-law":{n:"First law of thermodynamics",g:"Thermodynamics",p:"93",d:"Energy can be neither created nor destroyed. It can be converted from one form to another, so total energy before a transformation equals total energy after."},
 "second-law":{n:"Second law of thermodynamics",g:"Thermodynamics",p:"93",d:"Events in the universe have direction: they proceed from a higher energy state to a lower one. Each transformation reduces the amount of usable energy, because energy transformations are not 100% efficient; some is lost, often as heat, increasing entropy."},
 "spontaneous":{n:"Spontaneous (thermodynamically favourable)",g:"Thermodynamics",p:"93",d:"An event that proceeds from a higher to a lower energy state with no input of external energy."},
 "entropy":{n:"Entropy (S)",g:"Thermodynamics",p:"93, 95",d:"Energy lost to disorder. Energy released in a transformation, often as heat, increases entropy. Temperature influences the movement of molecules and adds to the degree of disorder."},
 "chemical-reaction":{n:"Chemical reaction",g:"Chemical reactions",p:"94",d:"A process in which the bonds linking atoms change while the atoms keep their identity. Example: CO₂ + H₂O ⇌ H₂CO₃, where covalent bonds in CO₂ and H₂O break and new ones form."},
 "reactants":{n:"Reactants",g:"Chemical reactions",p:"94",d:"The starting molecules of a chemical reaction, written on the left of the arrow."},
 "products":{n:"Products",g:"Chemical reactions",p:"94",d:"The molecules a chemical reaction makes, written on the right of the arrow. In a pathway, the products of one reaction are the reactants of the next."},
 "equilibrium":{n:"Chemical equilibrium",g:"Chemical reactions",p:"94, 96",d:"The concentrations of products and reactants influence whether a reaction proceeds forward or backward. At equilibrium the forward and backward reactions balance and there is no net change. Cells keep reactant-to-product ratios above that defined by the equilibrium constant, which helps them run +ΔG reactions."},
 "gibbs":{n:"Gibbs free energy (G)",g:"Free energy",p:"94",d:"The amount of energy in a system available to do work. ΔG is the difference in Gibbs free energy between the reactants and products of a chemical process."},
 "delta-g":{n:"ΔG",g:"Free energy",p:"94–95",d:"The change in free energy: Δ = change = final state − initial state, so ΔG = G(products) − G(reactants). Positive ΔG: endergonic. Negative ΔG: exergonic."},
 "endergonic":{n:"Endergonic",g:"Free energy",p:"94",d:"A reaction whose products have more free energy than its reactants (+ΔG). Thermodynamically unfavourable (nonspontaneous): it needs an input of energy. Endergonic reactions require energy."},
 "exergonic":{n:"Exergonic",g:"Free energy",p:"94",d:"A reaction whose reactants have more free energy than its products (−ΔG). Thermodynamically favourable (spontaneous): energy is available for use in other processes. Exergonic reactions release energy."},
 "enthalpy":{n:"Enthalpy (H)",g:"Free energy",p:"95",d:"Total energy. Total energy (H) = energy available to do work (G) + energy lost to entropy (S)."},
 "gibbs-equation":{n:"ΔG = ΔH − TΔS",g:"Free energy",p:"95",d:"The total-energy relation rearranged for Gibbs free energy. H = total energy (enthalpy), G = energy available to do work, S = energy lost to entropy or disorder, T = absolute temperature in Kelvin."},
 "coupling":{n:"Energetic coupling",g:"Free energy",p:"96",d:"Pairing an endergonic reaction with an exergonic one so the net ΔG is negative and both proceed. Example: glucose + Pᵢ → glucose 6-phosphate (+3.3 kcal/mol) coupled with ATP hydrolysis (−7.3 kcal/mol) gives glucose + ATP → glucose 6-phosphate + ADP, ΔG = −4 kcal/mol. Pᵢ is shared between the two reactions."},
 "activation-energy":{n:"Activation energy (EA)",g:"Enzymes",p:"95",d:"The input of energy all reactions need to proceed: reactants must have enough kinetic energy to break certain covalent bonds and get over the activation energy barrier to the transition state."},
 "transition-state":{n:"Transition state",g:"Enzymes",p:"95–96",d:"The highest-energy point of a reaction, at the top of the activation energy barrier. An enzyme's active site helps stabilize the transition state, which lowers the activation energy."},
 "enzyme":{n:"Enzymes",g:"Enzymes",p:"95–97",d:"Proteins that catalyze chemical reactions by decreasing the activation energy barrier, so the reaction can proceed faster. ΔG is the same with and without an enzyme. Both anabolic and catabolic reactions are catalyzed by enzymes."},
 "active-site":{n:"Enzyme active site",g:"Enzymes",p:"96",d:"The region of an enzyme formed by the assembly of certain amino acids in a 3-D structure. These amino acids are often far apart in the linear sequence; folding brings them together. It binds the substrate(s), converts it to product(s), and stabilizes the transition state."},
 "substrate":{n:"Substrate",g:"Enzymes",p:"96–97",d:"The reactant an enzyme binds in its active site and converts to product."},
 "es-complex":{n:"Enzyme–substrate complex (ES)",g:"Enzymes",p:"97",d:"The enzyme with its substrate bound. The cycle runs E + S ⇌ ES ⇌ EP ⇌ E + P: the enzyme–product complex (EP) releases the product and the enzyme is free to act again. In a catabolic reaction one substrate is split; in an anabolic reaction two substrates are joined."},
 "lock-key":{n:"Lock-and-key model",g:"Enzymes",p:"97",d:"A model of enzyme binding in which the substrate fits an active site that already has the matching shape, like a key in a lock (Fig 6.13)."},
 "induced-fit":{n:"Induced fit model",g:"Enzymes",p:"97",d:"A model of enzyme binding in which the enzyme changes shape when the substrate binds, closing more snugly around it (Fig 6.13)."},
 "inhibitor":{n:"Enzyme inhibitors",g:"Enzyme regulation",p:"97",d:"Molecules that reduce enzyme activity. There are two different kinds: reversible and irreversible. A competitive inhibitor binds the active site; a noncompetitive inhibitor binds elsewhere."},
 "competitive":{n:"Competitive inhibition",g:"Enzyme regulation",p:"97",d:"The inhibitor binds to the active site, competing with the substrate and reducing the rate of the reaction."},
 "noncompetitive":{n:"Noncompetitive inhibition",g:"Enzyme regulation",p:"97",d:"The inhibitor binds to a site other than the active site, changing the shape of the enzyme and reducing the rate of the reaction."},
 "activator":{n:"Enzyme activators",g:"Enzyme regulation",p:"97",d:"Molecules that increase enzyme activity."},
 "feedback-inhibition":{n:"Feedback inhibition",g:"Enzyme regulation",p:"97",d:"Regulation in which the final product of a pathway inhibits the first step. Important for maintaining balance in the cell and helping it conserve energy. Example: isoleucine inhibits threonine dehydratase, the first enzyme of the pathway from threonine."},
 "allosteric":{n:"Allosteric enzyme",g:"Enzyme regulation",p:"97",d:"An enzyme regulated by a molecule binding at a site other than the active site, which changes its shape and activity. In Fig 6.14, isoleucine is an allosteric inhibitor of threonine dehydratase."}
};

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let activeLoops = [];
function loop(fn){ let on = true, last = performance.now(); const tick = t => { if(!on) return; const dt = Math.min(0.05,(t-last)/1000); last = t; fn(dt,t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); const s = {stop(){on=false;}}; activeLoops.push(s); return s; }
function stopLoops(){ activeLoops.forEach(l=>l.stop()); activeLoops = []; }
function plate(svgOrEl, caption){
  const f = h("figure",{class:"plate"});
  if (typeof svgOrEl === "string") f.insertAdjacentHTML("beforeend", svgOrEl); else f.append(svgOrEl);
  if (caption) f.append(h("figcaption",{html:caption}));
  return f;
}

/* ============ shared drawing helpers ============ */
function lab(text, term, tx, ty, px, py, anchor="start", cls="lbl"){
  const lines = text.split("\n");
  const t = lines.map((l,i)=>`<tspan x="${tx}" dy="${i?14:0}">${l}</tspan>`).join("");
  const cw = cls.includes("sm")?5.7:6.4, wdt = Math.max(...lines.map(l=>l.length))*cw, hgt=(lines.length-1)*14;
  const x0 = anchor==="end"?tx-wdt: anchor==="middle"?tx-wdt/2 : tx, x1 = x0+wdt;
  let lx, ly=ty-4;
  if (px!=null && px>=x0-6 && px<=x1+6){ lx=Math.max(x0,Math.min(x1,px)); ly = py>ty ? ty+hgt+5 : ty-15; }
  else if (px!=null && px<x0) lx=x0-4; else lx=x1+4;
  const lead = (px!=null) ? `<line class="lead" x1="${lx}" y1="${ly}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2" fill="#5b6b73"/>` : "";
  return `<g ${term?`data-term="${term}"`:""}>${lead}<text class="${cls}" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text></g>`;
}

function arrow(x1,y1,x2,y2,col="#34454e",w=2.2,dash=""){
  const a=Math.atan2(y2-y1,x2-x1), L=10;
  const p1=[x2-L*Math.cos(a-0.4),y2-L*Math.sin(a-0.4)], p2=[x2-L*Math.cos(a+0.4),y2-L*Math.sin(a+0.4)];
  return `<line x1="${x1}" y1="${y1}" x2="${(x2-6*Math.cos(a)).toFixed(1)}" y2="${(y2-6*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
}

const txt=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"start"}" font-family="${o.serif?"Source Serif 4,Georgia":"Source Sans 3,Arial"}" font-size="${o.s||13}" font-weight="${o.w||400}" fill="${o.c||MC6.ink}"${o.it?' font-style="italic"':""}>${t}</text>`;
const bond=(x1,y1,x2,y2,c="#34454e",w=2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
const dbl=(x1,y1,x2,y2,c="#34454e")=>{ const a=Math.atan2(y2-y1,x2-x1), dx=3*Math.sin(a), dy=-3*Math.cos(a); return bond(x1+dx,y1+dy,x2+dx,y2+dy,c)+bond(x1-dx,y1-dy,x2-dx,y2-dy,c); };
function curveArrow(x1,y1,cx,cy,x2,y2,col="#34454e",w=2.2,cls=""){
  const a=Math.atan2(y2-cy,x2-cx), L=8+w*1.3, p1=[x2-L*Math.cos(a-0.42),y2-L*Math.sin(a-0.42)], p2=[x2-L*Math.cos(a+0.42),y2-L*Math.sin(a+0.42)];
  return `<path class="${cls}" d="M${x1} ${y1} Q${cx} ${cy} ${(x2-5*Math.cos(a)).toFixed(1)} ${(y2-5*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none"/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
}
/* energy profile: reactant level yR, product level yP, optional hump peak (y) */
function energyPath(x0,w,yR,yP,peak){
  const sm=u=>(1-Math.cos(Math.PI*Math.max(0,Math.min(1,u))))/2; let d="";
  for(let i=0;i<=80;i++){ const t=i/80; let y;
    if(peak==null) y=yR+(yP-yR)*sm((t-0.3)/0.4);
    else y= t<0.5 ? yR+(peak-yR)*sm((t-0.2)/0.3) : peak+(yP-peak)*sm((t-0.5)/0.3);
    d+=(i?"L":"M")+(x0+t*w).toFixed(1)+" "+y.toFixed(1); }
  return d;
}

   `<text class="lbl" x="${x0+w/2}" y="${y0+hh+20}" text-anchor="middle" font-weight="700">${xl}</text>`;
}

/* ============ laws of thermodynamics (notes p. 93, Figs 6.5, 6.6) ============ */
function cube(x,y,sz=24,f="#f6d36b",st="#b8901c"){ const d=sz*0.35; return `<polygon points="${x},${y} ${x+sz},${y} ${x+sz},${y+sz} ${x},${y+sz}" fill="${f}" stroke="${st}"/><polygon points="${x},${y} ${x+d},${y-d} ${x+sz+d},${y-d} ${x+sz},${y}" fill="${f}" stroke="${st}" opacity=".85"/><polygon points="${x+sz},${y} ${x+sz+d},${y-d} ${x+sz+d},${y+sz-d} ${x+sz},${y+sz}" fill="${f}" stroke="${st}" opacity=".7"/>`; }
const HEATC=["#f2b5a8","#c94a3d"];
function figLaw(n){
  const W=760,H=270; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${n===1?"First law: total energy before equals total energy after":"Second law: some energy is lost as heat, so less is available to do work"}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<g data-term="${n===1?"first-law":"second-law"}">`;
  [[0,0],[1,0],[0,1],[1,1]].forEach(([i,j])=>s+=cube(60+i*30,100+j*30,30));
  s+=`<polygon points="170,112 300,112 300,96 336,130 300,164 300,148 170,148" fill="#d6dcdf"/>${txt(250,135,"TRANSFORMATION",{a:"middle",s:12.5,w:700,c:"#4b5b64"})}`;
  if(n===1){ for(let i=0;i<4;i++) s+=cube(370+i*30,116,30); }
  else { for(let i=0;i<3;i++) s+=cube(370+i*30,130,30); s+=`<g data-term="entropy">${cube(420,40,30,HEATC[0],HEATC[1])}<path d="M428 34 q4 -8 0 -14 M440 34 q4 -8 0 -14" stroke="${HEATC[1]}" fill="none"/></g>`; }
  s+=`</g>`;
  s+=txt(90,210,"Total energy before",{a:"middle",w:700})+txt(250,210,"=",{a:"middle",s:18,w:700})+txt(420,210,"Total energy after",{a:"middle",w:700});
  s+=cube(70,236,18)+txt(100,250,"= one unit of energy",{s:12.5});
  s+=`<g class="lbls">`;
  if(n===1) s+=lab("Same 4 units, rearranged:\nenergy is neither created\nnor destroyed","first-law",560,100,494,130);
  else s+=lab("Energy, often as heat,\nresulting in increased entropy","entropy",404,30,420,50,"end")+lab("Energy available\nto do work","second-law",520,150,464,146);
  s+=`</g></svg>`; return s;
}

/* ============ enzyme shapes ============ */
function enzPath(cx,cy,R,n,mode){
  const top=cy-Math.sqrt(R*R-n*n);
  if(mode==="v") return `M${cx-n} ${top} L${cx} ${top+n*1.15} L${cx+n} ${top} A${R} ${R} 0 1 1 ${cx-n} ${top} Z`;
  if(mode==="bent") return `M${cx-n*1.15} ${top+3} Q${cx} ${top+n*0.25} ${cx+n*1.15} ${top+3} A${R} ${R} 0 1 1 ${cx-n*1.15} ${top+3} Z`;
  return `M${cx-n} ${top} A${n} ${n} 0 0 0 ${cx+n} ${top} A${R} ${R} 0 1 1 ${cx-n} ${top} Z`;
}
function enzyme(cx,cy,R,n,mode="round",o={}){
  const top=cy-Math.sqrt(R*R-n*n);
  let s=`<path d="${enzPath(cx,cy,R,n,mode)}" fill="${o.fill||MC6.enz}" stroke="${o.stroke||MC6.enzS}" stroke-width="1.8"/>`;
  if(mode==="closed") s+=`<circle cx="${cx-n*0.92}" cy="${top-n*0.18}" r="${n*0.36}" fill="${MC6.enz}" stroke="${MC6.enzS}" stroke-width="1.5"/><circle cx="${cx+n*0.92}" cy="${top-n*0.18}" r="${n*0.36}" fill="${MC6.enz}" stroke="${MC6.enzS}" stroke-width="1.5"/><rect x="${cx-n*1.3}" y="${top-1}" width="${n*2.6}" height="${n*0.35}" fill="${MC6.enz}"/><path d="M${cx-n} ${top} A${n} ${n} 0 0 0 ${cx+n} ${top}" stroke="${MC6.enzS}" stroke-width="1.8" fill="none"/>`;
  if(o.site) s+=`<path d="M${cx-n} ${top} A${n} ${n} 0 0 0 ${cx+n} ${top}" stroke="#a24fb8" stroke-width="4" fill="none" opacity=".75"/>`;
  return s;
}
const notchTop=(cy,R,n)=>cy-Math.sqrt(R*R-n*n);
const blobS=(x,y,r,f,st)=>`<circle cx="${x.toFixed?x.toFixed(1):x}" cy="${y.toFixed?y.toFixed(1):y}" r="${r}" fill="${f}" stroke="${st}" stroke-width="1.5"/>`;

/* ============ enzyme-substrate cycle (notes p. 97, Fig 6.13) ============ */
// stage 0: E+S, 1: ES, 2: EP, 3: E+P. t tweens toward the stage (0..1)
function cycleScene(cx,cy,kind,stage,fit,t=1){
  const R=46,n=18, top=notchTop(cy,R,n); let s="";
  const mode= fit ? (stage===2 || (stage===1 && t>0.6) ? "closed" : "v") : "round";
  s+=enzyme(cx,cy,R,n,mode);
  const lerp=(a,b)=>a+(b-a)*t;
  if(kind==="cat"){ // one substrate: two linked parts split into two products
    if(stage===0){ s+=`<line x1="${cx-9}" y1="${top-60}" x2="${cx+9}" y2="${top-60}" stroke="#55606a" stroke-width="3"/>`+blobS(cx-9,top-60,10,MC6.sub,MC6.subS)+blobS(cx+9,top-60,10,"#f6d36b",MC6.phS); }
    if(stage===1){ const y=lerp(top-60,top); s+=`<line x1="${cx-9}" y1="${y}" x2="${cx+9}" y2="${y}" stroke="#55606a" stroke-width="3"/>`+blobS(cx-9,y,10,MC6.sub,MC6.subS)+blobS(cx+9,y,10,"#f6d36b",MC6.phS); }
    if(stage===2){ s+=blobS(cx-lerp(9,12),top,10,MC6.sub,MC6.subS)+blobS(cx+lerp(9,12),top,10,"#f6d36b",MC6.phS); }
    if(stage===3){ s+=blobS(cx-lerp(12,40),top-lerp(0,60),10,MC6.sub,MC6.subS)+blobS(cx+lerp(12,40),top-lerp(0,70),10,"#f6d36b",MC6.phS); }
  } else { // two substrates join into one product
    if(stage===0){ s+=blobS(cx-30,top-60,11,MC6.prod,MC6.prodS)+blobS(cx+30,top-60,11,MC6.sub2,MC6.sub2S); }
    if(stage===1){ s+=blobS(lerp(cx-30,cx-10),lerp(top-60,top),11,MC6.prod,MC6.prodS)+blobS(lerp(cx+30,cx+10),lerp(top-60,top),11,MC6.sub2,MC6.sub2S); }
    if(stage===2){ s+=blobS(cx,top,lerp(11,15),"#2f8f8a","#1d5f5c"); }
    if(stage===3){ s+=blobS(cx,lerp(top,top-64),15,"#2f8f8a","#1d5f5c"); }
  }
  return s;
}
function figCycle(kind){

/* ============ story engine ============ */
let RUN = null; // {id, first:{}}
function chState(id){ return P.ch[id] || (P.ch[id] = {done:false, best:null, last:null}); }
function recordFirst(stepIdx, correct, terms){
  if (!RUN) return;
  if (!(stepIdx in RUN.first)) RUN.first[stepIdx] = !!correct;
  (terms||[]).forEach(k=>markTerm(k,"tested"));
}
function runScore(){ const v=Object.values(RUN.first); return {right:v.filter(Boolean).length, total:v.length}; }

function renderChapter(ci, si=0){
  stopLoops(); exploreHook=null; window.scrollTo(0,0);
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go==="story")));
  const ch = CHAPTERS[ci];
  if (!RUN || RUN.id !== ch.id) RUN = {id:ch.id, first:{}};
  const app = $("#app"); app.innerHTML = "";
  const bar = h("div",{class:"steps","aria-hidden":"true"});
  ch.steps.forEach((_,i)=>bar.append(h("i",{class:i<si?"on":i===si?"cur":""})));
  app.append(h("div",{class:"banner"}, h("span",{class:"num"},`6.${ci+1}`), h("span",{class:"ttl"},ch.title), h("span",{class:"pg"},`Course notes ${ch.pages}`)));
  app.append(h("div",{class:"crumb"}, h("button",{class:"back",onclick:()=>go("story")},"All chapters"), h("span",{class:"muted small"},`Step ${si+1} of ${ch.steps.length}`), bar));
  const step = ch.steps[si];
  const stage = h("div",{class:"stage"+(step.wide?" wide":"")});
  const plateHost = h("div"), panel = h("div",{class:"panel"});
  stage.append(plateHost, panel); app.append(stage);
  const next = h("button",{class:"btn",onclick:()=>{ if(si+1<ch.steps.length) renderChapter(ci,si+1); else finishChapter(ci); }}, si+1<ch.steps.length?"Continue":"Finish chapter");
  const back = h("button",{class:"btn ghost",onclick:()=>{ if(si>0) renderChapter(ci,si-1); else go("story"); }}, si>0?"Back":"All chapters");
  const api = {
    ci, si, panel, plateHost, next,
    lock(){ next.disabled = true; }, unlock(){ next.disabled = false; },
    grade(ok, terms){ recordFirst(si, ok, terms||step.terms); },
    gradeKey(key, ok, terms){ recordFirst(si+'.'+key, ok, terms); },
  };
  (STEP_TYPES[step.type])(step, api);
  panel.append(h("div",{class:"nav"}, back, next));
  bindTerms(app); bindRich(app);
  tc.classList.remove("show");
}
function finishChapter(ci){
  stopLoops(); window.scrollTo(0,0);
  const ch = CHAPTERS[ci], sc = runScore(), st = chState(ch.id);
  const frac = sc.total ? sc.right/sc.total : 1;
  const prevBest = st.best;
  st.done = true; st.last = frac; if (st.best==null || frac>st.best) st.best = frac; save();
  const app=$("#app"); app.innerHTML="";
  const box = h("div",{class:"summary"});

     h("div",{}, h("div",{class:"big"},`${sc.right}/${sc.total}`), h("div",{class:"muted small"},"right on the first try")),
     h("div",{}, h("div",{class:"big",style:"color:var(--head)"},Math.round((st.best||0)*100)+"%"), h("div",{class:"muted small"}, prevBest==null?"your best so far": (frac>prevBest?"new personal best":"your best"))) ));
  box.append(h("p",{},ch.wrap));
  box.append(h("p",{class:"muted small"},"Terms from this chapter. Click one to review it."), termChips(ch.terms));
  const nextBtn = ci+1<CHAPTERS.length ? h("button",{class:"btn",onclick:()=>{RUN=null; renderChapter(ci+1,0);}},`Start chapter ${ci+2}: ${CHAPTERS[ci+1].title}`) : h("button",{class:"btn",onclick:()=>go("checkpoint")},"Go to the enzyme desk");
  box.append(h("div",{class:"row",style:"margin-top:16px"}, nextBtn, h("button",{class:"btn ghost",onclick:()=>{RUN=null; renderChapter(ci,0);}},"Replay chapter"), h("button",{class:"btn ghost",onclick:()=>go("story")},"All chapters")));
  app.append(box);
  RUN = null;
}

/* ---- step types ---- */
function figHost(step, api, svg){
  if (!svg) return;
  const f = plate(svg, step.cap);
  if (step.labelsToggle){
    const b = h("button",{class:"mini","aria-pressed":"true"},"Labels");
    b.addEventListener("click",()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",on?"false":"true"); f.classList.toggle("labels-off",on); });
    f.prepend(h("div",{class:"tools"},b));
  }
  api.plateHost.innerHTML=""; api.plateHost.append(f);
  if (step.onFig) step.onFig(f.querySelector("svg"));
  return f;
}
const STEP_TYPES = {
  brief(step, api){
    figHost(step, api, step.fig && step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    if (step.terms) api.panel.append(termChips(step.terms));
  },
  review(step, api){
    figHost(step, api, step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    const counter = h("p",{class:"explored"});
    const seen = new Set();
    const upd = ()=>{ counter.textContent = `Parts explored: ${seen.size} of ${step.terms.length}`; };
    exploreHook = k=>{ if(step.terms.includes(k)){ seen.add(k); upd(); } };
    upd(); api.panel.append(counter, termChips(step.terms));
  },
  mcq(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},step.kicker||"Your call"), h("h2",{},step.title));
    if (step.q) api.panel.append(h("div",{html:rich(step.q)}));
    const box = h("div",{class:"opts"}), fb = h("div");
    let solved=false, first=true;
    const opts = step.keep ? step.opts : shuffle(step.opts);
    opts.forEach(o=>{
      const b = h("button",{class:"opt"},o[0]);
      b.addEventListener("click",()=>{
        if (solved) return;
        if (first){ api.grade(o[1], step.terms); first=false; }
        fb.innerHTML="";
        if (o[1]){
          solved=true; b.classList.add("right");
          $$(".opt",box).forEach(x=>x.disabled=true);
          fb.append(h("div",{class:"fb ok",html:`<b>Correct.</b>${rich(o[2]||"")}`}));
          if (step.after) fb.append(h("div",{class:"fb",html:rich(step.after)}));
          if (step.afterFig && f){ const nf = plate(step.afterFig(), step.afterCap||step.cap); api.plateHost.innerHTML=""; api.plateHost.append(nf); bindTerms(nf); }
          api.unlock();
        } else {
          b.classList.add("wrong"); b.disabled=true;
          fb.append(h("div",{class:"fb bad",html:`<b>Not quite.</b>${rich(o[2]||"")} Try another answer.`}));
        }
        bindRich(fb);
      });
      box.append(b);
    });
    api.panel.append(box, fb); api.lock();
  },
  order(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Put these in order"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    const n = step.items.length, slots = new Array(n).fill(null);
    let pool = shuffle(step.items.map((t,i)=>({t,i})));
    let first = true;
    const slotBox = h("div",{class:"order"}), poolBox = h("div",{class:"pool"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check order");
    function draw(){
      slotBox.innerHTML=""; poolBox.innerHTML="";
      slots.forEach((s,i)=>{
        const el = h("div",{class:"slot"+(s?" filled":"")+(s&&s.mark?" "+s.mark:""),tabindex:s?"0":null,role:s?"button":null}, h("span",{class:"n"},String(i+1)), h("span",{}, s?s.t:"Click a step below to place it here"));
        if (s && !s.locked) el.addEventListener("click",()=>{ pool.push(s); slots[i]=null; delete s.mark; draw(); });
        slotBox.append(el);
      });
      pool.forEach(p=>{ const b=h("button",{class:"card"},p.t); b.addEventListener("click",()=>{ const k=slots.indexOf(null); if(k<0) return; slots[k]=p; pool=pool.filter(x=>x!==p); draw(); }); poolBox.append(b); });
      check.disabled = slots.includes(null);
    }
    check.addEventListener("click",()=>{
      let all=true;
      slots.forEach((s,i)=>{ s.mark = s.i===i?"right":"wrong"; if(s.i!==i) all=false; else s.locked=true; });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){ fb.append(h("div",{class:"fb ok",html:"<b>That's the right order.</b>"+rich(step.after||"")})); check.remove(); api.unlock(); draw(); bindRich(fb); return; }
      draw();
      fb.append(h("div",{class:"fb bad",html:"<b>Some steps are out of place.</b> The green ones are right and locked in. Click a red one to send it back, then try again."}));
    });
    draw();
    api.panel.append(slotBox, poolBox, h("div",{class:"row"},check), fb); api.lock();
  },
  sort(step, api){
    figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Sort them"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    let items = shuffle(step.items.map((it,i)=>({t:it[0],bin:it[1],why:it[2],i,at:null})));
    let sel = null, first = true;
    const poolBox = h("div",{class:"pool"}), binBox = h("div",{class:"bins"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check");
    function draw(){
      poolBox.innerHTML=""; binBox.innerHTML="";
      items.filter(x=>x.at===null).forEach(x=>{ const b=h("button",{class:"card"+(sel===x?" sel":"")},x.t); b.addEventListener("click",()=>{ sel = sel===x?null:x; draw(); }); poolBox.append(b); });
      step.bins.forEach((name,bi)=>{
        const bin = h("div",{class:"bin",tabindex:"0",role:"button","aria-label":"Place in "+name}, h("h4",{},name));
        const place = ()=>{ if(sel){ sel.at=bi; delete sel.mark; sel=null; draw(); } };
        bin.addEventListener("click",place); bin.addEventListener("keydown",e=>{ if(e.key==="Enter") place(); });
        items.filter(x=>x.at===bi).forEach(x=>{ const c=h("button",{class:"card"+(x.mark?" "+x.mark:"")},x.t); c.addEventListener("click",e=>{ e.stopPropagation(); if(sel){ place(); return; } if(x.locked) return; x.at=null; delete x.mark; draw(); }); bin.append(c); });
        binBox.append(bin);
      });
      if (!items.some(x=>x.at===null)) poolBox.append(h("p",{class:"muted small"},"All placed. Check your sort, or click a card in a box to take it back out."));
      else if (!sel) poolBox.prepend(h("p",{class:"muted small",style:"margin:0"},"Click a card, then click the box it belongs in."));
      check.disabled = items.some(x=>x.at===null);
    }
    check.addEventListener("click",()=>{
      let all=true; const misses=[];
      items.forEach(x=>{ if(x.at===x.bin){ x.mark="right"; x.locked=true; } else { x.mark="wrong"; all=false; misses.push(x); } });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){
        fb.append(h("div",{class:"fb ok",html:"<b>All sorted correctly.</b>"+rich(step.after||"")}));
        check.remove(); api.unlock(); draw(); bindRich(fb);
        if (step.onSolved) step.onSolved(api);
        return;
      }
      draw();
      const why = misses.filter(m=>m.why).map(m=>`<li>${m.t}: ${m.why}</li>`).join("");
      fb.append(h("div",{class:"fb bad",html:`<b>${misses.length} in the wrong box.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""} Move the red ones and check again.`}));
    });
    draw();
    api.panel.append(poolBox, binBox, h("div",{class:"row"},check), fb); api.lock();
  },
  custom(step, api){ step.render(api, step); }
};

  steps:[
  {type:"review", title:"Bonds change, atoms don't", fig:figReaction, labelsToggle:true, cap:"<b>Figure 6.1</b> A chemical reaction: CO₂ + H₂O ⇌ H₂CO₃. (Notes p. 94, Fig 6.7)",
   text:`<p>In a [[chemical-reaction|chemical reaction]], atoms keep their identity but the bonds linking them change.</p><p>In the figure, the [[reactants|reactants]] are carbon dioxide and water. One C–O bond in CO₂ and one O–H bond in H₂O break. New covalent bonds form between the C of CO₂ and the O of water, and between an O of CO₂ and an H of water. The [[products|product]] is carbonic acid.</p><p>The concentrations of products and reactants can influence whether a reaction proceeds forward or backward ([[equilibrium|chemical equilibrium]]), shown by the double arrow.</p>`,
   terms:["chemical-reaction","reactants","products","equilibrium"]},
  {type:"review", title:"Free energy and ΔG", fig:figDG, cap:"<b>Figure 6.2</b> Endergonic and exergonic reactions. (Notes p. 94, Fig 6.8)",
   text:`<p>The amount of energy in a system available to do work is [[gibbs|Gibbs free energy]] (G). [[delta-g|ΔG]] is the difference in free energy between the reactants and products.</p><p>If the products have <b>more</b> free energy than the reactants: [[endergonic|endergonic]], +ΔG, thermodynamically unfavourable (nonspontaneous). It needs an input of energy.</p><p>If the reactants have <b>more</b> free energy than the products: [[exergonic|exergonic]], −ΔG, thermodynamically favourable (spontaneous). Energy is available for use in other processes.</p>${remember("Key (p. 94):"," endergonic reactions require energy; exergonic reactions release energy.")}`,
   terms:["gibbs","delta-g","endergonic","exergonic"]},
  {type:"custom", title:"Set the free energy", render:api=>simDeltaG(api), terms:["delta-g","endergonic","exergonic"]},
  {type:"brief", title:"ΔG = ΔH − TΔS", fig:()=>figLaw(2), cap:"<b>Figure 6.3</b> Total energy splits into energy available to do work and energy lost to entropy. (Notes pp. 93, 95)",
   text:`<p><b>Total energy (H) = energy available to do work (G) + energy lost to entropy (S).</b></p><p>Rearranged for Gibbs free energy: <b>[[gibbs-equation|ΔG = ΔH − TΔS]]</b></p><p>H = total energy ([[enthalpy|enthalpy]])<br>G = energy available to do work<br>S = energy lost to [[entropy|entropy]] or disorder<br>T = absolute temperature in Kelvin</p><p>Temperature influences the movement of molecules and adds to the degree of disorder.</p>${remember("Remember:"," Δ = change = final state − initial state.")}`, terms:["gibbs-equation","enthalpy","entropy"]},
  {type:"mcq", title:"Use the equation", q:"<p>For a reaction, ΔH = −10 kcal/mol and TΔS = +2 kcal/mol. What is ΔG, and what kind of reaction is it?</p>",
   opts:[["−12 kcal/mol; exergonic",true," ΔG = ΔH − TΔS = −10 − (+2) = −12. Negative ΔG: exergonic and spontaneous."],["−8 kcal/mol; exergonic",false," Subtract TΔS: −10 − 2, not −10 + 2."],["+12 kcal/mol; endergonic",false," Check the signs: −10 − 2 = −12."],["−12 kcal/mol; endergonic",false," Negative ΔG means exergonic."]], terms:["gibbs-equation","exergonic"]},
  {type:"sort", title:"Endergonic or exergonic?", q:"<p>Sort each description.</p>", bins:["Endergonic (+ΔG)","Exergonic (−ΔG)"],
   items:[["Products have more free energy than reactants",0],["Needs an input of energy",0],["Nonspontaneous",0],["Building a protein from amino acids",0],["Reactants have more free energy than products",1],["Spontaneous",1],["ATP + H₂O → ADP + Pᵢ",1],["Breaking glucose down to CO₂ and water",1]], terms:["endergonic","exergonic"]}
  ]},

{ id:"couple", title:"ATP hydrolysis and energetic coupling", pages:"pp. 95–96", blurb:"Why ATP hydrolysis is exergonic, and how it drives endergonic reactions.",
  terms:["atp-hydrolysis","phosphate-bonds","adp-amp","coupling","equilibrium","endergonic","exergonic"],
  wrap:"ATP + H₂O → ADP + Pᵢ releases 7.3 kcal/mol. Coupled to an endergonic reaction, it makes the net ΔG negative so both run. Next: why reactions need a push to start at all.",
  steps:[
  {type:"review", title:"What happens when ATP is hydrolyzed?", fig:figHydrolysis, cap:"<b>Figure 7.1</b> ATP hydrolysis. (Notes p. 95, Fig 6.9)",
   text:`<p><b>Question (from your notes):</b> What happens when ATP is hydrolyzed?<br><b>Answer:</b> The reaction of ATP with water is [[exergonic|exergonic]] (spontaneous): [[atp-hydrolysis|ATP + H₂O → ADP + Pᵢ]], releasing free energy (ΔG = −7.3 kcal/mol).</p><p>At physiological pH the phosphate groups in ATP are negatively charged and resist one another. Compared to ATP, which has three phosphate groups, [[adp-amp|ADP]] has two, so it has lower potential energy.</p>`,
   terms:["atp-hydrolysis","adp-amp","exergonic"]},
  {type:"brief", title:"Running uphill reactions", fig:figCoupling, cap:"<b>Figure 7.2</b> Energetic coupling. (Notes p. 96, Fig 6.11)",
   text:`<p>Cells can carry out many reactions with a +ΔG. This happens for two reasons:</p><p>1. The relative concentrations of reactants to products are kept above those defined by the equilibrium constant ([[equilibrium|chemical equilibrium]]), which pushes the reaction forward.</p><p>2. [[coupling|Coupling]] endergonic and exergonic reactions. For example, hydrolysis of ATP drives endergonic reactions.</p><p>In the figure, adding a phosphate to glucose is endergonic (+3.3 kcal/mol). Coupled with ATP hydrolysis (−7.3 kcal/mol), the net ΔG is −4 kcal/mol, so the coupled reaction proceeds. Pᵢ is shared between the two reactions.</p>`, terms:["coupling","equilibrium"]},
  {type:"custom", title:"Pay with ATP", render:api=>simCouple(api), terms:["coupling","atp-hydrolysis","endergonic"]},
  {type:"mcq", title:"Does it run?", q:"<p>An endergonic reaction has ΔG = +5.0 kcal/mol. It is coupled to the hydrolysis of one ATP (−7.3 kcal/mol). What is the net ΔG?</p>",
   opts:[["−2.3 kcal/mol, so the coupled reaction proceeds",true," +5.0 + (−7.3) = −2.3. Negative net ΔG: favourable."],["+12.3 kcal/mol, so it can't proceed",false," ATP hydrolysis has a negative ΔG; add it, don't subtract it."],["+2.3 kcal/mol, so it can't proceed",false," Check the sign: 5.0 − 7.3 = −2.3."],["−7.3 kcal/mol, the same as ATP alone",false," Both ΔG values count."]], terms:["coupling"]},
  {type:"mcq", title:"Why ADP is lower", q:"<p>Why does ADP have lower potential energy than ATP?</p>",
   opts:[["It has one fewer negatively charged phosphate group, so less repulsion is stored in its bonds",true," ATP has three phosphates resisting one another; ADP has two."],["ADP has no ribose",false," ADP still has adenine and ribose."],["ADP has more phosphate groups",false," ADP (di) has two; ATP (tri) has three."],["ADP is bonded to water",false," Water is used in hydrolysis, not kept in ADP."]], terms:["adp-amp","phosphate-bonds"]}
  ]},

{ id:"enzymes", title:"Activation energy and enzymes", pages:"pp. 95–97", blurb:"The activation energy barrier, how enzymes lower it, the active site, and the enzyme cycle.",
  terms:["activation-energy","transition-state","enzyme","active-site","substrate","es-complex","lock-key","induced-fit"],
  wrap:"Enzymes speed reactions by lowering the activation energy; they don't change ΔG. The active site binds the substrate, stabilizes the transition state, and releases the product. Next: how cells turn enzymes up and down.",
  steps:[
  {type:"review", title:"The activation energy barrier", fig:figEA, labelsToggle:true, cap:"<b>Figure 8.1</b> An enzyme-catalyzed reaction. (Notes p. 95, Fig 6.10)",
   text:`<p>Chemical transformations require breaking certain covalent bonds within the reactant. Reactants must have enough kinetic energy to get over the [[activation-energy|activation energy]] barrier (E<sub>A</sub>), to the [[transition-state|transition state]] at the top.</p><p>[[enzyme|Enzymes]] catalyze reactions by decreasing the size of the E<sub>A</sub> barrier, so the reaction can proceed.</p><p>Look at the figure: <b>ΔG is the same with and without an enzyme.</b> An enzyme changes how fast a reaction goes, not whether it is exergonic or endergonic.</p>`,
   terms:["activation-energy","transition-state","enzyme","delta-g"]},
  {type:"custom", title:"Get over the hump", render:api=>simEA(api), terms:["activation-energy","enzyme"]},
  {type:"review", title:"The active site", fig:figActiveSite, labelsToggle:true, cap:"<b>Figure 8.2</b> The enzyme active site forms when the enzyme folds. (Notes p. 96, Fig 6.12)",
   text:`<p><b>Question (from your notes):</b> How are chemical reactions catalyzed?<br><b>Answer:</b> By proteins called [[enzyme|enzymes]].</p><p>The [[active-site|active site]] is formed by the assembly of certain amino acids in a 3-D structure. These amino acids are often far apart in the linear sequence; folding brings them together (tertiary structure, Module 5).</p><p>The active site binds the [[substrate|substrate(s)]] and converts it to the product(s). It also helps stabilize the transition state, which lowers the activation energy.</p>`,
   terms:["active-site","substrate","enzyme"]},
  {type:"custom", title:"Inside the active site", render:api=>simFit(api), terms:["es-complex","induced-fit","lock-key"]},
  {type:"order", title:"One catalytic cycle", q:"<p>Put the steps of one enzyme cycle in order (notes p. 97, Fig 6.13).</p>",
   items:["E + S: the enzyme and its substrate are separate","ES: the substrate binds the active site","EP: the substrate is converted to product while still bound","E + P: the product is released and the enzyme is free to act again"], after:" Anabolic and catabolic reactions are both catalyzed by enzymes this way.", terms:["es-complex","substrate"]},
  {type:"mcq", title:"What does the enzyme change?", fig:figEA, cap:"<b>Figure 8.1</b> Catalyzed and uncatalyzed.", q:"<p>An enzyme is added to an exergonic reaction. Which changes?</p>",
   opts:[["The activation energy decreases; ΔG stays the same",true," The enzyme lowers the barrier, so the reaction proceeds faster. The start and end free energies don't change."],["ΔG becomes more negative",false," ΔG is the same with and without an enzyme."],["The reaction becomes endergonic",false," Enzymes don't change the direction of ΔG."],["The products gain free energy",false," The product level doesn't move."]], terms:["enzyme","activation-energy","delta-g"]}
  ]},

{ id:"regulate", title:"Enzyme regulation", pages:"p. 97", blurb:"Competitive and noncompetitive inhibitors, reversible and irreversible inhibition, activators, and feedback inhibition.",
  terms:["inhibitor","competitive","noncompetitive","activator","feedback-inhibition","allosteric","pathway"],
  wrap:"Inhibitors lower enzyme activity (competitive at the active site, noncompetitive elsewhere; reversible or irreversible) and activators raise it. Feedback inhibition lets a pathway's end product switch off its first enzyme. Last: the whole module in one go.",
  steps:[
  {type:"review", title:"Inhibitors and activators", fig:figInhib, cap:"<b>Figure 9.1</b> Enzyme-substrate interactions and inhibition. (Notes p. 97, Fig 6.13)",
   text:`<p>It is possible to affect enzyme activity.</p><p>Activity can be reduced by two different kinds of [[inhibitor|inhibitors]]: <b>reversible</b> and <b>irreversible</b>.</p><p>A [[competitive|competitive inhibitor]] binds the active site, competing with the substrate and reducing the rate of the reaction.<br>A [[noncompetitive|noncompetitive inhibitor]] binds a site other than the active site, changing the shape of the enzyme and reducing the rate of the reaction.</p><p>Activity can be increased by [[activator|activators]].</p>`,
   terms:["inhibitor","competitive","noncompetitive","activator"]},
  {type:"custom", title:"Slow the enzymes down", render:api=>simInhib(api), terms:["competitive","noncompetitive","inhibitor"]},
  {type:"sort", title:"Competitive or noncompetitive?", q:"<p>Sort each statement.</p>", bins:["Competitive","Noncompetitive"],
   items:[["Binds the active site",0],["Competes directly with the substrate",0],["Often shaped like the substrate",0],["Binds a site other than the active site",1],["Changes the shape of the enzyme",1],["Works by changing the active site's shape from a distance",1]], terms:["competitive","noncompetitive"]},
  {type:"review", title:"Feedback inhibition", fig:()=>figFeedback(1), cap:"<b>Figure 9.2</b> An allosteric enzyme. (Notes p. 97, Fig 6.14)",
   text:`<p>Because energy is needed for chemical reactions, many [[pathway|metabolic pathways]] are regulated.</p><p>In [[feedback-inhibition|feedback inhibition]] the final product of a pathway inhibits the first step. This is important for maintaining balance in the cell and helping it conserve energy.</p><p>In the figure, threonine is converted to isoleucine in five steps. Isoleucine binds threonine dehydratase, the first enzyme, at a site other than the active site: it is an [[allosteric|allosteric]] inhibitor.</p>`,
   terms:["feedback-inhibition","allosteric","pathway"]},
  {type:"custom", title:"Isoleucine on demand", render:api=>simFeedback(api), terms:["feedback-inhibition","allosteric"]},

function makeCanvas(W,H,label){
  const cv = h("canvas",{role:"img","aria-label":label||""}); const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); return {cv,ctx,W,H};
}
function label(ctx,t,x,y,opts={}){ ctx.fillStyle=opts.col||"#1c2830"; ctx.font=`${opts.it?"italic ":""}${opts.w||400} ${opts.s||13}px Source Sans 3, Arial`; ctx.textAlign=opts.a||"left"; ctx.textBaseline="alphabetic"; ctx.fillText(t,x,y); }
function inlineMCQ(host, q, opts, api, key, terms, onRight){
  host.append(h("p",{style:"margin-top:10px"},h("b",{},q)));
  const box=h("div",{class:"opts"}), fb=h("div"); let first=true, done=false;
  shuffle(opts).forEach(o=>{ const b=h("button",{class:"opt"},o[0]); b.addEventListener("click",()=>{
    if(done) return; if(first){ api.gradeKey(key,o[1],terms); first=false; }

    if(o[1]){ done=true; b.classList.add("right"); $$(".opt",box).forEach(x=>x.disabled=true); fb.append(h("div",{class:"fb ok",html:"<b>Correct.</b>"+o[2]})); onRight&&onRight(); }
    else { b.classList.add("wrong"); b.disabled=true; fb.append(h("div",{class:"fb bad",html:"<b>Not quite.</b>"+o[2]+" Try another answer."})); }
  }); box.append(b); });
  host.append(box,fb);
}

/* ============ Classify the organism (notes p. 90, Fig 6.1) ============ */
const TROPH_ORGS=[
 {n:"Cyanobacteria",d:"Bacteria that capture sunlight and build their sugars from CO₂.",q:"pa"},
 {n:"An oak tree",d:"Uses the sun's energy to convert CO₂ and water into sugar and O₂.",q:"pa"},
 {n:"Heliobacteria",d:"Bacteria that capture light energy but can't convert CO₂; they take in organic compounds for carbon.",q:"ph"},
 {n:"Green nonsulfur bacteria",d:"Most use light for energy and take up organic compounds as their carbon source.",q:"ph"},
 {n:"Sulfur-oxidizing bacteria",d:"Get energy from a chemical reaction with sulfur compounds and build their sugars from CO₂.",q:"ca"},
 {n:"Hydrogen bacteria",d:"Get energy from hydrogen gas, a chemical compound, and build their sugars from CO₂.",q:"ca"},
 {n:"A cheetah",d:"Eats other animals and breaks them down for both energy and carbon.",q:"ch"},
 {n:"Most bacteria (e.g. gut bacteria)",d:"Break down organic molecules they absorb, for both energy and carbon.",q:"ch"}];
const QNAME={pa:"photoautotroph",ph:"photoheterotroph",ca:"chemoautotroph",ch:"chemoheterotroph"};
function simTroph(api){

    mk(g1,[["p","Energy from sunlight"],["c","Energy from chemical compounds"]],o.q[0],()=>{ fb.innerHTML=""; q2.append(h("p",{style:"margin:8px 0 0"},h("b",{},"Carbon source?")),g2); });
    mk(g2,[["a","Carbon from CO₂ (inorganic)"],["h","Carbon from organic compounds"]],o.q[1],()=>{ api.gradeKey("o"+i,!wrongAny,TROPH_Q[o.q]); if(!wrongAny) right++; hl=o.q; fig();
      fb.innerHTML=""; fb.append(h("div",{class:"fb ok",html:`<b>${o.n}: ${QNAME[o.q]}.</b> ${o.q[0]==="p"?"Phototroph":"Chemotroph"} for energy, ${o.q[1]==="a"?"autotroph":"heterotroph"} for carbon.`}), h("button",{class:"btn",style:"margin-top:6px",onclick:()=>{ i++; hl=null; draw(); }},i+1<list.length?"Next organism":"Finish")); });
    body.append(h("p",{style:"margin:10px 0 0"},h("b",{},"Energy source?")),g1,q2,fb); }
  api.panel.append(h("p",{class:"kicker"},"Classify it"), h("h2",{},"Classify the organism"), h("p",{},"Read each description, then answer the two questions from Fig 6.1."), body);

/* ============ Run the metabolism cycle (notes p. 91, Fig 6.2) ============ */
const MPROC_A=["Join amino acids into a protein","Link nucleotides into DNA","Build glycogen from glucose"], MPROC_C=["Break glucose down to CO₂ and water","Digest a fat into fatty acids","Break a protein into amino acids"];
function simMetab(api){
  const A=shuffle(MPROC_A), C=shuffle(MPROC_C), list=[]; for(let k=0;k<3;k++){ list.push([C[k],"cat"],[A[k],"ana"]); }
  let i=0, pool=4, right=0, act=null; const host=h("div"), body=h("div"), meter=h("div"), q=h("div");
  api.plateHost.innerHTML=""; api.plateHost.append(host);
  function fig(){ host.innerHTML=""; const f=plate(figMetab(act),"<b>Figure 2.2</b> Anabolism and catabolism. The moving arrow shows the branch in use. (Notes p. 91, Fig 6.2)"); host.append(f); bindTerms(f); }
  let off=0; loop(dt=>{ off-=dt*40; const p=host.querySelector("path.flow."+act); if(p){ p.setAttribute("stroke-dasharray","16 10"); p.setAttribute("stroke-dashoffset",off.toFixed(1)); } });
  function drawMeter(){ meter.innerHTML=""; meter.append(h("p",{style:"margin:6px 0 2px"},h("b",{},"ATP in the cell: "),String(pool)), h("div",{class:"row",style:"gap:4px"},...Array.from({length:10},(_,k)=>h("span",{style:`width:22px;height:22px;border-radius:50%;display:inline-block;border:1px solid #b8901c;background:${k<pool?"#f6d36b":"transparent"}`})))); }
  function draw(){ body.innerHTML=""; fig(); drawMeter();
    if(i>=list.length){ body.append(h("div",{class:"fb ok",html:rich(`<b>All six done.</b> ${right} of 6 right on the first try. [[catabolism|Catabolism]] refilled the ATP that [[anabolism|anabolism]] spent.`)})); bindRich(body);
      if(!q.childElementCount) inlineMCQ(q,"So where does the energy for anabolism come from?",[["ATP made by catabolism",1," Breaking molecules down produces ATP; building them up spends it."],["Anabolism makes its own ATP",0," Anabolism requires an input of energy."],["Directly from sunlight in every cell",0," Only phototrophs capture sunlight, and even they store it as chemical energy first."],["From the subunits themselves",0," Subunits are the building blocks; joining them needs ATP."]],api,"src",["anabolism","catabolism"],()=>api.unlock());
      body.append(q); return; }
    const [t,ans]=list[i]; let first=true;
    body.append(h("div",{class:"idcard"},h("div",{class:"hd"},h("b",{},t),h("span",{},`${i+1} of 6`))));
    const g=h("div",{class:"gates"}), fb=h("div");
    [["ana","Anabolic: building up"],["cat","Catabolic: breaking down"]].forEach(([k,lbl])=>{ const b=h("button",{class:"gate"},lbl); b.onclick=()=>{ const ok=k===ans; if(first){ first=false; api.gradeKey("m"+i,ok,["anabolism","catabolism"]); if(ok) right++; }
      if(ok){ act=k; pool=Math.max(0,Math.min(10,pool+(k==="cat"?3:-2))); fig(); drawMeter(); b.classList.add("right"); $$(".gate",g).forEach(x=>x.disabled=true); fb.innerHTML="";
        fb.append(h("div",{class:"fb ok",html:k==="cat"?"<b>Catabolic.</b> Molecules are broken into smaller units and ATP is produced (ADP + Pᵢ → ATP).":"<b>Anabolic.</b> Molecules are built from smaller units, which requires an input of energy (ATP + H₂O → ADP + Pᵢ)."}), h("button",{class:"btn",style:"margin-top:6px",onclick:()=>{ i++; draw(); }},i<5?"Next process":"Finish")); }
      else { b.classList.add("wrong"); b.disabled=true; fb.innerHTML=""; fb.append(h("div",{class:"fb bad",html:"<b>Not quite.</b> Is it making something bigger, or breaking something into smaller units?"})); } }; g.append(b); });
    body.append(g,fb); }
  api.panel.append(h("p",{class:"kicker"},"Run it"), h("h2",{},"Run the cycle"), h("p",{},"A cell does six jobs. Decide which branch each belongs to, and watch the ATP supply."), meter, body);
  api.lock(); draw();
}

/* ============ Ball on the stairs (notes p. 91, Fig 6.3) ============ */
function simStairs(api){
  const W=760,H=360; const {cv,ctx}=makeCanvas(W,H,"A ball rolling down stairs, with energy bars");
  const r=16, FLOOR=330, steps=[[80,200,150],[200,320,210],[320,440,270]];
  const surf=x=>{ for(const [a,b,y] of steps) if(x>=a&&x<b) return y; return FLOOR; };
  const g=700, REST=FLOOR-r;
  const S={x:130,y:150-r,vx:0,vy:0,state:"top",E0:0,done:{roll:false,rest:false}};
  const pe=()=>g*(REST-S.y), ke=()=>0.5*(S.vx*S.vx+S.vy*S.vy);
  function reset(){ S.x=130; S.y=150-r; S.vx=0; S.vy=0; S.state="top"; }
  function step(dt){ if(S.state!=="moving") return;
    S.vy+=g*dt; S.x+=S.vx*dt; S.y+=S.vy*dt; const gr=surf(S.x)-r;
    if(S.y>=gr){ S.y=gr; if(S.vy>60) S.vy=-S.vy*0.5; else S.vy=0; }

  const search=h("input",{type:"search",placeholder:"Find a term",style:"padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;min-width:240px","aria-label":"Find a term"});
  app.append(h("div",{class:"banner"},h("span",{class:"num"},"6"),h("span",{class:"ttl"},"Important terms and concepts"),h("span",{class:"pg"},"Course notes p. 98")));
  app.append(h("div",{class:"crumb"},h("p",{class:"muted",style:"margin:0"},`${seen} of ${keys.length} seen, ${tested} tested. Page numbers point to your course notes.`),h("div",{style:"margin-left:auto"},search)));
  const box=h("div",{class:"gl"}); app.append(box);
  function draw(q=""){ box.innerHTML="";
    TERM_ORDER_GROUPS.forEach(g=>{ const ks=keys.filter(k=>T[k].g===g && (!q || (T[k].n+" "+T[k].d).toLowerCase().includes(q))); if(!ks.length) return;
      const sec=h("section",{},h("h2",{},g));

  const app=$("#app"); app.innerHTML="";
  app.append(h("div",{class:"banner"},h("span",{class:"num"},"6"),h("span",{class:"ttl"},"Mini exam")));

/* ============ router ============ */
function go(view){
  stopLoops(); exploreHook=null; RUN=null; tc.classList.remove("show"); tip.style.display="none";
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go===view)));
  if(view==="atlas") atlasView(); else if(view==="checkpoint") checkpointView(); else if(view==="glossary") glossaryView(); else if(view==="exam") examView(); else homeView();
  window.scrollTo(0,0);
}
$$(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.go)));
$("#home").addEventListener("click",()=>go("story"));
function fromHash(){
  const m=location.hash.match(/^#ch=(\d+)/);
  if(m && CHAPTERS[+m[1]-1]){ RUN=null; renderChapter(+m[1]-1,0); return true; }
  if(location.hash==="#exam"){ go("exam"); return true; }
  return false;
}
window.addEventListener("hashchange",fromHash);
if(!fromHash()) go("story");
