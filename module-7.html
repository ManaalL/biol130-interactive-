  steps:[
  {type:"review", title:"Four stages", fig:()=>figStages(), labelsToggle:true, cap:"<b>Figure 1.1</b> The four stages of cellular respiration. (Notes p. 100, Fig 7.2)",
   text:`<p>[[cellular-respiration|Cellular respiration]] can use carbohydrates, lipids and proteins. It converts the energy in fuel molecules into [[atp|ATP]], which allows the cell to do work.</p><p><b>Stage 1, [[glycolysis|glycolysis]]:</b> glucose is partially broken down, releasing a small amount of energy.<br><b>Stage 2, [[pyruvate-ox|pyruvate oxidation]]:</b> pyruvate from glycolysis is converted to acetyl-CoA and CO₂.<br><b>Stage 3, the [[cac|citric acid cycle]]:</b> acetyl-CoA is broken down, releasing CO₂, a small amount of energy and electron carriers.<br><b>Stage 4, [[oxidative-phos|oxidative phosphorylation]]:</b> all the electron carriers from stages 1 to 3 give their high-energy electrons to the electron transport chain, which produces ATP.</p>`+remember("Your notes:"," fatty acids and amino acids can also be broken down by different pathways, but this module follows glucose."),
   terms:["glycolysis","pyruvate-ox","cac","oxidative-phos"]},
  {type:"custom", title:"Where does each stage happen?", render:api=>simWhere(api), terms:["four-stages","mitochondria","matrix","inner-membrane"]},
  {type:"review", title:"Two ways to make ATP", fig:figOverview, cap:"<b>Figure 1.3</b> An overview of cellular respiration. (Notes p. 100, Fig 7.1)",
   text:`<p>There are two types of phosphorylation.</p><p>[[substrate-level|Substrate-level phosphorylation]] makes ATP by a reaction involving an enzyme/substrate complex. A <b>small amount</b> of ATP is made this way.</p><p>Most of the energy is transferred to [[electron-carriers|electron carriers]], which carry it from one reaction to another. They deliver electrons to the respiratory [[etc|electron transport chain]], which passes them along membrane proteins to a final acceptor. These proteins harness the energy released to make ATP: [[oxidative-phos|oxidative phosphorylation]]. The <b>majority of ATP</b> is made this way.</p>`,
   terms:["substrate-level","electron-carriers","etc","oxidative-phos"]},
  {type:"sort", title:"Substrate-level or oxidative?", q:"<p>Sort each statement by the type of phosphorylation it describes.</p>", bins:["Substrate-level phosphorylation","Oxidative phosphorylation"],
   items:[["Makes a small amount of ATP",0],["ATP made directly in an enzyme/substrate reaction",0],["Happens in glycolysis and the citric acid cycle",0],["Makes the majority of ATP",1],["Needs electron carriers and the electron transport chain",1],["Uses energy from electrons passed to a final acceptor",1]], terms:["substrate-level","oxidative-phos"]},
  {type:"order", title:"Stage by stage", q:"<p>Put the four stages in order, starting with glucose.</p>",
   items:["Glycolysis: glucose is broken down to pyruvate","Pyruvate oxidation: pyruvate becomes acetyl-CoA and CO₂","Citric acid cycle: acetyl-CoA is broken down to CO₂","Oxidative phosphorylation: electron carriers feed the electron transport chain, making ATP"], terms:["four-stages"]},
  {type:"mcq", title:"Which is NOT true?", q:"<p>Which statement about cellular respiration is <b>not</b> true?</p>",
   opts:[["Most of its ATP is made by substrate-level phosphorylation",true," Substrate-level phosphorylation makes only a small amount. The majority comes from oxidative phosphorylation."],["It can use carbohydrates, lipids and proteins as fuel",false," This is true (notes p. 100)."],["Stages 2 to 4 happen in the mitochondria",false," True: only glycolysis is in the cytoplasm."],["Electron carriers from stages 1 to 3 feed the electron transport chain",false," True: that's stage 4."]], terms:["substrate-level","oxidative-phos","cellular-respiration"]}
  ]},

{ id:"redox", title:"Redox and electron carriers", pages:"pp. 101–102", blurb:"OIL RIG, NAD⁺ and FAD, and why oxygen is the final electron acceptor.",
  terms:["redox","oxidation","reduction","electron-carriers","nad","fad","final-acceptor","free-energy"],
  wrap:"Glucose is oxidized to CO₂ and O₂ is reduced to H₂O. In between, NAD⁺ and FAD are reduced to NADH and FADH₂, which hold the energy until the last stage. Next: glycolysis.",
  steps:[
  {type:"review", title:"Oxidized and reduced", fig:figRedox, cap:"<b>Figure 2.1</b> Redox in cellular respiration. (Notes pp. 101–102)",
   text:`<p>In the breakdown of glucose, glucose is <b>oxidized</b> to CO₂ and O₂ is <b>reduced</b> to H₂O. The energy stored in glucose is harnessed in electron carriers as glucose is oxidized. Recall that the carbon atoms of glucose are bonded to other carbons, hydrogens and oxygens.</p>`+remember("OIL RIG"," [[oxidation|Oxidation]] Is Loss of electrons, [[reduction|Reduction]] Is Gain of electrons. Or: LEO the lion says GER (Loss of Electrons is Oxidation, Gain of Electrons is Reduction).")+`<p>[[nad|NAD⁺]] and [[fad|FAD]] are the important [[electron-carriers|electron carriers]]. NAD⁺ and FAD are the oxidized forms; NADH and FADH₂ are the reduced forms.</p>`,
   terms:["oxidation","reduction","redox","nad","fad"]},
  {type:"custom", title:"Follow the electrons", render:api=>simElectrons(api), terms:["redox","nad","final-acceptor"]},
  {type:"sort", title:"Oxidized or reduced form?", q:"<p>Sort each molecule into its oxidized or reduced form.</p>", bins:["Oxidized form","Reduced form"],
   items:[["NAD⁺",0],["FAD",0],["CO₂ (what glucose's carbons become)",0,"Glucose is oxidized to CO₂."],["NADH",1],["FADH₂",1],["H₂O (what O₂ becomes)",1,"O₂ is reduced to H₂O."]], terms:["nad","fad","oxidation","reduction"]},
  {type:"review", title:"Energy released in small steps", fig:figStair, labelsToggle:true, cap:"<b>Figure 2.3</b> Change in free energy in cellular respiration. (Notes p. 102, Fig 7.4)",
   text:`<p>Through glycolysis, pyruvate oxidation and the citric acid cycle, the electron carriers accept electrons and become reduced. The reduced form of a carrier has <b>high potential energy</b>, which is used to make ATP in the final stage.</p><p>The graph shows [[free-energy|the energy being released step by step]]: a little ATP is used at the start, then each drop stores energy as ATP or as NADH or FADH₂. Hide the labels and see if you can say what each drop makes.</p>`,
   terms:["free-energy","nad","fad","atp"]},
  {type:"mcq", title:"The end of the line", q:"<p>What is the final electron acceptor in cellular respiration, and what happens to it?</p>",
   opts:[["O₂; it is reduced to H₂O",true," The original electron donor is glucose; electrons move from molecule to molecule by redox reactions until they reach O₂."],["Glucose; it is oxidized to CO₂",false," Glucose is the original electron donor."],["NAD⁺; it is reduced to NADH",false," NAD⁺ is a carrier in the middle, not the final acceptor."],["CO₂; it is reduced to glucose",false," That runs the other way (photosynthesis)."]], terms:["final-acceptor","reduction"]},
  {type:"mcq", title:"Gaining electrons", q:"<p>In the citric acid cycle, FAD accepts two electrons and two H⁺. What is FAD now?</p>",
   opts:[["Reduced, as FADH₂, with high potential energy",true," Gain of electrons is reduction."],["Oxidized, as FADH₂",false," Gaining electrons is reduction, not oxidation."],["Reduced, as FAD⁺",false," The reduced form is FADH₂."],["Unchanged; FAD only carries protons",false," FAD is an electron carrier."]], terms:["fad","reduction"]}
  ]},

{ id:"glycolysis", title:"Glycolysis", pages:"pp. 103–105", blurb:"Ten reactions in the cytosol: spend 2 ATP, split the sugar, make 4 ATP and 2 NADH.",
  terms:["glycolysis","catabolic","anaerobic","prep-phase","cleavage-phase","payoff-phase","f16bp","g3p","pyruvate"],
  wrap:"Glycolysis spends 2 ATP, splits glucose into two three-carbon molecules, and pays back 4 ATP and 2 NADH, for a net gain of 2 ATP and 2 NADH. Next: pyruvate enters the mitochondria.",
  steps:[
  {type:"review", title:"Ten reactions in the cytosol", fig:()=>figGlycolysis(), cap:"<b>Figure 3.1</b> Glycolysis. (Notes p. 103, Fig 7.5)",
   text:`<p>[[glycolysis|Glycolysis]] is a [[catabolic|catabolic pathway]]: the sum of ten chemical reactions that break down glucose. It goes from one six-carbon glucose to two three-carbon [[pyruvate|pyruvates]].</p><p>It happens in the cytosol, in the presence or absence of O₂, and is considered an [[anaerobic|anaerobic]] process because no oxygen is consumed.</p><p>Three phases: [[prep-phase|phase 1]], where energy is consumed; [[cleavage-phase|phase 2]], where glucose is split into two; and [[payoff-phase|phase 3]], where ATP is one of the products.</p>`+remember("Remember:"," it takes energy to make energy."),
   terms:["glycolysis","prep-phase","cleavage-phase","payoff-phase"]},
  {type:"custom", title:"Run glycolysis", render:api=>simGlycolysis(api), terms:["glycolysis","prep-phase","payoff-phase","substrate-level"]},
  {type:"sort", title:"Which phase?", fig:()=>figGlycolysis(), cap:"<b>Figure 3.1</b> Glycolysis. (Notes pp. 104–105, Figs 7.6 and 7.7)", q:"<p>Sort each event into its phase.</p>", bins:["Phase 1","Phase 2","Phase 3"],
   items:[["Two ATP are used",0],["Phosphates trap glucose in the cell",0],["Fructose 1,6-bisphosphate is made",0],["Fructose 1,6-bisphosphate is split in two",1],["Dihydroxyacetone phosphate becomes a second G3P",1],["Two NADH are produced",2],["Four ATP are produced",2],["Two pyruvates are formed",2]], terms:["prep-phase","cleavage-phase","payoff-phase"]},
  {type:"order", title:"From glucose to pyruvate", q:"<p>Put these molecules in the order they appear in glycolysis.</p>",
   items:["Glucose","Glucose 6-phosphate","Fructose 1,6-bisphosphate","Glyceraldehyde 3-phosphate (two of them)","Pyruvate (two of them)"], terms:["glycolysis","f16bp","g3p","pyruvate"]},
  {type:"mcq", title:"Why add phosphates?", q:"<p>Phase 1 spends two ATP to add phosphate groups to glucose. What does this do?</p>",
   opts:[["It traps the molecule inside the cell and destabilizes it, ready for phase 2",true," Your notes, p. 104."],["It makes ATP by substrate-level phosphorylation",false," Phase 1 uses ATP; it doesn't make any."],["It releases the first CO₂",false," Glycolysis releases no CO₂."],["It reduces NAD⁺",false," That happens at step 6, in phase 3."]], terms:["prep-phase"]},
  {type:"mcq", title:"Anaerobic, but not only", q:"<p>Glycolysis runs in cells that have plenty of oxygen. Why is it still called anaerobic?</p>",
   opts:[["Because no oxygen is consumed in glycolysis",true," It happens in the cytosol with or without O₂."],["Because it only happens when O₂ is absent",false," It happens in both conditions."],["Because it happens inside the mitochondria",false," It happens in the cytosol."],["Because it produces lactic acid",false," Lactic acid comes from fermentation, after glycolysis."]], terms:["anaerobic","glycolysis"]}
  ]},

{ id:"pyruvate", title:"Mitochondria and pyruvate oxidation", pages:"pp. 105–107", blurb:"Two membranes and two spaces, and how pyruvate becomes acetyl-CoA in the matrix.",
  terms:["mitochondria","inner-membrane","intermembrane","matrix","pyruvate-ox","acetyl-coa","coa","pdh","aerobic"],
  wrap:"With O₂ present, each pyruvate enters the matrix and gives 1 CO₂, 1 NADH and 1 acetyl-CoA, so 2 of each per glucose. Next: the citric acid cycle.",
  steps:[
  {type:"review", title:"Inside a mitochondrion", fig:()=>figMito(), labelsToggle:true, cap:"<b>Figure 4.1</b> Mitochondrial structures. (Notes p. 106, Fig 7.8)",
   text:`<p>Stages 2 to 4 take place in the [[mitochondria|mitochondria]]. A mitochondrion has an outer membrane and an [[inner-membrane|inner membrane]], which define two spaces:</p><p>The space between the two membranes is the [[intermembrane|intermembrane space]].<br>The space inside the inner membrane is the [[matrix|mitochondrial matrix]].</p>`,
   terms:["mitochondria","inner-membrane","intermembrane","matrix"]},
  {type:"review", title:"Pyruvate to acetyl-CoA", fig:figPyrOx, cap:"<b>Figure 4.2</b> Pyruvate oxidation. (Notes p. 106, Fig 7.9)",
   text:`<p>When oxygen is present, pyruvate can be oxidized to produce CO₂ and NADH, and ultimately acetyl-CoA. These reactions occur in the mitochondrial matrix.</p><p>Pyruvate is first oxidized to form CO₂ and an acetyl group. The acetyl group is then transferred to [[coa|coenzyme A]], which carries it to the citric acid cycle. These reactions are catalyzed by a group of enzymes called the [[pdh|pyruvate dehydrogenase complex]].</p>`,
   terms:["pyruvate-ox","acetyl-coa","coa","pdh"]},
  {type:"custom", title:"Oxidize both pyruvates", render:api=>simPyrOx(api), terms:["pyruvate-ox","acetyl-coa"]},
  {type:"sort", title:"Where does it happen?", fig:()=>figMito(), cap:"<b>Figure 4.1</b> Mitochondrial structures. (Notes pp. 105–106)", q:"<p>Sort each process or feature by where it is found.</p>", bins:["Cytosol","Matrix","Inner membrane"],
   items:[["Glycolysis",0],["Pyruvate oxidation",1],["Citric acid cycle",1],["Pyruvate dehydrogenase complex",1],["Electron transport chain",2],["ATP synthase",2]], terms:["matrix","inner-membrane","mitochondria"]},
  {type:"mcq", title:"Coenzyme A's job", q:"<p>What does coenzyme A do in pyruvate oxidation?</p>",
   opts:[["It accepts the acetyl group and carries it to the citric acid cycle",true," Together they make acetyl-CoA."],["It removes CO₂ from pyruvate",false," That's done by the pyruvate dehydrogenase complex."],["It carries electrons to the ETC",false," NADH and FADH₂ do that."],["It pumps pyruvate into the matrix",false," Coenzyme A acts on the acetyl group."]], terms:["coa","acetyl-coa"]}
  ]},

{ id:"cac", title:"The citric acid cycle", pages:"pp. 107–108", blurb:"Acetyl-CoA in, CO₂ out: counting carbons, NADH, FADH₂ and ATP around the cycle.",
  terms:["cac","oxaloacetate","acetyl-coa","cac-intermediates","substrate-level","nad","fad"],
  wrap:"Each turn takes in 2 carbons and gives out 2 CO₂, 3 NADH, 1 FADH₂ and 1 ATP, and regenerates oxaloacetate. Two turns per glucose finish its oxidation. Next: where all those carriers go.",
  steps:[
  {type:"review", title:"A cycle that finishes the job", fig:()=>figCAC(), cap:"<b>Figure 5.1</b> The citric acid cycle. (Notes p. 107, Fig 7.10)",
   text:`<p>The [[cac|citric acid cycle]] is also called the Krebs cycle or the TCA (tricarboxylic acid) cycle. It is a cycle because the first reactant, [[oxaloacetate|oxaloacetate]], is regenerated at the end. During this stage the fuel molecules are completely oxidized.</p><p>[[substrate-level|Substrate-level phosphorylation]] makes ATP (via GTP), and the energy carriers NADH and FADH₂ are also made.</p><p>Some organisms use intermediates of the cycle in other pathways. For example, α-ketoglutarate can be modified to form other amino acids and purine bases ([[cac-intermediates|use of intermediates]]).</p>`,
   terms:["cac","oxaloacetate","acetyl-coa","cac-intermediates"]},
  {type:"custom", title:"Count the carbons", render:api=>simCAC(api), terms:["cac","oxaloacetate","nad","fad"]},
  {type:"mcq", title:"Your notes' question", q:"<p><b>Question (notes p. 107):</b> What happens during the citric acid cycle?</p>",
   opts:[["It completes the oxidation of glucose: the acetyl carbons leave as CO₂, and NADH, FADH₂ and ATP are made",true," The fuel molecules are completely oxidized."],["It splits glucose into two pyruvates",false," That's glycolysis."],["It pumps protons across the inner membrane",false," That's the electron transport chain."],["It reduces O₂ to water",false," That happens at complex IV."]], terms:["cac"]},
  {type:"mcq", title:"Why we exhale CO₂", q:"<p>Have you ever thought about why you exhale CO₂? Where does it come from?</p>",
   opts:[["From the oxidation of acetyl-CoA (and of pyruvate) in the mitochondria",true," The carbons of glucose leave as CO₂; the energy goes into NADH and FADH₂."],["From the O₂ you breathe in",false," O₂ becomes water at the end of the ETC."],["From glycolysis in the cytosol",false," Glycolysis releases no CO₂."],["From fermentation in muscle",false," Lactic acid fermentation releases no CO₂."]], terms:["cac","acetyl-coa"]},
  {type:"mcq", title:"Not just for energy", q:"<p>α-Ketoglutarate is taken out of the cycle in some organisms. What can it be used for?</p>",
   opts:[["Making other amino acids and purine bases",true," Cycle intermediates can feed other metabolic pathways."],["Making glycogen",false," Glycogen is made from glucose."],["Pumping protons",false," That's the ETC."],["Nothing: it must stay in the cycle",false," Your notes give it as an example of using intermediates."]], terms:["cac-intermediates"]}
  ]},

{ id:"oxphos", title:"Oxidative phosphorylation", pages:"pp. 108–110", blurb:"The electron transport chain, the proton gradient and ATP synthase.",
  terms:["etc","complexes","proton-gradient","atp-synthase","fo-f1","final-acceptor","inner-membrane","oxidative-phos"],
  wrap:"Electrons from NADH and FADH₂ run down the ETC to O₂; complexes I, III and IV pump H⁺ into the intermembrane space; the H⁺ flow back through ATP synthase, which makes ATP. Next: adding up the ATP.",
  steps:[
  {type:"review", title:"The electron transport chain", fig:figETC, labelsToggle:true, cap:"<b>Figure 6.1</b> Oxidative phosphorylation. (Notes p. 109, Figs 7.12 and 7.13)",
   text:`<p>The NADH and FADH₂ made in the first three stages transfer electrons to carriers in the [[etc|electron transport chain]], in the mitochondrial inner membrane. Electrons enter and move from donor to acceptor until they reach the [[final-acceptor|final electron acceptor]], oxygen. When oxygen accepts the electrons it combines with H⁺ to form water.</p><p>The electrons move through a sequence of redox reactions in [[complexes|complexes I to IV]]. The energy released lets complexes I, III and IV pump protons from the matrix into the intermembrane space, forming a [[proton-gradient|proton gradient]]: high H⁺ in the intermembrane space, low H⁺ in the matrix. Protons cannot diffuse back across the membrane, so the gradient holds high potential energy.</p>`,
   terms:["etc","complexes","proton-gradient","final-acceptor"]},
  {type:"order", title:"The electrons' route", fig:figETC, cap:"<b>Figure 6.1</b> The electron transport chain. (Notes p. 109)", q:"<p>Put the path of electrons from NADH in order.</p>",
   items:["NADH gives its electrons to complex I","Coenzyme Q (CoQ) carries them to complex III","Cytochrome c carries them to complex IV","Complex IV hands them to O₂, which forms H₂O"], terms:["complexes","final-acceptor"]},
  {type:"custom", title:"Pump protons, make ATP", render:api=>simETC(api), terms:["etc","proton-gradient","atp-synthase","final-acceptor"]},
  {type:"review", title:"ATP synthase", fig:()=>figATPSynth(), labelsToggle:true, cap:"<b>Figure 6.4</b> ATP synthase. (Notes p. 110, Fig 7.14)",
   text:`<p>The proton gradient powers [[atp-synthase|ATP synthase]], a molecular machine made of two subunits, [[fo-f1|Fo and F1]].</p><p>How does it work? Protons flow down their concentration gradient. As they pass through the Fo channel, it rotates. The F1 subunit uses this rotational energy to make ATP from ADP + Pi.</p>`,
   terms:["atp-synthase","fo-f1","proton-gradient"]},
  {type:"sort", title:"Which side?", q:"<p>Sort each feature to the side of the inner membrane where it belongs.</p>", bins:["Intermembrane space","Mitochondrial matrix"],
   items:[["High H⁺ concentration",0],["Where complexes I, III and IV pump protons to",0],["Where protons enter ATP synthase from",0],["Low H⁺ concentration",1],["The F1 subunit, where ATP is made",1],["The citric acid cycle",1]], terms:["intermembrane","matrix","proton-gradient"]},
  {type:"mcq", title:"A leaky membrane", q:"<p>Suppose the inner membrane became leaky to protons, while electrons kept flowing to O₂. What would happen to ATP synthesis?</p>",
   opts:[["It would drop: protons leak back without passing through ATP synthase, so there is no gradient to drive it",true," The gradient only works because protons cannot diffuse across the membrane."],["It would rise, because more protons reach the matrix",false," ATP is made only when protons pass through ATP synthase."],["Nothing would change, because electrons still reach O₂",false," Electron flow alone doesn't make ATP; the gradient does."],["Glycolysis would stop",false," Glycolysis is in the cytosol and doesn't need the gradient."]], terms:["proton-gradient","atp-synthase"]}
  ]},

{ id:"yield", title:"Adding up the ATP", pages:"pp. 110, 114", blurb:"How one glucose gives about 32 ATP, and where each one comes from.",
  terms:["atp-yield","substrate-level","oxidative-phos","free-energy","four-stages"],
  wrap:"About 32 ATP per glucose: 2 from glycolysis, 2 from the citric acid cycle and 28 from oxidative phosphorylation. Next: what happens without oxygen.",
  steps:[
  {type:"brief", title:"Energy released slowly", fig:()=>figStages(), cap:"<b>Figure 7.0</b> The four stages of cellular respiration. (Notes p. 114, Fig 7.20)",
   text:`<p>Overall, the energy of glucose is [[free-energy|released slowly]] in a series of reactions.</p><p>Some is released by [[substrate-level|substrate-level phosphorylation]]. Some is captured through redox reactions that transfer energy to the electron carriers NADH and FADH₂. These carriers donate electrons to the ETC, which forms the proton gradient that drives ATP synthase. This is [[oxidative-phos|oxidative phosphorylation]].</p><p>Cellular respiration is a 4-stage process: glycolysis, pyruvate oxidation, the citric acid cycle and oxidative phosphorylation.</p>`, terms:["atp-yield","four-stages"]},
  {type:"custom", title:"Count the ATP", render:api=>simYield(api), terms:["atp-yield","substrate-level","oxidative-phos"]},
  {type:"mcq", title:"Substrate-level share", q:"<p>Of the roughly 32 ATP from one glucose, how many are made by substrate-level phosphorylation?</p>",
   opts:[["4: 2 in glycolysis and 2 in the citric acid cycle",true," The other 28 come from oxidative phosphorylation."],["2",false," Count the citric acid cycle too."],["28",false," That's oxidative phosphorylation."],["32",false," Most ATP comes from oxidative phosphorylation."]], terms:["substrate-level","atp-yield"]},
  {type:"mcq", title:"Where the carriers come from", q:"<p>Which stage produces the most NADH per glucose?</p>",
   opts:[["The citric acid cycle (6 NADH)",true," Glycolysis and pyruvate oxidation make 2 each."],["Glycolysis (2 NADH)",false," Fewer than the cycle."],["Pyruvate oxidation (2 NADH)",false," One per pyruvate."],["Oxidative phosphorylation",false," It uses NADH; it doesn't make it."]], terms:["atp-yield","nad"]}
  ]},

{ id:"anaerobic", title:"Anaerobic conditions", pages:"p. 111", blurb:"Lactic acid and ethanol fermentation, and why regenerating NAD⁺ matters.",
  terms:["anaerobic","aerobic","fermentation","lactic","ethanol","nad"],
  wrap:"Without O₂, pyruvate is reduced: to lactic acid in animal cells and bacteria, or to ethanol and CO₂ in plants and fungi. Either way NAD⁺ is regenerated and glycolysis keeps making 2 ATP per glucose. Next: other fuels.",
  steps:[
  {type:"review", title:"When there is no oxygen", fig:()=>figFerment(), cap:"<b>Figure 8.1</b> Fermentation pathways. (Notes p. 111, Fig 7.16)",
   text:`<p><b>Question (notes p. 111):</b> What happens if oxygen is not available? <b>Answer:</b> the cell is under [[anaerobic|anaerobic conditions]].</p><p>1. The pyruvate from glycolysis can be reduced by [[fermentation|fermentation]]. In bacteria and animal cells it is reduced to lactic acid ([[lactic|lactic acid fermentation]]). This regenerates NAD⁺, which can then be reduced again in glycolysis, so ATP is still made in small amounts.<br>Glucose + 2 ADP + 2 Pi → 2 lactic acid + 2 ATP + 2 H₂O</p><p>2. Plants and fungi undergo [[ethanol|ethanol fermentation]]. Pyruvate releases CO₂ to form acetaldehyde; the electrons from NADH go to acetaldehyde, producing ethanol and NAD⁺.<br>Glucose + 2 ADP + 2 Pi → 2 ethanol + 2 CO₂ + 2 ATP + 2 H₂O</p>`,
   terms:["fermentation","lactic","ethanol","nad"]},
  {type:"custom", title:"No oxygen? Ferment", render:api=>simFerment(api), terms:["fermentation","lactic","ethanol","nad"]},
  {type:"sort", title:"Lactic acid or ethanol?", q:"<p>Sort each feature by the type of fermentation.</p>", bins:["Lactic acid fermentation","Ethanol fermentation","Both"],
   items:[["Animal cells and bacteria",0],["Pyruvate is reduced directly",0],["Plants and fungi",1],["CO₂ is released",1],["Acetaldehyde is made",1],["Regenerates NAD⁺",2],["2 ATP per glucose, from glycolysis",2]], terms:["lactic","ethanol","fermentation"]},
  {type:"mcq", title:"With or without oxygen", q:"<p>Compared with aerobic respiration, how much ATP does a cell get from one glucose by fermentation?</p>",
   opts:[["About 2 ATP instead of about 32",true," Only glycolysis makes ATP; the pyruvate's remaining energy stays in lactic acid or ethanol."],["About 32 ATP, the same",false," Without O₂ there is no oxidative phosphorylation."],["None at all",false," Glycolysis still makes 2 ATP."],["About 4 ATP",false," Glycolysis makes 4 but uses 2: net 2."]], terms:["fermentation","aerobic","anaerobic"]}
  ]},

{ id:"integration", title:"Metabolic integration", pages:"pp. 112–113", blurb:"Storing glucose as glycogen and starch, dietary sugars, fats and proteins as fuel.",
  terms:["glycogen","starch","monosaccharide","disaccharide","fatty-acid","beta-ox","fuel-entry"],
  wrap:"Glucose is stored as glycogen (animals) or starch (plants); other sugars, glycerol, fatty acids and amino acids feed into the same four stages at different points. Last: one glucose, start to finish.",
  steps:[
  {type:"review", title:"Storing extra glucose", fig:figStorage, cap:"<b>Figure 9.1</b> Glucose storage. (Notes p. 112, Fig 7.17)",
   text:`<p>Plants and animals can store excess glucose for glycolysis later, as branched polymers of glucose. Glucose monomers are cleaved off one at a time and enter glycolysis as an intermediate.</p><p>Plants store glucose as [[starch|starch]] (potatoes, wheat, corn). Animals store it as [[glycogen|glycogen]], a branched chain of glucose attached to a central protein: in muscle cells for energy to power contraction, and in the liver for the whole body.</p>`,
   terms:["glycogen","starch"]},
  {type:"review", title:"Other sugars", fig:figSugars, cap:"<b>Figure 9.2</b> Dietary sugars. (Notes p. 112, Fig 7.18)",
   text:`<p>Digested carbohydrates give a variety of [[disaccharide|disaccharides]] and [[monosaccharide|monosaccharides]], which may produce glucose or other glycolysis intermediates.</p><p>Disaccharides: maltose, lactose and sucrose. Monosaccharides: glucose, galactose, fructose and mannose.</p>`,
   terms:["disaccharide","monosaccharide"]},
  {type:"sort", title:"One sugar or two?", q:"<p>Sort these sugars.</p>", bins:["Monosaccharide","Disaccharide"],
   items:[["Glucose",0],["Galactose",0],["Fructose",0],["Mannose",0],["Maltose",1],["Lactose (milk)",1],["Sucrose (table sugar)",1]], terms:["monosaccharide","disaccharide"]},
  {type:"custom", title:"Where do other fuels enter?", render:api=>simFuel(api), terms:["fuel-entry","fatty-acid","beta-ox"]},
  {type:"mcq", title:"Beta-oxidation", q:"<p>Which statement about β-oxidation is right?</p>",

    right.append(h("h2",{},t.n),h("p",{},t.d),h("p",{class:"notes-ref"},h("b",{},"Course notes: "),`p. ${t.p}`));
    const rel=related(k); if(rel.length){ right.append(h("p",{class:"muted small",style:"margin:10px 0 0"},"Related")); right.append(termChips(rel)); } }
  function intro(t){ right.innerHTML=""; right.append(h("h2",{},VIEWS.find(v=>v[0]===mode)[1]),h("p",{},t)); }
  function draw(){ stopLoops(); host.innerHTML="";
    const put=(svg,cap)=>{ const f=plate(svg,cap); host.append(f); bindTerms(f,info); return f; };
    const M={
      mito:()=>{ put(figMito({stages:true}),"<b>Viewer</b> A mitochondrion and where each stage happens (Notes pp. 105–106, Fig 7.8)"); intro("Outer membrane, intermembrane space, folded inner membrane and matrix. Glycolysis is outside, in the cytosol; stages 2 to 4 are inside."); },
      stages:()=>{ put(figStages(),"<b>Viewer</b> The four stages (Notes p. 100, Fig 7.2)"); intro("Glycolysis, pyruvate oxidation, citric acid cycle, oxidative phosphorylation."); },

      redox:()=>{ put(figRedox(),"<b>Viewer</b> Redox in respiration (Notes pp. 101–102)"); intro("OIL RIG. Glucose is oxidized, O₂ is reduced, and NAD⁺ and FAD carry the electrons in between."); },

      gly:()=>{ put(figGlycolysis(),"<b>Viewer</b> Glycolysis (Notes pp. 103–105, Figs 7.5 to 7.7)"); intro("Phase 1 uses 2 ATP, phase 2 splits the sugar, phase 3 makes 4 ATP and 2 NADH."); },
      pyr:()=>{ put(figPyrOx(),"<b>Viewer</b> Pyruvate oxidation (Notes p. 106, Fig 7.9)"); intro("Pyruvate → acetyl-CoA + CO₂ + NADH, in the matrix."); },
      cac:()=>{ put(figCAC(),"<b>Viewer</b> The citric acid cycle (Notes p. 107, Fig 7.10)"); intro("2C in, 2 CO₂ out, 3 NADH, 1 FADH₂ and 1 ATP per turn."); },
      etc:()=>{ put(figETC(),"<b>Viewer</b> The electron transport chain (Notes p. 109, Figs 7.12 and 7.13)"); intro("Complexes I, III and IV pump H⁺ into the intermembrane space; O₂ is the final electron acceptor."); },

      yield:()=>{ put(figYield(true),"<b>Viewer</b> ATP yield (Notes p. 110, Fig 7.15)"); intro("About 32 ATP per glucose."); },
      ferm:()=>{ put(figFerment(),"<b>Viewer</b> Fermentation pathways (Notes p. 111, Fig 7.16)"); intro("Lactic acid or ethanol: both regenerate NAD⁺."); },

/* ============ router ============ */
function go(view){
  stopLoops(); exploreHook=null; RUN=null; tc.classList.remove("show"); tip.style.display="none";
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go===view)));
  if(view==="atlas") atlasView(); else if(view==="checkpoint") checkpointView(); else if(view==="glossary") glossaryView(); else if(view==="exam") examView(); else homeView();
  window.scrollTo(0,0);
}
$$(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.go)));
$("#home").addEventListener("click",()=>go("story"));
function fromHash(){
  const m=location.hash.match(/^#ch=(\d+)/);
  if(m && CHAPTERS[+m[1]-1]){ RUN=null; renderChapter(+m[1]-1,0); return true; }
  if(location.hash==="#exam"){ go("exam"); return true; }
  return false;
}
window.addEventListener("hashchange",fromHash);
