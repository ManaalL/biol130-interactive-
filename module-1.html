<!DOCTYPE html>
<html lang="en" data-module="m1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The cell theory | BIOL 130 Module 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,650;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eef3ec; --paper:#ffffff; --ink:#1c2830; --ink2:#4b5b64; --rule:#cbd5d7;
  --head:#23282e; --accent:#3f8a4c; --accentInk:#ffffff; --accentSoft:#e4f1e5;
  --ok:#2a7648; --okSoft:#e2f2e7; --bad:#a53838; --badSoft:#f7e4e2;
  --plate:#ffffff; --plateRule:#c3cdd0; --cap:#3b4a52; --chip:#f1f5f5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
    --head:#e8eeea; --accent:#7fcf8c; --accentInk:#0e1d11; --accentSoft:#1d3322;
    --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
    --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
  }
}
:root[data-theme="dark"]{
  --page:#0f171b; --paper:#162228; --ink:#e2eaec; --ink2:#a5b5bb; --rule:#2b3b42;
  --head:#e8eeea; --accent:#7fcf8c; --accentInk:#0e1d11; --accentSoft:#1d3322;
  --ok:#6cc394; --okSoft:#17311f; --bad:#e8908b; --badSoft:#3a1e1e;
  --plate:#f4f7f7; --plateRule:#3a4a51; --cap:#b9c7cc; --chip:#1d2b31;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--head);font-weight:650;line-height:1.2;margin:0}
p{margin:0 0 .8em}
sup{font-size:.7em;line-height:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--serif);font-size:1.45rem;color:var(--head);font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--rule);background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* figure plates */
.plate{background:var(--plate);border:1px solid var(--plateRule);border-radius:4px;padding:10px 10px 8px;margin:0;position:relative}
.plate svg,.plate canvas{display:block;width:100%;height:auto}
.plate figcaption{font-family:var(--serif);font-size:.93rem;color:#3b4a52;padding:8px 4px 2px;line-height:1.4}
.plate figcaption b{font-weight:650;color:#3f8a4c}
.plate .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.mini{font-size:.82rem;padding:4px 9px;border-radius:5px;border:1px solid #c3cdd0;background:#fff;color:#1c2830;cursor:pointer}
.mini:hover{background:#eef4f4}
.mini[aria-pressed="true"]{background:#3f8a4c;color:#fff;border-color:#3f8a4c}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:2.3rem;letter-spacing:-.015em;margin-bottom:12px}
.lede{font-size:1.08rem;color:var(--ink);max-width:36em}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.chlist{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chitem{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.chitem:hover{border-color:var(--accent)}
.chnum{font-family:var(--serif);font-size:1.6rem;color:var(--accent);grid-row:span 2;line-height:1}
.chitem h3{font-size:1.1rem}
.chitem .meta{grid-column:2;color:var(--ink2);font-size:.88rem}
.done-tag{color:var(--ok);font-weight:600}
.sect{margin-top:34px}
.sect h2{font-size:1.35rem;margin-bottom:6px}

/* chapter */
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.crumb h1{font-size:1.6rem}
.crumb .back{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.steps{display:flex;gap:4px;flex:1;min-width:160px;max-width:420px;margin-left:auto}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--head)}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide>.panel{max-width:860px}
.stage.wide>.panel:has(.pad){max-width:none}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.kicker{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--accent);background:var(--accentSoft);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.bad{border-color:var(--bad);background:var(--badSoft)}
.fb > b:first-child{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.explored{font-size:.9rem;color:var(--ink2);margin-top:6px}
.termlinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tl{border:1px solid var(--rule);background:var(--chip);border-radius:14px;padding:3px 10px;font-size:.86rem;cursor:pointer}
.tl:hover{border-color:var(--accent)}
.tl.inl{background:none;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;color:var(--accent);padding:0 1px!important;font-weight:600}
.tl.inl:hover{background:var(--accentSoft)}
.tl.seen{border-color:var(--accent);color:var(--accent)}

/* order + sort */
.order{display:grid;gap:8px;margin:10px 0}
.pool .card,.slot{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;background:var(--paper);line-height:1.35}
.pool{display:grid;gap:8px;margin:10px 0}
.pool .card{border-style:solid;cursor:pointer;text-align:left}
.pool .card:hover{border-color:var(--accent)}
.pool .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot .n{font-family:var(--serif);color:var(--accent);font-weight:650;min-width:1.2em}
.slot.filled{border-style:solid;cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--okSoft)}
.slot.wrong{border-color:var(--bad);background:var(--badSoft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bin{border:1px solid var(--rule);border-radius:6px;padding:8px;min-height:90px;background:var(--chip);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.92rem;font-family:var(--sans);color:var(--head)}
.bin .card{display:block;width:100%;font-size:.88rem;padding:5px 8px;margin-bottom:5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);text-align:left;cursor:pointer}
.bin .card.right{border-color:var(--ok);background:var(--okSoft)}
.bin .card.wrong{border-color:var(--bad);background:var(--badSoft)}
.bin:hover{border-color:var(--accent)}

/* controls in sims */
.ctl{display:grid;gap:10px;margin:10px 0}
.ctl label{font-weight:600;font-size:.92rem;display:block;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:7px 10px;background:var(--paper);border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:.9rem;min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink2)}
.meter{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}

/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}
.tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tok.used{opacity:.4}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}

/* term card */
.termcard{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px));background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,40,.18);padding:16px 18px;z-index:50;display:none;max-height:70vh;overflow:auto}
.termcard.show{display:block}
.termcard h3{font-size:1.2rem;margin-bottom:6px;padding-right:28px}
.termcard .x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--ink2);line-height:1;padding:4px 8px}
.termcard .rel{font-size:.86rem;color:var(--ink2);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:#2a2e35;color:#fff;font-size:.82rem;padding:4px 8px;border-radius:4px;z-index:60;display:none;white-space:nowrap}

/* svg hotspots */
[data-term]{cursor:pointer}
[data-term]:hover > .hl, [data-term]:focus > .hl{stroke:#3f8a4c;stroke-width:3}
[data-term]:focus{outline:none}
[data-term].hit > .hl{stroke:#3f8a4c}
[data-term]:hover{filter:brightness(1.06)}
.lbl{font-family:"Source Sans 3",Arial,sans-serif;font-size:13px;fill:#1c2830}
.lbl.sm{font-size:11.5px}
.lbl.it{font-style:italic;fill:#3b4a52}
.lead{stroke:#5b6b73;stroke-width:1;fill:none}
.labels-off .lbls{display:none}

/* checkpoint */
.idcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.idcard .hd{background:var(--head);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
:root[data-theme="dark"] .idcard .hd{color:#0f171b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idcard .hd{color:#0f171b}}
.idcard .hd b{font-family:var(--serif);font-size:1.25rem}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:12px 14px}
.idcard dt{color:var(--ink2);font-size:.9rem}
.idcard dd{margin:0;font-weight:600}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.gate{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;background:var(--paper);cursor:pointer;text-align:left;font-size:.92rem;line-height:1.3}
.gate:hover:not([disabled]){border-color:var(--accent)}
.gate small{display:block;color:var(--ink2);font-size:.8rem;margin-top:2px}
.gate.right{border-color:var(--ok);background:var(--okSoft)}
.gate.wrong{border-color:var(--bad);background:var(--badSoft)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* glossary */
.gl{columns:2 360px;column-gap:28px}
.gl section{break-inside:avoid;margin-bottom:22px}
.gl h2{font-size:1.2rem;margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.gi b{font-weight:700}
.gi p{grid-column:1 / -1;margin:0;color:var(--ink2);font-size:.94rem}
.st{font-size:.78rem;border-radius:10px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.st.tested{border-color:var(--ok);color:var(--ok)}
.st.seen{border-color:var(--accent);color:var(--accent)}

/* atlas */
.atlas{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:24px;align-items:start}
.atlas svg{touch-action:manipulation}
.quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accentSoft);border-radius:6px;padding:10px 14px;margin-bottom:12px}

.summary{max-width:720px}
.big{font-family:var(--serif);font-size:3rem;color:var(--accent);line-height:1}
.foot{margin-top:40px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}


/* course-notes styling */
.banner{display:flex;align-items:stretch;margin:0 0 16px;min-height:44px}
.banner .num{background:#2e6b39;color:#fff;font-family:var(--serif);font-weight:650;font-size:1.25rem;padding:8px 16px;display:flex;align-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.18);position:relative;z-index:1}
.banner .ttl{flex:1;background:#4f9d5c;color:#fff;display:flex;align-items:center;padding:6px 18px;font-variant:small-caps;letter-spacing:.04em;font-weight:700;font-size:1.15rem;margin-left:-2px}
.banner .pg{background:#4f9d5c;color:#ffffff;display:flex;align-items:center;padding:0 14px;font-size:.85rem;white-space:nowrap}
.remember{display:flex;gap:12px;align-items:flex-start;background:#e4ebf2;border-radius:4px;padding:10px 14px;margin:10px 0;color:#1c2830;box-shadow:1px 1px 0 rgba(0,0,0,.08)}
.remember .key{flex:none;width:28px;height:28px}
.remember b{display:block;font-family:var(--serif)}
.dyk{background:#e9f2e2;border-left:4px solid #3f8a4c;border-radius:0 4px 4px 0;padding:10px 14px;margin:10px 0;font-style:italic;color:#2a1c18}
.dyk b{font-style:normal}
.notes-ref{font-size:.85rem;color:var(--ink2);margin:4px 0 10px}
.notes-ref b{color:var(--accent)}
.homelink{color:var(--ink2);font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;margin-right:4px}
.homelink:hover{color:var(--accent);border-color:var(--accent)}
.seqrow{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.seqrow .end{font-weight:700;color:var(--ink2);min-width:26px;text-align:center}
.nt{width:30px;height:34px;border:1px solid var(--rule);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;background:var(--paper);color:var(--ink)}
.nt.A{background:#8e6cc4;color:#fff;border-color:#6a4e9b}.nt.G{background:#dd5f45;color:#fff;border-color:#b0452f}
.nt.T{background:#3a9a9a;color:#fff;border-color:#2a7676}.nt.C{background:#f0cf4f;color:#3a2e00;border-color:#c9a92c}
.nt.U{background:#86b851;color:#fff;border-color:#618f33}
.nt.slot{border-style:dashed;cursor:pointer}.nt.slot.cur{box-shadow:0 0 0 2px var(--accent)}
.nt.ok{outline:2px solid var(--ok)}.nt.no{outline:2px solid var(--bad)}
.pad{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pad button{width:46px;height:42px;border-radius:6px;border:1px solid var(--rule);font-weight:700;font-size:1.05rem;cursor:pointer}
.pad button.A{background:#8e6cc4;color:#fff}.pad button.G{background:#dd5f45;color:#fff}.pad button.T{background:#3a9a9a;color:#fff}.pad button.C{background:#f0cf4f;color:#3a2e00}.pad button.U{background:#86b851;color:#fff}
.pad button.del{width:auto;padding:0 12px;background:var(--paper);font-size:.9rem}

@media (max-width: 880px){
  body{font-size:16px}
  .hero,.stage,.atlas{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:1.8rem}
  .topin{padding:8px 14px;gap:8px}
  .tabs{margin-left:0;width:100%}
  .tab{padding:5px 9px;font-size:.92rem}
  .brand span{display:none}
  .wrap{padding:16px 12px 60px}
  .steps{max-width:none;min-width:100%;order:3}
  .termcard{right:0;left:0;bottom:0;width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px){.banner{flex-wrap:wrap}.banner .pg{flex-basis:100%;padding:4px 14px 6px;white-space:normal}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="brand" id="home" aria-label="Module 1 home"><b>Introduction to Cell Biology and the Cell Theory</b><span>BIOL 130, Module 1</span></button>
  <nav class="tabs" aria-label="Sections">
    <a class="homelink" id="hubLink" href="index.html" target="_top">All modules</a>
    <button class="tab" data-go="story">Chapters</button>
    <button class="tab" data-go="atlas">Cell atlas</button>
    <button class="tab" data-go="checkpoint">Is it alive?</button>
    <button class="tab" data-go="exam">Mini exam</button>
    <button class="tab" data-go="glossary">Glossary</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<aside class="termcard" id="termcard" role="dialog" aria-live="polite"><button class="x" aria-label="Close">×</button><div id="tcbody"></div></aside>
<div class="tip" id="tip"></div>
<script src="studydata.js"></script>
<script src="exam.js"></script>
<script src="kip.js"></script>
<script>
"use strict";
/* ============ storage ============ */
const KEY = "biol130-m1-progress-v1";
let P = { ch:{}, terms:{}, cp:{best:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
function markTerm(k, level){
  const order = {seen:1, tested:2};
  const cur = P.terms[k];
  if (!cur || order[level] > order[cur]) { P.terms[k] = level; save(); }
}
/* ============ glossary data (p = course notes page) ============ */
const T = {
 "cell":{n:"Cell",g:"Seeing cells",p:"4",d:"The fundamental, basic unit of life. Every organism is made of either a single cell or a group of cells."},
 "hooke":{n:"Robert Hooke (1665)",g:"Seeing cells",p:"4",d:"Looked at thin slices of cork and described its chambers as \"cells\". He was really looking at empty walls, the remains of dead cells."},
 "leeuwenhoek":{n:"Anton van Leeuwenhoek (1673–1700)",g:"Seeing cells",p:"4",d:"An early light microscopist who improved the magnifying power of microscope lenses. He saw living \"animalcules\" swimming in pond water."},
 "light-microscopy":{n:"Light microscopy",g:"Seeing cells",p:"4",d:"Uses visible light and glass lenses. Good for whole cells and tissues, including living ones; it cannot show the smallest structures."},
 "electron-microscopy":{n:"Electron microscopy",g:"Seeing cells",p:"4",d:"Uses a beam of electrons instead of light, so it can show much finer detail, such as the surface of bacteria or structures smaller than a micrometre."},
 "fluorescence-microscopy":{n:"Fluorescence microscopy",g:"Seeing cells",p:"4",d:"Uses dyes that glow to label specific parts of a cell. In your notes, DAPI stains the nucleus blue and phalloidin stains actin."},
 "cell-theory":{n:"The cell theory",g:"The cell theory",p:"5",d:"A pillar of modern biology, with three tenets: 1. All living organisms are composed of one (unicellular) or more (multicellular) cells. 2. Each cell is the structural and functional unit of life. 3. Cells can arise only from pre-existing cells."},
 "schleiden":{n:"Schleiden",g:"The cell theory",p:"5",d:"A botanist who noted that all plant tissues are composed of cells and that plant embryos arise from a single cell. With Schwann, proposed the first two tenets."},
 "schwann":{n:"Schwann",g:"The cell theory",p:"5",d:"A zoologist who came to the same conclusion about animals, and saw that plants and animals are similar. With Schleiden, proposed the first two tenets."},
 "virchow":{n:"Virchow",g:"The cell theory",p:"5",d:"A physician who added the third tenet of the cell theory: cells can arise only from pre-existing cells."},
 "unicellular":{n:"Unicellular and multicellular",g:"The cell theory",p:"5",d:"A unicellular organism is a single cell (a bacterium, a yeast cell). A multicellular organism is made of many cells (a plant, a mouse)."},
 "exception":{n:"Exceptions to the cell theory",g:"Not quite cells",p:"5",d:"Viruses, viroids and prions. They are not made of cells and cannot reproduce on their own, yet they can be copied inside living cells."},
 "virus":{n:"Virus",g:"Not quite cells",p:"5",d:"A small amount of nucleic acid (DNA or RNA) inside a protein coat, sometimes with an outer envelope. Outside a living cell it is inert; it needs a host cell to reproduce."},
 "capsid":{n:"Capsid",g:"Not quite cells",p:"5",d:"The protein coat of a virus, which surrounds its genome."},
 "viral-genome":{n:"Viral genome",g:"Not quite cells",p:"5",d:"The virus's genetic material, DNA or RNA, packed inside the capsid."},
 "viroid":{n:"Viroid",g:"Not quite cells",p:"5",d:"A small circular RNA with no protein coat. It needs the host's machinery to replicate. Example: potato spindle tuber viroid."},
 "prion":{n:"Prion",g:"Not quite cells",p:"5",d:"A proteinaceous infectious particle with NO nucleic acid. A misfolded form of the prion protein (PrP^Sc) makes the normal form (PrP^C) misfold too, and the misfolded protein piles up, leaving holes in brain tissue."},
 "host-cell":{n:"Host cell",g:"Not quite cells",p:"5",d:"A living cell that a virus or viroid uses to copy itself. It supplies the ribosomes, enzymes and energy the virus lacks."},
 "cell-properties":{n:"Basic properties of cells",g:"What all cells share",p:"6",d:"Cells are highly complex and organized, enclosed by a plasma membrane; have a genetic program (DNA); can reproduce; acquire and use energy; carry out chemical reactions; do mechanical work; respond to stimuli; and regulate themselves."},
 "plasma-membrane":{n:"Cell (plasma) membrane",g:"What all cells share",p:"6",d:"The physical barrier that encloses every cell and separates it from the outside. It controls what goes in and out."},
 "cytoplasm":{n:"Cytoplasm",g:"What all cells share",p:"6",d:"All the contents found inside the cell membrane. (Module 3 refines this: the contents minus the nucleus.)"},
 "cytosol":{n:"Cytosol",g:"What all cells share",p:"6",d:"The jelly-like internal fluid of a cell: the cytoplasm minus the organelles. It contains water, dissolved ions and molecules."},
 "nucleic-acids":{n:"Nucleic acids (DNA, RNA)",g:"What all cells share",p:"6",d:"The information molecules of the cell. DNA (deoxyribonucleic acid) stores the genetic program; RNA (ribonucleic acid) carries it to be used. Covered in detail in Modules 2 and 4."},
 "dna":{n:"DNA",g:"What all cells share",p:"6",d:"Deoxyribonucleic acid, the genetic material of every cell. Its genes are transcribed into RNA."},
 "rna":{n:"RNA",g:"What all cells share",p:"6",d:"Ribonucleic acid. Made from DNA by transcription, then translated into protein."},
 "protein":{n:"Protein",g:"What all cells share",p:"6",d:"The functional product of most genes, made by translation of RNA. Proteins do most of the work in a cell."},
 "gene":{n:"Gene",g:"What all cells share",p:"6",d:"The DNA code for the information needed to produce a functional product, such as a protein."},
 "central-dogma":{n:"The central dogma",g:"What all cells share",p:"6",d:"The flow of genetic information: DNA is transcribed into RNA, and RNA is translated into protein."},
 "transcription":{n:"Transcription",g:"What all cells share",p:"6",d:"Making RNA from a DNA template. The \"language\" stays the same (nucleic acid to nucleic acid)."},
 "translation":{n:"Translation",g:"What all cells share",p:"6",d:"Making a protein from the information in RNA. The language changes from nucleotides to amino acids."},
 "bioenergetics":{n:"Bioenergetics",g:"What all cells share",p:"6",d:"How cells acquire and use energy. Example: plants convert light energy into chemical energy."},
 "metabolism":{n:"Metabolism",g:"What all cells share",p:"6",d:"All the chemical reactions in a cell, organized into metabolic pathways such as glycolysis and the citric acid cycle."},
 "atp":{n:"Adenosine triphosphate (ATP)",g:"What all cells share",p:"6",d:"The cell's energy currency: adenine + ribose + three phosphate groups. The bonds linking the phosphate groups have high potential energy. With one phosphate it is AMP, with two ADP."},
 "adenine":{n:"Adenine",g:"What all cells share",p:"6",d:"The nitrogen-containing base in ATP. Adenine plus ribose is adenosine."},
 "ribose":{n:"Ribose",g:"What all cells share",p:"6",d:"The five-carbon sugar in ATP (and in RNA)."},
 "phosphate-group":{n:"Phosphate groups (AMP, ADP, ATP)",g:"What all cells share",p:"6",d:"Adenosine with one phosphate is AMP, with two is ADP, with three is ATP. The bonds between phosphates carry high potential energy."},
 "self-regulation":{n:"Self-regulation and response to stimuli",g:"What all cells share",p:"6",d:"Cells respond to signals using receptors, and control their own activities. A cell that loses self-regulation can grow uncontrollably."},
 "prokaryote":{n:"Prokaryote",g:"Prokaryotes",p:"7",d:"\"Before nucleus\". Single-celled organisms with no nucleus and no membrane-bound organelles. The most abundant organisms on Earth. Two domains: Bacteria and Archaea."},
 "eukaryote":{n:"Eukaryote",g:"Prokaryotes",p:"7",d:"\"True nucleus\". Cells with a membrane-bound nucleus and many organelles. Domain Eukarya: protists, fungi, plants and animals."},
 "tree-of-life":{n:"Tree of life",g:"Prokaryotes",p:"7",d:"The evolutionary tree of all organisms, with three domains: Bacteria, Archaea and Eukarya. Most of life's diversity is microbial."},
 "bacteria":{n:"Domain Bacteria",g:"Prokaryotes",p:"7",d:"Prokaryotes with a single circular chromosome. Many have plasmids, and they have a cell wall surrounding the cell membrane."},
 "archaea":{n:"Domain Archaea",g:"Prokaryotes",p:"7",d:"Prokaryotes with a single circular chromosome and an isoprenoid cell membrane. They often inhabit extreme environments. Eukaryotes are thought to have descended from within the Archaea."},
 "eukarya":{n:"Domain Eukarya",g:"Prokaryotes",p:"7",d:"All eukaryotes. Plants and animals lie on branches within the Eukarya."},
 "nucleoid":{n:"Nucleoid",g:"Prokaryotes",p:"6–7",d:"The region of a prokaryotic cell where its single circular chromosome sits. It is not enclosed by a membrane."},
 "plasmid":{n:"Plasmid",g:"Prokaryotes",p:"7",d:"A small circle of extra DNA found in many bacteria, separate from the main chromosome."},
 "cell-wall":{n:"Cell wall",g:"Prokaryotes",p:"7, 9",d:"A rigid layer outside the plasma membrane. Bacteria have one; fungal walls contain chitin; plant walls are made of polysaccharides. Animal cells have none."},
 "flagellum":{n:"Flagellum (plural flagella)",g:"Prokaryotes",p:"6–7",d:"A long whip-like structure some cells use to move."},
 "ribosome":{n:"Ribosome",g:"Prokaryotes",p:"7, 9",d:"The machine that makes proteins (translation). Found in every cell, prokaryotic and eukaryotic. It has no membrane, so it is not part of the endomembrane system."},
 "binary-fission":{n:"Binary fission",g:"Prokaryotes",p:"7",d:"How prokaryotes reproduce: one cell copies its DNA and divides into two."},
 "bacterial-shapes":{n:"Bacterial shapes",g:"Prokaryotes",p:"7",d:"Spheres (Streptococcus, in strings), rods (E. coli), helices (Streptomyces). Sizes range up to Thiomargarita namibiensis, the largest known bacterial cell. Myxobacteria aggregate into fruiting bodies."},
 "organelle":{n:"Organelle",g:"Inside a eukaryotic cell",p:"9",d:"A specialized structure inside a eukaryotic cell that carries out a particular job, such as the nucleus, mitochondria or Golgi apparatus."},
 "protists":{n:"Protists",g:"Eukaryotes",p:"8",d:"A diverse group of eukaryotes, mostly single cells but some form colonies. Includes algae (Volvox), water molds (potato blight), slime molds and protozoa (ciliates)."},
 "fungi":{n:"Fungi",g:"Eukaryotes",p:"8",d:"Eukaryotes with cell walls containing chitin. Includes yeasts, rusts, smuts, mildews, molds and mushrooms. They are heterotrophs that absorb food directly from the environment."},
 "chitin":{n:"Chitin",g:"Eukaryotes",p:"8",d:"A modified polysaccharide found in fungal cell walls."},
 "heterotroph":{n:"Heterotroph",g:"Eukaryotes",p:"8–9",d:"An organism that depends on preformed organic molecules for its carbon and energy. Fungi and animals are heterotrophs."},
 "autotroph":{n:"Autotroph",g:"Eukaryotes",p:"9",d:"An organism that produces its own food. Plants use chloroplasts to convert the sun's energy into chemical energy."},
 "plants":{n:"Plants",g:"Eukaryotes",p:"9",d:"Multicellular autotrophs with cell walls made of polysaccharides, large water-filled vacuoles, chloroplasts, and connections between cells called plasmodesmata."},
 "animals":{n:"Animals",g:"Eukaryotes",p:"9",d:"Multicellular heterotrophs with no cell walls, which gain energy and carbon from preformed organic molecules and have a distinct mode of early development."},
 "vacuole":{n:"Vacuole",g:"Eukaryotes",p:"9",d:"A membrane-bound sac. Plant cells have a large water-filled vacuole that gives structural rigidity by contributing to turgor pressure."},
 "plasmodesmata":{n:"Plasmodesmata",g:"Eukaryotes",p:"9",d:"Channels through the cell wall that connect neighbouring plant cells."},
 "chloroplast":{n:"Chloroplast",g:"Eukaryotes",p:"9",d:"The organelle where plant cells harness the energy of sunlight to make sugars. Not part of the endomembrane system."},
 "nucleus":{n:"Nucleus and nuclear envelope",g:"Inside a eukaryotic cell",p:"9",d:"The nucleus is the membrane-bound storehouse for the cell's chromosomes and the site of RNA synthesis. The nuclear envelope around it is part of the endomembrane system."},
 "nucleolus":{n:"Nucleolus",g:"Inside a eukaryotic cell",p:"9",d:"A dense region inside the nucleus where ribosome parts are made. Not part of the endomembrane system."},
 "nuclear-pores":{n:"Nuclear pores",g:"Inside a eukaryotic cell",p:"9",d:"Openings in the nuclear envelope that let molecules such as RNA move between the nucleus and the cytoplasm. (More in Module 3, p. 38.)"},
 "endomembrane":{n:"Endomembrane system (EMS)",g:"Inside a eukaryotic cell",p:"9",d:"Builds, modifies and transports cellular materials. Includes the nuclear envelope, rough and smooth ER, Golgi apparatus, lysosomes, vesicles and the plasma membrane."},
 "non-endomembrane":{n:"Non-endomembrane structures",g:"Inside a eukaryotic cell",p:"9",d:"Organelles that are not part of the EMS: mitochondria, chloroplasts, peroxisomes, ribosomes, the nucleolus, cytoskeleton, centrosomes and cilia/flagella."},
 "er":{n:"Endoplasmic reticulum (smooth and rough)",g:"Inside a eukaryotic cell",p:"9",d:"A network of membranes involved in both protein and lipid synthesis. Rough ER has ribosomes attached; smooth ER does not."},
 "golgi":{n:"Golgi apparatus",g:"Inside a eukaryotic cell",p:"9",d:"Modifies and sorts proteins and lipids as they move to their final destinations inside or outside the cell."},
 "lysosome":{n:"Lysosome",g:"Inside a eukaryotic cell",p:"9",d:"Contains enzymes that break down macromolecules such as proteins, nucleic acids, lipids and carbohydrates."},
 "vesicle":{n:"Vesicle",g:"Inside a eukaryotic cell",p:"9",d:"A small membrane sac that carries material between parts of the endomembrane system."},
 "mitochondria":{n:"Mitochondrion",g:"Inside a eukaryotic cell",p:"9",d:"Produces most of the ATP that serves as the energy currency of the cell. Not part of the endomembrane system."},
 "peroxisome":{n:"Peroxisome",g:"Inside a eukaryotic cell",p:"9",d:"Breaks down specific organic molecules such as fatty acids, and synthesizes others such as cholesterol and some phospholipids. Not part of the endomembrane system."},
 "cytoskeleton":{n:"Cytoskeleton",g:"Inside a eukaryotic cell",p:"9",d:"A network of protein filaments and associated proteins that gives the cell an internal structural framework."},
 "model-organism":{n:"Model organism",g:"Model organisms",p:"10",d:"A non-human species studied to understand biology in general. Your notes list E. coli, yeast, Arabidopsis, Drosophila, C. elegans and the mouse."},
 "ecoli":{n:"Escherichia coli (bacterium)",g:"Model organisms",p:"10",d:"Used to study DNA replication, gene transcription and translation."},
 "yeast":{n:"Saccharomyces cerevisiae (yeast)",g:"Model organisms",p:"10",d:"Used to study the cell cycle: the \"minimal model eukaryote\". Reproduces by budding."},
 "arabidopsis":{n:"Arabidopsis thaliana (plant)",g:"Model organisms",p:"10",d:"A model for flowering plants, which are closely related to each other."},
 "drosophila":{n:"Drosophila melanogaster (fruit fly)",g:"Model organisms",p:"10",d:"Used to study genetics and development."},
 "celegans":{n:"Caenorhabditis elegans (worm)",g:"Model organisms",p:"10",d:"The first animal genome to be sequenced. The location, lineage and fate of every cell in the embryo, larva and adult is known."},
 "mouse":{n:"Mus musculus (mouse)",g:"Model organisms",p:"10",d:"The \"model mammal\", with well understood genetics."}
};

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let activeLoops = [];
function loop(fn){ let on = true, last = performance.now(); const tick = t => { if(!on) return; const dt = Math.min(0.05,(t-last)/1000); last = t; fn(dt,t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); const s = {stop(){on=false;}}; activeLoops.push(s); return s; }
function stopLoops(){ activeLoops.forEach(l=>l.stop()); activeLoops = []; }
function plate(svgOrEl, caption){
  const f = h("figure",{class:"plate"});
  if (typeof svgOrEl === "string") f.insertAdjacentHTML("beforeend", svgOrEl); else f.append(svgOrEl);
  if (caption) f.append(h("figcaption",{html:caption}));
  return f;
}

function lab(text, term, tx, ty, px, py, anchor="start", cls="lbl"){
  const lines = text.split("\n");
  const t = lines.map((l,i)=>`<tspan x="${tx}" dy="${i?14:0}">${l}</tspan>`).join("");
  const cw = cls.includes("sm")?5.7:6.4, wdt = Math.max(...lines.map(l=>l.length))*cw, hgt=(lines.length-1)*14;
  const x0 = anchor==="end"?tx-wdt: anchor==="middle"?tx-wdt/2 : tx, x1 = x0+wdt;
  let lx, ly=ty-4;
  if (px!=null && px>=x0-6 && px<=x1+6){ lx=Math.max(x0,Math.min(x1,px)); ly = py>ty ? ty+hgt+5 : ty-15; }
  else if (px!=null && px<x0) lx=x0-4; else lx=x1+4;
  const lead = (px!=null) ? `<line class="lead" x1="${lx}" y1="${ly}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="2" fill="#5b6b73"/>` : "";
  return `<g ${term?`data-term="${term}"`:""}>${lead}<text class="${cls}" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text></g>`;
}

function arrow(x1,y1,x2,y2,col="#34454e",w=2.2,dash=""){
  const a=Math.atan2(y2-y1,x2-x1), L=10;
  const p1=[x2-L*Math.cos(a-0.4),y2-L*Math.sin(a-0.4)], p2=[x2-L*Math.cos(a+0.4),y2-L*Math.sin(a+0.4)];
  return `<line x1="${x1}" y1="${y1}" x2="${(x2-6*Math.cos(a)).toFixed(1)}" y2="${(y2-6*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
}

function figAnimalCell(){
  const blob="M60 240 C60 110 190 40 330 42 C480 44 600 110 602 235 C604 360 500 440 330 442 C170 444 60 380 60 240 Z";

  s+=`<g data-term="cytoskeleton">`+cs.map(l=>`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#8fb09c" stroke-width="1.6" stroke-dasharray="7 3"/><line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="transparent" stroke-width="10"/>`).join("")+`</g>`;
  // rough ER arcs around nucleus
  const nx=270, ny=235;
  let er=""; [100,114,128,142].forEach((r,i)=>{

  const W=860,H=380; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A virus, a viroid and a prion compared"><rect width="${W}" height="${H}" fill="#fff"/>`;
  // virus
  const vx=150, vy=170;
  s+=`<g data-term="virus"><circle cx="${vx}" cy="${vy}" r="92" fill="#fbe6a6" stroke="#c9a33b" stroke-width="4"/>`;
  for(let i=0;i<14;i++){ const a=i/14*6.283; s+=`<line x1="${vx+92*Math.cos(a)}" y1="${vy+92*Math.sin(a)}" x2="${vx+106*Math.cos(a)}" y2="${vy+106*Math.sin(a)}" stroke="#c9a33b" stroke-width="3"/><circle cx="${vx+108*Math.cos(a)}" cy="${vy+108*Math.sin(a)}" r="4" fill="#c9a33b"/>`; }
  s+=`</g><g data-term="capsid"><polygon points="${[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3+Math.PI/6; return (vx+70*Math.cos(a)).toFixed(1)+","+(vy+70*Math.sin(a)).toFixed(1);}).join(" ")}" fill="#f2b7c4" stroke="#b0566e" stroke-width="3"/></g>`;
  s+=`<g data-term="viral-genome"><path d="M${vx-36} ${vy-10} q12 -26 24 0 t24 0 t24 0 M${vx-30} ${vy+18} q12 -22 24 0 t24 0 t20 0" stroke="#2f5f93" stroke-width="3" fill="none"/></g>`;
  s+=`<text class="lbl" x="${vx}" y="${H-24}" text-anchor="middle" font-weight="700">Virus</text>`;
  // viroid
  const rx=440, ry=170;
  s+=`<g data-term="viroid"><path d="${(()=>{ let d=""; for(let i=0;i<=80;i++){ const a=i/80*6.283, r=58+6*Math.sin(a*9); d+=(i?"L":"M")+(rx+r*Math.cos(a)*1.4).toFixed(1)+" "+(ry+r*Math.sin(a)*0.75).toFixed(1); } return d+"Z"; })()}" fill="none" stroke="#c83a4f" stroke-width="4"/></g>`;
  s+=`<text class="lbl" x="${rx}" y="${H-24}" text-anchor="middle" font-weight="700">Viroid</text>`;
  // prion
  const px=720, py=150;
  s+=`<g data-term="prion">`;
  const blobN=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="16" fill="${c}" stroke="rgba(0,0,0,.3)"/>`;
  s+=blobN(px-60,py-40,"#6fc27a")+blobN(px-34,py-50,"#6fc27a")+blobN(px-48,py-18,"#6fc27a");
  s+=`<rect x="${px-14}" y="${py-14}" width="30" height="30" rx="4" fill="#d8463c" transform="rotate(25 ${px} ${py})"/>`;
  s+=arrow(px-30,py-24,px-14,py-10,"#555",2);
  s+=`<path d="M${px+22} ${py+10} q30 20 10 50" stroke="#555" stroke-width="2" fill="none"/>${arrow(px+34,py+50,px+30,py+64,"#555",2)}`;
  [[0,0],[24,10],[-20,16],[8,30],[34,34],[-8,46]].forEach(([dx,dy])=>{ s+=`<rect x="${px+dx-12}" y="${py+80+dy-12}" width="24" height="24" rx="3" fill="#d8463c" transform="rotate(${20+dx} ${px+dx} ${py+80+dy})"/>`; });
  s+=`</g><text class="lbl" x="${px}" y="${H-24}" text-anchor="middle" font-weight="700">Prion</text>`;
  s+=`<g class="lbls">${lab("Envelope","virus",20,30,vx-70,vy-70)}${lab("Capsid (protein coat)","capsid",20,330,vx-40,vy+60)}${lab("Genome (DNA or RNA)","viral-genome",250,40,vx+30,vy-10)}`;
  s+=lab("Small circular RNA,\nno protein coat","viroid",rx,62,rx,ry-50,"middle");
  s+=lab("Normal PrP (folded right)","prion",px-60,92-60,px-60,py-56,"middle");
  s+=lab("Misfolded PrP converts normal\nPrP, and the misfolded form piles up","prion",px,H-64,px+10,py+128,"middle","lbl sm")+`</g>`;
  s+=`</svg>`; return s;
}

  // bacteria
  s+=`<g data-term="bacteria">${br("M430 330 C360 300 260 260 200 200","#3d6fb6",10)}`;
  [[200,200,110,70],[200,200,170,60],[200,200,230,64],[240,236,280,120],[240,236,320,150],[160,170,70,120],[180,186,110,150]].forEach(([x1,y1,x2,y2])=>s+=br(`M${x1} ${y1} Q${(x1+x2)/2} ${(y1+y2)/2+20} ${x2} ${y2}`,"#3d6fb6",4));

  [[580,230,520,150],[580,230,560,140],[580,230,640,150],[580,230,700,190]].forEach(([x1,y1,x2,y2])=>s+=br(`M${x1} ${y1} Q${(x1+x2)/2} ${(y1+y2)/2+15} ${x2} ${y2}`,"#c0392b",4));
  s+=`<text x="690" y="250" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#c0392b" letter-spacing="2">ARCHAEA</text></g>`;
  // eukarya from within archaea

  s+=`<text x="720" y="40" font-family="Source Sans 3,Arial" font-size="20" font-weight="700" fill="#3f8a4c" letter-spacing="2">EUKARYA</text></g>`;
  s+=`<g class="lbls">${lab("Proposed position of the root.\nTime runs from root to branches.","tree-of-life",470,390,436,334,"start","lbl sm")}`;

  s+=lab("Plants and animals are twigs\non the Eukarya branch.","eukaryote",340,60,598,42,"start","lbl sm")+`</g>`;
  s+=`</svg>`; return s;
}

  s+=panel(3,"Animals","animals",(x,y)=>`<path d="M${x-62} ${y-10} C${x-62} ${y-70} ${x-10} ${y-80} ${x+20} ${y-72} C${x+70} ${y-60} ${x+70} ${y+20} ${x+40} ${y+40} C${x+10} ${y+60} ${x-60} ${y+50} ${x-62} ${y-10} Z" fill="#fdf4d8" stroke="#2f5f93" stroke-width="3"/><circle cx="${x-4}" cy="${y-14}" r="22" fill="#e8def6" stroke="#6f55a0" stroke-width="2"/>`,"no cell wall");

/* ATP and its relatives (notes Fig 1.6) */
function atpBuildSVG(n){
  const W=760,H=290; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Adenine and ribose with ${n} phosphate groups"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const P=(x,hi)=>`<g data-term="phosphate-group"><circle cx="${x}" cy="120" r="28" fill="#f4c64f" stroke="#b88a14" stroke-width="2"/><text x="${x}" y="127" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial" fill="#5a4300">P</text></g>`;
  const rx=500, ax=640;
  s+=`<g data-term="adenine"><rect x="${ax-60}" y="88" width="120" height="64" rx="12" fill="#8e6cc4"/><text x="${ax}" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Arial">Adenine</text></g>`;
  s+=`<line x1="${rx+40}" y1="120" x2="${ax-60}" y2="120" stroke="#333" stroke-width="3"/>`;
  s+=`<g data-term="ribose"><polygon points="${rx},80 ${rx+42},108 ${rx+28},158 ${rx-28},158 ${rx-42},108" fill="#f3b3c1" stroke="#b0566e" stroke-width="2"/><text x="${rx}" y="132" text-anchor="middle" font-size="14" font-weight="700" font-family="Arial">Ribose</text></g>`;
  for(let i=0;i<n;i++){ const x=rx-110-i*80; s+=`<line x1="${x+28}" y1="120" x2="${i===0?rx-42:x+52}" y2="120" stroke="${i>0?"#d8463c":"#333"}" stroke-width="${i>0?5:3}"/>`+P(x); }
  // brackets
  const names=["Adenosine","Adenosine monophosphate (AMP)","Adenosine diphosphate (ADP)","Adenosine triphosphate (ATP)"];
  for(let k=0;k<=n;k++){ const left = k===0? rx-44 : rx-110-(k-1)*80-30, y=180+k*24; s+=`<path d="M${left} ${y-8} v8 H${ax+60} v-8" stroke="#55606a" fill="none" stroke-width="1.5"/><text class="lbl sm" x="${(left+ax+60)/2}" y="${y+14}" text-anchor="middle" ${k===n?'font-weight="700"':""}>${names[k]}</text>`; }
  if(n>=2) s+=`<text class="lbl sm" x="${rx-150}" y="64" text-anchor="middle" fill="#b0342c">red bonds: high potential energy</text>`;
  s+=`</svg>`; return s;
}

/* ============ story engine ============ */
let RUN = null; // {id, first:{}}
function chState(id){ return P.ch[id] || (P.ch[id] = {done:false, best:null, last:null}); }
function recordFirst(stepIdx, correct, terms){
  if (!RUN) return;
  if (!(stepIdx in RUN.first)) RUN.first[stepIdx] = !!correct;
  (terms||[]).forEach(k=>markTerm(k,"tested"));
}
function runScore(){ const v=Object.values(RUN.first); return {right:v.filter(Boolean).length, total:v.length}; }

function renderChapter(ci, si=0){
  stopLoops(); exploreHook=null; window.scrollTo(0,0);
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go==="story")));
  const ch = CHAPTERS[ci];
  if (!RUN || RUN.id !== ch.id) RUN = {id:ch.id, first:{}};
  const app = $("#app"); app.innerHTML = "";
  const bar = h("div",{class:"steps","aria-hidden":"true"});
  ch.steps.forEach((_,i)=>bar.append(h("i",{class:i<si?"on":i===si?"cur":""})));
  app.append(h("div",{class:"banner"}, h("span",{class:"num"},`1.${ci+1}`), h("span",{class:"ttl"},ch.title), h("span",{class:"pg"},`Course notes ${ch.pages}`)));
  app.append(h("div",{class:"crumb"}, h("button",{class:"back",onclick:()=>go("story")},"All chapters"), h("span",{class:"muted small"},`Step ${si+1} of ${ch.steps.length}`), bar));
  const step = ch.steps[si];
  const stage = h("div",{class:"stage"+(step.wide?" wide":"")});
  const plateHost = h("div"), panel = h("div",{class:"panel"});
  stage.append(plateHost, panel); app.append(stage);
  const next = h("button",{class:"btn",onclick:()=>{ if(si+1<ch.steps.length) renderChapter(ci,si+1); else finishChapter(ci); }}, si+1<ch.steps.length?"Continue":"Finish chapter");
  const back = h("button",{class:"btn ghost",onclick:()=>{ if(si>0) renderChapter(ci,si-1); else go("story"); }}, si>0?"Back":"All chapters");
  const api = {
    ci, si, panel, plateHost, next,
    lock(){ next.disabled = true; }, unlock(){ next.disabled = false; },
    grade(ok, terms){ recordFirst(si, ok, terms||step.terms); },
    gradeKey(key, ok, terms){ recordFirst(si+'.'+key, ok, terms); },
  };
  (STEP_TYPES[step.type])(step, api);
  panel.append(h("div",{class:"nav"}, back, next));
  bindTerms(app); bindRich(app);
  tc.classList.remove("show");
}
function finishChapter(ci){
  stopLoops(); window.scrollTo(0,0);
  const ch = CHAPTERS[ci], sc = runScore(), st = chState(ch.id);
  const frac = sc.total ? sc.right/sc.total : 1;
  const prevBest = st.best;
  st.done = true; st.last = frac; if (st.best==null || frac>st.best) st.best = frac; save();
  const app=$("#app"); app.innerHTML="";
  const box = h("div",{class:"summary"});
  box.append(h("div",{class:"banner"}, h("span",{class:"num"},`1.${ci+1}`), h("span",{class:"ttl"},ch.title+": complete")));
  box.append(h("div",{class:"row",style:"gap:26px;margin:10px 0 18px"},
     h("div",{}, h("div",{class:"big"},`${sc.right}/${sc.total}`), h("div",{class:"muted small"},"right on the first try")),
     h("div",{}, h("div",{class:"big",style:"color:var(--head)"},Math.round((st.best||0)*100)+"%"), h("div",{class:"muted small"}, prevBest==null?"your best so far": (frac>prevBest?"new personal best":"your best"))) ));
  box.append(h("p",{},ch.wrap));
  box.append(h("p",{class:"muted small"},"Terms from this chapter. Click one to review it."), termChips(ch.terms));
  const nextBtn = ci+1<CHAPTERS.length ? h("button",{class:"btn",onclick:()=>{RUN=null; renderChapter(ci+1,0);}},`Start chapter ${ci+2}: ${CHAPTERS[ci+1].title}`) : h("button",{class:"btn",onclick:()=>go("checkpoint")},"Next: Is it alive?");
  box.append(h("div",{class:"row",style:"margin-top:16px"}, nextBtn, h("button",{class:"btn ghost",onclick:()=>{RUN=null; renderChapter(ci,0);}},"Replay chapter"), h("button",{class:"btn ghost",onclick:()=>go("story")},"All chapters")));
  app.append(box);
  RUN = null;
}

/* ---- step types ---- */
function figHost(step, api, svg){
  if (!svg) return;
  const f = plate(svg, step.cap);
  if (step.labelsToggle){
    const b = h("button",{class:"mini","aria-pressed":"true"},"Labels");
    b.addEventListener("click",()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",on?"false":"true"); f.classList.toggle("labels-off",on); });
    f.prepend(h("div",{class:"tools"},b));
  }
  api.plateHost.innerHTML=""; api.plateHost.append(f);
  if (step.onFig) step.onFig(f.querySelector("svg"));
  return f;
}
const STEP_TYPES = {
  brief(step, api){
    figHost(step, api, step.fig && step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    if (step.terms) api.panel.append(termChips(step.terms));
  },
  review(step, api){
    figHost(step, api, step.fig());
    api.panel.append(h("h2",{},step.title), h("div",{html:rich(step.text)}));
    const counter = h("p",{class:"explored"});
    const seen = new Set();
    const upd = ()=>{ counter.textContent = `Parts explored: ${seen.size} of ${step.terms.length}`; };
    exploreHook = k=>{ if(step.terms.includes(k)){ seen.add(k); upd(); } };
    upd(); api.panel.append(counter, termChips(step.terms));
  },
  mcq(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},step.kicker||"Your call"), h("h2",{},step.title));
    if (step.q) api.panel.append(h("div",{html:rich(step.q)}));
    const box = h("div",{class:"opts"}), fb = h("div");
    let solved=false, first=true;
    const opts = step.keep ? step.opts : shuffle(step.opts);
    opts.forEach(o=>{
      const b = h("button",{class:"opt"},o[0]);
      b.addEventListener("click",()=>{
        if (solved) return;
        if (first){ api.grade(o[1], step.terms); first=false; }
        fb.innerHTML="";
        if (o[1]){
          solved=true; b.classList.add("right");
          $$(".opt",box).forEach(x=>x.disabled=true);
          fb.append(h("div",{class:"fb ok",html:`<b>Correct.</b>${rich(o[2]||"")}`}));
          if (step.after) fb.append(h("div",{class:"fb",html:rich(step.after)}));
          if (step.afterFig && f){ const nf = plate(step.afterFig(), step.afterCap||step.cap); api.plateHost.innerHTML=""; api.plateHost.append(nf); bindTerms(nf); }
          api.unlock();
        } else {
          b.classList.add("wrong"); b.disabled=true;
          fb.append(h("div",{class:"fb bad",html:`<b>Not quite.</b>${rich(o[2]||"")} Try another answer.`}));
        }
        bindRich(fb);
      });
      box.append(b);
    });
    api.panel.append(box, fb); api.lock();
  },
  order(step, api){
    const f = figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Put these in order"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    const n = step.items.length, slots = new Array(n).fill(null);
    let pool = shuffle(step.items.map((t,i)=>({t,i})));
    let first = true;
    const slotBox = h("div",{class:"order"}), poolBox = h("div",{class:"pool"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check order");
    function draw(){
      slotBox.innerHTML=""; poolBox.innerHTML="";
      slots.forEach((s,i)=>{
        const el = h("div",{class:"slot"+(s?" filled":"")+(s&&s.mark?" "+s.mark:""),tabindex:s?"0":null,role:s?"button":null}, h("span",{class:"n"},String(i+1)), h("span",{}, s?s.t:"Click a step below to place it here"));
        if (s && !s.locked) el.addEventListener("click",()=>{ pool.push(s); slots[i]=null; delete s.mark; draw(); });
        slotBox.append(el);
      });
      pool.forEach(p=>{ const b=h("button",{class:"card"},p.t); b.addEventListener("click",()=>{ const k=slots.indexOf(null); if(k<0) return; slots[k]=p; pool=pool.filter(x=>x!==p); draw(); }); poolBox.append(b); });
      check.disabled = slots.includes(null);
    }
    check.addEventListener("click",()=>{
      let all=true;
      slots.forEach((s,i)=>{ s.mark = s.i===i?"right":"wrong"; if(s.i!==i) all=false; else s.locked=true; });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){ fb.append(h("div",{class:"fb ok",html:"<b>That's the right order.</b>"+rich(step.after||"")})); check.remove(); api.unlock(); draw(); bindRich(fb); return; }
      draw();
      fb.append(h("div",{class:"fb bad",html:"<b>Some steps are out of place.</b> The green ones are right and locked in. Click a red one to send it back, then try again."}));
    });
    draw();
    api.panel.append(slotBox, poolBox, h("div",{class:"row"},check), fb); api.lock();
  },
  sort(step, api){
    figHost(step, api, step.fig && step.fig());
    if (!step.fig) api.plateHost.remove(), api.panel.parentElement.classList.add("wide");
    api.panel.append(h("p",{class:"kicker"},"Sort them"), h("h2",{},step.title), h("div",{html:rich(step.q)}));
    let items = shuffle(step.items.map((it,i)=>({t:it[0],bin:it[1],why:it[2],i,at:null})));
    let sel = null, first = true;
    const poolBox = h("div",{class:"pool"}), binBox = h("div",{class:"bins"}), fb = h("div");
    const check = h("button",{class:"btn",disabled:true},"Check");
    function draw(){
      poolBox.innerHTML=""; binBox.innerHTML="";
      items.filter(x=>x.at===null).forEach(x=>{ const b=h("button",{class:"card"+(sel===x?" sel":"")},x.t); b.addEventListener("click",()=>{ sel = sel===x?null:x; draw(); }); poolBox.append(b); });
      step.bins.forEach((name,bi)=>{
        const bin = h("div",{class:"bin",tabindex:"0",role:"button","aria-label":"Place in "+name}, h("h4",{},name));
        const place = ()=>{ if(sel){ sel.at=bi; delete sel.mark; sel=null; draw(); } };
        bin.addEventListener("click",place); bin.addEventListener("keydown",e=>{ if(e.key==="Enter") place(); });
        items.filter(x=>x.at===bi).forEach(x=>{ const c=h("button",{class:"card"+(x.mark?" "+x.mark:"")},x.t); c.addEventListener("click",e=>{ e.stopPropagation(); if(sel){ place(); return; } if(x.locked) return; x.at=null; delete x.mark; draw(); }); bin.append(c); });
        binBox.append(bin);
      });
      if (!items.some(x=>x.at===null)) poolBox.append(h("p",{class:"muted small"},"All placed. Check your sort, or click a card in a box to take it back out."));
      else if (!sel) poolBox.prepend(h("p",{class:"muted small",style:"margin:0"},"Click a card, then click the box it belongs in."));
      check.disabled = items.some(x=>x.at===null);
    }
    check.addEventListener("click",()=>{
      let all=true; const misses=[];
      items.forEach(x=>{ if(x.at===x.bin){ x.mark="right"; x.locked=true; } else { x.mark="wrong"; all=false; misses.push(x); } });
      if (first){ api.grade(all, step.terms); first=false; }
      fb.innerHTML="";
      if (all){
        fb.append(h("div",{class:"fb ok",html:"<b>All sorted correctly.</b>"+rich(step.after||"")}));
        check.remove(); api.unlock(); draw(); bindRich(fb);
        if (step.onSolved) step.onSolved(api);
        return;
      }
      draw();
      const why = misses.filter(m=>m.why).map(m=>`<li>${m.t}: ${m.why}</li>`).join("");
      fb.append(h("div",{class:"fb bad",html:`<b>${misses.length} in the wrong box.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""} Move the red ones and check again.`}));
    });
    draw();
    api.panel.append(poolBox, binBox, h("div",{class:"row"},check), fb); api.lock();
  },
  custom(step, api){ step.render(api, step); }
};

function simMicroscope(api){
  const W=760,H=460; const {cv,ctx}=makeCanvas(W,H,"View down a microscope: cork or pond water");
  const S={spec:"cork",mag:30,focus:0.4,t:0}; const seen=new Set();

  const crit=[]; for(let i=0;i<9;i++) crit.push({x:(Math.random()-.5)*300,y:(Math.random()-.5)*300,a:Math.random()*6.283,v:8+Math.random()*16,k:i%3,s:0.7+Math.random()*0.6});

  }

    crit.forEach(c=>{ c.a+=(Math.random()-.5)*dt*2; c.x+=Math.cos(c.a)*c.v*dt; c.y+=Math.sin(c.a)*c.v*dt; if(Math.hypot(c.x,c.y)>170){ c.a+=Math.PI; }
      const x=cx+c.x*sc/90*1.2, y=cy+c.y*sc/90*1.2; const z=sc/90*c.s;
      if(c.k===0){ ctx.fillStyle="#9ccf8a"; ctx.strokeStyle="#4f8a3c"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(x,y,22*z,10*z,c.a,0,7); ctx.fill(); ctx.stroke(); ctx.fillStyle="#4f8a3c"; ctx.beginPath(); ctx.arc(x,y,3*z,0,7); ctx.fill();
        ctx.strokeStyle="#4f8a3c"; ctx.beginPath(); ctx.moveTo(x+Math.cos(c.a)*22*z,y+Math.sin(c.a)*22*z); ctx.quadraticCurveTo(x+Math.cos(c.a)*34*z+Math.sin(S.t*12)*5*z,y+Math.sin(c.a)*34*z,x+Math.cos(c.a)*44*z,y+Math.sin(c.a)*44*z); ctx.stroke(); }
      else if(c.k===1){ ctx.fillStyle="#cfe2f3"; ctx.strokeStyle="#5b86b0"; ctx.lineWidth=1.5; ctx.beginPath(); for(let k=0;k<=24;k++){ const a=k/24*6.283, rr=16*z*(1+0.18*Math.sin(a*3+S.t*2+c.x)); ctx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a)); } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle="#5b86b0"; ctx.beginPath(); ctx.arc(x,y,4*z,0,7); ctx.fill(); }
      else { ctx.fillStyle="#d9a05b"; for(let k=0;k<4;k++){ ctx.beginPath(); ctx.ellipse(x+k*7*z,y+(k%2)*5*z,3.5*z,1.8*z,0.4,0,7); ctx.fill(); } }
    });
  }
  loop(dt=>{ S.t+=dt;
    ctx.fillStyle="#1d2226"; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();

    label(ctx,`${S.spec==="cork"?"Thin slice of cork":"A drop of pond water"} at about ${S.mag}×`,18,28,{w:700,s:16,col:"#fff"});
    label(ctx,blur>2?"Out of focus: turn the focus knob":"In focus",18,H-16,{s:14,col:blur>2?"#f2c94c":"#9fe0a8"});
  });
  api.plateHost.innerHTML=""; api.plateHost.append(plate(cv,"<b>Figure 1.1</b> What the first microscopists saw. Hooke's compound microscope magnified about 30×; Leeuwenhoek's single-lens microscopes reached about 270×."));

    h("div",{class:"ctl"},h("div",{},h("label",{},"Specimen"),seg),h("div",{},h("label",{},"Focus"),foc),h("div",{},h("label",{},"Magnification"),mag)), note);
  say(); api.lock();

  app.append(h("p",{class:"foot"},"Made for BIOL 130 review. Content follows the Module 1 course notes (pp. 3 to 11), which use figures from Morris et al., Biology: How Life Works, 4th edition (Macmillan, 2023) and OpenStax Biology 2e. All figures here are original drawings. Progress is saved in this browser only.",reset));
}

/* ============ Glossary ============ */
function glossaryView(){
  const app=$("#app"); app.innerHTML="";
  const keys=Object.keys(T), tested=keys.filter(k=>P.terms[k]==="tested").length, seen=keys.filter(k=>P.terms[k]).length;
  const search=h("input",{type:"search",placeholder:"Find a term",style:"padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;min-width:240px","aria-label":"Find a term"});
  app.append(h("div",{class:"banner"},h("span",{class:"num"},"1"),h("span",{class:"ttl"},"Important terms and concepts"),h("span",{class:"pg"},"Course notes p. 11")));
  app.append(h("div",{class:"crumb"},h("p",{class:"muted",style:"margin:0"},`${seen} of ${keys.length} seen, ${tested} tested. Page numbers point to your course notes.`),h("div",{style:"margin-left:auto"},search)));
  const box=h("div",{class:"gl"}); app.append(box);
  function draw(q=""){ box.innerHTML="";
    TERM_ORDER_GROUPS.forEach(g=>{ const ks=keys.filter(k=>T[k].g===g && (!q || (T[k].n+" "+T[k].d).toLowerCase().includes(q))); if(!ks.length) return;
      const sec=h("section",{},h("h2",{},g));
      ks.forEach(k=>{ const st=P.terms[k]; sec.append(h("div",{class:"gi"},h("b",{},T[k].n),h("span",{class:"st "+(st||"")},st==="tested"?"Tested":st==="seen"?"Seen":"Not yet"),h("p",{},T[k].d+" "),h("p",{class:"notes-ref",style:"grid-column:1/-1;margin:2px 0 0"},`Notes p. ${T[k].p}`))); });
      box.append(sec); }); }
  search.addEventListener("input",()=>draw(search.value.trim().toLowerCase())); draw();
}



/* ============ mini exam (shared engine in exam.js) ============ */
function examView(){
  const app=$("#app"); app.innerHTML="";
  app.append(h("div",{class:"banner"},h("span",{class:"num"},"1"),h("span",{class:"ttl"},"Mini exam")));
  const host=h("div"); app.append(host);
  const items=((window.STUDY&&STUDY.exam&&STUDY.exam["m1"])||[]).map((q,i)=>({...q,mod:"m1",id:"m1-"+i}));
  EXAM.mount(host,{key:"m1",title:"Module 1 mini exam",intro:`${items.length} questions covering every chapter of this module.`,items,sizes:[10]});
}
/* ============ router ============ */
function go(view){
  stopLoops(); exploreHook=null; RUN=null; tc.classList.remove("show"); tip.style.display="none";
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.go===view)));
  if(view==="atlas") atlasView(); else if(view==="checkpoint") checkpointView(); else if(view==="glossary") glossaryView(); else if(view==="exam") examView(); else homeView();
  window.scrollTo(0,0);
}
$$(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.go)));
$("#home").addEventListener("click",()=>go("story"));
function fromHash(){
  const m=location.hash.match(/^#ch=(\d+)/);
  if(m && CHAPTERS[+m[1]-1]){ RUN=null; renderChapter(+m[1]-1,0); return true; }
  if(location.hash==="#exam"){ go("exam"); return true; }
  return false;
}
window.addEventListener("hashchange",fromHash);
if(!fromHash()) go("story");
</script></body></html>
